<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Súmulas Vinculantes 25 a 36 — Material de estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fs:19px; --lh:1.75; --measure:66ch;
  --sans:"Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --grad:linear-gradient(135deg,#6d5efc 0%,#a24bff 48%,#ff5fa2 100%);
  --gap:clamp(16px,3vw,32px); --radius:22px;
}
html[data-theme="claro"]{
  --bg:#f3f5fd; --bg2:#eef1fb; --ink:#1b2036; --ink-soft:#5f6685; --line:#e4e7f5;
  --card:#ffffff; --accent:#6d5efc; --accent-ink:#5a4bf0;
  --shadow:0 10px 30px rgba(80,70,190,.10); --shadow-sm:0 4px 14px rgba(80,70,190,.08);
}
html[data-theme="escuro"]{
  --bg:#0f1120; --bg2:#151830; --ink:#eef0fb; --ink-soft:#9aa2c9; --line:#262a45;
  --card:#181b30; --accent:#8f81ff; --accent-ink:#a99dff;
  --shadow:0 12px 34px rgba(0,0,0,.45); --shadow-sm:0 6px 18px rgba(0,0,0,.4);
}
html[data-theme="sepia"]{
  --bg:#fbeede; --bg2:#f7e6cf; --ink:#3a2f22; --ink-soft:#7b6a4f; --line:#ecdcc0;
  --card:#fff7ea; --accent:#e06636; --accent-ink:#c4522a;
  --shadow:0 10px 28px rgba(150,100,40,.14); --shadow-sm:0 4px 14px rgba(150,100,40,.1);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.font-amigavel{--sans:"Verdana","Trebuchet MS","Comic Sans MS",sans-serif;letter-spacing:.01em}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth} .lift{transition:transform .16s ease,box-shadow .16s ease,border-color .16s}}
h1,h2,h3,h4{font-weight:800;line-height:1.18;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:11px 16px;max-width:1220px;margin:0 auto}
.brand{font-weight:800;font-size:1rem;margin-right:auto;display:flex;align-items:center;gap:11px}
.brand .mk{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:800;box-shadow:0 6px 16px rgba(120,80,240,.35)}
.brand .btxt small{display:block;font-size:.7rem;color:var(--ink-soft);font-weight:600;letter-spacing:.02em}
.iconbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;cursor:pointer;font-size:.85rem;font-weight:600;min-height:42px;display:inline-flex;align-items:center;gap:7px}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 8px 20px rgba(120,80,240,.32)}
.iconbtn.primary:hover{color:#fff;filter:brightness(1.05)}
.iconbtn:focus-visible,.qopt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:520px){.hide-sm{display:none}}
.progresswrap{height:4px;background:var(--line)} .progressbar{height:100%;width:0;background:var(--grad)}

.wrap{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--gap);padding:var(--gap) 16px 130px}
@media (max-width:960px){.wrap{grid-template-columns:1fr}}

/* TOC */
aside.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 98px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.toc h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin:.1rem .2rem .5rem}
.toc .prog{font-size:.82rem;color:var(--ink-soft);margin:0 .2rem .7rem;display:flex;align-items:center;gap:8px}
.toc .prog .pill{background:var(--grad);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.75rem}
.toclink{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:14px;cursor:pointer;color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:600}
.toclink:hover{background:var(--bg)}
.toclink.active{background:color-mix(in srgb,var(--sc) 12%,var(--card))}
.toclink .tnum{min-width:50px;flex:0 0 50px;text-align:center;font-weight:800;font-size:.72rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:9px;padding:5px 2px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.toclink.active .ttl{color:var(--sc)}
.toclink .check{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;font-size:11px;color:#fff;display:grid;place-items:center}
.toclink.read .check{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent}
.toclink.read .check::after{content:"✓"}
@media (max-width:960px){
  aside.toc{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);z-index:60;transform:translateX(-105%);transition:transform .22s;border-radius:0 var(--radius) var(--radius) 0;max-height:100vh}
  aside.toc.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,10,30,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
}
@media(min-width:961px){.scrim{display:none}.menu-only{display:none}}

main{min-width:0}
/* HERO */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:clamp(24px,4vw,44px);color:#fff;margin-bottom:var(--gap);
  background:linear-gradient(135deg,#6d5efc 0%,#9b45ff 42%,#ff5b9a 82%,#ff8f5f 100%);box-shadow:0 20px 50px rgba(110,70,230,.32)}
.hero::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.16);top:-140px;right:-80px;filter:blur(6px)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);bottom:-120px;left:20%}
.hero>*{position:relative;z-index:1}
.hero .kicker{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.92;margin:0 0 10px}
.hero h1{margin:.1rem 0;font-size:clamp(1.7rem,4.6vw,2.7rem);text-shadow:0 2px 10px rgba(60,20,90,.2)}
.hero .sub{font-size:1.05rem;opacity:.95;margin:.4rem 0 0;font-weight:500;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.legend span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 13px;font-size:.82rem;font-weight:600}
.legend .sw{width:13px;height:13px;border-radius:4px}.legend .sw.orig{background:#fff;opacity:.85}.legend .sw.aid{background:#ffe08a}
.howto{margin-top:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:16px;padding:15px 18px;backdrop-filter:blur(4px)}
.howto b{font-weight:800} .howto ul{margin:.5rem 0 0;padding-left:1.1rem;font-size:.88rem;opacity:.96} .howto li{margin:.32rem 0}
.note-parte{margin-top:14px;background:rgba(255,255,255,.16);border-radius:16px;padding:13px 16px;font-size:.85rem;font-weight:500;border-left:5px solid #ffe08a}

/* SECTION */
.section{scroll-margin-top:84px;margin-bottom:calc(var(--gap)*1.5)}
.section .shead{display:flex;gap:15px;align-items:center;margin-bottom:6px}
.section .snum{flex:0 0 auto;min-width:60px;height:60px;padding:0 10px;border-radius:18px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px color-mix(in srgb,var(--sc) 45%,transparent);line-height:1}
.section .snum small{font-size:.58rem;letter-spacing:.14em;font-weight:800;opacity:.92}
.section .snum span{font-size:1.5rem;font-weight:800}
.section .stitlewrap{display:flex;flex-direction:column;gap:1px;min-width:0}
.section .skicker{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--sc)}
.section .stitle{font-size:clamp(1.25rem,2.8vw,1.7rem);margin:0;letter-spacing:-.02em}
.section .hrule{height:5px;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2),transparent);margin:12px 0 18px}
.readbtn{margin-left:auto;align-self:center;white-space:nowrap}

/* ENUNCIADO box */
.enun{background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 15%,var(--card)),color-mix(in srgb,var(--c2) 11%,var(--card)));
  border:2px solid color-mix(in srgb,var(--sc) 34%,var(--line));border-radius:20px;padding:17px 20px;margin:6px 0 18px;box-shadow:var(--shadow-sm)}
.enun .etag{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 14px;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:11px;box-shadow:0 6px 16px color-mix(in srgb,var(--sc) 40%,transparent)}
.enun p{margin:.1rem 0 0;font-size:1.06rem;font-weight:600;line-height:1.62;max-width:72ch}
.enun .mchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.enun .mchip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--sc) 13%,var(--card));border:1.5px solid color-mix(in srgb,var(--sc) 30%,var(--line));color:var(--sc);border-radius:999px;padding:5px 12px;font-size:.77rem;font-weight:700}

.prosa{max-width:var(--measure)}
.prosa p{margin:1.05em 0}
.prosa p.quote{background:color-mix(in srgb,var(--sc) 9%,var(--card));border-left:5px solid var(--sc);padding:12px 18px;border-radius:6px 16px 16px 6px;font-size:.98rem;font-weight:500}
b.bi{font-weight:800}

/* AIDS — colorful cards, gradient pill labels */
.aid{background:color-mix(in srgb,var(--sc) 7%,var(--card));border:1.5px solid color-mix(in srgb,var(--sc) 22%,var(--line));border-radius:20px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow-sm)}
.aid .tag{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 14px;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:11px;box-shadow:0 6px 16px color-mix(in srgb,var(--sc) 40%,transparent)}
.aid.resumo p{margin:.1rem 0 0;max-width:64ch}
.pontos{list-style:none;margin:.1rem 0 0;padding:0;display:grid;gap:10px}
.pontos li{display:flex;gap:12px;align-items:flex-start;font-size:.93rem;font-weight:500}
.pontos li::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));margin-top:.42em;flex:0 0 auto;box-shadow:0 2px 6px color-mix(in srgb,var(--sc) 45%,transparent)}
.terms{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px}
.chip{border:1.5px solid color-mix(in srgb,var(--sc) 30%,var(--line));background:color-mix(in srgb,var(--sc) 10%,var(--card));color:var(--sc);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:700;cursor:pointer}
.chip:hover{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
.termdef{margin-top:12px;font-size:.9rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:none;font-weight:500}
.termdef.show{display:block} .termdef b{color:var(--sc)}

.quiz .tag{background:linear-gradient(135deg,var(--c1),var(--c2))}
.qhint{font-size:.82rem;color:var(--ink-soft);margin:-2px 0 10px;font-weight:500}
.qitem{margin:14px 0} .qitem:first-of-type{margin-top:4px}
.qq{font-weight:700;margin:0 0 10px;font-size:1rem}
.qq .qn{color:var(--sc);font-weight:800;margin-right:3px}
.qopts{display:grid;gap:8px}
.qo{width:100%;text-align:left;font-family:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 13px;font-size:.9rem;font-weight:500;display:flex;gap:11px;align-items:center;cursor:pointer;transition:border-color .12s,background .12s,transform .05s}
.qo:hover:not(.locked){border-color:var(--sc)}
.qo:active:not(.locked){transform:scale(.995)}
.qo:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qo:disabled{cursor:default}
.qo .ql{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:color-mix(in srgb,var(--sc) 13%,var(--card));color:var(--sc);display:grid;place-items:center;font-weight:800;font-size:.85rem;transition:background .12s,color .12s}
.qo .qtext{flex:1}
.qo .qmk{flex:0 0 auto;width:20px;text-align:center;font-weight:800;font-size:1.05rem}
.qo.correct{border-color:#16a34a;background:color-mix(in srgb,#22c55e 15%,var(--card))}
.qo.correct .ql{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.qo.correct .qmk::after{content:"✓";color:#16a34a}
.qo.wrong{border-color:#e11d48;background:color-mix(in srgb,#f43f5e 14%,var(--card))}
.qo.wrong .ql{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff}
.qo.wrong .qmk::after{content:"✗";color:#e11d48}
.qfb{display:none;margin:9px 0 2px;padding:11px 14px;border-radius:13px;font-size:.88rem;font-weight:500;line-height:1.5}
.qfb.show{display:block}
.qfb.ok{background:color-mix(in srgb,#22c55e 12%,var(--card));border:1.5px solid color-mix(in srgb,#22c55e 42%,var(--line))}
.qfb.no{background:color-mix(in srgb,#f43f5e 10%,var(--card));border:1.5px solid color-mix(in srgb,#f43f5e 40%,var(--line))}
.qfb .qfbh{font-weight:800;display:block;margin-bottom:2px}
.qfb.ok .qfbh{color:#15803d} .qfb.no .qfbh{color:#be123c}
html[data-theme="escuro"] .qfb.ok .qfbh{color:#4ade80} html[data-theme="escuro"] .qfb.no .qfbh{color:#fb7185}
.enun.suspensa{border-style:dashed} .enun .ewarn{margin:0 0 8px;font-weight:700;color:var(--sc);font-size:.9rem}
/* gabarito recolhível */
.gab{margin:16px 0;border:2px dashed color-mix(in srgb,var(--sc) 40%,var(--line));border-radius:18px;background:color-mix(in srgb,var(--sc) 6%,var(--card));overflow:hidden}
.gab>summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;align-items:center;gap:11px;font-weight:600}
.gab>summary::-webkit-details-marker{display:none}
.gab>summary::after{content:"▸";margin-left:auto;color:var(--sc);font-weight:800;transition:transform .15s}
.gab[open]>summary::after{transform:rotate(90deg)}
.gab .gtag{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 14px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.gab .ghint{color:var(--ink-soft);font-size:.83rem;font-weight:500}
.gablist{margin:0;padding:2px 20px 16px 44px;display:grid;gap:10px;font-size:.9rem;font-weight:500}
.gablist li{padding-left:4px} .gablist li::marker{color:var(--sc);font-weight:800}
.gablist b{color:var(--sc)}

/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(90vw,370px);background:var(--card);border-left:1px solid var(--line);z-index:70;transform:translateX(105%);transition:transform .22s;overflow:auto;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer .dhead{display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.drawer .dhead b{margin-right:auto;font-size:1.05rem}
.drawer .body{padding:16px;display:grid;gap:20px}
.ctl label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:13px;padding:9px;cursor:pointer;font-size:.86rem;font-weight:600}
.seg button.on{border-color:transparent;background:var(--grad);color:#fff}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw-row .lbl{font-size:.9rem;font-weight:600} .sw-row .lbl small{display:block;color:var(--ink-soft);font-size:.76rem;font-weight:400}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.16s}
.slider::before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.16s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--grad)} .switch input:checked + .slider::before{transform:translateX(22px)}

.ttsbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:65;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);display:none;align-items:center;gap:6px;padding:8px 12px}
.ttsbar.show{display:flex}
.ttsbar button{border:none;background:var(--bg2);color:var(--ink);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:1rem}
.ttsbar button:hover{background:var(--grad);color:#fff}
.ttsbar .lab{font-size:.8rem;color:var(--ink-soft);padding:0 8px;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.reading{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:10px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 32%,transparent)}

body.focus .prosa p{transition:opacity .2s} body.focus .prosa p:not(.pfocus){opacity:.24}
body.focus .prosa p.pfocus,body.focus .prosa p.reading{opacity:1}
.focusnav{position:fixed;right:16px;bottom:16px;z-index:64;display:none;flex-direction:column;gap:8px}
body.focus .focusnav{display:flex}
.focusnav button{width:54px;height:54px;border-radius:50%;border:none;background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(120,80,240,.4);cursor:pointer;font-size:1.4rem}

.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px}
.modal.open{display:flex}
.modal .mbg{position:absolute;inset:0;background:rgba(10,10,30,.5)}
.modal .mcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .mhead{position:sticky;top:0;background:var(--card);padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .mhead b{margin-right:auto;font-size:1.1rem}
.modal input.search{width:100%;padding:12px 15px;border:2px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);font-size:.92rem;font-weight:500}
.modal input.search:focus{outline:none;border-color:var(--accent)}
.gitem{padding:13px 18px;border-bottom:1px solid var(--line)}
.gitem .gt{font-weight:800} .gitem .gs{font-size:.72rem;color:#fff;background:var(--grad);border-radius:999px;padding:2px 9px;margin-left:8px;font-weight:700}
.gitem .gd{margin:5px 0 0;font-size:.9rem;color:var(--ink-soft);font-weight:500}
.backtop{position:fixed;right:16px;bottom:16px;z-index:50;border:none;background:var(--grad);color:#fff;border-radius:14px;padding:11px 15px;cursor:pointer;box-shadow:0 10px 24px rgba(120,80,240,.35);display:none;font-weight:700}
.backtop.show{display:block} @media(max-width:960px){.backtop{bottom:80px}}
</style></head>
<body>
<header class="top"><div class="top-in">
  <button class="iconbtn menu-only" id="btnMenu" aria-label="Índice">☰</button>
  <div class="brand"><span class="mk">SV</span><span class="btxt">Súmulas Vinculantes<small>STF · 25 a 36</small></span></div>
  <button class="iconbtn" id="btnGloss">📖 <span class="hide-sm">Glossário</span></button>
  <button class="iconbtn primary" id="btnSettings">Aa <span class="hide-sm">Ajustes</span></button>
</div><div class="progresswrap"><div class="progressbar" id="pbar"></div></div></header>

<div class="scrim" id="scrim"></div>
<div class="wrap">
  <aside class="toc" id="toc"><h2>Sumário</h2><div class="prog"><span class="pill" id="progPill">0/0</span> <span id="progText">súmulas lidas</span></div><nav id="tocNav"></nav></aside>

<script>const DATA={"title": "SÚMULAS VINCULANTES 25 A 36", "subtitle": "STF · enunciados oficiais + explicações de estudo", "hues": {"25": 210, "26": 344, "27": 268, "28": 150, "29": 96, "30": 38, "31": 302, "32": 188, "33": 16, "34": 244, "35": 326, "36": 120}, "sections": [{"num": "25", "theme": "Prisão civil do depositário infiel", "enunciado": "É ilícita a prisão civil de depositário infiel, qualquer que seja a modalidade do depósito.", "meta": ["Aprovada em 16/12/2009.", "Importante."], "resumo": "Não se admite a prisão civil do depositário infiel, seja qual for a modalidade do depósito. Embora a CF permita, em tese, a prisão do depositário infiel (art. 5º, LXVII), o Pacto de San José da Costa Rica (Decreto 678/92) só autoriza a prisão civil do devedor de alimentos. Como os tratados de direitos humanos têm status supralegal, a legislação que autorizava a prisão do depositário deixou de ser aplicável. Permanece válida apenas a prisão civil do devedor de alimentos.", "pontos": ["Só resta uma hipótese de prisão civil por dívida: a do devedor de alimentos.", "Vale para qualquer modalidade de depósito (convencional, legal ou judicial) e para a alienação fiduciária.", "Fundamento: Pacto de San José da Costa Rica (art. 7º, §7º), com status supralegal.", "Superou a Súmula 619/STF; alinhada à Súmula 419/STJ."], "quiz": [{"q": "É possível a prisão civil do depositário infiel?", "options": ["Sim, em qualquer caso", "Não — é ilícita, qualquer que seja a modalidade do depósito", "Só no depósito judicial"], "answer": 1, "explain": "A SV 25 declara ilícita a prisão civil do depositário infiel, qualquer que seja a modalidade do depósito."}, {"q": "Qual a única hipótese de prisão civil por dívida que permanece admitida?", "options": ["A do depositário infiel", "A do devedor de alimentos", "Nenhuma"], "answer": 1, "explain": "Permanece apenas a prisão civil do devedor de obrigação alimentar (art. 5º, LXVII, da CF)."}, {"q": "Qual tratado internacional fundamenta a proibição?", "options": ["Convenção de Viena", "Pacto de San José da Costa Rica (CADH)", "Convenção de Genebra"], "answer": 1, "explain": "O Pacto de San José da Costa Rica (Decreto 678/92), art. 7º, §7º, só admite a prisão civil do devedor de alimentos."}, {"q": "Qual o status dos tratados de direitos humanos (não aprovados pelo rito do art. 5º, §3º), segundo o STF?", "options": ["Status de lei ordinária", "Status supralegal (acima da lei, abaixo da Constituição)", "Status constitucional em todos os casos"], "answer": 1, "explain": "O STF firmou o caráter supralegal desses tratados, tornando inaplicável a lei que autorizava a prisão do depositário."}, {"q": "A vedação alcança a prisão do depositário na alienação fiduciária em garantia?", "options": ["Não", "Sim", "Só para bens imóveis"], "answer": 1, "explain": "Sim — a proibição vale qualquer que seja a modalidade, inclusive na alienação fiduciária."}, {"q": "A SV 25 superou qual enunciado anterior do STF?", "options": ["A Súmula 619 (prisão do depositário judicial)", "A Súmula 691", "A Súmula 11 (algemas)"], "answer": 0, "explain": "A SV 25 superou a Súmula 619 do STF, que admitia a prisão do depositário judicial."}], "terms": [{"termo": "Depositário infiel", "definicao": "Quem, tendo o dever de guardar e devolver um bem (depósito), deixa de restituí-lo. A SV 25 proíbe sua prisão civil.", "secao": "25"}, {"termo": "Prisão civil por dívida", "definicao": "Prisão decretada pelo descumprimento de obrigação civil. Hoje só cabe contra o devedor de alimentos.", "secao": "25"}, {"termo": "Status supralegal", "definicao": "Posição dos tratados de direitos humanos não aprovados pelo rito do art. 5º, §3º: acima das leis e abaixo da Constituição.", "secao": "25"}, {"termo": "Pacto de San José da Costa Rica", "definicao": "Convenção Americana de Direitos Humanos (Decreto 678/92); só admite prisão civil do devedor de alimentos.", "secao": "25"}], "blocks": ["O art. 5º, LXVII, da CF/88 admite, em tese, duas hipóteses de prisão civil por dívida: a do devedor de alimentos e a do depositário infiel. A SV 25 afasta a segunda: não se admite a prisão civil do depositário infiel, qualquer que seja a modalidade do depósito (convencional, legal ou judicial), inclusive na alienação fiduciária em garantia.", "O fundamento é a Convenção Americana de Direitos Humanos (Pacto de San José da Costa Rica, art. 7º, §7º), promulgada pelo Decreto 678/1992, que só permite a prisão civil do devedor de alimentos. O STF reconheceu o caráter supralegal dos tratados de direitos humanos (acima da lei, abaixo da Constituição), o que tornou inaplicável a legislação infraconstitucional que autorizava a prisão do depositário (art. 652 do Código Civil; Decreto-Lei 911/69).", "Precedentes-base: RE 466.343, RE 349.703 e HC 87.585. A SV 25 superou a antiga Súmula 619 do STF (que admitia a prisão do depositário judicial) e está alinhada à Súmula 419 do STJ."]}, {"num": "26", "theme": "Progressão de regime em crime hediondo", "enunciado": "Para efeito de progressão de regime no cumprimento de pena por crime hediondo, ou equiparado, o juízo da execução observará a inconstitucionalidade do art. 2º da Lei n. 8.072, de 25 de julho de 1990, sem prejuízo de avaliar se o condenado preenche, ou não, os requisitos objetivos e subjetivos do benefício, podendo determinar, para tal fim, de modo fundamentado, a realização de exame criminológico.", "meta": ["Aprovada em 16/12/2009.", "Importante."], "resumo": "Em crime hediondo ou equiparado é possível a progressão de regime: o juízo da execução deve reconhecer a inconstitucionalidade do regime integralmente fechado (art. 2º da Lei 8.072/90), declarada pelo STF por ferir a individualização da pena. A progressão depende dos requisitos objetivo (lapso) e subjetivo (bom comportamento), podendo o juiz determinar exame criminológico de forma fundamentada. Após a Lei 11.464/2007, o lapso é de 2/5 (primário) ou 3/5 (reincidente).", "pontos": ["É cabível progressão de regime em crime hediondo/equiparado (o regime integralmente fechado é inconstitucional).", "Fundamento: individualização da pena (art. 5º, XLVI, da CF); origem no HC 82.959/SP.", "O juiz pode exigir exame criminológico, desde que de modo fundamentado.", "Lapso após a Lei 11.464/2007: 2/5 (primário) ou 3/5 (reincidente)."], "quiz": [{"q": "Segundo a SV 26, é possível a progressão de regime em crime hediondo?", "options": ["Não, o regime é integralmente fechado", "Sim; o regime integralmente fechado é inconstitucional", "Só após cumprir metade da pena"], "answer": 1, "explain": "A SV 26 manda o juízo observar a inconstitucionalidade do art. 2º da Lei 8.072/90 (regime integralmente fechado), permitindo a progressão."}, {"q": "Qual princípio constitucional fundamenta a SV 26?", "options": ["Legalidade", "Individualização da pena (art. 5º, XLVI)", "Presunção de inocência"], "answer": 1, "explain": "O STF declarou inconstitucional o regime integralmente fechado por violar a individualização da pena (HC 82.959)."}, {"q": "O juiz da execução pode determinar exame criminológico para a progressão?", "options": ["Nunca", "Sim, desde que de modo fundamentado", "Sempre, de forma obrigatória"], "answer": 1, "explain": "A súmula admite o exame criminológico, desde que determinado de modo fundamentado."}, {"q": "Qual precedente deu origem à SV 26?", "options": ["HC 82.959/SP", "HC 81.611", "RE 466.343"], "answer": 0, "explain": "O HC 82.959/SP declarou a inconstitucionalidade do regime integralmente fechado."}, {"q": "Após a Lei 11.464/2007, qual o lapso para progressão em crime hediondo (réu primário)?", "options": ["1/6 da pena", "2/5 da pena", "1/3 da pena"], "answer": 1, "explain": "A Lei 11.464/2007 passou a exigir 2/5 (primário) e 3/5 (reincidente) para a progressão em crimes hediondos."}, {"q": "Além do lapso temporal (requisito objetivo), o que mais se exige para progredir?", "options": ["Nada", "O requisito subjetivo (bom comportamento)", "O pagamento de multa"], "answer": 1, "explain": "A progressão depende dos requisitos objetivo e subjetivo; o juiz avalia se o condenado os preenche."}], "terms": [{"termo": "Progressão de regime", "definicao": "Passagem para regime menos rigoroso (fechado → semiaberto → aberto) no cumprimento da pena, conforme lapso e mérito.", "secao": "26"}, {"termo": "Crime hediondo", "definicao": "Crime de especial gravidade listado na Lei 8.072/90, com regras mais rígidas de execução penal.", "secao": "26"}, {"termo": "Individualização da pena", "definicao": "Garantia do art. 5º, XLVI, da CF: a pena deve ser adaptada ao caso concreto — base da inconstitucionalidade do regime integralmente fechado.", "secao": "26"}, {"termo": "Exame criminológico", "definicao": "Perícia que avalia condições pessoais do preso; pode ser exigido, de modo fundamentado, para aferir o requisito subjetivo da progressão.", "secao": "26"}], "blocks": ["A redação original do art. 2º, §1º, da Lei 8.072/90 (Lei dos Crimes Hediondos) impunha o cumprimento da pena em regime integralmente fechado, vedando a progressão. No HC 82.959/SP (2006), o STF declarou essa vedação inconstitucional, por violar o princípio da individualização da pena (art. 5º, XLVI, da CF).", "A SV 26 consolidou esse entendimento: no cumprimento de pena por crime hediondo ou equiparado, o juízo da execução deve observar a inconstitucionalidade do art. 2º da Lei 8.072/90, permitindo a progressão de regime, desde que preenchidos os requisitos objetivos (lapso temporal) e subjetivos (bom comportamento).", "Para avaliar o requisito subjetivo, o juiz pode determinar, de modo fundamentado, a realização de exame criminológico (no mesmo sentido, a Súmula 439 do STJ).", "Atenção: depois do HC 82.959, a Lei 11.464/2007 alterou a Lei 8.072/90 e passou a exigir, para a progressão em crimes hediondos, o cumprimento de 2/5 da pena (réu primário) ou 3/5 (reincidente) — frações maiores que a regra geral da LEP."]}, {"num": "27", "theme": "Competência — consumidor x telefonia (ANATEL)", "enunciado": "Compete à Justiça estadual julgar causas entre consumidor e concessionária de serviço público de telefonia, quando a ANATEL não seja litisconsorte passiva necessária, assistente, nem opoente.", "meta": ["Aprovada em 18/12/2009."], "resumo": "Nas ações entre consumidor e concessionária de telefonia, a competência é da Justiça Estadual, salvo se a ANATEL (autarquia federal) efetivamente integrar o processo como litisconsorte necessária, assistente ou opoente — hipótese em que a competência passa à Justiça Federal (art. 109, I, da CF). A simples relação de consumo com a concessionária, sem a ANATEL na lide, é julgada pela Justiça Estadual.", "pontos": ["Regra: consumidor x concessionária de telefonia → Justiça Estadual.", "Exceção: se a ANATEL integra a lide (litisconsorte necessária, assistente ou opoente) → Justiça Federal (art. 109, I, CF).", "A ANATEL é autarquia federal (Lei 9.472/97).", "É súmula de competência (processual), não de direito penal."], "quiz": [{"q": "Ação entre consumidor e concessionária de telefonia, sem a ANATEL na lide: de quem é a competência?", "options": ["Justiça Federal", "Justiça Estadual", "Justiça do Trabalho"], "answer": 1, "explain": "A SV 27 fixa a competência da Justiça Estadual quando a ANATEL não integra o processo."}, {"q": "O que desloca a competência para a Justiça Federal?", "options": ["A ANATEL ser litisconsorte necessária, assistente ou opoente", "O valor da causa", "A existência de dano moral"], "answer": 0, "explain": "A presença da ANATEL (autarquia federal) na lide atrai a competência da Justiça Federal (art. 109, I, CF)."}, {"q": "Qual a natureza jurídica da ANATEL?", "options": ["Empresa pública", "Autarquia federal", "Sociedade de economia mista"], "answer": 1, "explain": "A ANATEL é autarquia federal, criada pela Lei 9.472/97."}, {"q": "Qual dispositivo fixa a competência da Justiça Federal em razão da pessoa?", "options": ["Art. 114 da CF", "Art. 109, I, da CF", "Art. 145, II, da CF"], "answer": 1, "explain": "O art. 109, I, da CF fixa a competência da Justiça Federal quando autarquia federal for parte, assistente ou opoente."}, {"q": "A SV 27 trata de matéria de:", "options": ["Direito penal", "Competência (processual)", "Direito tributário"], "answer": 1, "explain": "É súmula de competência; nada tem de direito penal."}], "terms": [{"termo": "ANATEL", "definicao": "Agência Nacional de Telecomunicações; autarquia federal (Lei 9.472/97). Sua presença na lide atrai a Justiça Federal.", "secao": "27"}, {"termo": "Litisconsorte passivo necessário", "definicao": "Parte que obrigatoriamente deve figurar no polo passivo para a validade do processo.", "secao": "27"}, {"termo": "Assistente / opoente", "definicao": "Terceiros que ingressam no processo; se forem entes federais, deslocam a competência para a Justiça Federal.", "secao": "27"}, {"termo": "Competência da Justiça Federal (art. 109, I)", "definicao": "Fixada em razão da pessoa: União, autarquias e empresas públicas federais como partes, assistentes ou opoentes.", "secao": "27"}], "blocks": ["A ANATEL é autarquia federal (Lei 9.472/97). Pela regra do art. 109, I, da CF, a presença de autarquia federal na lide, como parte, assistente ou opoente, desloca a competência para a Justiça Federal.", "A SV 27 esclarece: nas causas entre o consumidor e a concessionária de telefonia (por exemplo, discussão de cobrança ou de qualidade do serviço), se a ANATEL não integra o processo (não é litisconsorte passiva necessária, assistente nem opoente), a competência é da Justiça Estadual comum.", "É súmula de competência (matéria processual) — não tem qualquer relação com direito penal. Precedente representativo: RE 571.572."]}, {"num": "28", "theme": "Depósito prévio em ação judicial tributária", "enunciado": "É inconstitucional a exigência de depósito prévio como requisito de admissibilidade de ação judicial na qual se pretenda discutir a exigibilidade de crédito tributário.", "meta": ["Aprovada em 03/02/2010.", "Importante."], "resumo": "Não se pode exigir depósito prévio para o contribuinte ajuizar ação discutindo a exigibilidade de crédito tributário — a exigência barra o acesso à Justiça (art. 5º, XXXV e LV, da CF). O depósito integral segue sendo uma faculdade (suspende a exigibilidade, art. 151, II, do CTN), nunca uma condição de admissibilidade. É a versão judicial da SV 21 (que veda o depósito prévio no recurso administrativo).", "pontos": ["Proibido exigir depósito prévio para ajuizar ação sobre crédito tributário.", "Fundamento: acesso à Justiça (art. 5º, XXXV) e ampla defesa (art. 5º, LV).", "Não há exceção \"salvo imposto\".", "Depósito integral é faculdade (suspende a exigibilidade — art. 151, II, CTN), não requisito.", "Face judicial da SV 21 (depósito no recurso administrativo)."], "quiz": [{"q": "É constitucional exigir depósito prévio para ajuizar ação discutindo crédito tributário?", "options": ["Sim", "Não (SV 28)", "Só para grandes valores"], "answer": 1, "explain": "A SV 28 declara inconstitucional a exigência de depósito prévio como requisito de admissibilidade dessa ação."}, {"q": "Qual garantia é violada por essa exigência?", "options": ["O acesso à Justiça (art. 5º, XXXV) e a ampla defesa", "A anterioridade tributária", "A isonomia"], "answer": 0, "explain": "A exigência viola a inafastabilidade da jurisdição e a ampla defesa (art. 5º, XXXV e LV)."}, {"q": "O depósito integral do tributo deixou de existir?", "options": ["Sim, foi abolido", "Não; continua como faculdade que suspende a exigibilidade (art. 151, II, CTN)", "Só vale na esfera administrativa"], "answer": 1, "explain": "O depósito continua sendo faculdade do contribuinte para suspender a exigibilidade; o que se proíbe é exigi-lo como condição."}, {"q": "A SV 28 tem relação com qual outra súmula vinculante?", "options": ["SV 21 (depósito prévio no recurso administrativo)", "SV 11 (algemas)", "SV 13 (nepotismo)"], "answer": 0, "explain": "A SV 28 é a face judicial da SV 21, que veda o depósito prévio como requisito de recurso administrativo."}, {"q": "Existe a ressalva \"salvo imposto\" no enunciado da SV 28?", "options": ["Sim", "Não", "Só para tributos estaduais"], "answer": 1, "explain": "Não há ressalva; a garantia de acesso à Justiça é ampla."}, {"q": "Qual precedente embasou a SV 28?", "options": ["ADI 1.074 (art. 19 da Lei 8.870/94)", "HC 82.959", "RE 116.121"], "answer": 0, "explain": "A ADI 1.074 declarou inconstitucional o depósito prévio do art. 19 da Lei 8.870/94."}], "terms": [{"termo": "Crédito tributário", "definicao": "Valor que o Fisco tem direito de cobrar do contribuinte após o lançamento.", "secao": "28"}, {"termo": "Depósito prévio", "definicao": "Depósito exigido antes de praticar um ato processual. Como condição de acesso ao Judiciário em matéria tributária, é inconstitucional (SV 28).", "secao": "28"}, {"termo": "Inafastabilidade da jurisdição", "definicao": "Garantia do art. 5º, XXXV, da CF: a lei não excluirá da apreciação do Judiciário lesão ou ameaça a direito.", "secao": "28"}, {"termo": "Suspensão da exigibilidade", "definicao": "Situação em que o Fisco não pode cobrar o crédito; o depósito integral é uma das causas (art. 151, II, do CTN).", "secao": "28"}], "blocks": ["É inconstitucional condicionar o ajuizamento de ação sobre crédito tributário a um depósito prévio. A exigência viola a inafastabilidade da jurisdição (art. 5º, XXXV, da CF) e a ampla defesa (art. 5º, LV).", "Precedente: ADI 1.074, que declarou inconstitucional o art. 19 da Lei 8.870/94 (exigia depósito prévio para discutir débito com o INSS). Não existe ressalva &quot;salvo imposto&quot;: a garantia de acesso à Justiça é ampla.", "O depósito do montante integral continua sendo uma faculdade do contribuinte, pois suspende a exigibilidade do crédito (art. 151, II, do CTN). O que a súmula proíbe é transformá-lo em condição para poder ir a juízo.", "A SV 28 é a face judicial da mesma lógica da SV 21, que trata da inconstitucionalidade do depósito prévio como requisito de recurso administrativo."]}, {"num": "29", "theme": "Base de cálculo de taxa x imposto", "enunciado": "É constitucional a adoção, no cálculo do valor de taxa, de um ou mais elementos da base de cálculo própria de determinado imposto, desde que não haja integral identidade entre uma base e outra.", "meta": ["Aprovada em 03/02/2010."], "resumo": "A taxa não pode ter base de cálculo idêntica à de um imposto (art. 145, §2º, da CF), mas pode adotar um ou mais elementos dessa base, desde que não haja identidade integral. Assim, é constitucional, por exemplo, calcular a taxa de coleta de lixo pela metragem do imóvel (elemento também presente no IPTU), porque as bases não coincidem por inteiro.", "pontos": ["A taxa pode usar elementos da base de cálculo de um imposto, se não houver identidade integral.", "Fundamento: art. 145, §2º, da CF (taxa não pode ter base de cálculo própria de imposto).", "Exemplo: taxa de lixo calculada pela área do imóvel (dialoga com a SV 19).", "Precedente: RE 576.321 (Tema 146)."], "quiz": [{"q": "A taxa pode adotar elementos da base de cálculo de um imposto?", "options": ["Nunca", "Sim, desde que não haja identidade integral entre as bases", "Sempre, sem qualquer restrição"], "answer": 1, "explain": "A SV 29 admite o uso de um ou mais elementos, vedada apenas a identidade integral."}, {"q": "Qual dispositivo proíbe que a taxa tenha base de cálculo própria de imposto?", "options": ["Art. 145, §2º, da CF", "Art. 150, I, da CF", "Art. 195 da CF"], "answer": 0, "explain": "O art. 145, §2º, da CF veda que a taxa tenha base de cálculo própria de imposto."}, {"q": "É constitucional calcular a taxa de coleta de lixo pela área construída do imóvel?", "options": ["Não, é base do IPTU", "Sim, pois não há identidade integral entre as bases", "Só em municípios pequenos"], "answer": 1, "explain": "É constitucional; usar a metragem (elemento também do IPTU) não gera identidade integral entre as bases."}, {"q": "O que exatamente a SV 29 proíbe?", "options": ["Qualquer semelhança entre bases", "A identidade INTEGRAL entre a base da taxa e a de um imposto", "A cobrança de taxa por serviço divisível"], "answer": 1, "explain": "O que se veda é a coincidência integral entre as bases, não o uso de elementos comuns."}, {"q": "A SV 29 relaciona-se diretamente com qual outra súmula?", "options": ["SV 19 (taxa de coleta de lixo)", "SV 13 (nepotismo)", "SV 25 (depositário infiel)"], "answer": 0, "explain": "Ela complementa a SV 19, sobre a taxa de coleta de lixo."}], "terms": [{"termo": "Taxa", "definicao": "Tributo vinculado a serviço público específico e divisível ou ao poder de polícia (art. 145, II, da CF).", "secao": "29"}, {"termo": "Base de cálculo", "definicao": "Grandeza sobre a qual se aplica a alíquota para apurar o valor do tributo.", "secao": "29"}, {"termo": "Identidade integral", "definicao": "Coincidência total entre a base de cálculo da taxa e a de um imposto — é isso que a Constituição proíbe.", "secao": "29"}], "blocks": ["O art. 145, §2º, da CF proíbe que a taxa tenha base de cálculo própria de imposto. A SV 29 esclarece o alcance dessa vedação: é possível usar um ou mais elementos da base de cálculo de um imposto para calcular a taxa, desde que não haja identidade integral entre as duas bases.", "Exemplo clássico: a taxa de coleta de lixo pode ser calculada em função da área (metragem) do imóvel — elemento que também aparece na base de cálculo do IPTU — sem que isso a torne inconstitucional, pois não há coincidência total entre as bases (dialoga com a SV 19).", "A taxa é tributo contraprestacional (vinculado a um serviço específico e divisível ou ao poder de polícia); exige-se equivalência razoável entre o valor cobrado e o custo da atividade estatal. Precedente: RE 576.321 (repercussão geral, Tema 146)."]}, {"num": "30", "theme": "Retenção de ICMS dos municípios — súmula suspensa", "enunciado": "É inconstitucional lei estadual que, a título de incentivo fiscal, retém parcela do ICMS pertencente aos municípios.", "meta": ["Redação aprovada em 03/02/2010 — publicação SUSPENSA em 04/02/2010.", "NÃO está em vigor."], "resumo": "A SV 30 é um caso peculiar: sua redação foi aprovada, mas a publicação foi suspensa no dia seguinte e nunca ocorreu — ela nunca entrou em vigor (\"súmula-fantasma\"). O tema era a vedação de lei estadual reter, a título de incentivo fiscal, parcela do ICMS pertencente aos municípios (arts. 158, IV, e 160 da CF). Para concurso, o ponto-chave é justamente saber que a SV 30 não existe em vigor.", "pontos": ["A SV 30 NÃO está em vigor: aprovada, mas suspensa e nunca publicada.", "A lista oficial do STF pula o número 30 (vai do 29 para o 31).", "Tema: vedação de reter parcela do ICMS dos municípios (arts. 158, IV, e 160, CF).", "Suspensa para não excluir outras hipóteses de retenção; assunto tratado por repercussão geral."], "quiz": [{"q": "A Súmula Vinculante 30 está em vigor?", "options": ["Sim", "Não — foi aprovada, mas suspensa e nunca publicada", "Só em alguns estados"], "answer": 1, "explain": "A publicação da SV 30 foi suspensa em 04/02/2010 e o enunciado nunca foi publicado; ela não tem eficácia."}, {"q": "Como a doutrina costuma se referir à SV 30?", "options": ["Súmula-fantasma (aprovada, mas sem vigência)", "Súmula revogada por lei", "Súmula de eficácia imediata"], "answer": 0, "explain": "É chamada de \"súmula-fantasma\": existe a redação aprovada, mas sem publicação e sem eficácia."}, {"q": "Qual era o tema de fundo da SV 30?", "options": ["Retenção de parcela do ICMS pertencente aos municípios", "Progressão de regime", "Prisão civil"], "answer": 0, "explain": "O tema era a vedação de lei estadual reter, a título de incentivo fiscal, parcela do ICMS dos municípios (arts. 158, IV, e 160 da CF)."}, {"q": "Na numeração oficial das súmulas vinculantes, o que ocorre com o número 30?", "options": ["É a mais aplicada", "É \"pulado\" (a lista vai do 29 para o 31)", "Foi renumerado para 30-A"], "answer": 1, "explain": "A compilação oficial do STF vai de 1 a 29 e de 31 a 58, sem a SV 30 em vigor."}], "terms": [{"termo": "Súmula-fantasma", "definicao": "Súmula cuja redação foi aprovada, mas cuja publicação foi suspensa; não entra em vigor. É o caso da SV 30.", "secao": "30"}, {"termo": "Repartição de receitas (ICMS)", "definicao": "Parte do ICMS pertence aos municípios (art. 158, IV, da CF); é vedado reter esses repasses (art. 160).", "secao": "30"}], "blocks": ["Atenção: a Súmula Vinculante 30 não está em vigor. O STF aprovou a redação em 03/02/2010, mas suspendeu a publicação já em 04/02/2010 (questão de ordem do Min. Dias Toffoli), e o enunciado nunca foi publicado no DJe. Por isso, ele não produz efeitos — é a chamada &quot;súmula-fantasma&quot;. A compilação oficial do STF vai de 1 a 29 e de 31 a 58, pulando o número 30.", "O tema de fundo é a repartição de receitas: parcela do ICMS pertence aos municípios (art. 158, IV, da CF) e é vedada a retenção desses repasses (art. 160 da CF). A redação aprovada limitava a inconstitucionalidade à retenção feita &quot;a título de incentivo fiscal&quot;.", "A suspensão ocorreu porque havia precedentes sobre outras hipóteses de retenção (não só o &quot;incentivo fiscal&quot;), e a redação restritiva poderia deixar esses casos de fora. O assunto passou a ser tratado por repercussão geral. Para provas, o ponto essencial é: se aparecer &quot;Súmula Vinculante 30&quot;, lembre-se de que ela foi suspensa e não tem eficácia."], "status": "suspensa"}, {"num": "31", "theme": "ISS não incide sobre locação de bens móveis", "enunciado": "É inconstitucional a incidência do imposto sobre serviços de qualquer natureza - ISS sobre operações de locação de bens móveis.", "meta": ["Aprovada em 04/02/2010.", "Importante — pegadinha comum."], "resumo": "Não incide ISS sobre a locação de bens móveis. O ISS pressupõe prestação de serviço (obrigação de fazer), e a locação de coisa móvel é obrigação de dar — logo, não é serviço tributável pelo imposto municipal. Atenção à literalidade: são bens MÓVEIS (não imóveis). Em contratos mistos (locação somada a serviço), o ISS pode incidir sobre a parte de serviço.", "pontos": ["Não incide ISS sobre locação de bens MÓVEIS (não confundir com imóveis).", "Razão: o ISS exige serviço (obrigação de fazer); locação é obrigação de dar.", "Fundamento: art. 156, III, da CF, e art. 110 do CTN; leading case RE 116.121/SP.", "Contratos mistos: o ISS pode incidir sobre a parcela de serviço (Tema 212, RE 626.706)."], "quiz": [{"q": "Incide ISS sobre a locação de bens móveis?", "options": ["Sim", "Não (SV 31)", "Só sobre veículos"], "answer": 1, "explain": "A SV 31 declara inconstitucional a incidência de ISS sobre a locação de bens móveis."}, {"q": "Por que a locação de bem móvel não é tributada pelo ISS?", "options": ["Porque é isenta por lei", "Porque é obrigação de dar, e não prestação de serviço (obrigação de fazer)", "Porque o bem é de baixo valor"], "answer": 1, "explain": "O ISS incide sobre serviço (obrigação de fazer); a locação é obrigação de dar/entregar a coisa."}, {"q": "A SV 31 trata da locação de:", "options": ["Bens imóveis", "Bens móveis", "Serviços públicos"], "answer": 1, "explain": "São bens MÓVEIS — atenção à pegadinha com a palavra \"imóveis\"."}, {"q": "Em um contrato misto (locação + serviço), o que ocorre com o ISS?", "options": ["Nunca incide", "Pode incidir sobre a parcela de serviço", "Incide sobre todo o contrato"], "answer": 1, "explain": "A SV 31 alcança a locação dissociada de serviço; em contratos mistos, o ISS pode incidir sobre a parte de serviço (Tema 212)."}, {"q": "Qual artigo do CTN impede a lei tributária de tratar a locação como serviço?", "options": ["Art. 110 (não pode alterar conceitos de direito privado)", "Art. 3º", "Art. 151"], "answer": 0, "explain": "O art. 110 do CTN veda alterar conceitos de direito privado usados pela Constituição."}, {"q": "Qual o leading case da SV 31?", "options": ["RE 116.121/SP", "HC 81.611", "ADI 1.648"], "answer": 0, "explain": "O RE 116.121/SP firmou a não incidência de ISS sobre locação de bens móveis."}], "terms": [{"termo": "ISS (ISSQN)", "definicao": "Imposto Sobre Serviços de Qualquer Natureza, de competência municipal (art. 156, III, da CF); incide sobre prestação de serviço.", "secao": "31"}, {"termo": "Obrigação de fazer x de dar", "definicao": "Serviço é obrigação de fazer (tributável pelo ISS); locação de coisa é obrigação de dar (não é serviço).", "secao": "31"}, {"termo": "Locação de bens móveis", "definicao": "Cessão temporária do uso de coisa móvel; não sofre ISS (SV 31).", "secao": "31"}, {"termo": "Contrato misto", "definicao": "Contrato que reúne locação e serviço; o ISS pode incidir sobre a parcela de serviço.", "secao": "31"}], "blocks": ["O ISS (imposto municipal, art. 156, III, da CF) incide sobre a prestação de serviços — que juridicamente é uma obrigação de fazer. A locação de bem móvel, ao contrário, é uma obrigação de dar/entregar a coisa, e não um serviço. Por isso, é inconstitucional cobrar ISS sobre a locação de bens móveis.", "Cuidado com a pegadinha: a súmula fala em bens MÓVEIS (por exemplo, locação de máquinas, guindastes, veículos, andaimes), e não em imóveis. O fundamento também está no art. 110 do CTN: a lei tributária não pode alterar conceitos de direito privado (locação não é serviço). Leading case: RE 116.121/SP.", "Nuance importante para prova (Tema 212, RE 626.706): a SV 31 alcança a locação de bem móvel dissociada da prestação de serviço. Em contratos mistos (locação somada a serviço), o ISS pode incidir sobre a parcela correspondente ao serviço."]}, {"num": "32", "theme": "ICMS não incide sobre salvados de sinistro", "enunciado": "O ICMS não incide sobre alienação de salvados de sinistro pelas seguradoras.", "meta": ["Aprovada em 16/02/2011."], "resumo": "A venda, pelas seguradoras, dos bens que sobram de um sinistro (salvados) não sofre ICMS. Essa alienação faz parte da operação de seguro e não é circulação de mercadoria com fim comercial — a seguradora não é comerciante e só recupera parte da indenização paga. Além disso, seguro é matéria de competência federal, o que afasta o imposto estadual.", "pontos": ["Não incide ICMS sobre a venda de salvados de sinistro pelas seguradoras.", "A alienação integra a operação de seguro; não é circulação de mercadoria com intuito comercial.", "A seguradora não é comerciante (art. 73 do DL 73/66).", "Leading cases: ADI 1.648 e RE 588.149."], "quiz": [{"q": "Incide ICMS na venda de salvados de sinistro pelas seguradoras?", "options": ["Sim", "Não (SV 32)", "Só sobre veículos"], "answer": 1, "explain": "A SV 32 firma que o ICMS não incide sobre a alienação de salvados de sinistro pelas seguradoras."}, {"q": "O que são \"salvados de sinistro\"?", "options": ["Os prêmios do seguro", "Os bens que restam do evento danoso e vão à seguradora após a indenização", "Multas contratuais"], "answer": 1, "explain": "São os bens remanescentes do sinistro que a seguradora recebe ao indenizar o segurado."}, {"q": "Por que não incide ICMS?", "options": ["Porque há isenção estadual", "Porque a alienação integra a operação de seguro e não é circulação de mercadoria com fim comercial", "Porque o valor é pequeno"], "answer": 1, "explain": "A venda dos salvados é parte da operação de seguro; a seguradora não age como comerciante."}, {"q": "A matéria de seguros é de competência de qual ente?", "options": ["Dos Estados", "Da União (arts. 22, VII, e 153, V, da CF)", "Dos Municípios"], "answer": 1, "explain": "Seguros são de competência federal, o que afasta o ICMS estadual."}, {"q": "Quais os leading cases da SV 32?", "options": ["ADI 1.648 e RE 588.149", "RE 116.121", "HC 82.959"], "answer": 0, "explain": "A ADI 1.648 e o RE 588.149 fundamentam a SV 32."}], "terms": [{"termo": "Salvados de sinistro", "definicao": "Bens que restam de um sinistro e são transferidos à seguradora com o pagamento da indenização.", "secao": "32"}, {"termo": "ICMS", "definicao": "Imposto estadual sobre circulação de mercadorias e alguns serviços (art. 155, II, da CF).", "secao": "32"}, {"termo": "Operação de seguro", "definicao": "Atividade própria da seguradora; a venda de salvados a integra e, por isso, não sofre ICMS.", "secao": "32"}], "blocks": ["Salvados de sinistro são os bens que restam de um evento danoso (por exemplo, um carro batido) e que a seguradora recebe do segurado ao pagar a indenização. A SV 32 firma que a venda desses salvados pela seguradora não sofre ICMS.", "A razão é que essa alienação integra a operação de seguro e não configura circulação de mercadoria com intuito comercial. A seguradora paga 100% da indenização ao segurado e recupera apenas parte do valor com a venda dos salvados — não age como comerciante. Aliás, o art. 73 do Decreto-Lei 73/66 proíbe as seguradoras de explorar outro ramo de comércio.", "O ICMS (art. 155, II, da CF) pressupõe circulação de mercadoria; a matéria de seguros é de competência federal (arts. 22, VII, e 153, V, da CF), o que afasta o imposto estadual. Leading cases: ADI 1.648 e RE 588.149."]}, {"num": "33", "theme": "Aposentadoria especial do servidor público", "enunciado": "Aplicam-se ao servidor público, no que couber, as regras do regime geral da previdência social sobre aposentadoria especial de que trata o artigo 40, § 4º, inciso III da Constituição Federal, até a edição de lei complementar específica.", "meta": ["Aprovada em 09/04/2014.", "Importante."], "resumo": "Como falta a lei complementar exigida pelo art. 40, §4º, III, da CF para a aposentadoria especial do servidor (atividades nocivas à saúde), o STF mandou aplicar \"no que couber\" as regras do RGPS (em especial o art. 57 da Lei 8.213/91). A SV 33 nasceu de vários mandados de injunção que reconheceram a mora do legislador e vale até a edição da lei específica.", "pontos": ["A aposentadoria especial do servidor (art. 40, §4º, III, CF) depende de lei complementar, ainda não editada.", "Enquanto não vier a lei, aplicam-se \"no que couber\" as regras do RGPS (art. 57 da Lei 8.213/91).", "Origem: mandados de injunção (ex.: MI 721 e MI 788) que reconheceram a omissão legislativa.", "Trata da concessão; a conversão de tempo especial em comum veio depois (Tema 942)."], "quiz": [{"q": "Enquanto não há lei complementar, como se concede a aposentadoria especial do servidor?", "options": ["Não pode ser concedida", "Aplicam-se, no que couber, as regras do RGPS", "Aplica-se a lei estadual"], "answer": 1, "explain": "A SV 33 manda aplicar, no que couber, as regras do RGPS (art. 57 da Lei 8.213/91)."}, {"q": "Qual dispositivo prevê a aposentadoria especial do servidor?", "options": ["Art. 40, §4º, III, da CF", "Art. 7º, IV, da CF", "Art. 114 da CF"], "answer": 0, "explain": "O art. 40, §4º, III, da CF prevê a aposentadoria especial por atividades prejudiciais à saúde/integridade física."}, {"q": "Qual instrumento processual deu origem à SV 33?", "options": ["Habeas corpus", "Mandado de injunção", "Reclamação"], "answer": 1, "explain": "A SV 33 nasceu de vários mandados de injunção (ex.: MI 721, MI 788) diante da omissão legislativa."}, {"q": "Por que se aplicam as regras do RGPS ao servidor?", "options": ["Por analogia proibida", "Por causa da omissão do legislador (falta a lei complementar exigida pela CF)", "Por escolha do servidor"], "answer": 1, "explain": "Diante da falta da lei complementar, o STF supre a omissão aplicando \"no que couber\" o RGPS."}, {"q": "A SV 33 deixou de valer com a EC 103/2019?", "options": ["Sim, foi revogada", "Não; segue aplicável enquanto não editada a lei complementar específica", "Só para novos servidores"], "answer": 1, "explain": "O entendimento permanece aplicável até que sobrevenha a lei complementar específica."}], "terms": [{"termo": "Aposentadoria especial", "definicao": "Aposentadoria por trabalho em condições prejudiciais à saúde/integridade; para o servidor, depende de lei complementar (art. 40, §4º, III, CF).", "secao": "33"}, {"termo": "Mandado de injunção", "definicao": "Ação para viabilizar direito inviabilizado pela falta de norma regulamentadora; origem da SV 33.", "secao": "33"}, {"termo": "RGPS", "definicao": "Regime Geral de Previdência Social (INSS); suas regras se aplicam \"no que couber\" ao servidor, na falta de lei específica.", "secao": "33"}, {"termo": "Lei complementar", "definicao": "Espécie normativa exigida pela CF para certos temas; sua ausência gerou a omissão suprida pela SV 33.", "secao": "33"}], "blocks": ["O art. 40, §4º, III, da CF prevê a aposentadoria especial do servidor público que trabalha em condições prejudiciais à saúde ou à integridade física, mas exige lei complementar para regulá-la — lei que não foi editada.", "Diante dessa omissão do legislador, o STF, em vários mandados de injunção, determinou que se apliquem ao servidor, &quot;no que couber&quot;, as regras do Regime Geral de Previdência Social (RGPS), especialmente o art. 57 da Lei 8.213/91. A SV 33 consolidou esse entendimento.", "Precedentes: mandados de injunção como o MI 721 e o MI 788, entre muitos outros. A súmula trata da concessão da aposentadoria especial; a conversão de tempo especial em comum do servidor foi enfrentada depois, no Tema 942 (RE 1.014.286). O entendimento segue aplicável enquanto não vier a lei complementar específica, mesmo após a EC 103/2019."]}, {"num": "34", "theme": "GDASST estendida aos inativos", "enunciado": "A Gratificação de Desempenho de Atividade de Seguridade Social e do Trabalho - GDASST, instituída pela Lei 10.483/2002, deve ser estendida aos inativos no valor correspondente a 60 (sessenta) pontos, desde o advento da Medida Provisória 198/2004, convertida na Lei 10.971/2004, quando tais inativos façam jus à paridade constitucional (EC 20/1998, 41/2003 e 47/2005).", "meta": ["Aprovada em 16/10/2014.", "Menos cobrada em provas."], "resumo": "A gratificação GDASST (Lei 10.483/2002) deve ser paga aos inativos no valor de 60 pontos, desde a MP 198/2004 (Lei 10.971/2004), quando esses aposentados tenham direito à paridade constitucional. Aplica-se a lógica de que gratificações de desempenho pagas de forma linear têm caráter geral e se estendem aos inativos com paridade. É tema mais específico e menos cobrado.", "pontos": ["GDASST (Lei 10.483/2002) estendida aos inativos no valor de 60 pontos.", "Marco temporal: desde a MP 198/2004 (convertida na Lei 10.971/2004).", "Só para inativos com direito à paridade (EC 20/1998, 41/2003 e 47/2005).", "Aplica a lógica das gratificações de desempenho pagas de forma linear (caráter geral)."], "quiz": [{"q": "A GDASST deve ser estendida aos inativos?", "options": ["Não", "Sim, no valor de 60 pontos, aos que têm paridade", "Só aos ativos"], "answer": 1, "explain": "A SV 34 estende a GDASST aos inativos no valor de 60 pontos, quando façam jus à paridade."}, {"q": "Desde quando vale a extensão?", "options": ["Desde a Lei 10.483/2002", "Desde a MP 198/2004 (Lei 10.971/2004)", "Desde a EC 103/2019"], "answer": 1, "explain": "A extensão vale desde o advento da MP 198/2004, convertida na Lei 10.971/2004."}, {"q": "Quem tem direito à extensão?", "options": ["Todos os inativos", "Apenas os inativos com direito à paridade constitucional", "Apenas os pensionistas"], "answer": 1, "explain": "Somente os inativos que fazem jus à paridade (EC 20/1998, 41/2003 e 47/2005)."}, {"q": "Qual a lógica que justifica estender a gratificação aos inativos?", "options": ["Gratificação de desempenho paga de forma linear tem caráter geral", "Toda gratificação se estende sempre", "Por liberalidade da Administração"], "answer": 0, "explain": "Enquanto paga de forma linear/genérica (60 pontos), a gratificação tem natureza geral e se estende aos inativos com paridade."}], "terms": [{"termo": "GDASST", "definicao": "Gratificação de Desempenho de Atividade de Seguridade Social e do Trabalho (Lei 10.483/2002); estendida aos inativos com paridade (SV 34).", "secao": "34"}, {"termo": "Paridade", "definicao": "Regra pela qual os proventos do inativo acompanham a remuneração do servidor ativo (mantida por regras de transição — EC 20/98, 41/03 e 47/05).", "secao": "34"}, {"termo": "Gratificação de desempenho", "definicao": "Vantagem ligada ao desempenho; quando paga de forma linear, tem caráter geral e se estende aos inativos com paridade.", "secao": "34"}], "blocks": ["A GDASST (Gratificação de Desempenho de Atividade de Seguridade Social e do Trabalho) foi criada pela Lei 10.483/2002. A SV 34 trata de sua extensão aos servidores inativos.", "A lógica é a das gratificações de desempenho: enquanto pagas de forma linear/genérica a todos (aqui, no valor de 60 pontos), elas têm natureza de vantagem geral e, por isso, se estendem aos aposentados que têm direito à paridade. A extensão vale desde a MP 198/2004 (convertida na Lei 10.971/2004).", "Beneficiários: apenas os inativos que fazem jus à paridade constitucional, conforme as regras das EC 20/1998, 41/2003 e 47/2005. É um tema mais específico e menos recorrente em provas."]}, {"num": "35", "theme": "Transação penal descumprida (Juizados)", "enunciado": "A homologação da transação penal prevista no artigo 76 da Lei 9.099/1995 não faz coisa julgada material e, descumpridas suas cláusulas, retoma-se a situação anterior, possibilitando-se ao Ministério Público a continuidade da persecução penal mediante oferecimento de denúncia ou requisição de inquérito policial.", "meta": ["Aprovada em 16/10/2014.", "Importante."], "resumo": "A homologação da transação penal (art. 76 da Lei 9.099/95) não faz coisa julgada material. Se o autor do fato descumprir o que foi acordado, tudo volta ao estado anterior e o Ministério Público pode retomar a persecução penal (denúncia ou inquérito). Não há conversão automática da pena transacionada em prisão.", "pontos": ["A homologação da transação penal só faz coisa julgada formal (não material).", "Descumprida, retorna-se ao status quo ante.", "O MP pode retomar a persecução (denúncia ou requisição de inquérito).", "Não há conversão automática da pena de multa/restritiva em privativa de liberdade."], "quiz": [{"q": "A homologação da transação penal faz coisa julgada material?", "options": ["Sim", "Não, apenas formal (SV 35)", "Depende do juiz"], "answer": 1, "explain": "A SV 35 firma que a homologação não faz coisa julgada material."}, {"q": "Descumpridas as cláusulas da transação penal, o que ocorre?", "options": ["Converte-se automaticamente em prisão", "Retoma-se a situação anterior (status quo ante)", "Nada acontece"], "answer": 1, "explain": "Retoma-se o estado anterior, possibilitando a persecução penal."}, {"q": "O que o Ministério Público pode fazer após o descumprimento?", "options": ["Nada, o caso está encerrado", "Oferecer denúncia ou requisitar inquérito policial", "Apenas executar a pena de multa"], "answer": 1, "explain": "O MP pode retomar a persecução penal com denúncia ou requisição de inquérito."}, {"q": "A transação penal está prevista em qual dispositivo?", "options": ["Art. 89 da Lei 9.099/95", "Art. 76 da Lei 9.099/95", "Art. 44 do CP"], "answer": 1, "explain": "A transação penal é o art. 76 da Lei 9.099/95 (Juizados Especiais Criminais)."}, {"q": "Há conversão automática da pena transacionada (multa/restritiva) em prisão pelo descumprimento?", "options": ["Sim", "Não", "Só para reincidentes"], "answer": 1, "explain": "Não há conversão automática; retoma-se a situação anterior e o MP pode agir."}], "terms": [{"termo": "Transação penal", "definicao": "Acordo do art. 76 da Lei 9.099/95: o MP propõe pena de multa ou restritiva de direitos, evitando o processo.", "secao": "35"}, {"termo": "Coisa julgada formal x material", "definicao": "Formal: imutabilidade dentro do processo. Material: imutabilidade definitiva do mérito. A homologação da transação só produz a formal.", "secao": "35"}, {"termo": "Status quo ante", "definicao": "O estado anterior das coisas; para onde se retorna quando a transação penal é descumprida.", "secao": "35"}, {"termo": "Persecução penal", "definicao": "Atividade estatal de apurar e processar o crime (inquérito e ação penal).", "secao": "35"}], "blocks": ["A transação penal (art. 76 da Lei 9.099/95) é o acordo, nos Juizados Especiais Criminais, em que o Ministério Público propõe ao autor do fato a aplicação imediata de pena restritiva de direitos ou multa, evitando o processo.", "A SV 35 esclarece que a homologação da transação penal faz apenas coisa julgada formal, não material. Se o beneficiário descumprir as cláusulas acordadas, retoma-se a situação anterior (status quo ante) — não há conversão automática da pena de multa ou restritiva em prisão.", "Voltando ao estado anterior, o Ministério Público pode retomar a persecução penal, oferecendo denúncia ou requisitando inquérito policial. Precedente representativo: RE 602.072 (repercussão geral)."]}, {"num": "36", "theme": "Justiça Federal — falsificação de CIR/CHA (Marinha)", "enunciado": "Compete à Justiça Federal comum processar e julgar civil denunciado pelos crimes de falsificação e de uso de documento falso quando se tratar de falsificação da Caderneta de Inscrição e Registro - CIR ou de Carteira de Habilitação de Amador - CHA, ainda que expedidas pela Marinha do Brasil.", "meta": ["Aprovada em 16/10/2014."], "resumo": "O civil que falsifica ou usa documento falso do tipo CIR (Caderneta de Inscrição e Registro) ou CHA (Carteira de Habilitação de Amador) — mesmo emitidos pela Marinha — é julgado pela Justiça Federal comum, não pela Justiça Militar. Em tempo de paz, o civil não comete crime militar nesses casos; como a ofensa atinge interesse/serviço da União, incide o art. 109, IV, da CF.", "pontos": ["Falsificação/uso de CIR ou CHA por civil → Justiça Federal comum (não Justiça Militar).", "Em tempo de paz, o civil não pratica crime militar nessas hipóteses.", "Fundamento: art. 109, IV, da CF (interesse/serviço da União — Marinha).", "Precedente: HC 110.237."], "quiz": [{"q": "Quem julga o civil que falsifica CIR ou CHA (mesmo expedidas pela Marinha)?", "options": ["A Justiça Militar", "A Justiça Federal comum (SV 36)", "A Justiça Estadual"], "answer": 1, "explain": "A SV 36 fixa a competência da Justiça Federal comum nessas hipóteses."}, {"q": "Por que não é a Justiça Militar?", "options": ["Porque o civil, em tempo de paz, não pratica crime militar nesses casos", "Porque a Marinha não é órgão federal", "Porque o crime é de menor potencial ofensivo"], "answer": 0, "explain": "Em tempo de paz, o civil não comete crime militar nessas hipóteses; a ofensa recai sobre interesse da União."}, {"q": "Qual dispositivo fundamenta a competência da Justiça Federal aqui?", "options": ["Art. 114 da CF", "Art. 109, IV, da CF", "Art. 145, II, da CF"], "answer": 1, "explain": "O art. 109, IV, da CF atrai a competência federal (interesse/serviço da União)."}, {"q": "O que são CIR e CHA?", "options": ["Documentos de trânsito urbano", "Caderneta de Inscrição e Registro e Carteira de Habilitação de Amador (documentos náuticos da Marinha)", "Documentos do Exército"], "answer": 1, "explain": "CIR e CHA são documentos náuticos expedidos pela Marinha do Brasil."}, {"q": "Qual o precedente representativo da SV 36?", "options": ["HC 110.237", "RE 116.121", "ADI 1.648"], "answer": 0, "explain": "O HC 110.237 é o precedente representativo da SV 36."}], "terms": [{"termo": "CIR", "definicao": "Caderneta de Inscrição e Registro, documento náutico expedido pela Marinha do Brasil.", "secao": "36"}, {"termo": "CHA", "definicao": "Carteira de Habilitação de Amador, documento náutico expedido pela Marinha do Brasil.", "secao": "36"}, {"termo": "Competência da Justiça Federal (art. 109, IV)", "definicao": "Alcança crimes que ofendem bens, serviços ou interesse da União — como no caso da CIR/CHA.", "secao": "36"}, {"termo": "Crime militar x comum", "definicao": "Em tempo de paz, o civil, nas hipóteses da SV 36, pratica crime comum (Justiça Federal), não crime militar.", "secao": "36"}], "blocks": ["A SV 36 fixa a competência da Justiça Federal comum (e não da Justiça Militar) para julgar o civil acusado de falsificação e uso de documento falso, quando o documento é a Caderneta de Inscrição e Registro (CIR) ou a Carteira de Habilitação de Amador (CHA), ainda que expedidas pela Marinha do Brasil.", "A razão: em tempo de paz, o civil, nessas hipóteses, não pratica crime militar. A ofensa recai sobre interesse e serviço da União (a Marinha é órgão federal), o que atrai o art. 109, IV, da CF (competência da Justiça Federal).", "Fundamentos citados pelo STF: arts. 21, XXII; 109, IV; e 144, §1º, III, da CF. Precedente representativo: HC 110.237."]}], "glossario": [{"termo": "Depositário infiel", "definicao": "Quem, tendo o dever de guardar e devolver um bem (depósito), deixa de restituí-lo. A SV 25 proíbe sua prisão civil.", "secao": "25"}, {"termo": "Prisão civil por dívida", "definicao": "Prisão decretada pelo descumprimento de obrigação civil. Hoje só cabe contra o devedor de alimentos.", "secao": "25"}, {"termo": "Status supralegal", "definicao": "Posição dos tratados de direitos humanos não aprovados pelo rito do art. 5º, §3º: acima das leis e abaixo da Constituição.", "secao": "25"}, {"termo": "Pacto de San José da Costa Rica", "definicao": "Convenção Americana de Direitos Humanos (Decreto 678/92); só admite prisão civil do devedor de alimentos.", "secao": "25"}, {"termo": "Progressão de regime", "definicao": "Passagem para regime menos rigoroso (fechado → semiaberto → aberto) no cumprimento da pena, conforme lapso e mérito.", "secao": "26"}, {"termo": "Crime hediondo", "definicao": "Crime de especial gravidade listado na Lei 8.072/90, com regras mais rígidas de execução penal.", "secao": "26"}, {"termo": "Individualização da pena", "definicao": "Garantia do art. 5º, XLVI, da CF: a pena deve ser adaptada ao caso concreto — base da inconstitucionalidade do regime integralmente fechado.", "secao": "26"}, {"termo": "Exame criminológico", "definicao": "Perícia que avalia condições pessoais do preso; pode ser exigido, de modo fundamentado, para aferir o requisito subjetivo da progressão.", "secao": "26"}, {"termo": "ANATEL", "definicao": "Agência Nacional de Telecomunicações; autarquia federal (Lei 9.472/97). Sua presença na lide atrai a Justiça Federal.", "secao": "27"}, {"termo": "Litisconsorte passivo necessário", "definicao": "Parte que obrigatoriamente deve figurar no polo passivo para a validade do processo.", "secao": "27"}, {"termo": "Assistente / opoente", "definicao": "Terceiros que ingressam no processo; se forem entes federais, deslocam a competência para a Justiça Federal.", "secao": "27"}, {"termo": "Competência da Justiça Federal (art. 109, I)", "definicao": "Fixada em razão da pessoa: União, autarquias e empresas públicas federais como partes, assistentes ou opoentes.", "secao": "27"}, {"termo": "Crédito tributário", "definicao": "Valor que o Fisco tem direito de cobrar do contribuinte após o lançamento.", "secao": "28"}, {"termo": "Depósito prévio", "definicao": "Depósito exigido antes de praticar um ato processual. Como condição de acesso ao Judiciário em matéria tributária, é inconstitucional (SV 28).", "secao": "28"}, {"termo": "Inafastabilidade da jurisdição", "definicao": "Garantia do art. 5º, XXXV, da CF: a lei não excluirá da apreciação do Judiciário lesão ou ameaça a direito.", "secao": "28"}, {"termo": "Suspensão da exigibilidade", "definicao": "Situação em que o Fisco não pode cobrar o crédito; o depósito integral é uma das causas (art. 151, II, do CTN).", "secao": "28"}, {"termo": "Taxa", "definicao": "Tributo vinculado a serviço público específico e divisível ou ao poder de polícia (art. 145, II, da CF).", "secao": "29"}, {"termo": "Base de cálculo", "definicao": "Grandeza sobre a qual se aplica a alíquota para apurar o valor do tributo.", "secao": "29"}, {"termo": "Identidade integral", "definicao": "Coincidência total entre a base de cálculo da taxa e a de um imposto — é isso que a Constituição proíbe.", "secao": "29"}, {"termo": "Súmula-fantasma", "definicao": "Súmula cuja redação foi aprovada, mas cuja publicação foi suspensa; não entra em vigor. É o caso da SV 30.", "secao": "30"}, {"termo": "Repartição de receitas (ICMS)", "definicao": "Parte do ICMS pertence aos municípios (art. 158, IV, da CF); é vedado reter esses repasses (art. 160).", "secao": "30"}, {"termo": "ISS (ISSQN)", "definicao": "Imposto Sobre Serviços de Qualquer Natureza, de competência municipal (art. 156, III, da CF); incide sobre prestação de serviço.", "secao": "31"}, {"termo": "Obrigação de fazer x de dar", "definicao": "Serviço é obrigação de fazer (tributável pelo ISS); locação de coisa é obrigação de dar (não é serviço).", "secao": "31"}, {"termo": "Locação de bens móveis", "definicao": "Cessão temporária do uso de coisa móvel; não sofre ISS (SV 31).", "secao": "31"}, {"termo": "Contrato misto", "definicao": "Contrato que reúne locação e serviço; o ISS pode incidir sobre a parcela de serviço.", "secao": "31"}, {"termo": "Salvados de sinistro", "definicao": "Bens que restam de um sinistro e são transferidos à seguradora com o pagamento da indenização.", "secao": "32"}, {"termo": "ICMS", "definicao": "Imposto estadual sobre circulação de mercadorias e alguns serviços (art. 155, II, da CF).", "secao": "32"}, {"termo": "Operação de seguro", "definicao": "Atividade própria da seguradora; a venda de salvados a integra e, por isso, não sofre ICMS.", "secao": "32"}, {"termo": "Aposentadoria especial", "definicao": "Aposentadoria por trabalho em condições prejudiciais à saúde/integridade; para o servidor, depende de lei complementar (art. 40, §4º, III, CF).", "secao": "33"}, {"termo": "Mandado de injunção", "definicao": "Ação para viabilizar direito inviabilizado pela falta de norma regulamentadora; origem da SV 33.", "secao": "33"}, {"termo": "RGPS", "definicao": "Regime Geral de Previdência Social (INSS); suas regras se aplicam \"no que couber\" ao servidor, na falta de lei específica.", "secao": "33"}, {"termo": "Lei complementar", "definicao": "Espécie normativa exigida pela CF para certos temas; sua ausência gerou a omissão suprida pela SV 33.", "secao": "33"}, {"termo": "GDASST", "definicao": "Gratificação de Desempenho de Atividade de Seguridade Social e do Trabalho (Lei 10.483/2002); estendida aos inativos com paridade (SV 34).", "secao": "34"}, {"termo": "Paridade", "definicao": "Regra pela qual os proventos do inativo acompanham a remuneração do servidor ativo (mantida por regras de transição — EC 20/98, 41/03 e 47/05).", "secao": "34"}, {"termo": "Gratificação de desempenho", "definicao": "Vantagem ligada ao desempenho; quando paga de forma linear, tem caráter geral e se estende aos inativos com paridade.", "secao": "34"}, {"termo": "Transação penal", "definicao": "Acordo do art. 76 da Lei 9.099/95: o MP propõe pena de multa ou restritiva de direitos, evitando o processo.", "secao": "35"}, {"termo": "Coisa julgada formal x material", "definicao": "Formal: imutabilidade dentro do processo. Material: imutabilidade definitiva do mérito. A homologação da transação só produz a formal.", "secao": "35"}, {"termo": "Status quo ante", "definicao": "O estado anterior das coisas; para onde se retorna quando a transação penal é descumprida.", "secao": "35"}, {"termo": "Persecução penal", "definicao": "Atividade estatal de apurar e processar o crime (inquérito e ação penal).", "secao": "35"}, {"termo": "CIR", "definicao": "Caderneta de Inscrição e Registro, documento náutico expedido pela Marinha do Brasil.", "secao": "36"}, {"termo": "CHA", "definicao": "Carteira de Habilitação de Amador, documento náutico expedido pela Marinha do Brasil.", "secao": "36"}, {"termo": "Competência da Justiça Federal (art. 109, IV)", "definicao": "Alcança crimes que ofendem bens, serviços ou interesse da União — como no caso da CIR/CHA.", "secao": "36"}, {"termo": "Crime militar x comum", "definicao": "Em tempo de paz, o civil, nas hipóteses da SV 36, pratica crime comum (Justiça Federal), não crime militar.", "secao": "36"}]};</script>
<script>
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shortTitle(t){let x=String(t);if(x.length>40)x=x.slice(0,38).replace(/\s+\S*$/,'')+'…';return x;}
const store=(()=>{let ok=true;try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){ok=false;}const mem={};
  return{get(k,d){try{if(ok){const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}}catch(e){}return(k in mem)?mem[k]:d;},
  set(k,v){try{if(ok){localStorage.setItem(k,JSON.stringify(v));return;}}catch(e){}mem[k]=v;}};})();
const SKEY='sv2_v1';
let state=Object.assign({theme:'claro',fs:'19',lh:'1.75',measure:'66ch',font:false,bionic:false,focus:false,rate:'1',read:[]},store.get(SKEY,{}));
