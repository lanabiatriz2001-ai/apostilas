xados para uma pessoa e não para um estado biológico da mulher – desconhece que o titular do direito a alimentos é o nascituro, e não a mãe, partindo de premissa errada, o que repercute no teor da lei”.<sup class=\"fn\" title=\"Nota 36 do original — o texto da nota não faz parte deste trecho (Parte I)\">36</sup>", "Tem razão a Professora Titular da USP, uma vez que a norma despreza toda a evolução científica e doutrinária no sentido de reconhecer os direitos do nascituro, principalmente aqueles de natureza existencial, fundados na sua personalidade. Desse modo, seria melhor que a lei fosse denominada lei dos alimentos do nascituro, ou algo próximo. Acrescente-se que o Superior Tribunal de Justiça concluiu, mais uma vez adotando a teoria concepcionista, que a lei visa à proteção do nascituro. Nos termos de ementa de julho de 2017, entendeu a sua Terceira Turma que “os alimentos gravídicos, previstos na Lei n. 11.804/2008, visam a auxiliar a mulher gestante nas despesas decorrentes da gravidez, da concepção ao parto, sendo, pois, a gestante a beneficiária direta dos alimentos gravídicos, ficando, por via de consequência, resguardados os direitos do próprio nascituro” (STJ, REsp 1629423/SP, 3.ª Turma, Rel. Min. Marco Aurélio Bellizze, j. 06.06.2017, DJe 22.06.2017).", "Pois bem, no Projeto de Reforma do Código Civil, elaborado pela Comissão de Juristas formada no Senado Federal, após intensos debates, não se chegou a um consenso para a alteração do art. 2.º do Código Civil, que foi mantido em sua integralidade, sem qualquer mudança.", "De todo modo, a teoria concepcionista está reforçada em vários dos preceitos sugeridos, destacando-se, de início, a proposição que reconhece direitos da personalidade ao nascituro, na linha do Enunciado n. 1 da I Jornada de Direito Civil. Consoante o projetado § 4.º do art. 11 da codificação privada, “a tutela dos direitos de personalidade alcança, no que couber e nos limites de sua aplicabilidade, os nascituros, os natimortos e as pessoas falecidas”.", "Ademais, no novo art. 1.511-A ora proposto protege-se o nascituro no âmbito da família, estabelecendo-se, em seu caput, que “o planejamento familiar é de livre decisão do casal, competindo ao Estado propiciar recursos educacionais e financeiros para o exercício deste direito, vedada qualquer forma de coerção, por parte de instituições privadas ou públicas”. Em complemento, o seu § 1.º enunciará que a potencialidade da vida humana pré-uterina e a vida humana pré-uterina e uterina – no caso, o nascituro – são expressões da dignidade humana e de paternidade e maternidade responsáveis. Como última sugestão para o comando, o § 2.º preceituará que “o cuidado físico e psíquico que se deva dar a gestante ou a quem pretende engravidar é tema concernente à intimidade da vida familiar com o suporte de assistência médica que o Estado deve prestar à família”.", "Além de tudo isso, a Comissão de Juristas propõe a revogação da Lei dos Alimentos Gravídicos, na linha das críticas doutrinárias e ressalvas jurisprudenciais antes expostas, para que a codificação privada passe a tratar, em seus arts. 1.701-A a 1.701-C, sobre “os alimentos devidos ao nascituro e à gestante”. Espera-se que o Congresso Nacional aprove tais proposições.", "Esclarecida e consolidada a prevalência da teoria concepcionista no Direito Civil contemporâneo, e a necessidade de alteração do Código Civil sobre a temática, cumpre trazer algumas palavras sobre a situação jurídica do embrião.", "A Lei 11.105/2005, conhecida como Lei de Biossegurança, tutela a integridade física do embrião, reforçando a teoria concepcionista. Isso, diante da proibição da engenharia genética em embrião humano, como regra. O art. 5.º da referida lei autoriza a utilização de células-tronco embrionárias para fins científicos e terapêuticos, desde que os embriões sejam considerados como inviáveis.", "Além dessa situação, é possível a utilização das células embrionárias nos casos de embriões congelados há três anos ou mais, na data da publicação da lei, ou já congelados na data da publicação da norma, depois de completarem três anos, contados a partir da data do congelamento. A lei exige autorização dos genitores do embrião, para que sejam utilizados para tais fins. Como se pode notar, a utilização de células-tronco embrionárias é exceção e não regra.", "Em maio de 2008, o Supremo Tribunal Federal discutiu a constitucionalidade do dispositivo, em ação declaratória de inconstitucionalidade proposta pela Procuradoria-Geral da República (ADIn 3.510). Seguindo a relatoria do Ministro Carlos Ayres Britto, por maioria de votos prevaleceu o entendimento de sua constitucionalidade, autorizando a pesquisa com células-tronco em nosso País.", "Destaque-se que, apesar da filiação à tese concepcionista, sou totalmente favorável à constitucionalidade do comando em análise. Primeiro, porque a lei acaba trazendo uma presunção de morte do embrião, autorizando a utilização de suas células-tronco se eles forem inviáveis à reprodução. Segundo, porque a partir de uma ponderação de valores constitucionais, os interesses da coletividade quanto à evolução científica devem prevalecer sobre os interesses individuais ou de determinados grupos, sobretudo religiosos.", "A utilização de células-tronco para fins de terapia representa uma chama de esperança para inúmeras pessoas que enfrentam doenças e problemas de saúde. Por fim, insta repisar que os critérios para a utilização das referidas células são rígidos, o que traz a conclusão do seu caráter excepcional.", "Como última observação sobre o tema, já ficou evidente que o Projeto de Reforma do Código Civil pretende proteger o embrião como vida humana e expressão da dignidade da pessoa, pela projeção do novo art. 1.511-A, § 2.º, do Código Civil. Nos termos exatos da proposta, “a potencialidade da vida humana pré-uterina e a vida humana pré-uterina e uterina são expressões da dignidade humana e de paternidade e maternidade responsáveis”.", "Por óbvio que a “potencialidade da vida humana pré-uterina” refere-se apenas aos gametas, aos óvulos e aos espermatozoides. Como vida humana pré-uterina tem-se o embrião e como vida humana uterina, o nascituro, tudo em confirmação da teoria concepcionista, que acabou prevalecendo na Comissão de Juristas, para os fins do Direito Civil, apesar de não se chegar a um consenso para a alteração do art. 2.º da codificação privada.", "Além de tudo isso, como se verá, o projeto de atualização pretende incluir na Lei Geral Privada um tratamento sobre a reprodução assistida, com menções à proteção do embrião, nos novos arts. 1.629-A a 1629-U, assunto tratado no capítulo deste livro relativo ao Direito de Família."]}, {"num": "2.2.3", "title": "2.2.3 Os incapazes no Código Civil de 2002", "resumo": "Os incapazes estão nos arts. 3º (absolutamente incapazes) e 4º (relativamente incapazes). O Estatuto da Pessoa com Deficiência (Lei 13.146/2015) fez uma “revolução”: hoje, os ÚNICOS absolutamente incapazes são os menores de 16 anos (critério apenas etário) — não existem mais maiores absolutamente incapazes. As pessoas com deficiência passaram, em regra, a ser plenamente capazes (a lógica mudou de dignidade-vulnerabilidade para dignidade-liberdade). São relativamente incapazes: os maiores de 16 e menores de 18; os ébrios habituais e viciados em tóxico; os que, por causa transitória ou permanente, não puderem exprimir a vontade; e os pródigos. Suprimento: o absolutamente incapaz é representado (sob pena de nulidade); o relativamente incapaz é assistido (sob pena de anulabilidade). Surgiu ainda a tomada de decisão apoiada (art. 1.783-A) para auxiliar a pessoa com deficiência sem retirar sua capacidade.", "pontos": ["Absolutamente incapazes hoje = SÓ os menores de 16 anos (art. 3º).", "O EPD (Lei 13.146/2015) eliminou os maiores absolutamente incapazes.", "Relativamente incapazes (art. 4º): 16–18 anos; ébrios/viciados; quem não pode exprimir vontade; pródigos.", "Absoluto = representado (nulidade); relativo = assistido (anulabilidade).", "Novidade: tomada de decisão apoiada (art. 1.783-A)."], "quiz": [{"q": "Após o Estatuto da Pessoa com Deficiência (Lei 13.146/2015), quem são os absolutamente incapazes?", "options": ["Os menores de 16 anos e as pessoas com deficiência mental", "Apenas os menores de 16 anos", "Os menores de 18 anos"], "answer": 1, "explain": "O EPD restringiu a incapacidade absoluta aos menores de 16 anos (critério etário). Não há mais maiores absolutamente incapazes."}, {"q": "Como se supre a incapacidade de cada categoria?", "options": ["Absoluto: assistência; relativo: representação", "Absoluto: representação (nulidade); relativo: assistência (anulabilidade)", "Ambos por curatela apenas"], "answer": 1, "explain": "O absolutamente incapaz é representado, sob pena de nulidade (art. 166, I); o relativamente incapaz é assistido, sob pena de anulabilidade (art. 171, I)."}, {"q": "A “tomada de decisão apoiada” (art. 1.783-A) serve para:", "options": ["Retirar a capacidade da pessoa com deficiência", "Auxiliar a pessoa com deficiência nas decisões, mantendo sua capacidade", "Substituir a emancipação"], "answer": 1, "explain": "É um processo em que a pessoa com deficiência elege ao menos duas pessoas de confiança para apoiá-la, sem perder a capacidade."}, {"q": "Com o Estatuto da Pessoa com Deficiência, a pessoa com deficiência passou a ser, em regra:", "options": ["Absolutamente incapaz", "Plenamente capaz", "Relativamente incapaz sempre"], "answer": 1, "explain": "O objetivo do EPD foi a plena inclusão: a pessoa com deficiência é, em regra, plenamente capaz; só eventualmente será relativamente incapaz."}, {"q": "A lógica introduzida pelo EPD pode ser resumida como a substituição de:", "options": ["Dignidade-liberdade por dignidade-vulnerabilidade", "Dignidade-vulnerabilidade por dignidade-liberdade", "Capacidade por incapacidade"], "answer": 1, "explain": "A dignidade-liberdade substitui a dignidade-vulnerabilidade: deixa-se de tratar a pessoa com deficiência como vulnerável para incluí-la como capaz."}, {"q": "Quem são os relativamente incapazes no art. 4º (redação atual)?", "options": ["Só os menores de 16 anos", "Maiores de 16 e menores de 18; ébrios habituais e viciados em tóxico; quem não puder exprimir vontade; e os pródigos", "Apenas os pródigos"], "answer": 1, "explain": "Art. 4º: os maiores de 16 e menores de 18; os ébrios habituais e viciados em tóxico; os que por causa transitória ou permanente não puderem exprimir vontade; e os pródigos."}, {"q": "O pródigo é:", "options": ["Quem tem deficiência mental", "Quem dissipa de forma desordenada o seu patrimônio", "Um menor de 16 anos"], "answer": 1, "explain": "Pródigo é quem dissipa desordenadamente os bens; recebe curador e fica privado de atos que comprometam o patrimônio (art. 1.782), mas pode, por exemplo, casar."}, {"q": "A maioridade civil, no CC/2002, passou de quantos anos?", "options": ["De 18 para 21 anos", "De 21 para 18 anos", "Permaneceu em 21 anos"], "answer": 1, "explain": "O CC/2002 reduziu a maioridade civil de 21 para 18 anos (art. 4º, I, quanto ao limite entre 16 e 18)."}, {"q": "Sobre o ausente, é correto afirmar que:", "options": ["Continua sendo absolutamente incapaz", "Não é mais considerado incapaz; a ausência é morte presumida, em três fases", "É relativamente incapaz"], "answer": 1, "explain": "O ausente não é mais incapaz (como era no CC/1916). A ausência significa morte presumida, com três fases: curadoria dos bens, sucessão provisória e definitiva."}, {"q": "A curatela, pelo art. 85 do EPD, afeta:", "options": ["Todos os atos da vida civil", "Apenas os atos de natureza patrimonial e negocial", "O direito ao voto e ao casamento"], "answer": 1, "explain": "A curatela é medida extraordinária que afeta somente atos patrimoniais e negociais; não alcança corpo, sexualidade, casamento, saúde, trabalho e voto."}], "terms": [{"termo": "Absolutamente incapaz", "definicao": "Hoje, apenas o menor de 16 anos (art. 3º); é representado, sob pena de nulidade.", "secao": "2.2.3"}, {"termo": "Relativamente incapaz", "definicao": "Maiores de 16 e menores de 18; ébrios/viciados; quem não pode exprimir vontade; pródigos (art. 4º). É assistido, sob pena de anulabilidade.", "secao": "2.2.3"}, {"termo": "Estatuto da Pessoa com Deficiência", "definicao": "Lei 13.146/2015: tornou a pessoa com deficiência, em regra, plenamente capaz (dignidade-liberdade).", "secao": "2.2.3"}, {"termo": "Representação", "definicao": "Suprimento da incapacidade do absolutamente incapaz; sua falta gera nulidade (art. 166, I).", "secao": "2.2.3"}, {"termo": "Assistência", "definicao": "Suprimento da incapacidade do relativamente incapaz; sua falta gera anulabilidade (art. 171, I).", "secao": "2.2.3"}, {"termo": "Tomada de decisão apoiada", "definicao": "Processo (art. 1.783-A) em que a pessoa com deficiência elege apoiadores de confiança, sem perder a capacidade.", "secao": "2.2.3"}, {"termo": "Curatela", "definicao": "Instituto assistencial dos maiores incapazes; medida extraordinária, restrita a atos patrimoniais e negociais (art. 85 EPD).", "secao": "2.2.3"}, {"termo": "Pródigo", "definicao": "Quem dissipa desordenadamente o patrimônio; é relativamente incapaz e recebe curador para atos patrimoniais.", "secao": "2.2.3"}, {"termo": "Dignidade-liberdade", "definicao": "Lógica do EPD: incluir a pessoa com deficiência como capaz, em vez de protegê-la como vulnerável (dignidade-vulnerabilidade).", "secao": "2.2.3"}, {"termo": "Ausência", "definicao": "Morte presumida após processo com três fases (curadoria, sucessão provisória e definitiva); o ausente não é mais incapaz.", "secao": "2.2.3"}], "blocks": ["Os incapazes sempre estiveram tratados nos arts. 3.º e 4.º do CC/2002, conforme tabela a seguir, que mostra a redação original da codificação privada, até as mudanças inseridas pela Lei 13.146/2015:", "Absolutamente incapazes (art. 3.º Relativamente incapazes (art. 4.º do CC) do CC)", "I – Os menores de dezesseis anos I – Os maiores de dezesseis e (menores impúberes); menores de dezoito anos (menores púberes); II – Os que, por enfermidade ou deficiência mental, não tiverem o", "necessário discernimento para a II – Os ébrios habituais, os viciados prática desses atos; em tóxicos, e os que, por deficiência mental, tenham o discernimento III – Os que, mesmo por causa reduzido; transitória, não puderem exprimir sua vontade. III – Os excepcionais, sem desenvolvimento mental completo;", "IV – Os pródigos.", "Essa norma foi sancionada no dia 6 de julho de 2015, instituindo o Estatuto da Pessoa com Deficiência. A lei foi publicada no dia 7 de julho, e entrou em vigor 180 dias após sua publicação, em janeiro de 2016. Em verdade, o Estatuto da Pessoa com Deficiência acabou por consolidar ideias constantes na Convenção de Nova York, tratado internacional de direitos humanos do qual o País é signatário e que entrou no sistema jurídico com efeitos de Emenda à Constituição por força do art. 5.º, § 3.º, da CF/1988 e do Decreto 6.949/2009.", "O art. 3.º da Convenção consagra como princípios a igualdade plena das pessoas com deficiência e a sua inclusão com autonomia, recomendando o dispositivo seguinte a revogação de todos os diplomas legais que tratam as pessoas com deficiência de forma discriminatória.", "O Estatuto da Pessoa com Deficiência gerou muitas polêmicas desde a sua entrada em vigor, especialmente diante de conflitos com o então Novo Código de Processo Civil. Para tentar resolvê-las, está ainda em trâmite no Congresso Nacional o Projeto de Lei 757/2015, originário do Senado, que contou com o meu parecer e o apoio parcial. Na Câmara dos Deputados, o número dessa projeção é 11.091/2018, novamente com nossa atuação, com sugestões feitas ao saudoso Deputado Luiz Flávio Gomes no ano de 2019. O Projeto de Reforma do Código Civil igualmente pretende sanar problemas criados pelo EPD, confirmando as críticas feitas por parte considerável da doutrina civilista.", "O art. 114 do Estatuto da Pessoa com Deficiência alterou substancialmente os dispositivos, revogando todos os incisos do art. 3.º e alterando os incisos II e III do art. 4.º da codificação material. Vejamos as redações atuais dos comandos:", "Absolutamente incapazes (art. 3.º do Relativamente incapazes (art. CC) 4.º do CC)", "“Art. 3.º São absolutamente incapazes de “Art. 4.º São incapazes, exercer pessoalmente os atos da vida relativamente a certos atos, ou à civil os menores de 16 (dezesseis) anos.” maneira de os exercer:", "I – (Revogado); I – os maiores de dezesseis e menores de dezoito anos; II – (Revogado); II – os ébrios habituais e os III – (Revogado). viciados em tóxico;", "III – aqueles que, por causa transitória ou permanente, não puderem exprimir sua vontade;", "IV – os pródigos.”", "Como se percebe, em sua redação originária, o inciso I do art. 3.º mencionava os menores de 16 anos, tidos como menores impúberes. O seu inciso II expressava os que, por enfermidade ou deficiência mental, não tivessem o necessário discernimento para a prática desses atos. Por fim, no inciso III havia a previsão dos que, mesmo por causa transitória, não pudessem exprimir sua vontade.", "Com as mudanças, somente são absolutamente incapazes os menores de 16 anos, não mais havendo maiores absolutamente incapazes, afirmação esta que tem sido seguida por julgados prolatados sob a vigência do EPD. Por todos, do Tribunal Paulista e citando esta obra:", "“Reforma legislativa, decorrente da Lei n.º 13.146/15 (EPD), que restringe a incapacidade absoluta aos menores impúberes. Reconhecimento de que o interdito é relativamente incapaz, abrangendo a curatela os atos relacionados aos direitos de natureza patrimonial e negocial. Artigo 4.º, inciso III, do Código Civil, e artigo 85 do Estatuto da Pessoa com Deficiência. Sentença reformada em parte. Apelo parcialmente provido” (TJSP, Apelação Cível com Voto 36.737, 3.ª Câmara de Direito Privado, Rel. Des. Donegá Morandini, j. 16.12.2016).", "No mesmo sentido de não haver mais maiores de idade que sejam absolutamente incapazes, citando a minha posição doutrinária, importante precedente do STJ, com o seguinte trecho de ementa: “a Lei n. 13.146/2015, que instituiu o Estatuto da Pessoa com Deficiência, tem por objetivo assegurar e promover a inclusão social das pessoas com deficiência física ou psíquica e garantir o exercício de sua capacidade em igualdade de condições com as demais pessoas. A partir da entrada em vigor da referida lei, a incapacidade absoluta para exercer pessoalmente os atos da vida civil se restringe aos menores de 16 (dezesseis) anos, ou seja, o critério passou a ser apenas etário, tendo sido eliminadas as hipóteses de deficiência mental ou intelectual anteriormente previstas no Código Civil” (STJ, REsp 1.927.423/SP, 3.ª Turma, Rel. Min. Marco Aurélio Bellizze, j. 27.04.2021, DJe 04.05.2021). Importante destacar que essa posição tem se repetido na Corte Superior, cabendo a transcrição do seguinte julgado, por todos:", "“Direito civil. Recurso especial. Interdição. Estatuto da Pessoa com Deficiência. Incapacidade relativa. I. Caso em exame. 1. Ação de interdição com pedido de liminar para decretação da interdição ilimitada da parte recorrida, com base no estado mental do interditando, conforme art. 755, § 3.º, do Código de Processo Civil. 2. Sentença de primeiro grau julgou parcialmente procedente o pedido, decretando a interdição parcial da parte recorrida, com base no Estatuto da Pessoa com Deficiência (Lei n. 13.146/2015), restringindo a interdição a atos de cunho patrimonial. 3. Recurso de apelação provido pelo Tribunal de origem, reconhecendo a incapacidade total do interditando. II. Questão em discussão. 4. A questão em discussão consiste em saber se, à luz do Estatuto da Pessoa com Deficiência (Lei n. 13.146/2015), é possível decretar a incapacidade total de um adulto com deficiência mental, ou se a incapacidade deve ser relativa, restringindo-se a atos patrimoniais e negociais. III. Razões de decidir. 5. A interpretação do acórdão recorrido diverge do entendimento do Superior Tribunal de Justiça, que estabelece que, após a entrada em vigor da Lei n. 13.146/2015, a incapacidade absoluta para atos da vida civil é restrita aos menores de dezesseis anos. 6. O Estatuto da Pessoa com Deficiência assegura o exercício da capacidade legal em igualdade de condições, estabelecendo a curatela como medida protetiva extraordinária, proporcional às necessidades e circunstâncias de cada caso. 7. O laudo pericial concluiu pela incapacidade total do interditando, mas, considerando o novo sistema de incapacidades, deve ser reconhecida a incapacidade relativa, conforme a sentença de primeiro grau. IV. Dispositivo e tese. 8. Recurso provido para cassar o acórdão recorrido e restabelecer a sentença de primeiro grau que reconheceu a incapacidade relativa da parte recorrida. Tese de julgamento: ‘1. A incapacidade absoluta para atos da vida civil é restrita aos menores de dezesseis anos, conforme o Estatuto da Pessoa com Deficiência. 2. A curatela é medida protetiva extraordinária, proporcional às necessidades e circunstâncias de cada caso, afetando apenas atos patrimoniais e negociais’. Dispositivos relevantes citados: Código Civil, arts. 3.º e 4.º; Lei n. 13.146/2015, arts. 84 e 85. Jurisprudência relevante citada: STJ, REsp n. 1.927.423/SP, Rel. Min. Marco Aurélio Bellizze, Terceira Turma, julgado em 27.04.2021” (STJ, REsp 1.884.638/SP, 3.ª Turma, Rel. Min. Humberto Martins, j. 19.05.2025, DJEN 22.05.2025).", "Repise-se que o objetivo do EPD foi a plena inclusão da pessoa com algum tipo de deficiência, tutelando a sua dignidade humana. Deixou-se de lado, assim, a proteção de tais pessoas como vulneráveis, o que era retirado do sistema anterior. Em outras palavras, a dignidade-liberdade substitui a dignidade-vulnerabilidade. Nesse contexto, todas as pessoas com deficiência que eram tratadas no art. 3.º anterior passam a ser, em regra, plenamente capazes para o Direito Civil. Eventualmente, podem ser tidas como relativamente incapazes, em algum enquadramento do art. 4.º do Código Civil, também ora alterado.", "Como se pode perceber, no último preceito não há mais a menção às pessoas com deficiência no inc. II. Quanto ao termo excepcionais sem desenvolvimento completo (art. 4.º, inc. III), ele foi substituído pela antiga expressão que se encontrava no anterior art. 3.º, inc. III, ora revogado (“aqueles que, por causa transitória ou permanente, não puderem exprimir sua vontade”). Em suma, pode-se dizer que houve uma verdadeira revolução na teoria das incapacidades.", "Em complemento, merece destaque o art. 6.º da Lei 13.146/2015, segundo o qual a deficiência não afeta a plena capacidade civil da pessoa, inclusive para: a) casar-se e constituir união estável; b) exercer direitos sexuais e reprodutivos; c) exercer o direito de decidir sobre o número de filhos e de ter acesso a informações adequadas sobre reprodução e planejamento familiar; d) conservar sua fertilidade, sendo vedada a esterilização compulsória; e) exercer o direito à família e à convivência familiar e comunitária; e f) exercer o direito à guarda, à tutela, à curatela e à adoção, como adotante ou adotando, em igualdade de oportunidades com as demais pessoas. Em suma, no plano familiar, para os atos existenciais, há uma inclusão plena das pessoas com deficiência.", "O art. 84 do Estatuto da Pessoa com Deficiência, também em prol da inclusão com dignidade-liberdade, estabelece que a pessoa com deficiência tem assegurado o direito ao exercício de sua capacidade legal em igualdade de condições com as demais pessoas. Eventualmente, quando necessário, a pessoa com deficiência será submetida à curatela, conforme a lei.", "Ademais, o mesmo comando prescreve que é facultada à pessoa com deficiência a adoção de processo de tomada de decisão apoiada, como se verá ainda nesta obra. A definição de curatela de pessoa com deficiência constitui medida protetiva extraordinária, proporcional às necessidades e às circunstâncias de cada caso, e durará o menor tempo possível. Por fim, o preceito enuncia que os curadores são obrigados a prestar, anualmente, contas de sua administração ao juiz, apresentando o balanço do respectivo ano.", "A curatela afetará tão somente os atos relacionados aos direitos de natureza patrimonial e negocial, conforme o art. 85 do Estatuto da Pessoa com Deficiência. A definição da curatela não alcança o direito ao próprio corpo, à sexualidade, ao matrimônio, à privacidade, à educação, à saúde, ao trabalho e ao voto, o que também é retirado do art. 6.º da mesma norma, ora citada.", "Em outras palavras, podem existir limitações para os atos patrimoniais, e não para os existenciais, que visam à promoção da pessoa humana. Além disso, está previsto no mesmo comando que a curatela constitui medida extraordinária, devendo constar da sentença as razões e motivações de sua definição, preservados os interesses do curatelado.", "Assim, constata-se que, para que a curatela esteja presente, há necessidade de uma ação judicial específica, com enquadramento em uma das hipóteses do novo art. 4.º do CC/2002, especialmente no seu inciso III. No caso de pessoa em situação de institucionalização, ao nomear curador, o juiz deve dar preferência a pessoa que tenha vínculo de natureza familiar, afetiva ou comunitária com o curatelado.", "Feitas essas considerações gerais a respeito do Estatuto emergente, a respeito dos absolutamente incapazes, devem eles ser representados sob pena de nulidade absoluta do ato praticado (art. 166, inc. I, do CC). Quanto aos relativamente incapazes, o instituto de suprimento é a assistência, sob pena de anulabilidade do negócio (art. 171, inc. I). Na verdade, o sistema de incapacidade anterior não protegia a pessoa em si, mas os negócios e atos praticados, em uma visão excessivamente patrimonialista, que sempre mereceu críticas. Tais categorias de suprimento da incapacidade para os negócios jurídicos não se confundem com os institutos de direito assistencial dos incapazes. Para os menores incapazes há a tutela; para os maiores incapazes, a curatela. Esses institutos de direito assistencial também sofreram mudanças consideráveis pelo Estatuto da Pessoa com Deficiência, conforme está desenvolvido no Capítulo 8 desta obra.", "Questão sempre debatida pela doutrina se referia à hipótese concreta em que o negócio é celebrado com um incapaz antes do processo de interdição. Vindo a sentença declaratória de incapacidade posterior, tal ato pode ser tido como nulo ou anulado? Tratando da matéria, Pablo Stolze Gagliano e Rodolfo Pamplona sempre seguiram em parte a solução francesa, no sentido de que os atos anteriores à interdição poderão ser tidos como inválidos se a causa da interdição existia anteriormente à época em que tais fatos foram praticados, podendo ser percebida pelo negociante capaz.<sup class=\"fn\" title=\"Nota 37 do original — o texto da nota não faz parte deste trecho (Parte I)\">37</sup> Em sentido próximo, mas com maior radicalidade, a visão clássica, mormente nos casos de incapacidade absoluta, ia no sentido de que os atos devem ser tidos como nulos ou anuláveis.<sup class=\"fn\" title=\"Nota 38 do original — o texto da nota não faz parte deste trecho (Parte I)\">38</sup>", "Na minha opinião doutrinária, a melhor solução era aquela que prestigiava a boa-fé e a confiança entre as partes, tidos como preceitos de ordem pública, conforme o Enunciado n. 363 do Conselho da Justiça Federal, aprovado na IV Jornada de Direito Civil. Assim, a boa-fé blindaria o adquirente que ignorava a situação do interdito, prevalecendo o negócio celebrado, se hígido for na substância e na forma. Destaque-se que pelo sistema do Código Civil de 2002, a boa-fé deve ser tida como presumida, e não a má-fé. Trazendo tal conclusão, do antigo e extinto Primeiro Tribunal de Alçada Civil de São Paulo:", "“Ato jurídico. Requisitos. Agente absolutamente incapaz. Emissão de título executivo. Obrigação assumida, entretanto, antes da interdição judicial. Nulidade que só se reconhece se, ao tempo da realização do ato, a deficiência do contratante já era notória. Conjunto probatório dos autos que não aponta para essa conclusão. Presunção, por esta razão, da existência de boa-fé a reger o negócio jurídico. Nulidade não configurada. Embargos à execução improcedentes nesta parte. (...)” (1.º TACSP, AI 760087-9, 8.ª Câmara, Rel. Juiz Maurício Ferreira Leite, j. 05.05.1999).", "De data mais próxima, do Tribunal Paulista, confirmando a premissa de que a boa-fé deve prevalecer sobre o aspecto formal da nulidade absoluta:", "“Prestação de serviços educacionais. Ação monitória. Inadimplemento de mensalidades. Nulidade do negócio jurídico firmado com interdito. Contrato celebrado antes do registro da sentença de interdição e da publicação de edital. Condição de incapaz que não era pública e, portanto, não oponível a terceiro de boa-fé. Efetiva prestação dos serviços; que exige a respectiva remuneração. Vedação ao enriquecimento sem causa. Recurso provido. 1. O instituto da interdição visa a proteger o incapaz, e não a servir de escudo para o locupletamento indevido do interdito ou de seus familiares. 2. Ainda: O direito e Justiça não toleram e devem coibir, onde quer que se apresente o enriquecimento a dano de terceiro, mesmo que o beneficiário seja incapaz, amental, criança, órfão ou viúva desvalida” (TJSP, Apelação 0002702-08.2009.8.26.0032, Acórdão 4922346, 29.ª Câmara de Direito Privado, Araçatuba, Rel. Des. Reinaldo Caldas, j. 02.02.2011, DJESP 16.03.2011).", "Esclareça-se, por oportuno, que o tema será retomado ainda neste capítulo da obra, quando da abordagem da teoria das nulidades, bem como do estudo da curatela e da interdição, alteradas com o CPC/2015 e com o citado Estatuto da Pessoa com Deficiência (Capítulo 8 deste livro).", "Todavia, adiante-se que, como não mais existem maiores absolutamente incapazes, a problemática parece ter desaparecido, pelo menos em parte. Feito tal esclarecimento, vejamos o estudo detalhado dos absolutamente e relativamente incapazes, de forma atualizada.", "2.2.3.1 Dos absolutamente incapazes", "Como exposto, os únicos absolutamente incapazes previstos no Código Civil a partir da vigência do Estatuto da Pessoa com Deficiência são os menores de 16 anos, denominados menores impúberes. Leva-se em conta o critério etário, não havendo necessidade de qualquer processo de interdição ou de nomeação de um curador (presunção absoluta de incapacidade).", "Não houve qualquer inovação com a codificação de 2002, diante do Código Civil de 1916, entendendo o legislador que, devido a essa idade, a pessoa ainda não atingiu o discernimento para distinguir o que pode ou não pode fazer na ordem privada.", "Anote-se que, eventualmente, o ato praticado pelo menor absolutamente incapaz pode gerar efeitos. Esse o teor doutrinário do Enunciado n. 138 do CJF/STJ, aprovado na III Jornada de Direito Civil: “a vontade dos absolutamente incapazes, na hipótese do inc. I do art. 3.º, é juridicamente relevante na concretização de situações existenciais a eles concernentes, desde que demonstrem discernimento bastante para tanto”. Ilustrando, um contrato celebrado por menor impúbere, de compra de um determinado bem de consumo, pode ser reputado válido, principalmente se houver boa-fé dos envolvidos.", "Além disso, a vontade dos menores nessas condições é relevante para os casos envolvendo a adoção e a guarda de filhos, cabendo a sua oitiva para expressarem sua opinião. No caso de adoção de maior de 12 anos, o consentimento do menor é essencial para o ato (art. 45, § 2.º, do Estatuto da Criança e do Adolescente – Lei 8.069/1990).", "Destaco que no Projeto de Reforma do Código Civil almeja-se retirar a expressão “menor” da codificação privada, para que a expressão “menor” deixe de ser uma condição jurídica, até porque teve uma utilização nefasta no passado. Assim, a norma apenas expressará a pessoa com menos de dezoito anos, como um fator meramente objetivo, o que se propõe para a nova redação do art. 3.º, inc. I (“são absolutamente incapazes de exercer pessoalmente os atos da vida civil: I – os que tenham menos de 16 (dezesseis) anos”. Essa modificação atinge todas as menções constantes da Norma Geral Privada, como se verá.", "Lembro que houve tentativas na Comissão de Juristas em se admitir que as pessoas com menos de dezesseis anos praticassem atos de menor complexidade, e tivessem sua autonomia admitida, como está no Enunciado n. 138 da I Jornada de Direito Civil. Todavia, as proposições foram mal compreendidas, no sentido de gerar uma imposição das vontades dos filhos frente aos seus pais, e, por isso, retiradas do Projeto.", "De volta ao sistema vigente, a respeito do antigo inciso II do art. 3.º do Código Civil, o comando tratava das pessoas que tivessem doença ou deficiência mental, congênita ou adquirida em vida de caráter duradouro e permanente, e que não estivessem em condições de administrar seus bens ou praticar atos jurídicos de qualquer espécie. A norma expressava “pessoas que, por enfermidade ou deficiência mental, não tiverem o necessário discernimento para a prática dos atos da vida civil”. Por oportuno, nosso ordenamento nunca admitiu os chamados intervalos lúcidos, pelo fato de a incapacidade mental estar revestida desse caráter permanente.", "Para que fosse declarada a incapacidade absoluta, em casos tais, seria necessário um processo próprio de interdição – de natureza declaratória e cuja sentença deveria ser registrada no Registro Civil da Comarca em que residir o interdito –, previsto entre os arts. 747 a 758 do CPC/2015, correspondentes aos arts. 1.177 a 1.186 do CPC/1973.", "Cabe atentar que agora não há mais a possibilidade dessa interdição absoluta, havendo entendimento de que nem mesmo o processo de interdição subsiste no sistema, pois incompatível com o Estatuto da Pessoa com Deficiência. O tema será analisado a seguir, demonstrando-se a divergência, até porque o CPC de 2015 reafirmou o processo de interdição.", "Ademais, foi inserida no sistema a figura da tomada de decisão apoiada a favor de todas as pessoas com deficiência, pelo menos como regra. Essa figura jurídica consta do art. 1.783-A do Código Civil, também incluído pela Lei 13.146/2015. O instituto visa ao auxílio da pessoa com deficiência para a celebração de atos mais complexos, caso dos contratos. Conforme o caput da norma, a tomada de decisão apoiada é o processo judicial pelo qual a pessoa com deficiência elege pelo menos duas pessoas idôneas, com as quais mantenha vínculos e que gozem de sua confiança, para prestar-lhe apoio na tomada de decisão sobre atos da vida civil, fornecendo-lhes os elementos e informações necessários para que possa exercer sua capacidade.", "A categoria é próxima da administração de sustento do Direito Italiano (amministrazione di sostegno), introduzida naquele sistema por força da Lei 6, de 9 de janeiro de 2004. Nos termos do seu art. 1.º, a finalidade da norma italiana é a de tutelar, com a menor limitação possível da capacidade de agir, a pessoa privada no todo ou em parte da autonomia na realização das funções da vida cotidiana, mediante intervenções de sustento temporário ou permanente.", "Foram incluídas, nesse contexto, modificações no Codice Italiano, passando a prever o seu art. 404 que a pessoa que, por efeito de uma enfermidade ou de um prejuízo físico ou psíquico, encontrar-se na impossibilidade, mesmo parcial ou temporária, de prover os próprios interesses pode ser assistida por um administrador de sustento, nomeado pelo juiz do lugar de sua residência ou domicílio. Como exemplifica a doutrina italiana, citando julgados daquele país, a categoria pode ser utilizada em benefício do doente terminal, do cego e do portador do mal de Alzheimer.<sup class=\"fn\" title=\"Nota 39 do original — o texto da nota não faz parte deste trecho (Parte I)\">39</sup>", "Parece-me que a tomada de decisão apoiada tem a função de trazer acréscimos ao antigo regime de incapacidades dos maiores, sustentado pela representação, pela assistência e pela curatela. Todavia, sua eficiência prática fica em dúvida, pois a pessoa com deficiência pode fazer uso de uma simples procuração para atribuição de poderes, já que é totalmente capaz no atual sistema. Sendo assim, por que faria a opção pela tomada de decisão apoiada, que é medida judicial e com vários entraves burocráticos? Como está desenvolvido no capítulo relativo ao Direito de Família, o Projeto de Reforma do Código Civil pretende reduzir essas burocracias, desjudicializando o instituto.", "Anote-se, a propósito, que a velhice ou senilidade, por si só, nunca foi tida como causa de restrição da capacidade de fato, podendo ocorrer a interdição anterior em hipótese em que a senectude originasse de um estado patológico (a esse respeito, da jurisprudência anterior: TJMG, Acórdão 1.0701.00.006030-4/001, 2.ª Câmara Cível, Uberaba, Rel. Des. Francisco de Assis Figueiredo, j. 1.º.06.2004, DJMG 25.06.2004).", "Por isso, sempre foi correto afirmar que a incapacidade por deficiência mental não se presumiria. A situação da pessoa com idade avançada continua a ser, em regra, de capacidade. Todavia, como se verá, tais pessoas podem ser consideradas relativamente incapazes, enquadradas no novo art. 4.º, inc. III, do Código Civil, também alterado pelo Estatuto da Pessoa com Deficiência (Lei 13.146/2015). Cite-se, a propósito, a pessoa com idade avançada que tenha mal de Alzheimer, e que não podem exprimir sua vontade.", "Cabe pontuar que o legislador da atual codificação material, em sua redação original, entendeu que a expressão loucos de todos os gêneros, contida no Código de 1916, era discriminatória e violadora da dignidade humana, razão dessa alteração anterior constante no art. 3.º, inc. II, do CC. Entretanto, compreendia-se que as duas expressões exprimiam basicamente a mesma situação. Com as alterações recentes do Código Civil, pelo Estatuto da Pessoa com Deficiência, essa afirmação não se sustenta mais.", "Seguindo-se no estudo do tema, o art. 3.º, inc. III, do Código Civil, em sua redação original, anterior ao Estatuto da Pessoa com Deficiência, trazia uma expressão ampla, que aumentava as hipóteses de incapacidade absoluta (pessoas que, mesmo por causa transitória, não pudessem exprimir vontade).", "Sempre entendi que tal previsão incluiria também o surdo-mudo que não pudesse manifestar sua vontade, que constava na codificação anterior, de 1916. Todavia, se o surdo-mudo pudesse exprimir sua vontade, seria considerado relativamente incapaz ou até plenamente capaz, dependendo do grau de possibilidade de sua expressão. Acrescente-se que, com a Lei 10.436/2002, passou-se a utilizar o termo “pessoa surda”, que é o mais correto para explicar essa hipótese. Porém, a expressão “surdo-mudo” ainda é aqui usada, por razões didáticas, pois é comum vê-la em provas de Direito Civil, diante do que estava na codificação de 1916.", "Essa afirmação sobre a pessoa surda pode ser mantida em parte com as mudanças de 2015, até porque essa antiga previsão do Código Civil de 2002 passou a compor o art. 4.º, inc. III, da norma material. Porém, o surdo, pessoa com deficiência, deve ser tido, em regra, como capaz. Eventualmente, caso não possa exprimir sua vontade, será relativamente incapaz. Não caberá mais o seu enquadramento como absolutamente incapaz, em hipótese alguma.", "Entendo que a previsão que constava do art. 3.º, inc. III, incluiria ainda pessoas que perderam a memória, bem como aqueles que estivessem em coma, sujeitos que passam a ser relativamente incapazes, em regra (novo art. 4.º, inc. III, estudado a seguir).", "Quanto aos ébrios habituais e aos viciados em tóxicos, será visto que são considerados relativamente incapazes. Dependendo da sua situação, afirmava, nas edições anteriores deste livro, que poderiam ser tidos como absolutamente incapazes. Agora, após a Lei 13.146/2015, serão sempre relativamente incapazes se houver alguma restrição, pois não existem mais no sistema pessoas maiores que sejam absolutamente incapazes, reafirme-se.", "Apesar dessa afirmação, fica a dúvida se é interessante retomar alguma previsão a respeito de maiores absolutamente incapazes, especialmente para as pessoas que não têm qualquer condição de exprimir vontade e que não são necessariamente pessoas deficientes.", "Entendo que sim, havendo proposição nesse sentido no citado Projeto de Lei 757/2015 (atual Projeto 11.091/2018, na Câmara), em sua redação originária e contando com o meu apoio e parecer. Cite-se, a esse propósito, justamente a pessoa que se encontra em coma profundo, sem qualquer condição de exprimir o que pensa. No atual sistema, será enquadrada como relativamente incapaz, o que parece não ter sentido técnico-jurídico.", "Porém, destaco que no parecer final originário do Senado Federal a proposta de retorno de regra a respeito de maiores absolutamente incapazes acabou por não prosperar, infelizmente. Conforme constou do relatório da Senadora Lídice da Mata, “as tentativas presentes no PLS 757 de se retomar o critério da ‘ausência ou insuficiência de discernimento’ (previsto na redação original do Código Civil), em detrimento do critério da ‘impossibilidade de manifestação de vontade’ (eleito pelo EPD), representam um grave retrocesso no tocante ao direito de fazer as próprias escolhas. Sim, é possível que o discernimento de certas pessoas com deficiência seja bem diferente ou até questionável diante de padrões comuns, mas isto não significa que o discernimento não exista e que a vontade manifestada possa ser ignorada”.", "Na tramitação desse Projeto na Câmara dos Deputados – sob o número 11.091/2018 –, fiz sugestão ao saudoso Deputado Luiz Flávio Gomes, no ano de 2019, para o retorno de regras relativas aos maiores de idade absolutamente incapazes no art. 3.º do Código Civil, que passaria a ter a seguinte redação: “São absolutamente incapazes de exercer os atos da vida civil: I – os menores de dezesseis anos; II – os que não tenham qualquer discernimento para a prática desses atos, conforme decisão judicial que leve em conta a avaliação biopsicossocial; III – os que, mesmo por causa de transitória, não puderem exprimir sua vontade”. Também foi proposta a supressão do atual art. 4.º, inc. III, do Código Civil, que passaria a compor a última norma.", "Tenho acompanhado o trâmite dessa projeção na Câmara dos Deputados, sendo fundamental e necessário o retorno de alguma regra a respeito da incapacidade absoluta das pessoas sem qualquer discernimento para exprimir vontade.", "Pontuo que, justamente com esse propósito, no atual Projeto de Reforma do Código Civil há proposição semelhante, para que o art. 3.º do Código Civil, no seu inciso II, passe a tratar, como absolutamente incapazes, “aqueles que por nenhum meio possam expressar sua vontade, em caráter temporário ou permanente”. Com isso, altera-se em boa hora também o art. 4.º, inc. III, da codificação privada, com a menção, como relativamente incapazes, daqueles “cuja autonomia estiver prejudicada por redução de discernimento, que não constitua deficiência, enquanto perdurar esse estado”. Por tudo o que foi exposto neste tópico, espero que o Congresso Nacional aprove essas importantes e necessárias modificações da Lei Geral Privada.", "OBSERVAÇÃO IMPORTANTE – O ausente não é mais considerado absolutamente incapaz como constava da codificação anterior (art. 5.º, inc. IV, do CC/1916). A ausência significa morte presumida da pessoa natural, após longo processo judicial, com três fases: curadoria dos bens do ausente, sucessão provisória e sucessão definitiva (arts. 22 a 39 do CC). Não houve qualquer modificação no tratamento jurídico do ausente diante da emergência do Estatuto da Pessoa com Deficiência.", "2.2.3.2 Dos relativamente incapazes", "Conforme antes exposto, o Estatuto da Pessoa com Deficiência também alterou substancialmente o regime da incapacidade relativa, tratado pelo art. 4.º do CC/2002. Reitere-se que não houve modificação no inciso I (menores entre 16 e 18 anos) e no inciso IV (pródigos). Todavia, no inciso II foi retirada a menção aos que por deficiência mental tivessem o discernimento reduzido.", "No inciso III, não se usa a expressão excepcionais sem desenvolvimento completo, substituída pela antiga previsão do art. 3.º, inc. III, da codificação (pessoas que por causa transitória ou definitiva não puderem exprimir vontade). O objetivo, mais uma vez, foi a plena inclusão das pessoas com deficiência, tidas como capazes no novo sistema e eventualmente sujeitas à tomada de decisão apoiada. Vejamos o estudo pontual dos incisos, devidamente atualizados.", "A respeito do inciso I do art. 4.º do Código Civil, a alteração substancial trazida pela codificação material de 2002 perante o CC/1916 foi a de reduzir a idade para se atingir a maioridade civil, de 21 para 18 anos. Em sadio diálogo interdisciplinar, destaque-se que tal redução não atingiu a questão dos benefícios previdenciários dos filhos dependentes até os 21 anos, conforme consta do Enunciado n. 3 da I Jornada de Direito Civil: “a redução do limite etário para a definição da capacidade civil aos 18 anos não altera o disposto no art. 16, inc. I, da Lei 8.213/1991, que regula específica situação de dependência econômica para fins previdenciários e outras situações similares de proteção, previstas em legislação especial”.", "Ademais, existem atos e negócios que os menores relativamente incapazes podem praticar, mesmo sem a assistência, como se casar, necessitando apenas de autorização dos pais ou representantes; elaborar testamento; servir como testemunha de atos e negócios jurídicos; requerer registro de seu nascimento; ser empresário, com autorização; ser eleitor; ser mandatário ad negotia (mandato extrajudicial).", "Em casos específicos, é possível a antecipação dos efeitos da maioridade civil, por meio da emancipação (art. 5.º, parágrafo único, do CC), instituto que será tratado no próximo tópico do capítulo.", "Seguindo-se no estudo do art. 4.º do Código Civil, repise-se que o seu inciso II previa três hipóteses, tendo retirada a última delas pela Lei 13.146/2015, relativa às pessoas com deficiência mental, conforme ora comentado. Permaneceram as menções aos ébrios habituais (entendidos como alcoólatras) e aos viciados em tóxicos (toxicômanos).", "De toda sorte, essa previsão material constituiu novidade importante perante o seu antecessor, o Código Civil de 1916, pela qual se ampliaram os casos de incapacidade relativa decorrente de causa permanente ou transitória. Aqui também deverá haver um processo próprio de nomeação de um curador nas hipóteses restantes (ébrios habituais e viciados em tóxicos), cabendo análise caso a caso da situação de incapacidade, se presente ou não. A respeito da situação anterior do ébrio habitual, ilustre-se com decisão do Tribunal de Minas Gerais:", "“Incapacidade relativa. Necessidade de comprovação da embriaguez habitual do vendedor. Desnecessidade de registro da promessa de compra e venda. Testemunhas não presentes quando da assinatura do contrato. Irrelevância. Acusações levianas. Dano moral configurado. A amizade da testemunha com a parte somente a torna suspeita para depor se se tratar de amizade íntima, entendida como aquela muito próxima, com laços de afinidade profundos. O vício de consumo de álcool implica incapacidade relativa da pessoa se a transforma em ébrio habitual, aquele que, pelo uso constante da bebida, tem seu discernimento permanentemente afetado pela embriaguez. Incomprovada a embriaguez habitual da pessoa e inexistindo interdição judicial, não se configura incapacidade. (...). Agravo retido e apelação não providos” (TJMG, Apelação Cível 0540383-93.2008.8.13.0470, 10.ª Câmara Cível, Paracatu, Rel. Des. Mota e Silva, j. 26.10.2010, DJEMG 17.11.2010).", "Todavia, aqui devem ser demonstrados os atropelamentos legislativos entre o CPC/2015 e o Estatuto da Pessoa com Deficiência. De início, constata-se que a última norma alterou o art. 1.768 do Código Civil, não mencionando mais o processo de interdição relativa, mas uma demanda em que é nomeado um curador. Entretanto, esse dispositivo é revogado pelo Código de Processo civil de 2015, que está totalmente estruturado na ação de interdição (arts. 747 a 758). Assim, o EPD, em tais aspectos, teve incidência restrita, entre a sua entrada em vigor (janeiro de 2016) até o surgimento de vigência do atual CPC (março de 2016). Entendo que será necessária a edição de uma terceira norma processual para apontar qual regra a prevalecer. Essa norma, de lege ferenda, é o Projeto de Lei 757/2015, em curso no Congresso Nacional, que pretende retomar os dispositivos do EPD, revogados pelo CPC/2015. Conforme parecer que elaborei para essa tramitação legislativa, seria melhor que fossem retiradas todas as menções à ação de interdição constantes do CPC de 2015, passando este a expressar apenas a ação de pedido de curatela. Na Câmara dos Deputados, reitere-se que o número dessa projeção é 11.091/2018.", "A propósito, enunciava o art. 1.772 do CC/2002 que, pronunciada a interdição das pessoas descritas no art. 4.º, incs. II e III, o juiz assinaria, segundo o estado ou o desenvolvimento mental do interdito, os limites da curatela do maior incapaz. No entanto, ressalte-se que tal dispositivo também foi revogado expressamente pelo art. 1.072, inciso II, do CPC em vigor; com o objetivo de concentrar o tema no diploma instrumental. Assim, em sentido próximo, o art. 753, § 2.º, do CPC/2015 passou a expressar que “o laudo pericial indicará especificadamente, se for o caso, os atos para os quais haverá necessidade de curatela”.", "Curiosamente, a Lei 13.146/2015 também alterou o art. 1.772 do Código Civil, passando a estabelecer que “o juiz determinará, segundo as potencialidades da pessoa, os limites da curatela, circunscritos às restrições constantes do art. 1.782, e indicará curador. Parágrafo único. Para a escolha do curador, o juiz levará em conta a vontade e as preferências do interditando, a ausência de conflito de interesses e de influência indevida, a proporcionalidade e a adequação às circunstâncias da pessoa”. A principal novidade diz respeito à inclusão do parágrafo único, que vinha em boa hora, dando preferência à vontade da pessoa com deficiência.", "Contudo, como o art. 1.772 do CC/2002, mesmo com a modificação, foi revogado pelo CPC de 2015, também esta última norma teve vigência apenas no período compreendido entre a sua entrada em vigor (início de janeiro de 2016) e a entrada em vigor do CPC/2015 (18 de março de 2016).", "Na minha opinião doutrinária, parece ter havido mais um sério cochilo do legislador, que acabou por atropelar uma lei por outra, sem as devidas ressalvas. Espero, assim, que essas imprecisões sejam corrigidas no futuro, por meio do citado Projeto 757, em curso no Congresso Nacional. O tema é retomado e aprofundado no Capítulo 8 desta obra, quando do estudo da curatela.", "O art. 4.º, inc. III, do CC, ao mencionar originalmente os excepcionais sem desenvolvimento completo, abrangia as pessoas com síndrome de Down e de outras anomalias psíquicas que apresentassem sinais de desenvolvimento mental incompleto. Sempre entendi que a qualificação que constava nesse dispositivo dependeria mais uma vez de regular processo de interdição, podendo o excepcional ser também enquadrado como absolutamente incapaz (nesse sentido, ver TJSP, Apelação com Revisão 577.725.4/7, Acórdão 3310051, 2.ª Câmara de Direito Privado, Limeira, Rel. Des. Morato de Andrade, j. 21.10.2008, DJESP 10.12.2008). Ademais, a pessoa com síndrome de Down poderia ser, ainda, plenamente capaz, o que dependeria da sua situação.", "Com as mudanças promovidas pelo Estatuto da Pessoa com Deficiência, será plenamente capaz, em regra, sujeito ao instituto da tomada de decisão apoiada, para os atos patrimoniais (novo art. 1.783-A do Código Civil). Para os atos existenciais familiares, a pessoa com síndrome de Down tem capacidade civil plena (art. 6.º da Lei 13.146/2015).", "Além disso, no novo sistema, repise-se que o art. 4.º, inc. III, do Código Civil passou a tratar da antiga hipótese que estava no art. 3.º, inc. III, da própria codificação material, mencionando aqueles que, por causa transitória ou permanente, não puderem exprimir sua vontade. Valem os comentários que fiz anteriormente sobre esse novo enquadramento, especialmente quanto à pessoa surda que não puder se expressar, ao idoso com mal de Alzheimer e à pessoa com coma, que agora passam a ser relativamente incapazes dentro do sistema.", "A encerrar o estudo do art. 4.º do Código Civil, o seu inc. IV faz menção aos pródigos, sem qualquer alteração recente. Os pródigos são aqueles que dissipam de forma desordenada e desregrada os seus bens ou seu patrimônio, realizando gastos desnecessários e excessivos, sendo exemplo típico a pessoa viciada em jogatinas. Os pródigos devem ter a nomeação de um curador, ficando privados dos atos que possam comprometer o seu patrimônio, tais como emprestar dinheiro, transigir, dar quitação, alienar bens, hipotecar ou agir em juízo (art. 1.782 do CC). Todavia, poderá o pródigo exercer atos que não envolvam a administração direta de seus bens, como se casar ou manter união estável (nesse sentido, ver: TJMS, Acórdão 2007.007113-4/0000-00, Campo Grande, 4.ª Turma Cível, Rel. Des. Atapoã da Costa Feliz, DJEMS 16.05.2008, p. 33).", "Ao contrário do que se possa pensar, não é imposto ao pródigo que se casa o regime da separação total de bens de origem legal ou obrigatória, pois ele não consta no art. 1.641 do CC, que traz rol taxativo ou numerus clausus de hipóteses que restringem a liberdade da pessoa. No entanto, para fazer pacto antenupcial, entendo que o pródigo necessita de assistência, pois há ato de disposição, sob pena de anulabilidade do ato (art. 171, inc. I, do CC).", "Como palavras finais sobre o pródigo, é necessário citar importante julgado do Tribunal de Justiça de São Paulo, prolatado pela sua 2.ª Câmara de Direito Privado em 11 de dezembro de 2018, tendo sido relatora a Desembargadora Rosangela Telles. O acórdão já leva em conta o Estatuto da Pessoa com Deficiência, constando de sua ementa:", "“Incapacidade parcial demonstrada. O laudo pericial confirmou que a interditanda sofre de transtorno delirante persistente, transtorno mental caracterizado pelo desenvolvimento de um delírio isolado ou de um conjunto de delírios relacionados entre si que são usualmente persistentes e muitas vezes duram toda a vida. Excetuando-se as ações e atitudes diretamente relacionadas ao delírio, o afeto e o comportamento são normais. Comprovação de que a interditanda é incapaz de administrar suas finanças, sendo caso de interdição parcial, segundo a Lei 13.146/15 (Estatuto do Deficiente). Tratamento compulsório. Incapacidade estritamente administrativa. Trata-se de pessoa pródiga e a limitação das suas finanças é suficiente à proteção da interditanda. Submetê-la a tratamento compulsório seria medida desarrazoada, neste momento, elevando sobremaneira as consequências psicológicas com o resultado desta demanda” (TJSP, Processo 0021174-74.2001.8.26.0602).", "O decisum demonstra que houve uma aproximação do EPD em relação ao que já ocorria juridicamente com o pródigo, demandando uma análise casuística da situação da pessoa com deficiência para a instituição da curatela parcial.", "Como última observação para encerrar o tópico, o atual Projeto de Reforma do Código Civil também pretende alterar o art. 4.º da codificação privada. Assim, com a volta da antiga previsão a respeito das pessoas que não possam expressar a sua vontade no art. 3.º, o inc. II do dispositivo em estudo passará a prever, como relativamente incapazes, “aqueles cuja autonomia estiver prejudicada por redução de discernimento, que não constitua deficiência, enquanto perdurar esse estado”. Além dessa previsão, revoga-se o inciso III da norma, com o objetivo de se manter a pessoa com deficiência, em regra, como plenamente capaz.", "Ademais, o dispositivo receberá um parágrafo único, prevendo, na linha do consagrado pelo Estatuto da Pessoa com Deficiência que “as pessoas com deficiência mental ou intelectual, maiores de 18 (dezoito) anos, têm assegurado o direito ao exercício de sua capacidade civil em igualdade de condições com as demais pessoas, observando-se, quanto aos apoios e às salvaguardas de que eventualmente necessitarem para o pleno exercício dessa capacidade, o disposto nos arts. 1.767 a 1.783 deste Código”. Também é incluído um novo art. 4.º-A, assegurando que “a deficiência física ou psíquica da pessoa, por si só, não afeta sua capacidade civil”, o que é essencial atualmente.", "OBSERVAÇÃO IMPORTANTE – Em relação aos indígenas ou antes denominados silvícolas, o Código Civil de 2002 não os considera mais como incapazes, como constava do art. 6.º, inc. III, do CC/1916. A sua situação deve ser regida por lei especial, pelo que enuncia o art. 4.º, parágrafo único, do CC/2002. Essa lei especial é a Lei 6.001/1973, conhecida como Estatuto do Índio, que coloca o indígena e sua comunidade, enquanto não integrados à comunhão nacional, sob o regime tutelar, devendo a assistência ser exercida pela FUNAI (Fundação Nacional dos Povos Indígenas). Enuncia o art. 7.º da referida norma que a esse regime tutelar aplicam-se, no que couber, os princípios e normas da tutela de direito comum. São nulos os atos praticados entre o índio não integrado e qualquer pessoa estranha à comunidade indígena quando não tenha havido assistência do órgão tutelar competente (art. 8.º do Estatuto dos Povos Indígenas. Não se aplica tal regra no caso em que o índio revele consciência e conhecimento do ato praticado, desde que não lhe seja prejudicial, e da extensão dos seus efeitos (art. 8.º, parágrafo único). Qualquer índio poderá requerer ao Juiz competente a sua liberação do regime tutelar previsto nesta Lei, investindo-se na plenitude da capacidade civil, desde que preencha os requisitos seguintes: a) idade mínima de 21 anos; b) conhecimento da língua portuguesa; c) habilitação para o exercício de atividade útil, na comunhão nacional; d) razoável compreensão dos usos e costumes da comunhão nacional. O Juiz decidirá após instrução sumária, ouvidos o órgão de assistência ao índio e o Ministério Público, transcrita a sentença concessiva no registro civil (art. 9.º, parágrafo único, da Lei 6.001/1973). Aqui não houve qualquer alteração engendrada pelo Estatuto da Pessoa com Deficiência. No atual Projeto de Reforma do Código Civil, com a mudança do parágrafo único do art. 4.º do CC/2002, ora proposta, a situação dos indígenas passará a ser remetida totalmente para a legislação especial, sem qualquer regra a seu respeito na Norma Geral Privada, visão que acabou por prevalecer na Comissão de Juristas."]}, {"num": "2.2.4", "title": "2.2.4 A emancipação", "resumo": "Emancipação é o ato que antecipa a capacidade civil plena para antes dos 18 anos. Atenção: o emancipado deixa de ser incapaz, mas não deixa de ser menor (Enunciado 530 — não afasta o ECA; ex.: não pode dirigir nem beber). Em regra é definitiva, irretratável e irrevogável (mas pode ser desconstituída por vício de vontade — Enunciado 397). O rol do art. 5º, parágrafo único, é taxativo: (a) voluntária parental (concessão de ambos os pais, por instrumento público, ao menor com 16 anos completos, sem homologação judicial); (b) judicial (por sentença, ex.: desacordo dos pais); (c) legal pelo casamento (idade núbil de 16 anos); (d) legal por emprego público efetivo; (e) legal por colação de grau em curso superior; (f) legal por estabelecimento civil/comercial ou relação de emprego com economia própria (menor com 16 anos).", "pontos": ["Emancipa = antecipa a capacidade plena; mas continua menor (não afasta o ECA — Enunciado 530).", "Regra: definitiva, irretratável e irrevogável (salvo vício de vontade — Enunciado 397).", "Rol taxativo (art. 5º, § único): voluntária parental, judicial e legal (casamento, emprego público, colação de grau, estabelecimento/emprego).", "Voluntária parental: instrumento público, 16 anos, sem homologação judicial."], "quiz": [{"q": "O menor emancipado:", "options": ["Deixa de ser incapaz e deixa de ser menor para todos os fins", "Deixa de ser incapaz, mas continua sendo menor (não afasta o ECA)", "Continua absolutamente incapaz"], "answer": 1, "explain": "A emancipação antecipa a capacidade civil, mas o emancipado continua menor: pelo Enunciado 530, não elide o ECA (ex.: não pode dirigir nem ingerir álcool)."}, {"q": "A emancipação voluntária parental exige:", "options": ["Homologação judicial obrigatória", "Instrumento público, menor com 16 anos completos, concedida pelos pais, sem homologação judicial", "Apenas documento particular do menor"], "answer": 1, "explain": "É concedida por ambos os pais (ou um na falta do outro) por instrumento público, ao menor com no mínimo 16 anos, sem necessidade de homologação judicial."}, {"q": "O que é a emancipação?", "options": ["O fim da personalidade", "O ato que antecipa a capacidade civil plena para antes dos 18 anos", "A perda da capacidade"], "answer": 1, "explain": "Emancipação é o ato que antecipa os efeitos da maioridade e da capacidade civil plena para antes dos 18 anos."}, {"q": "Como regra, a emancipação é:", "options": ["Temporária e revogável a qualquer tempo", "Definitiva, irretratável e irrevogável (salvo desconstituição por vício de vontade — Enunciado 397)", "Sempre revogável pelos pais"], "answer": 1, "explain": "A emancipação é, em regra, definitiva, irretratável e irrevogável; pode ser desconstituída por vício de vontade (erro ou dolo — Enunciado 397 da V Jornada)."}, {"q": "O rol das hipóteses de emancipação (art. 5º, parágrafo único) é:", "options": ["Exemplificativo (numerus apertus)", "Taxativo (numerus clausus)", "Inexistente"], "answer": 1, "explain": "O rol do art. 5º, parágrafo único, é taxativo (numerus clausus)."}, {"q": "A emancipação judicial ocorre:", "options": ["Por escritura pública lavrada pelos pais", "Por sentença do juiz (ex.: quando um dos pais não concorda)", "Automaticamente aos 16 anos"], "answer": 1, "explain": "A emancipação judicial se dá por sentença — por exemplo, quando um dos pais discorda da vontade do outro. A decisão dispensa a escritura pública."}, {"q": "A idade núbil (idade mínima para casar), que gera emancipação legal, é de:", "options": ["14 anos", "16 anos, com autorização dos pais/representantes", "18 anos"], "answer": 1, "explain": "A idade núbil, tanto do homem quanto da mulher, é de 16 anos (art. 1.517 do CC); o casamento gera emancipação legal."}, {"q": "São hipóteses de emancipação LEGAL (além do casamento):", "options": ["Emprego público efetivo, colação de grau em curso superior e estabelecimento/emprego com economia própria", "Tirar carteira de motorista", "Completar o ensino médio"], "answer": 0, "explain": "A emancipação legal decorre também do exercício de emprego público efetivo, da colação de grau em curso superior reconhecido e do estabelecimento civil/comercial ou relação de emprego com economia própria."}], "terms": [{"termo": "Emancipação", "definicao": "Ato que antecipa a capacidade civil plena para antes dos 18 anos; o emancipado deixa de ser incapaz, mas continua menor.", "secao": "2.2.4"}, {"termo": "Emancipação voluntária parental", "definicao": "Concedida pelos pais, por instrumento público, ao menor com 16 anos, sem homologação judicial.", "secao": "2.2.4"}, {"termo": "Emancipação judicial", "definicao": "Concedida por sentença (ex.: desacordo entre os pais).", "secao": "2.2.4"}, {"termo": "Emancipação legal", "definicao": "Decorre de fato previsto em lei: casamento, emprego público efetivo, colação de grau superior, estabelecimento/emprego com economia própria.", "secao": "2.2.4"}, {"termo": "Idade núbil", "definicao": "Idade mínima para casar: 16 anos, com autorização dos pais/representantes (art. 1.517 do CC).", "secao": "2.2.4"}, {"termo": "Casamento putativo", "definicao": "Casamento nulo/anulável contraído de boa-fé; preserva efeitos (aqui, mantém a emancipação).", "secao": "2.2.4"}], "blocks": ["A emancipação pode ser conceituada como o ato jurídico que antecipa os efeitos da aquisição da maioridade e da consequente capacidade civil plena, para data anterior àquela em que o menor atinge a idade de 18 anos, para fins civis. Com a emancipação, no atual sistema, o menor deixa de ser incapaz e passa a ser capaz. Todavia, ele não deixa de ser menor.", "Tanto isso é verdade que, conforme o Enunciado n. 530, aprovado na VI Jornada de Direito Civil, evento realizado em 2013, “a emancipação, por si só, não elide a incidência do Estatuto da Criança e do Adolescente”. Sendo assim, a título de exemplo, um menor emancipado não pode tirar carteira de motorista, entrar em locais proibidos para crianças e adolescentes ou ingerir bebidas alcoólicas. Tais restrições existem diante de consequências que surgem no campo penal, e a emancipação somente envolve fins civis ou privados.", "A emancipação, regra geral, é definitiva, irretratável e irrevogável. De toda sorte, conforme se depreende de enunciado aprovado na V Jornada de Direito Civil, de novembro de 2011, a emancipação por concessão dos pais ou por sentença do juiz está sujeita a desconstituição por vício de vontade (Enunciado n. 397). Desse modo, é possível a sua anulação por erro ou dolo, por exemplo.", "Trata-se de ato formal e solene em regra, eis que o Código Civil de 2002 exige o instrumento público como regra. De acordo com o Código Civil, a emancipação poderá ocorrer nas seguintes situações (art. 5.º, parágrafo único) – rol esse que é taxativo (numerus clausus):", "a) Emancipação voluntária parental – por concessão de ambos os pais ou de um deles na falta do outro. Em casos tais, não é necessária a homologação perante o juiz, eis que é concedida por instrumento público e registrada no Cartório de Registro Civil das Pessoas Naturais. Para que ocorra a emancipação parental, o menor deve ter, no mínimo, 16 anos completos.", "b) Emancipação judicial – por sentença do juiz, em casos, por exemplo, em que um dos pais não concorda com a emancipação, contrariando um a vontade do outro. A decisão judicial, por razões óbvias, afasta a necessidade de escritura pública. Tanto a emancipação voluntária quanto a judicial devem ser registradas no Registro Civil das pessoas naturais, sob pena de não produzirem efeitos (art. 107, § 1.º, da Lei 6.015/1973 – LRP). A emancipação legal, por outro lado, produz efeitos independentemente desse registro.", "c) Emancipação legal matrimonial – pelo casamento do menor. Consigne-se que a idade núbil tanto do homem quanto da mulher é de 16 anos (art. 1.517 do CC), sendo possível o casamento do menor se houver autorização dos pais ou dos seus representantes. O divórcio, a viuvez e a anulação do casamento não implicam no retorno à incapacidade. No entanto, entende parte da doutrina que o casamento nulo faz com que se retorne à situação de incapaz, sendo revogável em casos tais a emancipação, o mesmo sendo dito quanto à inexistência do casamento. Para outra corrente, como no caso de Pablo Stolze e Rodolfo Pamplona, tratando-se de nulidade e de anulabilidade do casamento, a emancipação persiste apenas se o matrimônio for contraído de boa-fé (hipótese de casamento putativo).<sup class=\"fn\" title=\"Nota 40 do original — o texto da nota não faz parte deste trecho (Parte I)\">40</sup> Em situação contrária, retorna-se à situação de incapacidade. As duas correntes estão muito bem fundamentadas. A última delas segue o entendimento de que o ato anulável também tem efeitos retroativos (ex tunc), conforme será abordado mais adiante e com o qual se concorda.", "d) Emancipação legal, por exercício de emprego público efetivo – segundo a doutrina, a regra deve ser interpretada a incluir todos os casos envolvendo cargos ou empregos públicos, desde que haja nomeação de forma definitiva.<sup class=\"fn\" title=\"Nota 41 do original — o texto da nota não faz parte deste trecho (Parte I)\">41</sup> Estão afastadas, assim, as hipóteses de serviços temporários ou de cargos comissionados.", "e) Emancipação legal, por colação de grau em curso de ensino superior reconhecido – para tanto, deve ser o curso superior reconhecido, não sendo aplicável à regra para o curso de magistério antigo curso normal. A presente situação torna-se cada vez mais difícil de ocorrer na prática.", "f) Emancipação legal, por estabelecimento civil ou comercial ou pela existência de relação de emprego, obtendo o menor as suas economias próprias, visando a sua subsistência – necessário que o menor tenha ao menos 16 anos, revelando amadurecimento e experiência desenvolvida. Ter economia própria significa receber um salário mínimo. Deve-se entender que não houve revogação das normas trabalhistas relativas ao empregado menor notadamente do art. 439 da CLT que enuncia: “é lícito ao menor firmar recibo pelo pagamento de salário. Tratando-se, porém, de rescisão do contrato de trabalho, é vedado ao menor de 18 (dezoito) anos dar, sem assistência dos seus responsáveis legais, a quitação ao empregador pelo recebimento da indenização que lhe for devida”. Seguindo a ideia conciliadora do diálogo das fontes, prevê a Portaria MTE/SRT 1, de 25 de maio de 2006, da Secretaria de Relações do Trabalho, que “não é necessária a assistência por responsável legal, na homologação da rescisão contratual, ao empregado adolescente que comprove ter sido emancipado”. Não havendo emancipação, o que é possível, a norma da CLT continua tendo aplicação.", "Além das previsões constantes do Código Civil, consigne-se que continua sendo possível a emancipação legal do menor militar, que possui 17 anos e que esteja prestando tal serviço, nos termos do art. 73 da Lei 4.375/1964, reproduzido pelo art. 239 do Decreto 57.654/1966.<sup class=\"fn\" title=\"Nota 42 do original — o texto da nota não faz parte deste trecho (Parte I)\">42</sup>", "Para findar o estudo da emancipação, a Comissão de Juristas nomeada no âmbito do Congresso Nacional para a Reforma do Código Civil propõe alterações relevantes a respeito do instituto, confirmando-se muitos dos meus comentários doutrinários.", "Como é proposto que a menoridade deixe de ser uma condição jurídica, o caput do art. 5.º do Código Civil passará a prever que “a incapacidade em razão da idade cessa aos dezoito anos completos, quando a pessoa fica habilitada à prática pessoal de todos os atos da vida civil”. E mais, nos termos do seu parágrafo único, com destaque para a limitação da sua incidência para as pessoas com idade entre 16 e 18 anos e a inclusão da união estável, “também cessará a incapacidade, para as pessoas entre 16 (dezesseis) e 18 (dezoito) anos completos: I – pela concessão de emancipação pelos que tenham a autoridade parental, por instrumento público, independentemente de homologação judicial; II – por sentença do juiz, ouvido o tutor ou guardião, se o adolescente tiver 16 (dezesseis) anos completos; III – pelo casamento ou constituição de união estável registrada na forma do inciso III do art. 9º deste Código, desde que com a autorização dos representantes; IV – pelo exercício de emprego público efetivo; V – pela colação de grau em curso de ensino superior; VI – pelo estabelecimento civil ou empresarial, ou pela existência de relação de emprego, desde que, em função deles, o adolescente tenha economia própria”.", "Por fim, na linha parcial do Enunciado n. 397, aprovado na V Jornada de Direito Civil, inclui-se na norma civil, confirmando-se a posição hoje majoritária, um novo art. 5.º-A, estabelecendo que “a emancipação por concessão dos pais ou por sentença do juiz está sujeita à desconstituição pelas mesmas causas que invalidam os negócios jurídicos em geral”. Porém, observo que a proposição, de modo mais técnico, vai além das situações de vícios de vontade, englobando todas as situações de nulidade absoluta ou relativa dos atos e negócios jurídicos em geral, previstas nos arts. 166 e 171 do Código Civil. Espera-se a sua aprovação pelo Parlamento Brasileiro."]}, {"num": "2.2.5", "title": "2.2.5 Os direitos da personalidade em uma análise civil-constitucional. A ponderação de direitos e o seu tratamento no Código de Processo Civil de 2015", "resumo": "Aqui o Código Civil passa a tratar dos direitos da personalidade (arts. 11 a 21). O ponto de partida de Tartuce é que essa proteção não é novidade absoluta: a Constituição de 1988 já enumerava os direitos fundamentais da pessoa (Título II — “Dos Direitos e Garantias Fundamentais”). Por isso, os direitos da personalidade devem ser lidos numa perspectiva civil-constitucional (na linha das teses anteriores). Observação: este trecho é o início do tópico — a Parte I do capítulo termina aqui, e o desenvolvimento (características, ponderação de direitos, etc.) segue na continuação da obra.", "pontos": ["Direitos da personalidade: arts. 11 a 21 do CC/2002.", "A CF/1988 já protegia a pessoa (direitos fundamentais) — leitura civil-constitucional.", "Este é o início do tópico; o trecho (Parte I) encerra aqui."], "quiz": [{"q": "Em que perspectiva Tartuce propõe estudar os direitos da personalidade?", "options": ["Apenas pelo texto do Código Civil", "Em uma perspectiva civil-constitucional", "Somente pelo Direito Penal"], "answer": 1, "explain": "Como a CF/1988 já enumera direitos fundamentais da pessoa, os direitos da personalidade (arts. 11 a 21 do CC) devem ser lidos numa perspectiva civil-constitucional."}, {"q": "Os direitos da personalidade estão tratados em quais artigos do Código Civil?", "options": ["Arts. 1º a 10", "Arts. 11 a 21", "Arts. 79 a 103"], "answer": 1, "explain": "O CC/2002 trata dos direitos da personalidade entre os seus arts. 11 a 21."}, {"q": "A proteção da pessoa pelos direitos da personalidade é uma novidade absoluta do CC/2002?", "options": ["Sim, nada havia antes", "Não — a CF/1988 já enumerava os direitos fundamentais da pessoa (Título II)", "Sim, criada apenas em 2015"], "answer": 1, "explain": "Não é total novidade: a Constituição de 1988, no Título II (“Dos Direitos e Garantias Fundamentais”), já traçava as prerrogativas da pessoa humana."}], "terms": [{"termo": "Direitos da personalidade", "definicao": "Direitos que protegem a pessoa em si (arts. 11 a 21 do CC), lidos em perspectiva civil-constitucional.", "secao": "2.2.5"}], "blocks": ["Como inovação festejada, o Código Civil de 2002 passou a tratar dos direitos da personalidade entre os seus arts. 11 a 21. Destaque-se que a proteção de direitos dessa natureza não é uma total novidade no sistema jurídico nacional, eis que a Constituição Federal de 1988 enumerou os direitos fundamentais postos à disposição da pessoa humana. Por isso, é preciso abordar a matéria em uma perspectiva civil-constitucional, na linha doutrinária antes exposta.", "Sabe-se que o Título II da Constituição de 1988, sob o título “Dos Direitos e Garantias Fundamentais”, traça as prerrogativas para garantir uma convivência digna, com liberdade e com igualdade para todas as pessoas, sem distinção de raça, credo ou origem. Tais garantias são genéricas, mas também são essenciais ao ser humano,"]}]}], "glossario": [{"termo": "Eticidade", "definicao": "Princípio do CC/2002: valorização da ética e da boa-fé objetiva.", "secao": "2.1"}, {"termo": "Socialidade", "definicao": "Princípio do CC/2002: superação do individualismo — toda categoria civil tem função social (o “eu” vira “nós”).", "secao": "2.1"}, {"termo": "Operabilidade", "definicao": "Princípio do CC/2002: simplicidade + efetividade, alcançadas pelo sistema de cláusulas gerais.", "secao": "2.1"}, {"termo": "Cláusula geral", "definicao": "“Janela aberta” deixada pelo legislador, de sentido dinâmico, para preenchimento pelo aplicador caso a caso (ex.: função social do contrato).", "secao": "2.1"}, {"termo": "Conceito legal indeterminado", "definicao": "Termo vago que consta da lei sem definição; é estático. Ao ganhar concreção pelo aplicador, aproxima-se de uma cláusula geral.", "secao": "2.1"}, {"termo": "Ontognoseologia jurídica", "definicao": "Teoria do conhecimento jurídico de Miguel Reale, baseada no culturalismo jurídico e na teoria tridimensional.", "secao": "2.1"}, {"termo": "Culturalismo jurídico", "definicao": "Enfoque subjetivo (do aplicador) de Reale, guiado por três palavras: cultura, experiência e história.", "secao": "2.1"}, {"termo": "Teoria tridimensional", "definicao": "Para Reale, direito é fato, valor e norma, sempre correlacionados (visão concreta e dinâmica).", "secao": "2.1"}, {"termo": "Boa-fé objetiva", "definicao": "Boa-fé ligada à conduta de lealdade (não à intenção). Tem função interpretativa (art. 113), de controle (art. 187) e de integração (art. 422).", "secao": "2.1"}, {"termo": "Direito Civil Constitucional", "definicao": "Caminho metodológico que interpreta o Código Civil à luz da Constituição, numa visão unitária do ordenamento.", "secao": "2.1.1"}, {"termo": "Visão unitária do ordenamento", "definicao": "Ideia de que o sistema jurídico é um todo coerente; o ponto de referência desloca-se do Código Civil para a Constituição.", "secao": "2.1.1"}, {"termo": "Personalização do Direito Civil", "definicao": "Valorização da pessoa humana em detrimento do patrimônio, a partir da dignidade humana.", "secao": "2.1.1"}, {"termo": "Neoconstitucionalismo", "definicao": "Fenômeno de “invasão” da Constituição nos demais ramos, reconhecido também pelos constitucionalistas.", "secao": "2.1.1"}, {"termo": "Eficácia vertical", "definicao": "Aplicação dos direitos fundamentais na relação entre o Estado e o cidadão.", "secao": "2.1.2"}, {"termo": "Eficácia horizontal", "definicao": "Aplicação dos direitos fundamentais também nas relações entre particulares.", "secao": "2.1.2"}, {"termo": "Eficácia horizontal imediata", "definicao": "O direito fundamental aplica-se diretamente à relação privada, sem ponte legal (base: art. 5º, § 1º, CF).", "secao": "2.1.2"}, {"termo": "Eficácia horizontal mediata", "definicao": "O direito fundamental entra na relação privada por meio das cláusulas gerais (a “porta de entrada”).", "secao": "2.1.2"}, {"termo": "Diálogo das fontes", "definicao": "Teoria (Erik Jayme; Claudia Lima Marques) de que as normas não se excluem, mas se complementam.", "secao": "2.1.3"}, {"termo": "Diálogo de coerência", "definicao": "Uma lei serve de base conceitual para a outra (ex.: conceito de compra e venda do CC usado em contrato de consumo).", "secao": "2.1.3"}, {"termo": "Diálogo de complementaridade/subsidiariedade", "definicao": "Uma norma completa a outra, de forma direta (complementaridade) ou indireta (subsidiariedade).", "secao": "2.1.3"}, {"termo": "Diálogo de influências recíprocas", "definicao": "Os conceitos estruturais de uma lei sofrem influência da outra (double sens).", "secao": "2.1.3"}, {"termo": "Big Bang legislativo", "definicao": "Expressão de Ricardo Lorenzetti para a “explosão de leis” do mundo pós-moderno.", "secao": "2.1.3"}, {"termo": "Reforma do Código Civil", "definicao": "Trabalho da Comissão de Juristas do Senado (2023), que virou o PL 4/2025; é atualização, não um novo Código.", "secao": "2.1.5"}, {"termo": "Capacidade de direito (gozo)", "definicao": "Aptidão para ser sujeito de direitos e deveres; toda pessoa tem (art. 1º).", "secao": "2.2.1"}, {"termo": "Capacidade de fato (exercício)", "definicao": "Aptidão para exercer pessoalmente os atos da vida civil; os incapazes não a têm plenamente.", "secao": "2.2.1"}, {"termo": "Capacidade civil plena", "definicao": "Soma da capacidade de direito com a capacidade de fato.", "secao": "2.2.1"}, {"termo": "Legitimação", "definicao": "Capacidade especial para um ato ou negócio específico (ex.: outorga conjugal para vender imóvel).", "secao": "2.2.1"}, {"termo": "Legitimidade", "definicao": "Capacidade processual; uma das condições da ação.", "secao": "2.2.1"}, {"termo": "Personalidade", "definicao": "A soma dos caracteres da pessoa; a capacidade é a “medida” da personalidade.", "secao": "2.2.1"}, {"termo": "Nascituro", "definicao": "Aquele que já foi conc
