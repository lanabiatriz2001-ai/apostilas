tamente em uma relação entre empregador e empregado, entre marido e mulher, entre companheiros, entre pais e filhos, entre contratantes e assim sucessivamente. Isso, sem a necessidade de qualquer ponte infraconstitucional. A mesma afirmação cabe para as ações judiciais com tais conteúdos, especialmente pelo que consta do sempre citado art. 1.º do Código de Processo Civil de 2015.", "Como exemplo de aplicação da tese, pode ser citado julgado do Supremo Tribunal Federal em que foi adotada, no sentido de assegurar direito à ampla defesa a associado que fora excluído do quadro de uma pessoa jurídica (Informativo n. 405 do STF):", "“A Turma, concluindo julgamento, negou provimento a recurso extraordinário interposto contra acórdão do Tribunal de Justiça do Estado do Rio de Janeiro que mantivera decisão que reintegrara associado excluído do quadro da sociedade civil União Brasileira de Compositores – UBC, sob o entendimento de que fora violado o seu direito de defesa, em virtude de o mesmo não ter tido a oportunidade de refutar o ato que resultara na sua punição – v. Informativos ns. 351, 370 e 385. Entendeu-se ser, na espécie, hipótese de aplicação direta dos direitos fundamentais às relações privadas. Ressaltou-se que, em razão de a UBC integrar a estrutura do ECAD – Escritório Central de Arrecadação e Distribuição, entidade de relevante papel no âmbito do sistema brasileiro de proteção aos direitos autorais, seria incontroverso que, no caso, ao restringir as possibilidades de defesa do recorrido, a recorrente assumira posição privilegiada para determinar, preponderantemente, a extensão do gozo e da fruição dos direitos autorais de seu associado. Concluiu-se que as penalidades impostas pela recorrente ao recorrido extrapolaram a liberdade do direito de associação e, em especial, o de defesa, sendo imperiosa a observância, em face das peculiaridades do caso, das garantias constitucionais do devido processo legal, do contraditório e da ampla defesa. Vencidos a Min. Ellen Gracie, relatora, e o Min. Carlos Velloso, que davam provimento ao recurso, por entender que a retirada de um sócio de entidade privada é solucionada a partir das regras do estatuto social e da legislação civil em vigor, sendo incabível a invocação do princípio constitucional da ampla defesa” (STF, RE 201.819/RJ, Rel. Min. Ellen Gracie, Rel. p/ o acórdão Min. Gilmar Mendes, j. 11.10.2005).", "Interessante verificar que, do julgado acima, relatado pelo Ministro Gilmar Mendes, pode ser retirada outra grande lição, a de que “um meio de irradiação dos direitos fundamentais para as relações privadas seriam as cláusulas gerais (Generalklausel) que serviriam de ‘porta de entrada’ (Einbruchstelle) dos direitos fundamentais no âmbito do Direito Privado”. Trata-se daquilo que se denomina eficácia horizontal mediata, pois há uma ponte infraconstitucional para as normas constitucionais: as cláusulas gerais. Tal mecanismo é perfeitamente possibilitado pelo Código Civil de 2002, diante da adoção de um modelo aberto, conforme antes demonstrado.", "No aspecto processual, vale lembrar que a Emenda Constitucional 45/2004 introduziu, entre os direitos fundamentais, a razoável duração do processo (art. 5.º, inc. LXXVIII). Fez o mesmo o Código de Processo Civil de 2015, por força do seu art. 4.º, que tem a seguinte redação: “as partes têm o direito de obter em prazo razoável a solução integral do mérito, incluída a atividade satisfativa”. Muitas ementas do Superior Tribunal de Justiça debatem esse importante direito processual, especialmente os seus limites, o que deve ser aprofundado com a emergência do Código de Processo Civil de 2015.", "Assim, por exemplo, reconheceu o Tribunal da Cidadania que “a Constituição Federal assegura, em seu art. 5.º, inciso LXXVIII, como direito fundamental, a razoável duração do processo. Contudo, a alegação de excesso de prazo não pode basear-se em simples critério aritmético, devendo a demora ser analisada em cotejo com as particularidades e complexidades de cada caso concreto, pautando-se sempre pelo critério da razoabilidade” (STJ, HC 263.148/SP, 5.ª Turma, Rel. Min. Marilza Maynard (desembargadora convocada do TJSE), j. 04.06.2013, DJe 07.06.2013). Ou, ainda: “a duração razoável dos processos foi erigida como cláusula pétrea e direito fundamental pela Emenda Constitucional 45, de 2004, que acresceu ao art. 5.º o inciso LXXVIII, in verbis: ‘a todos, no âmbito judicial e administrativo, são assegurados a razoável duração do processo e os meios que garantam a celeridade de sua tramitação’. A conclusão de processo administrativo em prazo razoável é corolário dos princípios da eficiência, da moralidade e da razoabilidade (Precedentes: MS 13.584/DF, 3.ª Seção, Rel. Min. Jorge Mussi, j. 13.05.2009, DJe 26.06.2009; REsp 1091042/ SC, 2.ª Turma, Rel. Min. Eliana Calmon, j. 06.08.2009, DJe 21.08.2009; MS 13.545/DF, 3.ª Seção, Rel. Min. Maria Thereza de Assis Moura, j. 29.10.2008, DJe 07.11.2008; REsp 690.819/RS, 1.ª Turma, Rel. Min. José Delgado, j. 22.02.2005, DJ 19.12.2005)” (STJ, EDcl no AgRg no REsp 1090242/SC, 1.ª Turma, Rel. Min. Luiz Fux, j. 28.09.2010, DJe 08.10.2010).", "No plano das Cortes Estaduais também podem ser encontradas várias decisões que aplicam a eficácia horizontal dos direitos fundamentais às relações privadas. Do Tribunal Paulista, destaque-se julgado com o seguinte trecho:", "“Uma vez reconhecida, pela própria seguradora, a incapacidade do devedor, em razão de um câncer, e efetuado o pagamento integral da dívida financiada pela seguradora, não resta motivo plausível para que o Banco credor negue o levantamento da garantia e conceda a documentação necessária para a transferência da propriedade do bem, providência que, aliás, é um direito do apelante. Se o débito já se encontrava integralmente quitado, o simples fato de haver uma ação revisional em andamento não poderia impedir o levantamento da hipoteca. A postura do Banco se afasta da boa-fé objetiva, descumpre a eficácia horizontal dos direitos fundamentais e afronta o princípio do solidarismo constitucional. Autor que se encontra acometido de doença maligna que possui tratamento reconhecidamente penoso para o paciente e custoso para sua família. Nada mais natural que possa, nesse momento de aflição e angústia, movimentar seu patrimônio da forma que bem entenda, seja para custear o tratamento, seja para dar melhor condição ao adoentado, pouco importa. Caberia aos apelantes receber a documentação necessária para a transmissão da propriedade do imóvel, uma vez que este já havia sido quitado pela seguradora. Evidente a ofensa moral causada, que comporta reparação. Considerando que o contrato de financiamento se encontra quitado desde 03 de maio de 2004, reconhecendo o próprio Banco que o sinistro é datado de 01 de abril de 2003, permanecendo os apelantes até os dias atuais com a hipoteca pendendo sobre seu bem imóvel, deve ser fixada indenização por danos morais, em favor dos recorrentes, em quantia equivalente a R$ 16.000,00 (dezesseis mil reais), suficiente para reparar os danos causados e impingir ao Banco o dever de aprimorar a prestação de seus serviços” (TJSP, Apelação 9127680-34.2008.8.26.0000, Acórdão 6755404, 20.ª Câmara de Direito Privado, Santos, Rel. Des. Maria Lúcia Pizzotti, j. 20.05.2013, DJESP 12.06.2013).", "Nota-se, por fim, que existe uma relação inafastável entre essa eficácia das normas que protegem a pessoa nas relações entre particulares e o sistema de cláusulas gerais adotado pela codificação de 2002. Em sintonia, com tudo o que foi aqui exposto, é preciso estudar a festejada tese do diálogo das fontes."]}, {"num": "2.1.3", "title": "2.1.3 O diálogo das fontes", "resumo": "A teoria do diálogo das fontes foi criada por Erik Jayme (Heidelberg) e trazida ao Brasil por Claudia Lima Marques. Sua essência: as normas não se excluem — se complementam, ainda que de ramos diferentes (mais uma visão unitária do ordenamento). Serve de “leme” na era da “explosão de leis” (Big Bang legislativo, Lorenzetti). O exemplo clássico é aplicar ao mesmo caso o Código Civil e o Código de Defesa do Consumidor. Claudia Lima Marques aponta três diálogos: (a) diálogo sistemático de coerência (uma lei dá a base conceitual da outra); (b) diálogo de complementaridade/subsidiariedade (uma norma completa a outra, direta ou indiretamente); (c) diálogo de influências recíprocas (os conceitos de uma lei influenciam os da outra). A tese tende, no futuro, a substituir os critérios clássicos de solução de antinomias (hierárquico, especialidade, cronológico).", "pontos": ["Erik Jayme (criador) e Claudia Lima Marques (trouxe ao Brasil).", "As normas se complementam, não se excluem (visão unitária).", "Exemplo típico: CC/2002 + CDC no mesmo caso.", "Três diálogos: coerência, complementaridade/subsidiariedade, influências recíprocas.", "Tende a superar os critérios clássicos de antinomia."], "quiz": [{"q": "Qual é a ideia central da teoria do diálogo das fontes?", "options": ["Uma norma sempre revoga a outra", "As normas não se excluem, mas se complementam", "Só vale a norma hierarquicamente superior"], "answer": 1, "explain": "A essência (Erik Jayme) é que as normas jurídicas não se excluem — elas se complementam, numa visão unitária do ordenamento."}, {"q": "O exemplo mais clássico de aplicação do diálogo das fontes ocorre entre:", "options": ["O Código Civil e o Código Penal", "O Código Civil e o Código de Defesa do Consumidor", "A CLT e a Constituição"], "answer": 1, "explain": "A primeira e mais conhecida aplicação é a incidência simultânea do CC/2002 e do CDC, superando a ideia de que o CDC seria um microssistema isolado."}, {"q": "Quem criou a teoria do diálogo das fontes e quem a trouxe ao Brasil?", "options": ["Miguel Reale; José Fernando Simão", "Erik Jayme (Heidelberg); Claudia Lima Marques", "Pietro Perlingieri; Gustavo Tepedino"], "answer": 1, "explain": "A tese foi desenvolvida por Erik Jayme, da Universidade de Heidelberg, e trazida ao Brasil por Claudia Lima Marques (UFRGS)."}, {"q": "Quais são os três diálogos apontados por Claudia Lima Marques?", "options": ["Coerência, complementaridade/subsidiariedade e influências recíprocas", "Vertical, horizontal e diagonal", "Cronológico, hierárquico e da especialidade"], "answer": 0, "explain": "São: diálogo sistemático de coerência; de complementaridade/subsidiariedade; e de influências recíprocas sistemáticas."}, {"q": "No diálogo sistemático de coerência:", "options": ["Uma lei serve de base conceitual para a outra", "Uma lei revoga a outra", "Aplica-se só o CDC"], "answer": 0, "explain": "No diálogo de coerência, uma lei dá a base conceitual da outra — ex.: o conceito de compra e venda vem do Código Civil mesmo em contrato de consumo."}, {"q": "A expressão “Big Bang legislativo” (explosão de leis) é atribuída a:", "options": ["Erik Jayme", "Ricardo Lorenzetti", "Miguel Reale"], "answer": 1, "explain": "A “explosão de leis”/“Big Bang legislativo” é simbologia criada por Ricardo Lorenzetti, que fala na “era da desordem”."}, {"q": "Segundo Tartuce, no futuro a teoria do diálogo das fontes tende a:", "options": ["Reforçar os critérios clássicos de antinomia", "Substituir e superar os critérios clássicos de solução de antinomias", "Ser abandonada"], "answer": 1, "explain": "A tese surge para substituir e superar os critérios clássicos (hierárquico, especialidade e cronológico), embora por ora ainda seja possível conciliá-los."}], "terms": [{"termo": "Diálogo das fontes", "definicao": "Teoria (Erik Jayme; Claudia Lima Marques) de que as normas não se excluem, mas se complementam.", "secao": "2.1.3"}, {"termo": "Diálogo de coerência", "definicao": "Uma lei serve de base conceitual para a outra (ex.: conceito de compra e venda do CC usado em contrato de consumo).", "secao": "2.1.3"}, {"termo": "Diálogo de complementaridade/subsidiariedade", "definicao": "Uma norma completa a outra, de forma direta (complementaridade) ou indireta (subsidiariedade).", "secao": "2.1.3"}, {"termo": "Diálogo de influências recíprocas", "definicao": "Os conceitos estruturais de uma lei sofrem influência da outra (double sens).", "secao": "2.1.3"}, {"termo": "Big Bang legislativo", "definicao": "Expressão de Ricardo Lorenzetti para a “explosão de leis” do mundo pós-moderno.", "secao": "2.1.3"}], "blocks": ["A tese do diálogo das fontes foi desenvolvida na Alemanha por Erik Jayme, professor da Universidade de Heidelberg, trazida ao Brasil por Claudia Lima Marques, da Universidade Federal do Rio Grande do Sul. A essência da teoria é que as normas jurídicas não se excluem – supostamente porque pertencentes a ramos jurídicos distintos –, mas se complementam. Como se pode perceber há nesse marco teórico, do mesmo modo, a premissa de uma visão unitária do ordenamento jurídico.", "A primeira justificativa que pode surgir para a sua aplicação refere-se à sua funcionalidade. É cediço que vivemos um momento de explosão de leis, um “Big Bang legislativo”, como simbolizou Ricardo Lorenzetti. O mundo pós-moderno e globalizado, complexo e abundante por natureza, convive com uma quantidade enorme de normas jurídicas, a deixar o aplicador do Direito até desnorteado. Convive-se com a era da desordem, conforme expõe o mesmo Lorenzetti.<sup class=\"fn\" title=\"Nota 23 do original — o texto da nota não faz parte deste trecho (Parte I)\">23</sup> O diálogo das fontes serve como leme nessa tempestade de complexidade.", "Relativamente às razões filosóficas e sociais da aplicação da tese, Claudia Lima Marques ensina o seguinte:", "“Segundo Erik Jayme, as características da cultura pós-moderna no direito seriam o pluralismo, a comunicação, a narração, o que Jayme denomina de ‘le retour des sentiments’, sendo o Leitmotiv da pós-modernidade a valorização dos direitos humanos. Para Jayme, o direito como parte da cultura dos povos muda com a crise da pós-modernidade. O pluralismo manifesta-se na multiplicidade de fontes legislativas a regular o mesmo fato, com a descodificação ou a implosão dos sistemas genéricos normativos (‘Zersplieterung’), manifesta-se no pluralismo de sujeitos a proteger, por vezes difusos, como o grupo de consumidores ou os que se beneficiam da proteção do meio ambiente, na pluralidade de agentes ativos de uma mesma relação, como os fornecedores que se organizam em cadeia e em relações extremamente despersonalizadas. Pluralismo também na filosofia aceita atualmente, onde o diálogo é que legitima o consenso, onde os valores e princípios têm sempre uma dupla função, o ‘double coding’, e onde os valores são muitas vezes antinômicos. Pluralismo nos direitos assegurados, nos direitos à diferença e ao tratamento diferenciado aos privilégios dos ‘espaços de excelência’ (Jayme, Erik. Identité culturelle et intégration: le droit international privé postmoderne. Recueil des Cours de l’Académie de Droit International de la Haye, 1995, II, Kluwer, Haia, p. 36 e ss.).”<sup class=\"fn\" title=\"Nota 24 do original — o texto da nota não faz parte deste trecho (Parte I)\">24</sup>", "A primeira tentativa de aplicação da tese do diálogo das fontes se dá com a possibilidade de subsunção concomitante tanto do Código de Defesa do Consumidor quanto do Código Civil a determinadas relações obrigacionais, sobretudo aos contratos. Isso diante da já conhecida aproximação principiológica entre os dois sistemas, consolidada pelos princípios sociais contratuais, sobretudo pela boa-fé objetiva e pela função social dos contratos. Supera-se a ideia de que o Código Consumerista seria um microssistema jurídico, totalmente isolado do Código Civil de 2002.", "Como outro exemplo de interação necessária, parece-me que o CPC de 2015 intensificou a possibilidade de diálogos com a legislação material, em especial por ter adotado um sistema aberto e constitucionalizado. Ademais, a valorização da boa-fé objetiva processual possibilita a aplicação concomitante do CPC/2015 e do CC/2002, com o intuito de valorizar a conduta de lealdade das partes durante o curso de uma demanda judicial. Sendo assim, acredita-se que muitos julgados surgirão, nos próximos anos, fazendo incidir a teoria do diálogo das fontes nessa seara.", "Feitas tais considerações, Claudia Lima Marques demonstra três diálogos possíveis a partir da teoria exposta:<sup class=\"fn\" title=\"Nota 25 do original — o texto da nota não faz parte deste trecho (Parte I)\">25</sup>", "a) Em havendo aplicação simultânea das duas leis, se uma lei servir de base conceitual para a outra, estará presente o diálogo sistemático de coerência. Exemplo: os conceitos dos contratos de espécie podem ser retirados do Código Civil mesmo sendo o contrato de consumo, caso de uma compra e venda (art. 481 do CC).", "b) Se o caso for de aplicação coordenada de duas leis, uma norma pode completar a outra, de forma direta (diálogo de complementaridade) ou indireta (diálogo de subsidiariedade). O exemplo típico ocorre com os contratos de consumo que também são de adesão. Em relação às cláusulas abusivas, pode ser invocada a proteção dos consumidores constante do art. 51 do CDC e ainda a proteção dos aderentes constante do art. 424 do CC.", "c) Os diálogos de influências recíprocas sistemáticas estão presentes quando os conceitos estruturais de uma determinada lei sofrem influências da outra. Assim, o conceito de consumidor pode sofrer influências do próprio Código Civil. Como afirma a própria Claudia Lima Marques, “é a influência do sistema especial no geral e do geral no especial, um diálogo de doublé sens (diálogo de coordenação e adaptação sistemática)”.", "Analisadas essas premissas, é interessante trazer à colação, com os devidos comentários, alguns julgados nacionais que aplicaram a tese do diálogo das fontes, propondo principalmente uma interação entre o Código Civil de 2002 e o Código de Defesa do Consumidor.", "De início, limitando os juros cobrados em cartão de crédito e aplicando a aclamada teoria, do Tribunal de Justiça da Bahia, entre tantas ementas que se repetem:", "“Consumidor. Cartão de crédito. Juros abusivos. Código de Defesa do Consumidor. Juros estipulação usurária pecuniária ou real. Trata-se de crime previsto na Lei n.º 1.521/51, art. 4.º. Limitação prevista na Lei n.º 4.595/64 e das normas do Conselho Monetário Nacional, regulação vigorante, ainda que depois da revogação do art. 192 da CF/1988, pela Emenda Constitucional 40 de 2003. Manutenção da razoabilidade e limitação de prática de juros pelos artigos 161 do CTN combinando com 406 e 591 do CC/2002. A cláusula geral da boa-fé está presente tanto no Código de Defesa do Consumidor (arts. 4.º, III, e 51, IV, e § 1.º, do CDC) como no Código Civil de 2002 (arts. 113, 187 e 422), que devem atuar em diálogo (diálogo das fontes, na expressão de Erik Jayme) e sob a luz da Constituição e dos direitos fundamentais para proteger os direitos dos consumidores (art. 7.º do CDC). Relembre-se, aqui, portanto, do Enunciado de n. 26 da Jornada de Direito Civil, organizada pelo STJ em 2002, que afirma: ‘a cláusula geral contida no art. 422 do novo Código Civil impõe ao juiz interpretar e, quando necessário, suprir e corrigir o contrato segundo a boa-fé objetiva, entendida como exigência de comportamento leal dos contratantes’. Recurso improcedente” (TJBA, Recurso 0204106-62.2007.805.0001-1, 2.ª Turma Recursal, Rel. Juíza Nicia Olga Andrade de Souza Dantas, DJBA 25.01.2010).", "Do Tribunal do Rio Grande do Norte, da mesma maneira tentando uma aproximação conceitual entre os dois Códigos, colaciona-se:", "“Civil. CDC. Processo Civil. Apelação cível. Juízo de admissibilidade positivo. Ação de indenização por danos morais. Contrato de promessa de compra e venda de imóvel. Notificação cartorária. Cobrança indevida. Prestação de serviços. Relação de consumo configurada. Incidência do Código Civil. Diálogo das fontes. Responsabilidade objetiva. Vício de qualidade. Dano moral configurado. Dano à honra. Abalo à saúde. Quantum indenizatório excessivo. Redução. Minoração da condenação em honorários advocatícios. Recurso conhecido e provido em parte” (TJRN, Acórdão 2009.010644-0, 3.ª Câmara Cível, Natal, Rel. Juíza Conv. Maria Neize de Andrade Fernandes, DJRN 03.12.2009, p. 39).", "Tratando da coexistência entre as leis, enunciado fundamental da teoria do diálogo das fontes, destaque-se decisão do Tribunal do Rio Grande do Sul:", "“Embargos de declaração. Ensino particular. Desnecessidade de debater todos os argumentos das partes. Aplicação do Código de Defesa do Consumidor. Diálogo das fontes. 1. Formada a convicção pelo julgador que já encontrou motivação suficiente para alicerçar sua decisão, e fundamentada nesse sentido, consideram-se afastadas teses, normas ou argumentos porventura esgrimidos em sentidos diversos. 2. Em matéria de consumidor vige um método de superação das antinomias chamado de diálogo das fontes, segundo o qual o diploma consumerista coexiste com as demais fontes de direito como o Código Civil e Leis esparsas. Embargos desacolhidos” (TJRS, Embargos de Declaração 70027747146, 6.ª Câmara Cível, Caxias do Sul, Rel. Des. Liége Puricelli Pires, j. 18.12.2008, DOERS 05.02.2009, p. 43).", "Por fim, sem prejuízo de inúmeros outros julgados que utilizaram a teoria do diálogo das fontes, merecem relevo os seguintes acórdãos do Tribunal de São Paulo, do mesmo modo buscando uma interação entre o CC/2002 e o CDC:", "“Civil. Compromisso de compra e venda de imóvel. Transação. Carta de crédito. Relação de consumo. Lei 8.078/90. Diálogo das fontes. Abusividade das condições consignadas em carta de crédito. Validade do instrumento quanto ao reconhecimento de dívida. Processual civil. Honorários. Princípio da sucumbência e da causalidade. Arbitramento em conformidade com o disposto no artigo 20, § 3.º do CPC. Recurso desprovido” (TJSP, Apelação com Revisão 293.227.4/4, Acórdão 3233316, 2.ª Câmara de Direito Privado, São Paulo, Rel. Des. Boris Padron Kauffmann, j. 09.09.2008, DJESP 1.º.10.2008).", "“Responsabilidade civil. Defeito em construção. Contrato de empreitada mista. Responsabilidade objetiva do empreiteiro. Análise conjunta do CC e CDC. Diálogo das fontes. Sentença mantida. Recurso improvido” (TJSP, Apelação com Revisão 281.083.4/3, Acórdão 3196517, 8.ª Câmara de Direito Privado, Bauru, Rel. Des. Caetano Lagrasta, j. 21.08.2008, DJESP 09.09.2008).", "“Responsabilidade civil por vícios de construção. Desconformidade entre o projeto e a obra. Paredes de espessura inferior às constantes do projeto, que provocam alterações acústicas e de temperatura nas unidades autônomas. Responsabilidade da incorporadora e construtora pela correta execução do empreendimento. Vinculação da incorporadora e construtora à execução das benfeitorias prometidas, que integram o preço. Desvalorização do empreendimento. Indenização pelos vícios de construção e pelas desconformidades com o projeto original e a oferta aos adquirentes das unidades. Inocorrência de prescrição ou decadência da pretensão ou direito à indenização. Incidência do prazo prescricional de solidez da obra do Código Civil. Diálogo das fontes com o Código de Defesa do Consumidor. Ação procedente. Recurso improvido” (TJSP, Apelação Cível 407.157.4/8, Acórdão 2635077, 4.ª Câmara de Direito Privado, Piracicaba, Rel. Des. Francisco Loureiro, j. 29.05.2008, DJESP 20.06.2008).", "Superadas essas exemplificações de diálogos entre o Direito Civil e o Direito do Consumidor, é imperioso dizer que também são possíveis diálogos entre o Direito Civil e o Direito do Trabalho, particularmente entre o Código Civil e a legislação trabalhista, o que é totalmente viável e, mais do que isso, plenamente recomendável.", "Para esse diálogo, de início, é importante apontar que o Direito do Trabalho é ramo do Direito Privado, assim como o é o Direito Civil. Quanto ao contrato de trabalho, a sua própria concepção é feita com vistas à proteção do vulnerável dessa relação privada, o empregado ou trabalhador. Há tempos que o Direito do Trabalho lida com a diferença existente no contrato em questão, visando tutelar camadas da população desprotegidas e desamparadas. Talvez a legislação trabalhista seja o primeiro exemplo de dirigismo contratual, de intervenção do Estado e da lei nos contratos.", "Conforme o art. 8.º da CLT, o direito comum e, logicamente, o Direito Civil são fontes subsidiárias do Direito do Trabalho. Na verdade, pela aplicação da tese do diálogo das fontes, o que se propõe é uma nova leitura desse comando legal. Não se deve mais considerar o Direito Civil como simples fonte subsidiária, mas, em alguns casos, como fonte direta do Direito do Trabalho.", "Isso porque, em muitas situações atualmente comuns à prática trabalhista, não há normas de Direito do Trabalho regulamentando a matéria. Em casos tais é que as normas do Código Civil terão aplicação. Outro argumento interessante é que, quando a CLT entrou em vigor, não vivíamos esse momento de complexidade legislativa atual.", "Trazendo clarividência a essa complexidade, anote-se que a Emenda Constitucional 45/2004 ampliou enormemente a competência da Justiça do Trabalho para tratar de casos que antes eram da competência da Justiça Comum, como a responsabilidade civil por acidente de trabalho ou em decorrência do contrato de trabalho. Como não há legislação trabalhista a tratar do tema, o aplicador do Direito deve procurar socorro nas normas do Código Civil que tratam da responsabilidade civil.", "Em suma, a partir da interação científica a doutrina civilista deve preencher as estantes do intérprete que atua na área trabalhista, para motivar o seu convencimento e os seus argumentos. Na área trabalhista, já podem ser encontrados arestos que fazem menção à teoria do diálogo das fontes, com destaque para o seguinte:", "“Trabalho temporário. Aplicação da CLT ou outro diploma legal. Possibilidade. Diálogo das fontes. A circunstância de o trabalho temporário ser disciplinado pela Lei 6.019/74. Não importa, de per si, em inaplicabilidade da CLT ou mesmo de outros diplomas legais, como o Código Civil, por exemplo, e isso porque, como se sabe, hodiernamente, diante do aumento dos microssistemas, regulando situações específicas, imprescindível o recurso ao denominado diálogo das fontes, como meio mais eficaz de proteção à parte mais fraca de uma relação jurídica, preservando-se a sua dignidade de pessoa humana e também por possibilitar uma visão de conjunto que um olhar parcial, por óbvio, não proporciona. Trabalho temporário. Contrato. Validade. Requisitos. A se entender que a mera celebração de contrato escrito e normalmente com cláusulas já previamente estabelecidas, entre as empresas prestadora e tomadora de serviços e entre aquela e o obreiro, apontando, passe a singeleza do vocábulo, ‘secamente’ qual o motivo da contratação, às vezes apenas assinalando com um ‘X’ um espaço em branco, atende ao quanto disposto na referida ‘lex’, bem é de ver que muito raramente se encontrará algum contrato de trabalho temporário que padeça de algum vício de nulidade, todos serão celebrados com a mais absoluta observância das normas legais pertinentes, de modo que, em situações nas quais se fala em substituição transitória de pessoal permanente ou quando o motivo determinante é o acréscimo extraordinário de serviços, há de ser apontado o que levou a que se desse uma ou outra situação, sendo totalmente insuficiente a mera alusão, sem maiores especificações, a respeitante necessidade. Em outras palavras, não basta dizer que o motivo da contratação do trabalho temporário é este ou aquele, mesmo porque, só em razão dos mesmos é que tal concerto pode ser ajustado, imprescindível o deixar claro qual a situação que provocou e/ou que dá sustentação ao motivo alegado; por exemplo, um pedido de cliente absolutamente imprevisto e que, para ser atendido, provoca – aí sim – um acréscimo extraordinário de serviço, do contrário, se mencionada situação não ficar devidamente apontada, a rigor, as normas aplicáveis não restaram satisfeitas, como deveriam sê-lo, o que leva à decretação de nulidade do contrato de trabalho temporário, por não demonstrado o preenchimento das condições necessárias à sua celebração” (TRT da 15.ª Região, Recurso Ordinário 1146-2007-059-15-00-9, Acórdão 45622/08, 5.ª Câmara, Rel. Des. Francisco Alberto da Motta Peixoto Giordani, DOESP 1.º.08.2008, p. 95).", "A encerrar o presente tópico, destaque-se que a teoria do diálogo das fontes surge para substituir e superar os critérios clássicos de solução das antinomias jurídicas (hierárquico, especialidade e cronológico). Realmente, esse será o seu papel no futuro. No momento, ainda é possível conciliar tais critérios com a aclamada tese, premissa que guiará a presente obra, que tenta conciliar o clássico e o contemporâneo, o moderno e o pós-moderno."]}, {"num": "2.1.4", "title": "2.1.4 A interação entre as teses expostas e a visão unitária do ordenamento jurídico", "resumo": "Este tópico costura as teses anteriores: a constitucionalização do Direito Civil (Direito Civil Constitucional) é um diálogo entre o Código Civil e a Constituição, onde repousa a proteção da pessoa (personalização). Para que essa proteção funcione, reconhece-se a eficácia horizontal dos direitos fundamentais — direta (imediata) ou pela porta de entrada das cláusulas gerais (mediata). Somadas ao sistema de cláusulas gerais (ontognoseologia realeana), todas essas teorias apontam para um mesmo lugar: uma visão unitária do sistema, com diálogos mútuos e interdisciplinaridade. É assim que se constrói o Direito Civil contemporâneo.", "pontos": ["As teses se conectam numa visão unitária do ordenamento.", "Constitucionalização → personalização → eficácia horizontal → cláusulas gerais.", "O fio condutor é o diálogo entre as fontes e os ramos do Direito."], "quiz": [{"q": "O que une o Direito Civil Constitucional, a eficácia horizontal e o diálogo das fontes?", "options": ["A ideia de uma visão unitária do ordenamento jurídico", "A defesa de um sistema fechado de normas", "A prevalência absoluta do Código Civil"], "answer": 0, "explain": "Todas as teses convergem para uma visão unitária do sistema, com diálogos mútuos e reconhecimento da interdisciplinaridade."}, {"q": "A constitucionalização do Direito Civil nada mais é do que um diálogo entre:", "options": ["O Código Civil e o Código Penal", "O Código Civil e a Constituição", "A CLT e o CDC"], "answer": 1, "explain": "A constitucionalização do Direito Civil é um diálogo entre o Código Civil e a Constituição (Direito Civil Constitucional), onde repousa a proteção da pessoa."}, {"q": "Para que a proteção da pessoa nas relações privadas seja possível, deve-se reconhecer:", "options": ["A eficácia horizontal dos direitos fundamentais", "A revogação do Código Civil", "A supremacia do contrato"], "answer": 0, "explain": "É preciso reconhecer a eficácia horizontal — direta (imediata) ou pela porta de entrada das cláusulas gerais (mediata)."}], "terms": [], "blocks": ["Como aspecto fundamental para o estudo da introdução ao Código Civil de 2002, pode-se demonstrar uma relação direta entre o diálogo das fontes, a constitucionalização do Direito Civil (com o surgimento do Direito Civil Constitucional), a eficácia horizontal dos direitos fundamentais, a personalização do Direito Civil e o sistema de cláusulas gerais construído pela ontognoseologia realeana.", "Ora, a constitucionalização do Direito Civil nada mais é do que um diálogo entre o Código Civil e a Constituição (Direito Civil Constitucional). Com isso se vai até a Constituição, onde repousa a proteção da pessoa como máxime do nosso ordenamento jurídico (personalização).", "Para que essa proteção seja possível, deve-se reconhecer a eficácia horizontal dos direitos fundamentais, ou seja, que as normas que protegem a pessoa, previstas no Texto Maior, têm aplicação imediata nas relações entre particulares. A porta de entrada dessas normas protetivas, nas relações privadas, pode se dar por meio das cláusulas gerais (eficácia horizontal mediata), ou mesmo de forma direta (eficácia horizontal imediata).", "Em síntese, percebe-se que todas essas teorias possibilitam a visão de um sistema unitário, em que há mútuos diálogos e o reconhecimento da interdisciplinaridade. Assim está sendo construído o Direito Civil Contemporâneo."]}, {"num": "2.1.5", "title": "2.1.5 A Reforma do Código Civil de 2002. A Comissão de Juristas nomeada no âmbito do Senado Federal, em 2023, e a sua tramitação no Congresso Nacional", "resumo": "Em 24/08/2023, o Senado nomeou uma Comissão de Juristas para reformar e atualizar o Código Civil de 2002 — presidida pelo Min. Luis Felipe Salomão (vice: Min. Marco Aurélio Bellizze), tendo Flávio Tartuce e Rosa Maria de Andrade Nery como relatores. Justificativa: o projeto do atual Código é dos anos 1970 e “já nasceu velho”, desatualizado quanto a empresa, família, sucessões e, sobretudo, às novas tecnologias (Direito Digital). Foram 9 grupos de trabalho, audiências públicas e ampla participação social. Os trabalhos viraram o Projeto de Lei 4/2025. Importante: não é um “Novo Código Civil”, mas uma ampla reforma; a estrutura e os princípios foram mantidos (arts. 113 e 187, por exemplo, ficaram intactos).", "pontos": ["Comissão de Juristas do Senado (2023): Salomão (pres.), Bellizze (vice); Tartuce relator.", "Motivo: o CC/2002 “já nasceu velho” (projeto dos anos 1970).", "Virou o Projeto de Lei 4/2025.", "É reforma e atualização — não um “Novo Código Civil”."], "quiz": [{"q": "Sobre a Reforma do Código Civil conduzida pela Comissão de Juristas de 2023:", "options": ["É um Novo Código Civil que revoga toda a estrutura atual", "É uma ampla reforma e atualização, mantendo estrutura e princípios", "Foi arquivada sem virar projeto de lei"], "answer": 1, "explain": "Não é um “Novo Código Civil”, mas uma ampla reforma/atualização; a organização e os princípios foram mantidos, e o texto virou o PL 4/2025."}, {"q": "Quem presidiu a Comissão de Juristas do Senado (2023) para a Reforma do CC?", "options": ["O Ministro Luis Felipe Salomão (vice: Marco Aurélio Bellizze)", "O Ministro Gilmar Mendes", "O Senador Rodrigo Pacheco"], "answer": 0, "explain": "A Comissão teve a presidência do Min. Luis Felipe Salomão e a vice de Marco Aurélio Bellizze (ambos do STJ). Tartuce foi relator, ao lado de Rosa Maria de Andrade Nery."}, {"q": "Qual a principal justificativa para reformar o Código Civil de 2002?", "options": ["Ele é muito recente", "Seu projeto é dos anos 1970 e “já nasceu velho”, desatualizado (empresa, família, sucessões, Direito Digital)", "Ele tem poucos artigos"], "answer": 1, "explain": "Afirmou-se com força que o atual Código “já nasceu velho”: o projeto é da década de 1970 e está desatualizado, sobretudo frente às novas tecnologias."}, {"q": "O anteprojeto da Comissão de Juristas tornou-se qual projeto de lei?", "options": ["Projeto de Lei 4/2025", "Projeto de Lei 757/2015", "Medida Provisória 881"], "answer": 0, "explain": "No início de 2025, o anteprojeto virou o Projeto de Lei 4/2025, proposto pelo Senador Rodrigo Pacheco, sem modificação do texto original."}, {"q": "Quais dispositivos fundamentais foram mantidos intactos na Reforma?", "options": ["Os arts. 113 e 187 do Código Civil", "Os arts. 3º e 4º do Código Civil", "O art. 2º do Código Civil apenas"], "answer": 0, "explain": "Foram mantidos a estrutura e os princípios, e dispositivos fundamentais como os arts. 113 e 187 não sofreram qualquer alteração."}], "terms": [{"termo": "Reforma do Código Civil", "definicao": "Trabalho da Comissão de Juristas do Senado (2023), que virou o PL 4/2025; é atualização, não um novo Código.", "secao": "2.1.5"}], "blocks": ["Em 24 de agosto de 2023, o Presidente do Senado Federal, Rodrigo Pacheco, nomeou e formou uma Comissão de Juristas para empreender os trabalhos de Reforma e de Atualização do Código Civil de 2002. Como antes se expôs, o projeto que gerou a atual codificação privada é da década de 1970, estando desatualizada em vários aspectos, sobretudo em questões relativas ao Direito de Empresa, ao Direito de Família, ao Direito das Sucessões e frente às novas tecnologias, ao Direito Digital. Voltou-se a afirmar, com muita força, que o atual Código Civil “já nasceu velho”. Trata-se de um texto com mais de cinquenta anos de elaboração que, por óbvio, se encontra muito desatualizado, como se pode perceber da leitura desta obra.", "A Comissão teve a Presidência do Ministro Luis Felipe Salomão e a Vice-Presidência do Ministro Marco Aurélio Bellizze, ambos do Superior Tribunal de Justiça. Tive a honra de atuar como relator da Comissão, ao lado da Professora Rosa Maria Andrade Nery. O prazo para o desenvolvimento dos trabalhos foi de cento e oitenta dias, com a possibilidade de eventual prorrogação. De todo modo, os trabalhos foram entregues no prazo, cumprindo-se a sua missão institucional, e com a entrega formal ao Congresso Nacional em 17 de abril de 2024.", "Foram formados nove grupos de trabalho, de acordo com os livros respectivos do Código Civil e também com a necessidade de inclusão de um capítulo específico sobre o Direito Civil Digital, o que nos foi pedido no âmbito do Congresso Nacional.", "As composições das subcomissões, com os respectivos sub-relatores, foram as seguintes:", "– Na Parte Geral: Professor Rodrigo Mudrovitsch (relator), Ministro João Otávio de Noronha, Professora Estela Aranha e Desembargador Rogério Marrone Castro Sampaio.", "– Em Direito das Obrigações: Professor José Fernando Simão (relator) e Professor Edvaldo Brito.", "– Em Responsabilidade Civil: Professor Nelson Rosenvald (relator), Ministra Maria Isabel Gallotti e Juíza Patrícia Carrijo.", "– Quanto ao Direito dos Contratos: Professor Carlos Eduardo Elias de Oliveira (relator), Professora Angelica Carlini, Professora Cláudia Lima Marques e Professor Carlos Eduardo Pianovski.", "– Em Direito das Coisas: Desembargador Marco Aurélio Bezerra de Melo (relator), Professor Carlos Vieira Fernandes, Professora Maria Cristina Santiago e Desembargador Marcelo Milagres.", "– Em Direito de Família: Juiz Pablo Stolze Gagliano (relator), Ministro Marco Buzzi, Desembargadora Maria Berenice Dias e Professor Rolf Madaleno.", "– No Direito das Sucessões: Professor Mario Luiz Delgado (relator), Ministro Cesar Asfor Rocha, Professora Giselda Maria Fernandes Novaes Hironaka e Professor Gustavo Tepedino.", "– Para o livro especial do Direito Civil Digital: Professora Laura Porto (relatora), Professor Dierle Nunes e Professor Ricardo Campos.", "– Por fim, para o Direito de Empresa: Professora Paula Andrea Forgioni (relatora), Professor Marcus Vinícius Furtado Coelho, Professor Flavio Galdino, Desembargador Moacyr Lobato e Juiz Daniel Carnio.", "Também foram nomeados como membros consultores da Comissão de Juristas os Professores de Direito Ana Cláudia Scalquette, Layla Abdo Ribeiro de Andrada e Maurício Bunazar; o Professor de Língua Portuguesa Jorge Miguel; a Defensora Pública Fernanda Fernandes da Silva Rodrigues; e o Juiz Federal e também Professor Vicente de Paula Ataíde Jr., especialista na causa animal.", "No ano de 2023, foram realizadas três audiências públicas, em São Paulo (OABSP, em 23 de outubro), Porto Alegre (Tribunal de Justiça do Rio Grande do Sul, em 20 de novembro) e Salvador (Tribunal de Justiça da Bahia, em 7 de dezembro). Além da exposição de especialistas e debates ocorridos nesses eventos, muitos outros seminários jurídicos foram realizados e reuniões de cada Subcomissão.", "Foram também abertos canais para envio de sugestões pelo Senado Federal e oficiados mais de quatrocentos institutos e instituições jurídicas. Mais de duzentos deles mandaram propostas para a Comissão de Juristas, em um sistema democrático de participação não visto em processos anteriores, de elaboração e alteração da Lei Geral Privada Brasileira. Após um intenso trabalho no âmbito de cada grupo temático, em dezembro de 2023 foram consolidados os textos dos dispositivos sugeridos, enviados para a revisão dos relatores-gerais.", "Em 2024, foi realizada mais uma audiência pública, em Brasília, com a presença do Ministro da Suprema Corte Argentina Ricardo Lorenzetti e da Professora Aída Kemelmajer. Na oportunidade, os juristas argentinos compartilharam conosco um pouco da sua experiência com a elaboração do Novo Código Civil daquele País, de 2014.", "Também ocorreram, sucessivamente, os debates entre todos os membros da Comissão, a elaboração de emendas de consenso, a votação dos textos, em abril de 2024, e a sua elaboração final, com a posterior entrega ao Presidente do Senado.", "No início de 2025, o Anteprojeto elaborado pela Comissão de Juristas se tornou o Projeto de Lei 4/2025, proposto pelo Senador Rodrigo Pacheco e sem qualquer modificação do texto original. Em abril do mesmo ano, foi lançada obra jurídica coletiva de destaque pela Livraria do Senado, com os membros da Comissão de Juristas, para a orientação dos parlamentares, sob a sua coordenação e com a presença de membros dos três poderes da República.", "Nesse mesmo ano, os debates foram intensificados no meio social jurídico e, finalmente, em setembro foi formada a Comissão Especial Temporária no Senado Federal, sob o rito do art. 374 do Regimento Interno da Casa, com a constituição por onze membros titulares e onze suplentes.", "Com a presença do Presidente Davi Alcolumbre, foi eleito por aclamação como Presidente dessa comissão o Senador Rodrigo Pacheco e como Vice-Presidente o Senador Efraim Filho. A Relatoria da Comissão é do Senador Veneziano Vital do Rêgo, todos com ampla e profunda experiência na área jurídica, sobretudo no Direito Privado.", "Sucessivamente, foram realizadas novas audiências públicas, das quais tive a honra de participar, aguardando-se a apresentação do relatório final para votação no Senado, envio à Câmara dos Deputados e sanção pelo Presidente da República, em 2026. Não se pode negar que a Reforma do Código Civil continuará sendo a principal temática de debate do Direito Civil Brasileiro nos próximos anos.", "Sendo assim, a partir da edição de 2025 deste Manual de Direito Civil, trago para estudo as normas projetadas, com comentários pontuais e exposição dos debates que travamos, sendo imperiosa, sem dúvida, uma reforma e uma atualização do Código Civil de 2002 diante dos novos desafios contemporâneos e por tudo o que está exposto neste livro.", "Como último esclarecimento inicial a respeito do Projeto, cabe deixar evidente a afirmação de não se tratar de uma projeção de um “Novo Código Civil”, mas apenas de uma ampla reforma, com atualizações fundamentais e necessárias, para que o Direito Civil Brasileiro esteja pronto para enfrentar os desafios do século XXI.", "Foram mantidos a organização, a estrutura e os princípios da atual Lei Geral Privada, assim como dispositivos fundamentais, caso dos seus arts. 113 e 187, que não sofreram qualquer alteração. Em muitos deles, houve apenas a correção do texto – como naqueles relativos ao Direito de Família, em que se incluiu o convivente ao lado do cônjuge – e a atualização diante de leis recentes, de decisões dos Tribunais Superiores e dos enunciados aprovados nas Jornadas de Direito Civil, além da retomada do Código Civil como protagonista em matéria do Direito Privado, o que foi esvaziado, nos últimos anos.", "Partimos, então, ao estudo do Código Civil de 2002, com as proposições de sua mais do que necessária Reforma."]}]}, {"num": "2.2", "title": "2.2 PARTE GERAL DO CÓDIGO CIVIL DE 2002. DA PESSOA NATURAL", "resumo": "Aqui começa a Parte Geral do Código Civil, tratando da pessoa natural como sujeito de direito (arts. 1º a 39). É o alicerce de todo o Direito Civil: quem é sujeito de direitos, quando começa a personalidade, quem são os incapazes e como se antecipa a capacidade (emancipação). As subseções percorrem: conceitos iniciais de capacidade (2.2.1), o início da personalidade e o nascituro (2.2.2), os incapazes e as mudanças do Estatuto da Pessoa com Deficiência (2.2.3), a emancipação (2.2.4) e a abertura dos direitos da personalidade (2.2.5).", "pontos": ["Parte Geral: a pessoa natural como sujeito de direito (arts. 1º a 39).", "Base de todo o Direito Civil: capacidade, personalidade, incapacidade, emancipação.", "Grande divisor de águas recente: o Estatuto da Pessoa com Deficiência (Lei 13.146/2015)."], "quiz": [{"q": "A Parte Geral do Código Civil trata primeiro de quê?", "options": ["Dos contratos", "Da pessoa natural como sujeito de direito (arts. 1º a 39)", "Das sucessões"], "answer": 1, "explain": "A codificação cuida primeiro da pessoa natural como sujeito de direito, entre os arts. 1º a 39."}, {"q": "Qual lei recente provocou uma “revolução” na teoria das incapacidades?", "options": ["O Código de Processo Civil de 2015", "O Estatuto da Pessoa com Deficiência (Lei 13.146/2015)", "A Lei da Liberdade Econômica"], "answer": 1, "explain": "A teoria das incapacidades sofreu grandes alterações estruturais com o Estatuto da Pessoa com Deficiência (Lei 13.146/2015)."}, {"q": "Quais temas a Parte Geral (pessoa natural) percorre?", "options": ["Capacidade, personalidade, incapacidade e emancipação", "Posse, propriedade e usucapião", "Casamento, divórcio e alimentos"], "answer": 0, "explain": "As subseções tratam de capacidade, início da personalidade (nascituro), incapazes, emancipação e direitos da personalidade."}], "terms": [], "blocks": [], "children": [{"num": "2.2.1", "title": "2.2.1 Conceitos iniciais. A capacidade e conceitos correlatos", "resumo": "O art. 1º do CC/2002 diz que “toda pessoa é capaz de direitos e deveres na ordem civil”. Isso é a capacidade de direito (ou de gozo): a aptidão para ser sujeito de direitos e deveres, que TODA pessoa tem, sem distinção. Diferente é a capacidade de fato (ou de exercício): a aptidão para exercer pessoalmente os atos, que alguns não têm (os incapazes, arts. 3º e 4º). A soma das duas é a capacidade civil plena. Conceitos correlatos: legitimação (capacidade especial para um ato específico — ex.: outorga conjugal para vender imóvel), legitimidade (capacidade processual) e personalidade (a soma dos caracteres da pessoa — “a capacidade é a medida da personalidade”).", "pontos": ["Capacidade de direito/gozo: toda pessoa tem (art. 1º).", "Capacidade de fato/exercício: os incapazes não têm.", "Direito + fato = CAPACIDADE CIVIL PLENA.", "Legitimação (ato específico) x legitimidade (processual) x personalidade."], "quiz": [{"q": "Qual a diferença entre capacidade de direito e capacidade de fato?", "options": ["De direito é ser sujeito de direitos (todos têm); de fato é exercê-los pessoalmente (nem todos têm)", "São sinônimos", "De fato todos têm; de direito só os maiores"], "answer": 0, "explain": "Capacidade de direito (de gozo) toda pessoa tem. Capacidade de fato (de exercício) é a de praticar pessoalmente os atos — os incapazes não a têm plenamente."}, {"q": "Capacidade de direito somada à capacidade de fato resulta em:", "options": ["Legitimação", "Personalidade jurídica formal", "Capacidade civil plena"], "answer": 2, "explain": "A fórmula do texto: capacidade de direito (gozo) + capacidade de fato (exercício) = capacidade civil plena."}, {"q": "A capacidade de direito, segundo o art. 1º do CC:", "options": ["Só existe para quem tem certidão de nascimento", "Toda pessoa tem, sem distinção", "Depende de decisão judicial"], "answer": 1, "explain": "“Toda pessoa é capaz de direitos e deveres na ordem civil” (art. 1º): havendo pessoa, há capacidade de direito, sem exigências formais."}, {"q": "O que é a “legitimação”?", "options": ["A capacidade processual", "A capacidade ESPECIAL para determinado ato (ex.: outorga conjugal para vender imóvel)", "A soma dos caracteres da pessoa"], "answer": 1, "explain": "Legitimação é a capacidade especial para um ato/negócio específico — ex.: outorga conjugal para vender imóvel (arts. 1.647, I, e 1.649 do CC)."}, {"q": "A “legitimidade”, no texto, corresponde a:", "options": ["A capacidade processual (condição da ação)", "A capacidade especial para um ato", "A personalidade"], "answer": 0, "explain": "Legitimidade é a capacidade processual, uma das condições da ação (art. 17 do CPC/2015)."}, {"q": "A frase “a capacidade é a medida da personalidade” significa que:", "options": ["Capacidade e personalidade são a mesma coisa", "A personalidade é a essência (quid) e a capacidade é o quantum", "A personalidade depende de registro"], "answer": 1, "explain": "Personalidade é a soma dos caracteres da pessoa (um quid, essência); a capacidade é a sua medida (um quantum)."}], "terms": [{"termo": "Capacidade de direito (gozo)", "definicao": "Aptidão para ser sujeito de direitos e deveres; toda pessoa tem (art. 1º).", "secao": "2.2.1"}, {"termo": "Capacidade de fato (exercício)", "definicao": "Aptidão para exercer pessoalmente os atos da vida civil; os incapazes não a têm plenamente.", "secao": "2.2.1"}, {"termo": "Capacidade civil plena", "definicao": "Soma da capacidade de direito com a capacidade de fato.", "secao": "2.2.1"}, {"termo": "Legitimação", "definicao": "Capacidade especial para um ato ou negócio específico (ex.: outorga conjugal para vender imóvel).", "secao": "2.2.1"}, {"termo": "Legitimidade", "definicao": "Capacidade processual; uma das condições da ação.", "secao": "2.2.1"}, {"termo": "Personalidade", "definicao": "A soma dos caracteres da pessoa; a capacidade é a “medida” da personalidade.", "secao": "2.2.1"}], "blocks": ["O Código Civil de 2002, a exemplo de seu antecessor, cuida primeiro da pessoa natural como sujeito de direito, entre os seus arts. 1.º a 39. Consigne-se que a atual codificação não reproduziu o preceito geral de seu conteúdo, constante do art. 1.º do CC/1916 o que, de fato, é dispensável (“Art. 1.º Este Código regula os direitos e obrigações de ordem privada concernentes às pessoas, aos bens e às suas relações”).", "Como dispositivo inaugural da norma privada, enuncia o art. 1.º do CC/2002 que “toda pessoa é capaz de direitos e deveres na ordem civil”. Três constatações pontuais podem ser retiradas do comando legal.", "A primeira é que o artigo não faz mais menção a homem, como constava do art. 2.º do Código Civil, adaptando-se à Constituição Federal, que consagra a dignidade da pessoa humana (art. 1.º, inc. III), assim como fez o art. 8.º do vigente Código de Processo Civil. Trata-se de conquista do movimento feminista, uma das mobilizações efetivas que inaugurou a pós-modernidade jurídica.", "A segunda constatação diz respeito à menção a deveres e não obrigações, como do mesmo modo constava do art. 2.º do CC/1916. Isso porque existem deveres que não são obrigacionais, em um sentido patrimonializado, caso dos deveres que decorrem da boa-fé.", "Terceira, ao mencionar a pessoa na ordem civil, há um sentido de socialidade, como pregava Miguel Reale.", "Anote-se que o Projeto de Reforma do Código Civil pretende incluir nesse dispositivo um parágrafo único, tratando da personalidade internacional, conceito importante para resolver vários dilemas da atualidade, sobretudo para a proteção de direitos da personalidade e fundamentais de estrangeiros no território nacional, no âmbito das relações privadas. Assim, consoante a regra projetada, “nos termos dos tratados internacionais dos quais o País é signatário, reconhece-se personalidade internacional a todas as pessoas naturais em território nacional, garantindo-lhes direitos, deveres e liberdades fundamentais” (proposta de parágrafo único ao art. 1.º do Código Civil). Penso ser louvável a proposta, que deve ser aprovada pelo Congresso Nacional.", "A norma em questão trata ainda da capacidade de direito ou de gozo, que é aquela para ser sujeito de direitos e deveres na ordem privada, e que todas as pessoas têm sem distinção. Em suma, havendo pessoa, está presente tal capacidade, não importando questões formais como ausência de certidão de nascimento ou de documentos.", "É notório que existe ainda outra capacidade, aquela para exercer direitos, denominada como capacidade de fato ou de exercício, e que algumas pessoas não têm. São os incapazes, especificados pelos arts. 3.º e 4.º do CC/2002, e que receberão estudo em tópico próprio. A propósito, advirta-se de imediato que a teoria das incapacidades sofreu grandes alterações estruturais com a emergência do Estatuto da Pessoa com Deficiência, instituído pela Lei 13.146, de julho de 2015. A fórmula a seguir demonstra a questão da capacidade da pessoa natural:", "CAPACIDADE DE DIREITO (GOZO) + CAPACIDADE DE FATO (EXERCÍCIO) = CAPACIDADE CIVIL PLENA", "Repise-se que todas as pessoas têm a primeira capacidade, o que pressupõe a segunda, em regra, uma vez que a incapacidade é exceção.", "O estudioso deve estar atento para os conceitos correlatos à capacidade da pessoa natural, a seguir expostos:", "a) Legitimação – capacidade especial para determinado ato ou negócio jurídico. Como primeiro exemplo, cite-se a necessidade de outorga conjugal para vender imóvel, sob pena de anulabilidade do contrato (arts. 1.647, inc. I, e 1.649 do CC). Outro exemplo envolve a venda de ascendente a descendente, havendo necessidade de autorização dos demais descendentes e do cônjuge do alienante, mais uma vez sob pena de anulabilidade (art. 496 do CC).", "b) Legitimidade – é a capacidade processual, uma das condições da ação (art. 3.º do CPC/1973, repetido parcialmente pelo art. 17 do CPC/2015). Constata-se que o próprio legislador utiliza os termos legitimação e legitimidade como sinônimos. Exemplificando, o art. 12, parágrafo único, do CC/2002, trata dos legitimados processualmente para as medidas de tutela dos interesses do morto, fazendo uso do termo legitimação. O certo seria mencionar a legitimidade.", "c) Personalidade – é a soma de caracteres da pessoa, ou seja, aquilo que ela é para si e para a sociedade. Afirma-se doutrinariamente que a capacidade é a medida da personalidade, ou seja, “a personalidade é um quid (substância, essência) e a capacidade um quantum”.<sup class=\"fn\" title=\"Nota 26 do original — o texto da nota não faz parte deste trecho (Parte I)\">26</sup>", "Encerrado o estudo de tais conceitos iniciais, parte-se para a abordagem sobre o início da personalidade civil."]}, {"num": "2.2.2", "title": "2.2.2 O início da personalidade civil. A situação jurídica do nascituro", "resumo": "O art. 2º do CC diz: “a personalidade civil da pessoa começa do nascimento com vida; mas a lei põe a salvo, desde a concepção, os direitos do nascituro”. Nascituro é o já concebido que ainda não nasceu. A grande polêmica é sua personalidade, com três teorias: natalista (só há pessoa com o nascimento; o nascituro teria mera expectativa de direitos), da personalidade condicional (a personalidade começa no nascimento, mas os direitos ficam sob condição suspensiva) e concepcionista (o nascituro é pessoa e tem direitos desde a concepção). A concepcionista prevalece na doutrina contemporânea e na jurisprudência do STJ (ex.: dano moral e DPVAT ao nascituro). Temas ligados: alimentos gravídicos (Lei 11.804/2008) e a proteção do embrião (Lei de Biossegurança; ADIn 3.510).", "pontos": ["Art. 2º: personalidade começa do nascimento com vida; direitos do nascituro a salvo desde a concepção.", "Três teorias: natalista, da personalidade condicional e concepcionista.", "A concepcionista prevalece (doutrina e STJ).", "Nascituro ≠ embrião; natimorto também tem direitos da personalidade (Enunciado 1 CJF)."], "quiz": [{"q": "O que diz o art. 2º do Código Civil sobre o início da personalidade?", "options": ["A personalidade começa com o registro de nascimento", "A personalidade civil começa do nascimento com vida; mas a lei põe a salvo, desde a concepção, os direitos do nascituro", "A personalidade começa aos 18 anos"], "answer": 1, "explain": "Art. 2º: “a personalidade civil da pessoa começa do nascimento com vida; mas a lei põe a salvo, desde a concepção, os direitos do nascituro”."}, {"q": "Quem é o nascituro?", "options": ["O recém-nascido", "Aquele que já foi concebido, mas ainda não nasceu", "O embrião congelado apenas"], "answer": 1, "explain": "Nascituro é aquele que foi concebido, mas ainda não nasceu."}, {"q": "Segundo a teoria natalista, o nascituro:", "options": ["É pessoa desde a concepção", "Não é pessoa; tem mera expectativa de direitos", "Tem personalidade condicional"], "answer": 1, "explain": "Para a natalista, o nascituro não é pessoa (a personalidade exige nascimento com vida); teria mera expectativa de direitos."}, {"q": "Na teoria da personalidade condicional, os direitos do nascituro ficam sujeitos a:", "options": ["Uma condição suspensiva (o nascimento com vida)", "Um termo final", "Nenhuma condição"], "answer": 0, "explain": "Para essa teoria, a personalidade começa com o nascimento, mas os direitos do nascituro ficam sob condição suspensiva — o próprio nascimento com vida (art. 130 do CC)."}, {"q": "Segundo a teoria concepcionista, que prevalece hoje, o nascituro:", "options": ["Tem mera expectativa de direitos", "É pessoa e tem direitos desde a concepção", "Só adquire direitos após o registro"], "answer": 1, "explain": "A concepcionista sustenta que o nascituro é pessoa e tem direitos resguardados desde a concepção — posição majoritária na doutrina e no STJ."}, {"q": "Qual é a principal crítica de Tartuce à teoria natalista?", "options": ["Reconhece direitos demais ao nascituro", "Se o nascituro não é pessoa, ele seria uma coisa? — e nega-lhe direitos da personalidade", "Confunde nascituro com embrião"], "answer": 1, "explain": "A natalista não responde: se o nascituro não tem personalidade, seria uma coisa? Além disso, nega-lhe direitos da personalidade (vida, alimentos, nome)."}, {"q": "A quem a teoria concepcionista reconhece direitos da personalidade (nome, imagem, sepultura), pelo Enunciado 1 do CJF?", "options": ["Apenas ao já nascido", "Também ao natimorto", "Apenas ao embrião"], "answer": 1, "explain": "O Enunciado 1 do CJF: a proteção do nascituro alcança o natimorto quanto aos direitos da personalidade — nome, imagem e sepultura."}, {"q": "Como Maria Helena Diniz classifica a personalidade jurídica?", "options": ["Em formal (direitos da personalidade, desde a concepção) e material (patrimoniais, com o nascimento)", "Em ativa e passiva", "Em pública e privada"], "answer": 0, "explain": "Ela distingue personalidade formal (direitos da personalidade, que o nascituro tem desde a concepção) e material (patrimoniais, adquirida com o nascimento), filiando-se à concepcionista."}, {"q": "A Lei 11.804/2008 (alimentos gravídicos) é criticada por Silmara Chinellato porque:", "options": ["É inconstitucional", "O titular do direito seria o nascituro, e não a mãe (o nome “gravídicos” seria impróprio)", "Proíbe alimentos na gravidez"], "answer": 1, "explain": "A crítica é que a lei parte de premissa errada: o titular do direito é o nascituro, e não a mãe; “alimentos gravídicos” seria neologismo inaceitável."}], "terms": [{"termo": "Nascituro", "definicao": "Aquele que já foi concebido, mas ainda não nasceu.", "secao": "2.2.2"}, {"termo": "Natimorto", "definicao": "Aquele que nasce sem vida; tem resguardados direitos da personalidade (nome, imagem, sepultura — Enunciado 1 CJF).", "secao": "2.2.2"}, {"termo": "Embrião", "definicao": "Ser concebido fora do ventre (in vitro/crioconservado); protegido pela Lei de Biossegurança.", "secao": "2.2.2"}, {"termo": "Teoria natalista", "definicao": "O nascituro não é pessoa; tem mera expectativa de direitos (a personalidade só começa com o nascimento).", "secao": "2.2.2"}, {"termo": "Teoria da personalidade condicional", "definicao": "A personalidade começa no nascimento, mas os direitos do nascituro ficam sob condição suspensiva.", "secao": "2.2.2"}, {"termo": "Teoria concepcionista", "definicao": "O nascituro é pessoa e tem direitos desde a concepção; prevalece na doutrina e no STJ.", "secao": "2.2.2"}, {"termo": "Condição suspensiva", "definicao": "Elemento que subordina a eficácia do negócio a evento futuro e incerto (aqui, o nascimento com vida).", "secao": "2.2.2"}, {"termo": "Alimentos gravídicos", "definicao": "Alimentos da gestante (Lei 11.804/2008) para cobrir despesas da concepção ao parto; a doutrina critica o nome.", "secao": "2.2.2"}], "blocks": ["A respeito do início da personalidade, enuncia o art. 2.º do atual Código Civil que “a personalidade civil da pessoa começa do nascimento com vida; mas a lei põe a salvo, desde a concepção, os direitos do nascituro”. A norma praticamente repete o já reticente art. 4.º do CC/1916.", "Como é notório, o nascituro é aquele que foi concebido, mas ainda não nasceu. Parece ser mais correta a tese, encabeçada pela Professora Titular da USP Silmara Juny Chinellato, de que a proteção referente ao nascituro abrange também o embrião pré-implantatório in vitro ou crioconservado, ou seja, aquele que não foi introduzido no ventre materno.<sup class=\"fn\" title=\"Nota 27 do original — o texto da nota não faz parte deste trecho (Parte I)\">27</sup>", "Todavia, a questão não é pacífica, pois há corrente liderada por Maria Helena Diniz que deduz que o embrião não está abrangido pelo art. 2.º do CC/2002, uma vez que se diferencia do nascituro por ter vida extrauterina.<sup class=\"fn\" title=\"Nota 28 do original — o texto da nota não faz parte deste trecho (Parte I)\">28</sup> Justamente por isso, o antigo Projeto de Lei Ricardo Fiuza (antigos PL 6.960/2002 e PL 699/2011) pretendia incluir no comando a menção expressa ao embrião, encerrando a polêmica doutrinária.", "Mas a maior controvérsia existente não é essa, e sim a referente à personalidade civil do nascituro, uma vez que o art. 2.º do CC/2002 continua colocando em colisão as teorias natalistas e concepcionistas. A polêmica não foi encerrada pelo fato de a norma continuar a utilizar os termos nascimento e concepção. Na primeira parte, o artigo parece indicar que o nascituro não é pessoa, não tendo direito. Entretanto, na sua segunda parte afirma o contrário.", "Para dirimir dúvidas, realizar pesquisa científica e aprofundar o seu estudo, escrevi artigo sobre o tema intitulado A situação jurídica do nascituro: uma página a ser virada no Direito Brasileiro.<sup class=\"fn\" title=\"Nota 29 do original — o texto da nota não faz parte deste trecho (Parte I)\">29</sup> Nesse trabalho de pesquisa, onde constam todas as referências bibliográficas, foram encontradas três correntes que procuraram justificar a situação do nascituro, que passam a ser expostas de forma pontual, com a citação também a outros autores, pesquisados após sua elaboração.", "a) Teoria natalista", "A teoria natalista prevalecia entre os autores modernos ou clássicos do Direito Civil Brasileiro, para quem o nascituro não poderia ser considerado pessoa, pois o Código Civil exigia e ainda exige, para a personalidade civil, o nascimento com vida. Assim sendo, o nascituro não teria direitos, mas mera expectativa de direitos. Como adeptos dessa corrente, da doutrina tradicional, podem ser citados Silvio Rodrigues, Caio Mário da Silva Pereira e San Tiago Dantas. Na doutrina contemporânea, filiam-se a essa corrente Sílvio de Salvo Venosa e Anderson Schreiber, o último no nosso Código Civil Comentado.<sup class=\"fn\" title=\"Nota 30 do original — o texto da nota não faz parte deste trecho (Parte I)\">30</sup> Partem esses autores de uma interpretação literal e simplificada da lei, que dispõe que a personalidade jurídica começa com o nascimento com vida, o que traz a conclusão de que o nascituro não é pessoa.", "O grande problema da teoria natalista é que ela não consegue responder à seguinte constatação e pergunta: se o nascituro não tem personalidade, não é pessoa; desse modo, o nascituro seria uma coisa? A resposta acaba sendo positiva a partir da primeira constatação de que haveria apenas expectativa de direitos. Além disso, a teoria natalista está totalmente distante do surgimento das novas técnicas de reprodução assistida e da proteção dos direitos do embrião. Também está distante de uma proteção ampla de direitos da personalidade, tendência do Direito Civil pós-moderno.", "Do ponto de vista prático, a teoria natalista nega ao nascituro até mesmo os seus direitos fundamentais, relacionados com a sua personalidade, caso do direito à vida, à investigação de paternidade, aos alimentos, ao nome e até à imagem. Com essa negativa, a teoria natalista esbarra em dispositivos do Código Civil que consagram direitos àquele que foi concebido e não nasceu. Essa negativa de direitos é mais um argumento forte para sustentar a total superação dessa corrente doutrinária.", "b) Teoria da personalidade condicional", "A teoria da personalidade condicional é aquela pela qual a personalidade civil começa com o nascimento com vida, mas os direitos do nascituro estão sujeitos a uma condição suspensiva, ou seja, são direitos eventuais. Como se sabe, a condição suspensiva é o elemento acidental do negócio ou ato jurídico que subordina a sua eficácia a evento futuro e incerto. No caso, a condição é justamente o nascimento daquele que foi concebido. Como fundamento da tese e da existência de direitos sob condição suspensiva, pode ser citado o art. 130 do atual Código Civil. Como entusiastas desse posicionamento, podem ser citados Washington de Barros Monteiro, Miguel Maria de Serpa Lopes e Clóvis Beviláqua, supostamente. Diz-se supostamente quanto ao último jurista, pois, apesar de ter inserido tal teoria no Código Civil de 1916, afirmava que “parece mais lógico afirmar francamente, a personalidade do nascituro”.<sup class=\"fn\" title=\"Nota 31 do original — o texto da nota não faz parte deste trecho (Parte I)\">31</sup> Na doutrina atual, Arnaldo Rizzardo segue o entendimento da teoria da personalidade condicional.", "O grande problema da corrente doutrinária é que ela é apegada a questões patrimoniais, não respondendo ao apelo de direitos pessoais ou da personalidade a favor do nascituro. Ressalte-se, por oportuno, que os direitos da personalidade não podem estar sujeitos a condição, termo ou encargo, como propugna a corrente. Além disso, essa linha de entendimento acaba reconhecendo que o nascituro não tem direitos efetivos, mas apenas direitos eventuais sob condição suspensiva, ou seja, também mera expectativa de direitos.", "Na verdade, com devido respeito ao posicionamento em contrário, consideramos que a teoria da personalidade condicional é essencialmente natalista, pois também parte da premissa de que a personalidade tem início com o nascimento com vida. Não há, portanto, uma teoria mista, como querem alguns. Por isso, em uma realidade que prega a personalização do Direito Civil, uma tese essencialmente patrimonialista não pode prevalecer.<sup class=\"fn\" title=\"Nota 32 do original — o texto da nota não faz parte deste trecho (Parte I)\">32</sup>", "c) Teoria concepcionista", "A teoria concepcionista é aquela que sustenta que o nascituro é pessoa humana, tendo direitos resguardados pela lei. Esse é o entendimento defendido por Silmara Juny Chinellato (a principal precursora da tese no Brasil), Pontes de Miranda, Rubens Limongi França, Giselda Maria Fernandes Novaes Hironaka, Pablo Stolze Gagliano e Rodolfo Pamplona Filho, Roberto Senise Lisboa, José Fernando Simão, Cristiano Chaves de Farias e Nelson Rosenvald, Francisco Amaral, Guilherme Calmon Nogueira da Gama, Antonio Junqueira de Azevedo, Gustavo Rene Nicolau, Renan Lotufo e Maria Helena Diniz. Em sua obra sobre a Parte Geral do Código Civil de 2002, lançada no ano de 2012, o meu Mestre Álvaro Villaça Azevedo também expõe que o correto é sustentar que a personalidade é adquirida desde a concepção.<sup class=\"fn\" title=\"Nota 33 do original — o texto da nota não faz parte deste trecho (Parte I)\">33</sup>", "A maioria dos autores citados aponta que a origem da teoria está no Esboço de Código Civil elaborado por Teixeira de Freitas, pela previsão constante do art. 1.º da sua Consolidação das Leis Civis, segundo o qual “as pessoas consideram-se como nascidas apenas formadas no ventre materno; a Lei lhes conserva seus direitos de sucessão ao tempo de nascimento”. Como é notório, esse Esboço inspirou o anterior Código Civil argentino, que adotava expressamente a teoria concepcionista. O Novo Código Civil e Comercial Argentino, em vigor a partir de 2015 naquele País, confirma a premissa, enunciando, em seu art. 19, que a existência da pessoa humana começa com a concepção.", "Consigne-se que a conclusão pela corrente concepcionista consta do Enunciado n. 1, do Conselho da Justiça Federal (CJF), aprovado na I Jornada de Direito Civil, e que também enuncia direitos ao natimorto, cujo teor segue: “Art. 2.º A proteção que o Código defere ao nascituro alcança o natimorto no que concerne aos direitos da personalidade, tais como nome, imagem e sepultura”.", "Sobre essa tutela específica do natimorto, a propósito, quando da II Jornada de Prevenção e Solução Extrajudicial dos Litígios, promovida pelo mesmo Conselho da Justiça Federal em 2021, aprovou-se o Enunciado n. 124, segundo o qual “é direito dos genitores o registro do natimorto com inclusão de nome e demais elementos de registro, independentemente de ordem judicial, sempre que optarem por seu sepultamento, nas hipóteses em que tal providência não for obrigatória”. No mesmo sentido, o Enunciado n. 2 da I Jornada de Direito Notarial e Registral, de agosto de 2022: “não obstante a ausência de previsão legal, é facultado aos pais a atribuição de nome ao natimorto, a ser incluído em registro que deverá ser realizado no Livro C-Auxiliar”.", "Seguindo tais recomendações doutrinárias, em 2023, o Conselho Nacional de Justiça regulamentou esse registro, por força do seu Provimento n. 151, depois incorporado ao Código Nacional de Normas (CNN). Consoante o seu art. 479-A, é direito dos pais atribuir, se quiserem, nome ao natimorto, devendo o registro ser realizado no Livro C-Auxiliar, no Cartório de Registro das Pessoas Naturais, com índice elaborado a partir dos nomes dos pais. Também está previsto na norma que não será gerado Cadastro de Pessoa Física (CPF) ao natimorto; sendo assegurado aos pais o direito à averbação do nome no caso de registros de natimorto anteriormente lavrado, sem essa informação. Para a composição do nome do natimorto, devem ser observadas as mesmas regras observadas quando do registro de nascimento.", "Também há regra no sentido de que se a criança, embora tenha nascido viva, morrer por ocasião do parto, serão feitos, necessariamente na mesma serventia do Cartório de Registro Civil das Pessoas Naturais, dois assentos, o de nascimento e o de óbito, com os elementos cabíveis e remissões recíprocas (art. 479-B do Código Nacional de Normas).", "Em 2025, após essa ampla regulamentação administrativa, surgiu a Lei 15.139, que institui a Política Nacional de Humanização do Luto Materno e Parental, alterando a Lei 6.015/1973, para tratar justamente sobre o registro de criança nascida morta. Nesse contexto, sem prejuízo de outras disposições, o art. 53 da Lei de Registros Públicos recebeu novos §§ 3.º e 4.º, prevendo que é direito dos pais atribuir nome ao natimorto; e que se aplicam à composição do nome do natimorto as disposições relativas ao registro de nascimento.", "Como se pode notar, a teoria concepcionista é aquela que prevalece entre os doutrinadores contemporâneos do Direito Civil Brasileiro. Para essa corrente, o nascituro tem direitos reconhecidos desde a concepção. Quanto à Professora Maria Helena Diniz, há que se fazer um aparte, pois alguns autores a colocam como seguidora da tese natalista, o que não é verdade. A renomada doutrinadora, em construção interessante, classifica a personalidade jurídica em formal e material, a saber:", "– Personalidade jurídica formal – é aquela relacionada com os direitos da personalidade, o que o nascituro já tem desde a concepção.", "– Personalidade jurídica material – mantém relação com os direitos patrimoniais, e o nascituro só a adquire com o nascimento com vida, segundo a doutrinadora.", "A jurista afirma expressamente que a razão está com a teoria concepcionista, filiando-se a tal corrente teórica.<sup class=\"fn\" title=\"Nota 34 do original — o texto da nota não faz parte deste trecho (Parte I)\">34</sup>", "A corrente concepcionista tem também prevalecido na jurisprudência do Superior Tribunal de Justiça, sobretudo para os fins do Direito Civil. De início, em notório julgado foi reconhecido dano moral ao nascituro, pela morte de seu pai ocorrida antes do seu nascimento:", "“Direito civil. Danos morais. Morte. Atropelamento. Composição férrea. Ação ajuizada 23 anos após o evento. Prescrição inexistente. Influência na quantificação do quantum. Precedentes da turma. Nascituro. Direito aos danos morais. Doutrina. Atenuação. Fixação nesta instância. Possibilidade. Recurso parcialmente provido. I – Nos termos da orientação da Turma, o direito à indenização por dano moral não desaparece com o decurso de tempo (desde que não transcorrido o lapso prescricional), mas é fato a ser considerado na fixação do quantum. II – O nascituro também tem direito aos danos morais pela morte do pai, mas a circunstância de não tê-lo conhecido em vida tem influência na fixação do quantum. III – Recomenda-se que o valor do dano moral seja fixado desde logo, inclusive nesta instância, buscando dar solução definitiva ao caso e evitando inconvenientes e retardamento da solução jurisdicional” (STJ, REsp 399.028/SP, 4.ª Turma, Rel. Min. Sálvio de Figueiredo Teixeira, j. 26.02.2002, DJ 15.04.2002, p. 232).", "Anote-se que tal entendimento é perfilhado por outros arestos de datas mais próximas da mesma Corte Superior, que confirmam a teoria concepcionista (por todos: STJ, AgRg no AgRg no AREsp 150.297/DF, 3.ª Turma, Rel. Min. Sidnei Beneti, j. 19.02.2013, DJe 07.05.2013).", "Como outra ilustração, em 2015 reconheceu-se a presença de danos morais ao nascituro pela infeliz afirmação feita pelo humorista Rafinha Bastos no programa CQC, em relação à cantora Wanessa Camargo, então grávida, e seu filho (STJ, REsp 1.487.089/ SP, 4.ª Turma, Rel. Min. Marco Buzzi, j. 23.06.2015). Apesar de certa divergência no julgamento sobre a personalidade do nascituro, acredito tratar-se de clara incidência da teoria concepcionista.", "A mesma premissa foi adotada pelo STJ em outro julgado em que o nascituro foi tratado de forma igual em relação aos outros filhos já nascidos, em caso envolvendo acidente do trabalho que vitimou o seu pai:", "“Responsabilidade civil. Acidente do trabalho. Morte. Indenização por dano moral. Filho nascituro. Fixação do quantum Indenizatório. Dies a quo. Correção monetária. Data da fixação pelo juiz. Juros de mora. Data do evento danoso. Processo civil. Juntada de documento na fase recursal. Possibilidade, desde que não configurada A má-fé da parte e oportunizado o contraditório. Anulação do processo. Inexistência de dano. Desnecessidade. Impossível admitir-se a redução do valor fixado a título de compensação por danos morais em relação ao nascituro, em comparação com outros filhos do de cujus, já nascidos na ocasião do evento morte, porquanto o fundamento da compensação é a existência de um sofrimento impossível de ser quantificado com precisão. – Embora sejam muitos os fatores a considerar para a fixação da satisfação compensatória por danos morais, é principalmente com base na gravidade da lesão que o juiz fixa o valor da reparação. (...)” (STJ, REsp 931.556/RS, 3.ª Turma, Rel. Min. Nancy Andrighi, j. 17.06.2008, DJe 05.08.2008).", "Igualmente seguindo a teoria concepcionista – apesar de confusões no corpo do julgado – a Terceira Turma do Superior Tribunal de Justiça reconheceu, em 2010, que cabe pagamento de indenização do antigo seguro obrigatório por acidente de trânsito (DPVAT) pela morte do nascituro. Como se percebe, o feto foi tratado pelo acórdão como pessoa humana, o que é merecedor de elogios:", "“Recurso especial. Direito securitário. Seguro DPVAT. Atropelamento de mulher grávida. Morte do feto. Direito à indenização. Interpretação da Lei n. 6194/74. 1. Atropelamento de mulher grávida, quando trafegava de bicicleta por via pública, acarretando a morte do feto quatro dias depois com trinta e cinco semanas de gestação. 2. Reconhecimento do direito dos pais de receberem a indenização por danos pessoais, prevista na legislação regulamentadora do seguro DPVAT, em face da morte do feto. 3. Proteção conferida pelo sistema jurídico à vida intrauterina, desde a concepção, com fundamento no princípio da dignidade da pessoa humana. 4. Interpretação sistemático--teleológica do conceito de danos pessoais previsto na Lei n. 6.194/74 (arts. 3.º e 4.º). 5. Recurso especial provido, vencido o relator, julgando-se procedente o pedido” (STJ, REsp 1120676/SC, 3.ª Turma, Rel. Min. Massami Uyeda, Rel. p/ Acórdão Min. Paulo de Tarso Sanseverino, j. 07.12.2010, DJe 04.02.2011).", "A adoção da linha concepcionista foi confirmada em julgamento da sua Quarta Turma e de 2014, publicado no Informativo n. 547 da Corte Superior. Consta expressamente da sua publicação que “o ordenamento jurídico como um todo (e não apenas o CC) alinhou-se mais à teoria concepcionista – para a qual a personalidade jurídica se inicia com a concepção, muito embora alguns direitos só possam ser plenamente exercitáveis com o nascimento, haja vista que o nascituro é pessoa e, portanto, sujeito de direitos – para a construção da situação jurídica do nascituro, conclusão enfaticamente sufragada pela majoritária doutrina contemporânea. Além disso, apesar de existir concepção mais restritiva sobre os direitos do nascituro, amparada pelas teorias natalista e da personalidade condicional, atualmente há de se reconhecer a titularidade de direitos da personalidade ao nascituro, dos quais o direito à vida é o mais importante, uma vez que garantir ao nascituro expectativas de direitos, ou mesmo direitos condicionados ao nascimento, só faz sentido se lhe for garantido também o direito de nascer, o direito à vida, que é direito pressuposto a todos os demais. Portanto, o aborto causado pelo acidente de trânsito subsume-se ao comando normativo do art. 3.º da Lei 6.194/1974, haja vista que outra coisa não ocorreu, senão a morte do nascituro, ou o perecimento de uma vida intrauterina” (STJ, REsp 1.415.727/SC, Rel. Min. Luis Felipe Salomão, j. 04.09.2014).", "Este último aresto adota expressamente a teoria concepcionista, citando todos os doutrinadores que são filiados a essa corrente. Pode-se afirmar, na verdade, que o Superior Tribunal de Justiça, em sua atual composição, segue o caminho de tutelar o nascituro como pessoa humana, especialmente no âmbito das relações privadas e dos direitos de personalidade.", "O debate das teorias relativas ao nascituro ganhou reforço com a entrada em vigor no Brasil da Lei 11.804, de 5 de novembro de 2008, conhecida como Lei dos Alimentos Gravídicos, disciplinando o direito de alimentos da mulher gestante (art. 1.º). Os citados alimentos gravídicos, nos termos da lei, devem compreender os valores suficientes para cobrir as despesas adicionais do período de gravidez e que sejam dele decorrentes, da concepção ao parto, inclusive as referentes a alimentação especial, assistências médica e psicológica, exames complementares, internações, parto, medicamentos e demais prescrições preventivas e terapêuticas indispensáveis, a juízo do médico, além de outras que o juiz considere pertinentes (art. 2.º). Em verdade, a norma emergente em nada inova, diante dos inúmeros julgados que deferiam alimentos durante a gravidez ao nascituro (nesse sentido, ver, por exemplo: TJMG, Agravo 1.0000.00.207040-7/000, 4.ª Câmara Cível, Araxá, Rel. Des. Almeida Melo, j. 1.º.03.2001, DJMG 05.04.2001).", "A respeito dessa norma específica, a sua terminologia é criticada por Silmara Juny Chinellato, principal precursora da teoria concepcionista no Brasil.<sup class=\"fn\" title=\"Nota 35 do original — o texto da nota não faz parte deste trecho (Parte I)\">35</sup> Em obra mais atual pontua a jurista:", "“A recente Lei 11.804, de 5 de novembro de 2008, que trata dos impropriamente denominados ‘alimentos gravídicos’ – desnecessário e inaceitável neologismo, pois alimentos são fi
