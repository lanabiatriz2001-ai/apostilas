<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cap. II · Parte I — Material de estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fs:19px; --lh:1.75; --measure:64ch;
  --sans:"Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --grad:linear-gradient(135deg,#6d5efc 0%,#a24bff 48%,#ff5fa2 100%);
  --gap:clamp(16px,3vw,32px); --radius:22px;
}
html[data-theme="claro"]{
  --bg:#f3f5fd; --bg2:#eef1fb; --ink:#1b2036; --ink-soft:#5f6685; --line:#e4e7f5;
  --card:#ffffff; --accent:#6d5efc; --accent-ink:#5a4bf0;
  --shadow:0 10px 30px rgba(80,70,190,.10); --shadow-sm:0 4px 14px rgba(80,70,190,.08);
}
html[data-theme="escuro"]{
  --bg:#0f1120; --bg2:#151830; --ink:#eef0fb; --ink-soft:#9aa2c9; --line:#262a45;
  --card:#181b30; --accent:#8f81ff; --accent-ink:#a99dff;
  --shadow:0 12px 34px rgba(0,0,0,.45); --shadow-sm:0 6px 18px rgba(0,0,0,.4);
}
html[data-theme="sepia"]{
  --bg:#fbeede; --bg2:#f7e6cf; --ink:#3a2f22; --ink-soft:#7b6a4f; --line:#ecdcc0;
  --card:#fff7ea; --accent:#e06636; --accent-ink:#c4522a;
  --shadow:0 10px 28px rgba(150,100,40,.14); --shadow-sm:0 4px 14px rgba(150,100,40,.1);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.font-amigavel{--sans:"Verdana","Trebuchet MS","Comic Sans MS",sans-serif;letter-spacing:.01em}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth} .lift{transition:transform .16s ease,box-shadow .16s ease,border-color .16s}}
h1,h2,h3,h4{font-weight:800;line-height:1.18;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:11px 16px;max-width:1220px;margin:0 auto}
.brand{font-weight:800;font-size:1rem;margin-right:auto;display:flex;align-items:center;gap:11px}
.brand .mk{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:800;box-shadow:0 6px 16px rgba(120,80,240,.35)}
.iconbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;cursor:pointer;font-size:.85rem;font-weight:600;min-height:42px;display:inline-flex;align-items:center;gap:7px}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 8px 20px rgba(120,80,240,.32)}
.iconbtn.primary:hover{color:#fff;filter:brightness(1.05)}
.iconbtn:focus-visible,.qopt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progresswrap{height:4px;background:var(--line)} .progressbar{height:100%;width:0;background:var(--grad)}

.wrap{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--gap);padding:var(--gap) 16px 130px}
@media (max-width:960px){.wrap{grid-template-columns:1fr}}

/* TOC */
aside.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 98px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.toc h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin:.1rem .2rem .5rem}
.toc .prog{font-size:.82rem;color:var(--ink-soft);margin:0 .2rem .7rem;display:flex;align-items:center;gap:8px}
.toc .prog .pill{background:var(--grad);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.75rem}
.toclink{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:14px;cursor:pointer;color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:600}
.toclink:hover{background:var(--bg)}
.toclink.active{background:color-mix(in srgb,var(--sc) 12%,var(--card))}
.toclink .tnum{min-width:40px;flex:0 0 40px;text-align:center;font-weight:800;font-size:.74rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:9px;padding:4px 2px;font-variant-numeric:tabular-nums}
.toclink.sub{padding-left:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft)}
.toclink.sub .tnum{min-width:46px;flex-basis:46px;font-size:.7rem;opacity:.92}
.toclink.active .ttl{color:var(--sc)}
.toclink .check{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;font-size:11px;color:#fff;display:grid;place-items:center}
.toclink.read .check{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent}
.toclink.read .check::after{content:"✓"}
@media (max-width:960px){
  aside.toc{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);z-index:60;transform:translateX(-105%);transition:transform .22s;border-radius:0 var(--radius) var(--radius) 0;max-height:100vh}
  aside.toc.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,10,30,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
}
@media(min-width:961px){.scrim{display:none}.menu-only{display:none}}

main{min-width:0}
/* HERO */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:clamp(24px,4vw,44px);color:#fff;margin-bottom:var(--gap);
  background:linear-gradient(135deg,#6d5efc 0%,#9b45ff 42%,#ff5b9a 82%,#ff8f5f 100%);box-shadow:0 20px 50px rgba(110,70,230,.32)}
.hero::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.16);top:-140px;right:-80px;filter:blur(6px)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);bottom:-120px;left:20%}
.hero>*{position:relative;z-index:1}
.hero .kicker{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.92;margin:0 0 10px}
.hero h1{margin:.1rem 0;font-size:clamp(1.9rem,5vw,2.9rem);text-shadow:0 2px 10px rgba(60,20,90,.2)}
.hero .sub{font-size:1.08rem;opacity:.95;margin:.4rem 0 0;font-weight:500;max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.legend span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 13px;font-size:.82rem;font-weight:600}
.legend .sw{width:13px;height:13px;border-radius:4px}.legend .sw.orig{background:#fff;opacity:.7}.legend .sw.aid{background:#ffe08a}
.howto{margin-top:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:16px;padding:15px 18px;backdrop-filter:blur(4px)}
.howto b{font-weight:800} .howto ul{margin:.5rem 0 0;padding-left:1.1rem;font-size:.88rem;opacity:.96} .howto li{margin:.32rem 0}
.note-parte{margin-top:14px;background:rgba(255,255,255,.16);border-radius:16px;padding:13px 16px;font-size:.86rem;font-weight:500;border-left:5px solid #ffe08a}

/* SECTION */
.section{scroll-margin-top:84px;margin-bottom:calc(var(--gap)*1.5)}
.section .shead{display:flex;gap:15px;align-items:center;margin-bottom:6px}
.section .snum{flex:0 0 auto;min-width:58px;height:58px;padding:0 12px;border-radius:18px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.25rem;box-shadow:0 12px 26px color-mix(in srgb,var(--sc) 45%,transparent)}
.section .stitle{font-size:clamp(1.25rem,2.8vw,1.7rem);margin:0;letter-spacing:-.02em}
.section .hrule{height:5px;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2),transparent);margin:12px 0 18px}
.readbtn{margin-left:auto;align-self:center;white-space:nowrap}

.prosa{max-width:var(--measure)}
.prosa p{margin:1.05em 0}
.prosa p.quote{background:color-mix(in srgb,var(--sc) 9%,var(--card));border-left:5px solid var(--sc);padding:12px 18px;border-radius:6px 16px 16px 6px;font-size:.98rem;font-weight:500}
sup.fn{font-size:.62em;font-weight:800;color:var(--sc);cursor:help;padding:0 1px;vertical-align:super}
b.bi{font-weight:800}

.subsec{margin-top:30px}
.subsec .subhead{display:flex;gap:12px;align-items:center;margin:0 0 4px}
.subsec .subnum{flex:0 0 auto;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:11px;padding:5px 12px;font-weight:800;font-size:.9rem;box-shadow:var(--shadow-sm)}
.subsec .subtitle{font-size:1.2rem;margin:0;letter-spacing:-.01em}
.subsec .subrule{height:3px;border-radius:999px;background:linear-gradient(90deg,var(--c1),transparent);margin:8px 0 14px}

/* AIDS — colorful cards, gradient pill labels */
.aid{background:color-mix(in srgb,var(--sc) 7%,var(--card));border:1.5px solid color-mix(in srgb,var(--sc) 22%,var(--line));border-radius:20px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow-sm)}
.aid .tag{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 14px;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:11px;box-shadow:0 6px 16px color-mix(in srgb,var(--sc) 40%,transparent)}
.aid.resumo p{margin:.1rem 0 0;max-width:62ch}
.pontos{list-style:none;margin:.1rem 0 0;padding:0;display:grid;gap:10px}
.pontos li{display:flex;gap:12px;align-items:flex-start;font-size:.93rem;font-weight:500}
.pontos li::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));margin-top:.42em;flex:0 0 auto;box-shadow:0 2px 6px color-mix(in srgb,var(--sc) 45%,transparent)}
.terms{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px}
.chip{border:1.5px solid color-mix(in srgb,var(--sc) 30%,var(--line));background:color-mix(in srgb,var(--sc) 10%,var(--card));color:var(--sc);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:700;cursor:pointer}
.chip:hover{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
.termdef{margin-top:12px;font-size:.9rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:none;font-weight:500}
.termdef.show{display:block} .termdef b{color:var(--sc)}

.quiz .tag{background:linear-gradient(135deg,var(--c1),var(--c2))}
.qitem{margin:14px 0} .qitem:first-of-type{margin-top:4px}
.qq{font-weight:700;margin:0 0 10px;font-size:1rem}
.qq .qn{color:var(--sc);font-weight:800;margin-right:3px}
.qopts{display:grid;gap:8px}
.qo{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 13px;font-size:.9rem;font-weight:500;display:flex;gap:11px;align-items:center}
.qo .ql{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:color-mix(in srgb,var(--sc) 13%,var(--card));color:var(--sc);display:grid;place-items:center;font-weight:800;font-size:.85rem}
/* gabarito recolhível */
.gab{margin:16px 0;border:2px dashed color-mix(in srgb,var(--sc) 40%,var(--line));border-radius:18px;background:color-mix(in srgb,var(--sc) 6%,var(--card));overflow:hidden}
.gab>summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;align-items:center;gap:11px;font-weight:600}
.gab>summary::-webkit-details-marker{display:none}
.gab>summary::after{content:"▸";margin-left:auto;color:var(--sc);font-weight:800;transition:transform .15s}
.gab[open]>summary::after{transform:rotate(90deg)}
.gab .gtag{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 14px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.gab .ghint{color:var(--ink-soft);font-size:.83rem;font-weight:500}
.gablist{margin:0;padding:2px 20px 16px 44px;display:grid;gap:10px;font-size:.9rem;font-weight:500}
.gablist li{padding-left:4px} .gablist li::marker{color:var(--sc);font-weight:800}
.gablist b{color:var(--sc)}

/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(90vw,370px);background:var(--card);border-left:1px solid var(--line);z-index:70;transform:translateX(105%);transition:transform .22s;overflow:auto;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer .dhead{display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.drawer .dhead b{margin-right:auto;font-size:1.05rem}
.drawer .body{padding:16px;display:grid;gap:20px}
.ctl label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:13px;padding:9px;cursor:pointer;font-size:.86rem;font-weight:600}
.seg button.on{border-color:transparent;background:var(--grad);color:#fff}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw-row .lbl{font-size:.9rem;font-weight:600} .sw-row .lbl small{display:block;color:var(--ink-soft);font-size:.76rem;font-weight:400}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.16s}
.slider::before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.16s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--grad)} .switch input:checked + .slider::before{transform:translateX(22px)}

.ttsbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:65;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);display:none;align-items:center;gap:6px;padding:8px 12px}
.ttsbar.show{display:flex}
.ttsbar button{border:none;background:var(--bg2);color:var(--ink);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:1rem}
.ttsbar button:hover{background:var(--grad);color:#fff}
.ttsbar .lab{font-size:.8rem;color:var(--ink-soft);padding:0 8px;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.reading{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:10px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 32%,transparent)}

body.focus .prosa p{transition:opacity .2s} body.focus .prosa p:not(.pfocus){opacity:.24}
body.focus .prosa p.pfocus,body.focus .prosa p.reading{opacity:1}
.focusnav{position:fixed;right:16px;bottom:16px;z-index:64;display:none;flex-direction:column;gap:8px}
body.focus .focusnav{display:flex}
.focusnav button{width:54px;height:54px;border-radius:50%;border:none;background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(120,80,240,.4);cursor:pointer;font-size:1.4rem}

.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px}
.modal.open{display:flex}
.modal .mbg{position:absolute;inset:0;background:rgba(10,10,30,.5)}
.modal .mcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .mhead{position:sticky;top:0;background:var(--card);padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .mhead b{margin-right:auto;font-size:1.1rem}
.modal input.search{width:100%;padding:12px 15px;border:2px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);font-size:.92rem;font-weight:500}
.modal input.search:focus{outline:none;border-color:var(--accent)}
.gitem{padding:13px 18px;border-bottom:1px solid var(--line)}
.gitem .gt{font-weight:800} .gitem .gs{font-size:.72rem;color:#fff;background:var(--grad);border-radius:999px;padding:2px 9px;margin-left:8px;font-weight:700}
.gitem .gd{margin:5px 0 0;font-size:.9rem;color:var(--ink-soft);font-weight:500}
.backtop{position:fixed;right:16px;bottom:16px;z-index:50;border:none;background:var(--grad);color:#fff;border-radius:14px;padding:11px 15px;cursor:pointer;box-shadow:0 10px 24px rgba(120,80,240,.35);display:none;font-weight:700}
.backtop.show{display:block} @media(max-width:960px){.backtop{bottom:80px}}
</style></head>
<body>
<header class="top"><div class="top-in">
  <button class="iconbtn menu-only" id="btnMenu" aria-label="Índice">☰</button>
  <div class="brand"><span class="mk">II</span> Parte Geral · Pessoa Natural</div>
  <button class="iconbtn" id="btnGloss">📖 <span class="hide-sm">Glossário</span></button>
  <button class="iconbtn primary" id="btnSettings">Aa <span class="hide-sm">Ajustes</span></button>
</div><div class="progresswrap"><div class="progressbar" id="pbar"></div></div></header>

<div class="scrim" id="scrim"></div>
<div class="wrap">
  <aside class="toc" id="toc"><h2>Sumário</h2><div class="prog"><span class="pill" id="progPill">0/0</span> <span id="progText">seções lidas</span></div><nav id="tocNav"></nav></aside>
  <main id="main"></main>
</div>

<div class="drawer" id="drawer">
  <div class="dhead"><b>Ajustes de leitura</b><button class="iconbtn" id="btnCloseDrawer">✕</button></div>
  <div class="body">
    <div class="ctl"><label>Tema</label><div class="seg" id="segTheme">
      <button data-theme="claro" class="on">☀️ Claro</button><button data-theme="sepia">🌼 Creme</button><button data-theme="escuro">🌙 Escuro</button></div></div>
    <div class="ctl"><label>Tamanho do texto</label><div class="seg" id="segFs">
      <button data-fs="16">A</button><button data-fs="19" class="on">A</button><button data-fs="22">A</button><button data-fs="26">A</button></div></div>
    <div class="ctl"><label>Espaçamento</label><div class="seg" id="segLh">
      <button data-lh="1.5">Compacto</button><button data-lh="1.75" class="on">Médio</button><button data-lh="2.1">Amplo</button></div></div>
    <div class="ctl"><label>Largura da coluna</label><div class="seg" id="segMeasure">
      <button data-measure="52ch">Estreita</button><button data-measure="64ch" class="on">Média</button><button data-measure="82ch">Larga</button></div></div>
    <div class="sw-row"><div class="lbl">Fonte amigável<small>Espaçada, p/ dislexia</small></div><label class="switch"><input type="checkbox" id="swFont"><span class="slider"></span></label></div>
    <div class="sw-row"><div class="lbl">Leitura biônica<small>Início das palavras em negrito</small></div><label class="switch"><input type="checkbox" id="swBionic"><span class="slider"></span></label></div>
    <div class="sw-row"><div class="lbl">Modo foco<small>Um parágrafo por vez</small></div><label class="switch"><input type="checkbox" id="swFocus"><span class="slider"></span></label></div>
    <div class="ctl"><label>Velocidade da leitura em voz alta</label><div class="seg" id="segRate">
      <button data-rate="0.8">Devagar</button><button data-rate="1" class="on">Normal</button><button data-rate="1.25">Rápido</button></div></div>
    <button class="iconbtn" id="btnReset" style="width:100%">↺ Restaurar padrões</button>
    <p style="font-size:.76rem;color:var(--ink-soft);margin:0">Preferências e progresso ficam salvos neste navegador.</p>
  </div>
</div>

<div class="modal" id="modalGloss"><div class="mbg" data-close></div><div class="mcard">
  <div class="mhead"><b>📖 Glossário</b><button class="iconbtn" data-close>✕</button></div>
  <div style="padding:14px 18px"><input class="search" id="gSearch" placeholder="Buscar termo… (ex.: nascituro, cláusula geral)"></div>
  <div id="glist"></div></div></div>

<div class="ttsbar" id="ttsbar"><button id="ttsPrev">⏮</button><button id="ttsToggle">⏸</button><button id="ttsStop">⏹</button><span class="lab" id="ttsLab">Lendo…</span></div>

<script>const DATA={"title": "CAPÍTULO II — PARTE I", "subtitle": "Visão filosófica do Código Civil de 2002 · Da pessoa natural", "hues": {"2.1": 258, "2.1.1": 210, "2.1.2": 168, "2.1.3": 32, "2.1.4": 342, "2.1.5": 280, "2.2": 300, "2.2.1": 190, "2.2.2": 140, "2.2.3": 18, "2.2.4": 224, "2.2.5": 322}, "sections": [{"num": "2.1", "title": "2.1 INTRODUÇÃO. VISÃO FILOSÓFICA DO CÓDIGO CIVIL DE 2002. AS PRINCIPAIS TESES DO DIREITO CIVIL CONTEMPORÂNEO", "resumo": "Para entender o Código Civil de 2002 não basta comparar artigos com o de 1916: é preciso conhecer sua linha filosófica. O projeto nasceu nos anos 1970 (comissão coordenada por Miguel Reale) e o Código assenta-se em três princípios: eticidade (valorização da ética e da boa-fé objetiva), socialidade (superação do individualismo — o “eu” vira “nós”) e operabilidade (simplicidade + efetividade, via cláusulas gerais). A grande diferença de filosofia frente ao Código de 1916 é a adoção de cláusulas gerais (“janelas abertas”), que se distinguem dos conceitos legais indeterminados. Tudo isso decorre da ontognoseologia de Reale — culturalismo jurídico (cultura, experiência, história) e teoria tridimensional (direito é fato, valor e norma) —, em oposição à visão fechada de Kelsen (“o juiz é a boca da lei”). As três grandes teses do Direito Civil contemporâneo são: Direito Civil Constitucional, eficácia horizontal dos direitos fundamentais e diálogo das fontes.", "pontos": ["Três princípios do CC/2002 (Reale): eticidade, socialidade e operabilidade.", "Principal diferença filosófica p/ o CC/1916: o sistema de cláusulas gerais.", "Cláusula geral (dinâmica) ≠ conceito legal indeterminado (estático, sem definição).", "Ontognoseologia realeana: culturalismo + teoria tridimensional (fato, valor e norma).", "Kelsen (pirâmide, sistema fechado) x Reale (aberto e dinâmico)."], "quiz": [{"q": "Quais são os três princípios fundamentais do Código Civil de 2002, segundo Miguel Reale?", "options": ["Legalidade, moralidade e eficiência", "Eticidade, socialidade e operabilidade", "Autonomia, boa-fé e segurança"], "answer": 1, "explain": "Da exposição de motivos de Reale: eticidade (ética e boa-fé objetiva), socialidade (função social) e operabilidade (simplicidade e efetividade)."}, {"q": "Qual é a principal diferença de filosofia entre o CC/2002 e o CC/1916?", "options": ["A adoção de um sistema baseado em cláusulas gerais", "O aumento do número de artigos", "A separação entre Código Civil e Código Comercial"], "answer": 0, "explain": "Tartuce aponta que essa “pode ser tida como a principal diferença de filosofia”: o CC/2002 valoriza cláusulas gerais, que dão margem de interpretação ao julgador."}, {"q": "Segundo a teoria tridimensional de Miguel Reale, o direito é:", "options": ["Norma, sanção e coação", "Fato, valor e norma", "Sujeito, objeto e vínculo"], "answer": 1, "explain": "Para Reale, direito é fato, valor e norma, sempre correlacionados — visão “concreta e dinâmica”."}, {"q": "O que distingue uma cláusula geral de um conceito legal indeterminado?", "options": ["Nada, são sinônimos", "A cláusula geral é dinâmica; o conceito legal indeterminado é estático e consta da lei sem definição", "O conceito legal indeterminado só existe no processo civil"], "answer": 1, "explain": "A cláusula geral tem sentido dinâmico; o conceito legal indeterminado é construção estática, sem definição. Ao ser concretizado pelo aplicador, aproxima-se de uma cláusula geral."}, {"q": "O princípio da socialidade significa que o CC/2002 procurou:", "options": ["Reforçar o individualismo do Código de 1916", "Superar o individualismo, valorizando o “nós” em vez do “eu”", "Eliminar a função social dos contratos"], "answer": 1, "explain": "A socialidade supera o caráter individualista e egoísta da codificação anterior — a palavra “eu” é substituída por “nós”; toda categoria civil tem função social."}, {"q": "O princípio da operabilidade tem dois sentidos. Quais são?", "options": ["Rigidez e formalismo", "Simplicidade e efetividade (concretude)", "Publicidade e legalidade"], "answer": 1, "explain": "A operabilidade significa simplicidade (facilitar a aplicação, como na distinção prescrição/decadência) e efetividade/concretude (sistema de cláusulas gerais)."}, {"q": "Na comparação de Tartuce, a visão de Hans Kelsen corresponde a:", "options": ["Um sistema aberto e dinâmico", "Uma pirâmide de normas, sistema fechado e estático (“o juiz é a boca da lei”)", "A teoria tridimensional"], "answer": 1, "explain": "A visão kelseniana é a pirâmide de normas, fechada e estática. A frase-símbolo é “o juiz é a boca da lei”. Já Reale representa o sistema aberto e dinâmico."}, {"q": "A ontognoseologia jurídica de Reale baseia-se em duas subteorias. Quais?", "options": ["Positivismo e jusnaturalismo", "Culturalismo jurídico e teoria tridimensional", "Common Law e Civil Law"], "answer": 1, "explain": "A ontognoseologia (teoria do conhecimento jurídico) apoia-se no culturalismo jurídico (plano subjetivo: cultura, experiência, história) e na teoria tridimensional (fato, valor e norma)."}], "terms": [{"termo": "Eticidade", "definicao": "Princípio do CC/2002: valorização da ética e da boa-fé objetiva.", "secao": "2.1"}, {"termo": "Socialidade", "definicao": "Princípio do CC/2002: superação do individualismo — toda categoria civil tem função social (o “eu” vira “nós”).", "secao": "2.1"}, {"termo": "Operabilidade", "definicao": "Princípio do CC/2002: simplicidade + efetividade, alcançadas pelo sistema de cláusulas gerais.", "secao": "2.1"}, {"termo": "Cláusula geral", "definicao": "“Janela aberta” deixada pelo legislador, de sentido dinâmico, para preenchimento pelo aplicador caso a caso (ex.: função social do contrato).", "secao": "2.1"}, {"termo": "Conceito legal indeterminado", "definicao": "Termo vago que consta da lei sem definição; é estático. Ao ganhar concreção pelo aplicador, aproxima-se de uma cláusula geral.", "secao": "2.1"}, {"termo": "Ontognoseologia jurídica", "definicao": "Teoria do conhecimento jurídico de Miguel Reale, baseada no culturalismo jurídico e na teoria tridimensional.", "secao": "2.1"}, {"termo": "Culturalismo jurídico", "definicao": "Enfoque subjetivo (do aplicador) de Reale, guiado por três palavras: cultura, experiência e história.", "secao": "2.1"}, {"termo": "Teoria tridimensional", "definicao": "Para Reale, direito é fato, valor e norma, sempre correlacionados (visão concreta e dinâmica).", "secao": "2.1"}, {"termo": "Boa-fé objetiva", "definicao": "Boa-fé ligada à conduta de lealdade (não à intenção). Tem função interpretativa (art. 113), de controle (art. 187) e de integração (art. 422).", "secao": "2.1"}], "blocks": ["A compreensão de uma nova norma jurídica é tarefa centrada não apenas na análise comparada da letra fria da lei. Em outras palavras, para que o estudioso entenda efetivamente a codificação privada de 2002, é preciso conhecer a linha filosófica adotada pela norma emergente. A comparação das duas leis por meio de Códigos confrontados, comum após o surgimento do Código Civil de 2002, é apenas o ponto de partida para o intérprete. A premissa afirmada também vale com a emergência do Código de Processo Civil de 2015, sendo a confrontação com o CPC/1973 apenas o início do estudo.", "Diante disso, antes de adentrar no estudo da Parte Geral do Código Civil de 2002, será demonstrada a linha filosófica da atual codificação material, bem como as grandes teses do Direito Civil contemporâneo. Segue-se, assim, o modelo adotado em outra obra.<sup class=\"fn\" title=\"Nota 1 do original — o texto da nota não faz parte deste trecho (Parte I)\">1</sup> Trata-se de ponto fundamental para os estudiosos do Direito Civil, até porque as matérias de filosofia e sociologia passaram a ser solicitadas não só nos cursos de graduação, mas também em provas existentes após o bacharelado (v.g., exame de admissão na Ordem dos Advogados do Brasil e concursos públicos). Recentemente, a análise dessa estrutura tornou-se ainda mais fundamental com o surgimento de leis que se distanciam dos seus fundamentos, caso da Lei da Liberdade Econômica (Lei 13.874/2019).", "O atual Código Civil Brasileiro foi instituído pela Lei 10.406, de 10 de janeiro de 2002, entrando em vigor após um ano de vacatio legis, para a maioria da doutrina, em 11 de janeiro de 2003. A atual codificação civil teve uma longa tramitação no Congresso Nacional, com seu embrião, no ano de 1975, ocasião em que o então Presidente da República, Ernesto Geisel, submeteu à apreciação da Câmara dos Deputados o Projeto de Lei 634-D, com base em trabalho elaborado por uma Comissão de sete membros, coordenada por Miguel Reale. Como se nota, portanto, o projeto legislativo surgiu no “ápice” da ditadura militar que imperava no Brasil.", "A estrutura básica do projeto que gerou a nova codificação foi concebida com uma Parte Geral e cinco livros na Parte Especial, tendo sido convidado para cada uma delas um jurista de renome e notório saber, todos com as mesmas ideias gerais sobre as diretrizes a serem seguidas. Convocados foram para a empreitada:", "• José Carlos Moreira Alves (SP) – relator da Parte Geral;", "• Agostinho Alvim (SP) – relator do livro que trata do Direito das Obrigações;", "• Silvio Marcondes (SP) – relator do livro de Direito de Empresa;", "• Erbert Chamoun (RJ) – responsável pelo Direito das Coisas;", "• Clóvis do Couto e Silva (RS) – responsável pelo livro de Direito de Família;", "• Torquato Castro (PE) – relator do livro do Direito das Sucessões.", "Conforme lembra Gerson Luiz Carlos Branco, a escolha foi abrangente, uma vez que “foram contemplados juristas do Sul, do Nordeste, do centro do País, do Rio de Janeiro e São Paulo, congregando professores, advogados e juízes. A Comissão escolhida teve um perfil adequado às considerações políticas em relação à postura dos membros da Comissão. Além disso, segundo o próprio Miguel Reale, havia uma afinidade de ideias e de pensamento entre todos os juristas que integravam a Comissão”.<sup class=\"fn\" title=\"Nota 2 do original — o texto da nota não faz parte deste trecho (Parte I)\">2</sup> Em suma, os trabalhos foram guiados pela mesma linha de pensamento.", "Na exposição de motivos da atual codificação privada, Miguel Reale demonstra quais foram as diretrizes básicas seguidas pela Comissão revisora do Código Civil de 2002, a saber:<sup class=\"fn\" title=\"Nota 3 do original — o texto da nota não faz parte deste trecho (Parte I)\">3</sup>", "a) Preservação do Código Civil anterior sempre que fosse possível, pela excelência técnica do seu texto e diante da existência de um posicionamento doutrinário e jurisprudencial já consubstanciado sobre os temas nele constantes.", "b) Alteração principiológica do Direito Privado, em relação aos ditames básicos que constavam na codificação anterior, buscando a nova codificação valorizar a eticidade, a socialidade e a operabilidade, que serão abordadas oportunamente.", "c) Aproveitamento dos estudos anteriores em que houve tentativas de reforma da lei civil, trabalhos esses que foram elaborados primeiro por Hahneman Guimarães, Orozimbo Nonato e Philadelpho de Azevedo, com o anteprojeto do Código das Obrigações; e, depois, por Orlando Gomes e Caio Mário da Silva Pereira, com a proposta de elaboração separada de um Código Civil e de um Código das Obrigações, contando com a colaboração, neste caso, de Silvio Marcondes, Theóphilo de Azevedo Santos e Nehemias Gueiros.", "d) Firmar a orientação de somente inserir no Código Civil matéria já consolidada ou com relevante grau de experiência crítica, transferindo-se para a legislação especial questões ainda em processo de estudo, ou que, por sua natureza complexa, envolvem problemas e soluções que extrapolam a codificação privada, caso da bioética, do biodireito e do direito eletrônico ou digital. Aliás, quanto à bioética e ao biodireito, prevê o Enunciado n. 2 do Conselho da Justiça Federal, aprovado na I Jornada de Direito Civil que “sem prejuízo dos direitos da personalidade nele assegurados, o art. 2.º do Código Civil não é sede adequada para questões emergentes da reprogenética humana, que deve ser objeto de um estatuto próprio”. Nesse sentido, entrou em vigor em nosso País, em março de 2005, a Lei de Biossegurança (Lei 11.105/2005), um dos satélites na órbita do planeta Código Civil. O STF discutiu a constitucionalidade do seu art. 5.º, que prevê a possibilidade de utilização de células embrionárias para fins terapêuticos (ADIn 3.510/DF). Acabou concluindo por sua constitucionalidade, felizmente. De todo modo, adiante-se que, para que o Código Civil volte a ter um protagonismo perdido no Direito Privado, almeja-se que temas relativos às novas tecnologias sejam nele inseridos, caso da reprodução assistida, conforme está no Projeto de Reforma, elaborado pela Comissão de Juristas e em trâmite no Congresso Nacional, o que atualmente é defendido por mim.", "e) Dar nova estrutura ao Código Civil, mantendo-se a Parte Geral – conquista preciosa do direito brasileiro, desde Teixeira de Freitas –, mas com nova organização da matéria, a exemplo das recentes codificações existentes à época.", "f) Não realizar, propriamente, a unificação de todo o Direito Privado, mas sim do Direito das Obrigações – de resto já é uma realidade em nosso País – em virtude do obsoletismo do Código Comercial de 1850 – com a consequente inclusão de mais um livro na Parte Especial, que se denominou Direito de Empresa. Nesse ponto, o Código Civil Brasileiro de 2002 seguiu o modelo do Código Italiano de 1942.", "g) Valorizar um sistema baseado em cláusulas gerais, que dão certa margem de interpretação ao julgador. Essa pode ser tida como a principal diferença de filosofia entre o Código Civil de 2002 e seu antecessor.", "Ponto de destaque se refere aos princípios do Código Civil de 2002 outrora expostos, e que merecem no presente momento um estudo mais aprofundado. O próprio Miguel Reale não se cansava em apontar os regramentos básicos que sustentam a atual codificação privada: eticidade, socialidade e operabilidade. Repise-se que o estudo de tais princípios é fundamental para que se possam entender os novos institutos que surgiram com a nova lei privada.", "De início, a respeito do princípio da eticidade, o Código Civil de 2002 se distancia do tecnicismo institucional advindo da experiência do Direito Romano, procurando, em vez de valorizar formalidades, reconhecer a participação dos valores éticos em todo o Direito Privado. Cumpre transcrever as palavras do Ministro José Delgado, do Superior Tribunal de Justiça, no sentido de que “o tipo de Ética buscado pelo novo Código Civil é o defendido pela corrente kantiana: é o comportamento que confia no homem como um ser composto por valores que o elevam ao patamar de respeito pelo semelhante e de reflexo de um estado de confiança nas relações desenvolvidas, quer negociais, quer não negociais. É, na expressão kantiana, a certeza do dever cumprido, a tranquilidade da boa consciência”.<sup class=\"fn\" title=\"Nota 4 do original — o texto da nota não faz parte deste trecho (Parte I)\">4</sup>", "O princípio da eticidade pode ser percebido pela leitura de vários dispositivos da atual codificação privada. Inicialmente, nota-se a valorização de condutas éticas, de boa--fé objetiva – aquela relacionada com a conduta de lealdade das partes negociais –, pelo conteúdo da norma do art. 113, caput, segundo o qual “os negócios jurídicos devem ser interpretados conforme a boa-fé e os usos do lugar de sua celebração” (função interpretativa da boa-fé objetiva). Ademais, o art. 187 do CC/2002 determina qual a sanção para a pessoa que contraria a boa-fé no exercício de um direito: cometerá abuso de direito, assemelhado a ilícito (função de controle da boa-fé objetiva). Ato contínuo, o art. 422 da Lei Geral Privada valoriza a eticidade, prevendo que a boa-fé deve integrar a conclusão e a execução do contrato (função de integração da boa-fé objetiva). Sobre o art. 113 da codificação privada, recebeu ele dois novos parágrafos pela Lei da Liberdade Econômica (Lei 13.874/2019), o que será analisado ainda no presente capítulo, quando do estudo da teoria geral do negócio jurídico.", "Aqui cabe fazer mais uma nota sobre o Código de Processo de 2015, que procurou valorizar a boa-fé, especialmente a de natureza objetiva, em vários de seus comandos. De início, o art. 5.º do Estatuto Processual emergente prescreve que aquele que de qualquer forma participa do processo deve comportar-se de acordo com a boa-fé.", "Em complemento, há a previsão expressa a respeito do dever de cooperação processual, corolário da boa-fé objetiva, enunciando o art. 6.º do CPC/2015 que “todos os sujeitos do processo devem cooperar entre si para que se obtenha, em tempo razoável, decisão de mérito justa e efetiva”. Essa colaboração também é imposta aos julgadores, vedando-se as decisões surpresas, uma vez que “o juiz não pode decidir, em grau algum de jurisdição, com base em fundamento a respeito do qual não se tenha dado às partes oportunidade de se manifestar, ainda que se trate de matéria sobre a qual deva decidir de ofício” (art. 10 do CPC/2015).", "Por derradeiro, sem prejuízo de outros dispositivos, o art. 489, § 3.º, do CPC/2015 prescreve que a decisão judicial deve ser interpretada a partir da conjugação de todos os seus elementos e em conformidade com o princípio da boa-fé. Como se nota, a boa-fé objetiva passa a ser elemento de interpretação das decisões como um todo, o que deve gerar um grande impacto na prática cível nos próximos anos. A propósito, não deixando dúvidas de que se trata de uma boa-fé que se situa no plano da conduta, e não da intenção, estabelece o Enunciado n. 1, aprovado na I Jornada de Direito Processual Civil (agosto de 2017), que a verificação da violação à boa-fé objetiva dispensa a comprovação do animus do sujeito processual.", "Voltando-se à lei material em vigor, no que concerne ao princípio da socialidade, o Código Civil de 2002 procura superar o caráter individualista e egoísta que imperava na codificação anterior, valorizando a palavra nós, em detrimento da palavra eu. Os grandes ícones do Direito Privado recebem uma denotação social: a família, o contrato, a propriedade, a posse, a responsabilidade civil, a empresa, o testamento. De toda forma, em certa medida, as orientações individualistas que permeavam o Código Civil de 1916 voltaram a ter uma valorização neste início de século XXI, o que pode ser percebido, no Brasil, pela recente Lei 13.874/2019, que institui a “Declaração de Direitos de Liberdade Econômica”.", "Destaque-se que a função social da propriedade já estava prevista na Constituição Federal de 1988, em seu art. 5.º, incs. XXII e XXIII, e no seu art. 170, inc. III, tendo sido reforçada pelo art. 1.228, § 1.º, do CC/2002. Como novidade de grande impacto, a função social dos contratos passou a ser tipificada em lei, nos arts. 421 e 2.035, parágrafo único, do Código Civil. Trata-se de um princípio contratual de ordem pública, pelo qual o contrato deve ser, necessariamente, visualizado e interpretado de acordo com o contexto da sociedade.<sup class=\"fn\" title=\"Nota 5 do original — o texto da nota não faz parte deste trecho (Parte I)\">5</sup> Como se verá, reitere-se, esse princípio deve ser confrontado perante os regramentos que foram instituídos pela citada Lei da Liberdade Econômica, de setembro de 2019.", "Mesmo a posse recebe uma função social, eis que o atual Código consagra a diminuição dos prazos de usucapião imobiliária quando estiver configurada a posse-trabalho, situação fática em que o possuidor despendeu tempo e labor na ocupação de um determinado imóvel. A codificação de 2002 valoriza aquele que planta e colhe, o trabalho da pessoa natural, do cidadão comum. Tais premissas podem ser captadas pela leitura dos arts. 1.238, parágrafo único, e 1.242, parágrafo único, do CC/2002, que reduzem os prazos da usucapião extraordinária e ordinária, para dez e cinco anos, respectivamente quando o possuidor tiver realizado no imóvel obras e serviços considerados pelo juiz de caráter social e econômico relevante.", "Por fim, há o princípio da operabilidade, que tem dois significados. De início, há o sentido de simplicidade, uma vez que o Código Civil de 2002 segue tendência de facilitar a interpretação e a aplicação dos institutos nele previstos. Como exemplo, pode ser citada a distinção que agora consta em relação aos institutos da prescrição e da decadência, matéria que antes trazia grandes dúvidas pela lei anterior, que era demasiadamente confusa. Por outra via, há o sentido de efetividade, ou concretude do Direito Civil, o que foi seguido pela adoção do sistema de cláusulas gerais.", "Nas palavras de Judith Martins-Costa, grande intérprete da filosofia realeana e do Código Civil de 2002, percebe-se na atual codificação material um sistema aberto ou de janelas abertas, em virtude da linguagem que emprega, permitindo a constante incorporação e solução de novos problemas, seja pela jurisprudência, seja por uma atividade de complementação legislativa. Vejamos as suas lições a respeito das cláusulas gerais:", "“Estas janelas, bem denominadas por Irti de ‘concetti di collegamento’, com a realidade social são constituídas pelas cláusulas gerais, técnica legislativa que conforma o meio hábil para permitir o ingresso, no ordenamento jurídico codificado, de princípios valorativos ainda não expressos legislativamente, de ‘standards’, arquétipos exemplares de comportamento, de deveres de conduta não previstos legislativamente (e, por vezes, nos casos concretos, também não advindos da autonomia privada), de direitos e deveres configurados segundo os usos do tráfego jurídico, de diretivas econômicas, sociais e políticas, de normas, enfim, constantes de universos metajurídicos, viabilizando a sua sistematização e permanente ressistematização no ordenamento positivo. Nas cláusulas gerais a formulação da hipótese legal é procedida mediante o emprego de conceitos cujos termos têm significado intencionalmente vago e aberto, os chamados ‘conceitos jurídicos indeterminados’. Por vezes – e aí encontraremos as cláusulas gerais propriamente ditas –, o seu enunciado, ao invés de traçar punctualmente a hipótese e as consequências, é desenhado como uma vaga moldura, permitindo, pela vagueza semântica que caracteriza os seus termos, a incorporação de princípios e máximas de conduta originalmente estrangeiros ao corpus codificado, do que resulta, mediante a atividade de concreção destes princípios, diretrizes e máximas de conduta, a constante formulação de novas normas”.<sup class=\"fn\" title=\"Nota 6 do original — o texto da nota não faz parte deste trecho (Parte I)\">6</sup>", "A partir dos ensinamentos da professora gaúcha, as cláusulas gerais podem ser conceituadas como janelas abertas deixadas pelo legislador para preenchimento pelo aplicador do Direito, caso a caso. São exemplos de cláusulas gerais constantes do Código Civil de 2002:", "– Função social do contrato – art. 421 do CC.", "– Função social da propriedade – art. 1.228, § 1.º, do CC.", "– Boa-fé – arts. 113, 187 e 422 do CC.", "– Bons costumes – arts. 13 e 187 do CC.", "– Atividade de risco – art. 927, parágrafo único, do CC.", "As cláusulas gerais têm um sentido dinâmico, o que as diferencia dos conceitos legais indeterminados, construções estáticas que constam da lei sem definição. Assim, pode-se afirmar que quando o aplicador do direito cumpre a tarefa de dar sentido a um conceito legal indeterminado, passará ele a constituir uma cláusula geral. Segue-se com tal premissa o posicionamento de Karl Engisch, para quem a cláusula geral não se confunde com a ideia de conceito legal indeterminado, eis que a primeira “contrapõe a uma elaboração ‘casuística’ das hipóteses legais. ‘Casuística’ é aquela configuração da hipótese legal (enquanto somatório dos pressupostos que condicionam a estatuição) que circunscreve particulares grupos de casos na sua especificidade própria”.<sup class=\"fn\" title=\"Nota 7 do original — o texto da nota não faz parte deste trecho (Parte I)\">7</sup>", "Consigne-se que muitas das cláusulas gerais são princípios, mas não necessariamente. Ilustrando, a função social do contrato é princípio contratual; ao contrário da cláusula geral de atividade de risco, que não é princípio da responsabilidade civil.", "Ora, a adoção do sistema de cláusulas gerais pelo Código Civil de 2002 tem relação direta com a linha filosófica adotada por Miguel Reale na vastidão de sua obra. É notório que o jurista criou a sua própria teoria do conhecimento e da essência jurídica, a ontognoseologia jurídica, em que se busca o papel do direito nos enfoques subjetivo e objetivo, baseando-se em duas subteorias: o culturalismo jurídico e a teoria tridimensional do direito.<sup class=\"fn\" title=\"Nota 8 do original — o texto da nota não faz parte deste trecho (Parte I)\">8</sup> Vejamos de forma sistematizada:", "a) Culturalismo jurídico (plano subjetivo) – inspirado no trabalho de Carlos Cossio, Reale busca o enfoque jurídico no aspecto subjetivo, do aplicador do direito. Três palavras orientarão a aplicação e as decisões a serem tomadas: cultura, experiência e história, que devem ser entendidas tanto do ponto de vista do julgador como no da sociedade, ou seja, do meio em que a decisão será prolatada.", "b) Teoria tridimensional do direito (plano objetivo) – para Miguel Reale, direito é fato, valor e norma. Ensina o Mestre que a sua teoria tridimensional do direito e do Estado vem sendo concebida desde 1940, distinguindo-se das demais teorias por ser “concreta e dinâmica”, eis que “fato, valor e norma estão sempre presentes e correlacionados em qualquer expressão da vida jurídica, seja ela estudada pelo filósofo ou o sociólogo do direito, ou pelo jurista como tal, ao passo que, na tridimensionalidade genérica ou abstrata, caberia ao filósofo apenas o estudo do valor, ao sociólogo de fato e ao jurista a norma (tridimensionalidade como requisito essencial do direito)”.<sup class=\"fn\" title=\"Nota 9 do original — o texto da nota não faz parte deste trecho (Parte I)\">9</sup>", "Pela conjugação das duas construções, na análise dos institutos jurídicos presentes no Código Civil de 2002, muitos deles abertos, genéricos e indeterminados, o jurista e o magistrado deverão fazer um mergulho profundo nos fatos que margeiam a situação, para então, de acordo com os seus valores e da sociedade – construídos após anos de educação e de experiências –, aplicar a norma de acordo com os seus limites, procurando sempre interpretar sistematicamente a legislação privada. Fato, valor e norma serão imprescindíveis a apontar o caminho seguido para a aplicação do Direito. Dessa forma, dar-se-á o preenchimento das cláusulas gerais, das janelas abertas. Por esse processo os conceitos legais indeterminados ganham determinação jurídica, diante da atuação do magistrado, sempre guiado pela equidade.", "Primeiro, o magistrado julgará de acordo com a sua cultura, bem como do meio social. Isso porque os elementos culturais e valorativos do magistrado serão imprescindíveis para o preenchimento da discricionariedade deixada pela norma privada. Ganha destaque o valor como elemento formador do direito.", "Segundo, tudo dependerá da história do processo e dos institutos jurídicos a ele relacionados, das partes que integram a lide e também a história do próprio aplicador. Aqui, ganha relevo o fato, outro elemento do direito, de acordo com a construção de Reale.", "Por fim, a experiência do aplicador do direito, que reúne fato e valor simbioticamente, visando à aplicação da norma. Esta, sim, elemento central daquilo que se denomina ontognoseologia, a teoria do conhecimento, da essência jurídica, criada por Miguel Reale. Encaixa-se perfeitamente a proposta de Reale, para que sejamos juristas – no ponto de vista das normas –, sociólogos – diante da análise dos fatos – e filósofos – pelo prisma dos valores.", "Nunca é demais frisar que as cláusulas gerais que constam da atual codificação material, a serem delineadas pela jurisprudência e pela comunidade jurídica, devem ser baseadas nas experiências pessoais dos aplicadores e dos julgadores, que também devem estar atualizados de acordo com os aspectos temporais, locais e subjetivos que envolvem a questão jurídica que lhes é levada para apreciação. Ilustrando, o aplicador do direito deve estar atento à evolução tecnológica, para não tomar decisões totalmente descabidas, como a de determinar o bloqueio de todos à internet, visando proteger a imagem individual de determinada pessoa. A formação interdisciplinar é primordial para o jurista do século XXI.", "Como pontuação importante a respeito do Código de Processo Civil de 2015, acredito que a legislação instrumental emergente também adotou um sistema aberto, baseado em cláusulas gerais e conceitos legais indeterminados. Como é notório, o art. 1.º do CPC/2015 prevê que processo civil será ordenado, disciplinado e interpretado conforme os valores e as normas fundamentais estabelecidos na Constituição da República Federativa do Brasil, valores esses que são por vezes abertos, caso da igualdade e da solidariedade.", "Merece também ser destacado, mais uma vez, o revolucionário art. 8.º do CPC/2015, segundo o qual, ao aplicar o ordenamento jurídico, o juiz atenderá aos fins sociais e às exigências do bem comum, resguardando e promovendo a dignidade da pessoa humana e observando a proporcionalidade, a razoabilidade, a legalidade, a publicidade e a eficiência. Como se pode perceber, todas as expressões em itálico são cláusulas gerais, com preenchimento de acordo com as circunstâncias do caso concreto.", "Além disso, o Código de Processo Civil de 2015 reconhece expressamente a plena possibilidade de julgamento com base nas cláusulas gerais e conceitos legais indeterminados, exigindo a devida fundamentação pelo julgador em casos tais. Todas essas hipóteses constituem exceções à regra da intransmissibilidade e indisponibilidade. Nesse contexto, o art. 11 do CPC/2015 preconiza que todos os julgamentos dos órgãos do Poder Judiciário serão públicos e fundamentadas todas as decisões, sob pena de nulidade.", "Mais à frente, ao tratar dos elementos essenciais da sentença, o § 1.º do art. 489 do Estatuto Processual estabelece que não se considera fundamentada qualquer decisão judicial, seja ela interlocutória, sentença ou acórdão, que: a) se limitar à indicação, à reprodução ou à paráfrase de ato normativo, sem explicar sua relação com a causa ou a questão decidida; b) empregar conceitos jurídicos indeterminados, sem explicar o motivo concreto de sua incidência no caso; c) invocar motivos que se prestariam a justificar qualquer outra decisão; d) não enfrentar todos os argumentos deduzidos no processo capazes de, em tese, infirmar a conclusão adotada pelo julgador; e) se limitar a invocar precedente ou enunciado de súmula, sem identificar seus fundamentos determinantes nem demonstrar que o caso sob julgamento se ajusta àqueles fundamentos; f) deixar de seguir enunciado de súmula, jurisprudência ou precedente invocado pela parte, sem demonstrar a existência de distinção no caso em julgamento ou a superação do entendimento. Nota-se que a norma menciona os conceitos legais indeterminados, mas é certo que muitos deles são também cláusulas gerais.", "O último dispositivo processual visa a afastar o livre convencimento do juiz, sem o devido fundamento. Esse comando poderá revolucionar as decisões judiciais no País, trazendo-lhes balizas mais certas e seguras, inclusive motivadas na doutrina. No entanto, o preceito também poderá ser totalmente desprezado pelos julgadores, inclusive pela ausência de sanção imediata. Somente o tempo e a prática demonstrarão qual a amplitude social da norma emergente.", "De todo modo, é certo que essa linha filosófica, aberta por excelência, foi inserida no Código Civil de 2002, principalmente no capítulo que trata do Direito das Obrigações, e reafirmada pelo Código de Processo Civil de 2015. Os desenhos a seguir demonstram muito bem a confrontação entre o Código Civil de 1916, concebido à luz da teoria positivista, que teve como um de seus principais expoentes Hans Kelsen, e o Código Civil de 2002, sob a teoria tridimensional de Miguel Reale:", "Como se nota, a visão kelseniana é de uma pirâmide de normas, um sistema fechado e estático. Assim era o civilista da geração anterior, moderno. Privilegiava-se o apego à literalidade fechada da norma jurídica, prevalecendo a ideia de que a norma seria suficiente. A frase-símbolo dessa concepção legalista era: o juiz é a boca da lei.", "A visão realeana é de três subsistemas: dos fatos, dos valores e das normas. O sistema é aberto e dinâmico, em constantes diálogos. Assim é o civilista da atual geração, pós-moderno. Privilegia-se a ideia de interação, de visão unitária do sistema, prevalecendo a constatação de que, muitas vezes, a norma não é suficiente. As cláusulas gerais são abertas e devem ser analisadas caso a caso. Frase-símbolo: direito é fato, valor e norma.", "Repise-se que, além do Código Civil de 2002, acredito que o capítulo inaugural do Novo Código de Processo Civil, recheado de cláusulas gerais e conceitos legais indeterminados, possibilite a mesma comparação, em que o Código de Processo Civil de 1973 está para o Código Civil de 1916, assim como o Código de Processo Civil de 2015 está para o Código Civil de 2002, guardadas as devidas proporções.", "Superado esse estudo jusfilosófico, é preciso expor os principais marcos teóricos do Direito Civil brasileiro contemporâneo, a saber: o Direito Civil Constitucional, a eficácia horizontal dos direitos fundamentais e a teoria do diálogo das fontes."], "children": [{"num": "2.1.1", "title": "2.1.1 Direito Civil Constitucional", "resumo": "O Direito Civil Constitucional é um caminho metodológico que analisa os institutos privados a partir da Constituição (e não o contrário). Tem raiz na doutrina italiana de Pietro Perlingieri e, no Brasil, na escola carioca (Gustavo Tepedino, Maria Celina Bodin de Moraes, Heloísa Helena Barboza). Parte de uma visão unitária do ordenamento: desloca o ponto de referência do Código Civil para a “tábua axiológica” da Constituição. Não faz o Direito Civil deixar de ser Direito Civil — é uma análise “em mão dupla”. Seus três princípios básicos (Tepedino) são: dignidade da pessoa humana (superprincípio, art. 1º, III, CF), solidariedade social (art. 3º, I) e isonomia/igualdade (art. 5º, caput). É a chamada personalização do Direito Civil: a pessoa acima do patrimônio.", "pontos": ["Interpretar o Código Civil à luz da Constituição (visão unitária).", "Raiz em Perlingieri (Itália); no Brasil, escola carioca (Tepedino).", "3 princípios: dignidade da pessoa humana, solidariedade e isonomia.", "Dignidade = “superprincípio”; leva à personalização do Direito Civil."], "quiz": [{"q": "Quais são os três princípios básicos do Direito Civil Constitucional, segundo Gustavo Tepedino?", "options": ["Legalidade, publicidade e eficiência", "Dignidade da pessoa humana, solidariedade social e isonomia", "Autonomia, propriedade e liberdade"], "answer": 1, "explain": "São a proteção da dignidade da pessoa humana (art. 1º, III), a solidariedade social (art. 3º, I) e a isonomia/igualdade (art. 5º, caput, da CF/1988)."}, {"q": "A ideia central do Direito Civil Constitucional é:", "options": ["Interpretar a Constituição a partir do Código Civil", "Interpretar o Código Civil a partir da Constituição (visão unitária)", "Separar totalmente o Direito Público do Direito Privado"], "answer": 1, "explain": "Há uma inversão: interpreta-se o Código Civil segundo a Constituição, deslocando o ponto de referência para a tábua axiológica constitucional (personalização)."}, {"q": "A expressão “Direito Civil Constitucional” tem raiz na doutrina de:", "options": ["Hans Kelsen", "Pietro Perlingieri (Itália)", "Erik Jayme"], "answer": 1, "explain": "A expressão encontra raízes na doutrina italiana de Pietro Perlingieri, para quem a Constituição funda o ordenamento jurídico."}, {"q": "No Brasil, a escola que capitaneou o Direito Civil Constitucional é a:", "options": ["Escola carioca (UERJ) — Tepedino, Bodin de Moraes e Barboza", "Escola paulista da USP", "Escola mineira"], "answer": 0, "explain": "A visão ganhou força na escola carioca (UERJ), com Gustavo Tepedino, Maria Celina Bodin de Moraes e Heloísa Helena Barboza."}, {"q": "A dignidade da pessoa humana (art. 1º, III, da CF) é tratada como:", "options": ["Um princípio de menor importância", "O superprincípio ou “princípio dos princípios”", "Uma regra processual"], "answer": 1, "explain": "É o superprincípio (princípio dos princípios), principal fundamento da personalização do Direito Civil — a pessoa acima do patrimônio."}, {"q": "“Personalização do Direito Civil” significa:", "options": ["Valorização do patrimônio sobre a pessoa", "Valorização da pessoa humana em detrimento do patrimônio", "Privatização de serviços públicos"], "answer": 1, "explain": "A personalização é a valorização da pessoa humana em detrimento do patrimônio, a partir da dignidade humana."}], "terms": [{"termo": "Direito Civil Constitucional", "definicao": "Caminho metodológico que interpreta o Código Civil à luz da Constituição, numa visão unitária do ordenamento.", "secao": "2.1.1"}, {"termo": "Visão unitária do ordenamento", "definicao": "Ideia de que o sistema jurídico é um todo coerente; o ponto de referência desloca-se do Código Civil para a Constituição.", "secao": "2.1.1"}, {"termo": "Personalização do Direito Civil", "definicao": "Valorização da pessoa humana em detrimento do patrimônio, a partir da dignidade humana.", "secao": "2.1.1"}, {"termo": "Neoconstitucionalismo", "definicao": "Fenômeno de “invasão” da Constituição nos demais ramos, reconhecido também pelos constitucionalistas.", "secao": "2.1.1"}], "blocks": ["A existência das grandes dicotomias em Direito sempre permitiu que houvesse uma sistematização do ponto de vista da análise do próprio âmbito jurídico, concebido, de forma analítica, como um conjunto de normas. Contudo, diante da superabundância dessas normas, uma organização teórica do direito que assegure uma definição genérica e lógica dos assuntos jurídicos fica bastante prejudicada, para não dizer inviabilizada. O Big Bang Legislativo (explosão de leis), conforme simbologia criada por Ricardo Lorenzetti, dificultou o trabalho do aplicador do direito na busca de uma sistematização.", "Sabe-se que a distinção entre Direito Público e Direito Privado não é apenas um método de classificação, de ordenação dos critérios de distinção dos tipos normativos, mas sim um poderoso instrumento de sistematização. Tal distinção remonta ao Digesto, 1.1.1.2, no Corpus Juris Civilis de Ulpiano, que dividiu o direito em jus publicum e jus privatum. Os critérios utilizados para que fosse feita essa distinção se baseavam na utilidade da lei: se fosse de utilidade pública, tratar-se-ia de uma lei de Direito Público; se fosse de utilidade particular, seria uma lei de Direito Privado.", "Esse critério de utilidade estrita desde logo foi contestado, e chegou-se à conclusão de que, em verdade, o critério para classificação da lei era baseado na utilidade preponderante da lei, uma vez que as utilidades de uma norma não ficam circunscritas a um único interesse, do Estado ou do particular, mas acabam se entrelaçando, de modo que a norma de uma natureza exerce influência em outra de natureza diversa.", "Em princípio, o Direito Público tem como finalidade a ordem e a segurança geral, enquanto o Direito Privado reger-se-ia pela liberdade e pela igualdade. Enquanto no Direito Público somente seria válido aquilo que está autorizado pela norma, no Direito Privado tudo aquilo que não está proibido por ela seria válido. Mas essa dicotomia não é um obstáculo intransponível e a divisão não é absoluta, como quase nada é absoluto nos nossos dias atuais.", "Nesse sentido, é interessante tecer alguns comentários sob a relação entre o Direito Civil e o Direito Constitucional, o que faz com que surja, para muitos, uma nova disciplina ou caminho metodológico, denominado Direito Civil Constitucional, da qual continuo adepto e entusiasta.<sup class=\"fn\" title=\"Nota 10 do original — o texto da nota não faz parte deste trecho (Parte I)\">10</sup>", "A utilização da expressão Direito Civil Constitucional encontra raízes na doutrina italiana de Pietro Perlingieri.<sup class=\"fn\" title=\"Nota 11 do original — o texto da nota não faz parte deste trecho (Parte I)\">11</sup> No início de sua obra, Perlingieri aponta que a Constituição funda o ordenamento jurídico, pois “o conjunto de valores, de bens, de interesses que o ordenamento jurídico considera e privilegia, e mesmo a sua hierarquia traduzem o tipo de ordenamento com o qual se opera. Não existe, em abstrato, o ordenamento jurídico, mas existem ordenamentos jurídicos, cada um dos quais caracterizado por uma filosofia de vida, isto é, por valores e por princípios fundamentais que constituem a sua estrutura qualificadora”.<sup class=\"fn\" title=\"Nota 12 do original — o texto da nota não faz parte deste trecho (Parte I)\">12</sup>", "No Brasil, essa visão ganhou força na escola carioca, capitaneada pelos professores da Universidade do Estado do Rio de Janeiro Gustavo Tepedino, Maria Celina Bodin de Moraes e Heloísa Helena Barboza. No Paraná, Luiz Edson Fachin também faz escola com o ensino do Direito Civil Constitucional, na Universidade Federal do Paraná. No Nordeste é de se mencionar o trabalho de Paulo Luiz Netto Lôbo, também adepto dessa visão de sistema. Em São Paulo, destacam-se os trabalhos do saudoso Renan Lotufo, na PUCSP, e da professora Giselda Maria Fernandes Novaes Hironaka, Titular na USP. Em Brasília, na UNB, o professor Frederico Viegas de Lima igualmente se dedica aos estudos das interações entre o Direito Civil e a Constituição Federal de 1988.", "O conceito de Direito Civil Constitucional, à primeira vista, poderia parecer um paradoxo. Mas não é. O direito é um sistema lógico de normas, valores e princípios que regem a vida social, que interagem entre si de tal sorte que propicie segurança – em sentido lato – para os homens e mulheres que compõem uma sociedade. O Direito Civil Constitucional, portanto, está baseado em uma visão unitária do ordenamento jurídico.<sup class=\"fn\" title=\"Nota 13 do original — o texto da nota não faz parte deste trecho (Parte I)\">13</sup>", "Ao tratar dos direitos fundamentais, José Joaquim Gomes Canotilho também fala em unidade da ordem jurídica, sustentando a viabilidade de uma interação entre o Direito privado e a Constituição, mesmo que em tom cético.<sup class=\"fn\" title=\"Nota 14 do original — o texto da nota não faz parte deste trecho (Parte I)\">14</sup> Para Gustavo Tepedino, um dos principais idealizadores desse novo caminho metodológico, é “imprescindível e urgente uma releitura do Código Civil e das leis especiais à luz da Constituição”.<sup class=\"fn\" title=\"Nota 15 do original — o texto da nota não faz parte deste trecho (Parte I)\">15</sup> Desse modo, “reconhecendo a existência dos mencionados universos legislativos setoriais, é de se buscar a unidade do sistema, deslocando para a tábua axiológica da Constituição da República o ponto de referência antes localizado no Código Civil”.<sup class=\"fn\" title=\"Nota 16 do original — o texto da nota não faz parte deste trecho (Parte I)\">16</sup>", "O Direito Civil Constitucional, como uma mudança de postura, representa uma atitude bem pensada, que tem contribuído para a evolução do pensamento privado, para a evolução dos civilistas contemporâneos e para um sadio diálogo entre os juristas das mais diversas áreas. Essa inovação reside no fato de que há uma inversão da forma de interação dos dois ramos do direito – o público e o privado –, interpretando o Código Civil segundo a Constituição Federal em substituição do que se costumava fazer, isto é, exatamente o inverso.", "Os próprios constitucionalistas reconhecem o fenômeno de interação entre o Direito Civil e o Direito Constitucional como realidade do que se convém denominar neoconstitucionalismo, ou da invasão da Constituição. E, por certo, o movimento brasileiro é único, é autêntico. Ressalta Eduardo Ribeiro Moreira que “as outras inovações do direito civil-constitucional têm de ser esse ponto de encontro, os direitos fundamentais nas relações entre particulares, interação vital com a transposição e redução entre o espaço privado e o espaço público, garantizador. Dois pontos basilares do direito civil-constitucional que funcionam em prol da dignidade humana. Outro ponto a ser destacado é que, apesar de partir do direito civil italiano, o direito civil-constitucional brasileiro é uma expansão e produção autêntica”.<sup class=\"fn\" title=\"Nota 17 do original — o texto da nota não faz parte deste trecho (Parte I)\">17</sup> O também constitucionalista Ministro Luís Roberto Barroso igualmente demonstrou todo o seu entusiasmo em relação à visão civil-constitucional, tecendo comentários elogiosos.<sup class=\"fn\" title=\"Nota 18 do original — o texto da nota não faz parte deste trecho (Parte I)\">18</sup>", "Deve ser feita a ressalva que, por tal interação, o Direito Civil não deixará de ser Direito Civil; e o Direito Constitucional não deixará de ser Direito Constitucional. O Direito Civil Constitucional nada mais é do que um novo caminho metodológico, que procura analisar os institutos privados a partir da Constituição, e, eventualmente, os mecanismos constitucionais a partir do Código Civil e da legislação infraconstitucional, em uma análise em mão dupla.", "Fazendo mais uma anotação diante da emergência do Código de Processo Civil 2015, esse Estatuto Processual parece inaugurar na lei instrumental o mesmo caminho, concebendo o Direito Processual Civil Constitucional. Como é notório, o seu art. 1.º expressa que “o processo civil será ordenado, disciplinado e interpretado conforme os valores e as normas fundamentais estabelecidos na Constituição da República Federativa do Brasil, observando-se as disposições deste Código”. Em complemento, cite-se, mais uma vez, o impactante art. 8.º do CPC/2015, que ordena ao julgador ser guiado pelo princípio da dignidade da pessoa humana, ao aplicar o ordenamento jurídico.", "Como instrumento do direito material, acredito que muitas premissas do Direito Civil Constitucional servem perfeitamente a essa nova visão do processo. Na verdade, pensamos que os fundamentos legais para a visão da Escola do Direito Civil Constitucional passam a ser os arts. 1.º e 8.º do CPC/2015.", "Três são os princípios básicos do Direito Civil Constitucional, conforme as lições de Gustavo Tepedino, o que é fundamental para a compreensão da essência desse marco teórico importante para a civilística contemporânea.<sup class=\"fn\" title=\"Nota 19 do original — o texto da nota não faz parte deste trecho (Parte I)\">19</sup>", "O primeiro deles, aquele que pretende a proteção da dignidade da pessoa humana, está estampado no art. 1.º, inc. III, do Texto Maior, sendo a valorização da pessoa um dos objetivos da República Federativa do Brasil. Trata-se do superprincípio ou princípio dos princípios como se afirma em sentido geral. A proteção da dignidade humana, a partir do modelo de Kant, constitui o principal fundamento da personalização do Direito Civil, da valorização da pessoa humana em detrimento do patrimônio. A tutela da dignidade humana representa a proteção da liberdade e dos direitos subjetivos na ordem privada. Como explica o jurista alemão Stephan Kirste, “ter liberdade jurídica significa, como ainda mostraremos em seguida, possuir direitos subjetivos. A capacidade de liberdade é, assim, a capacidade de ser portador de direitos subjetivos. Portador desses direitos é, então, o sujeito do Direito ou a pessoa de Direito. A proteção da dignidade humana significa, portanto, o direito ao reconhecimento como pessoa do Direito”.<sup class=\"fn\" title=\"Nota 20 do original — o texto da nota não faz parte deste trecho (Parte I)\">20</sup>", "O segundo princípio visa à solidariedade social, outro objetivo fundamental da República, na dicção do art. 3.º, inc. I, da CF/1988. Outros preceitos da própria Constituição trazem esse alcance, como no caso do seu art. 170, pelo qual: “a ordem econômica, fundada na valorização do trabalho humano e na livre iniciativa, tem por fim assegurar a todos existência digna, conforme os ditames da justiça social”. Aqui também reside o objetivo social de erradicação da pobreza, do mesmo modo prevista na Constituição Federal de 1988 (art. 3.º, inc. III).", "Por fim, o princípio da isonomia ou igualdade lato sensu, traduzido no art. 5.º, caput, da Lei Maior, eis que “todos são iguais perante a lei, sem distinção de qualquer natureza, garantindo-se aos brasileiros e aos estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade”. Quanto a essa igualdade, princípio maior, pode ser a mesma concebida pela seguinte expressão, atribuída a Aristóteles e também a Ruy Barbosa: A lei deve tratar de maneira igual os iguais, e de maneira desigual os desiguais. Do texto, nota-se na sua primeira parte a consolidação do princípio da igualdade stricto sensu (a lei deve tratar de maneira igual os iguais), enquanto a segunda traz o princípio da especialidade (... e de maneira desigual os desiguais). Essa é a essência da igualdade substancial.", "Em obra lançada no ano de 2014, o Ministro Luiz Edson Fachin demonstra os grandes desafios do Direito Privado Contemporâneo Brasileiro, em constante interação com a Constituição Federal. Expõe que são tendências atuais do nosso Direito Civil:", "“A incidência franca da Constituição nos diversos âmbitos das relações entre particulares, mormente nos contratos, nas propriedades e nas famílias, à luz de comandos inafastáveis de proteção à pessoa; há, nada obstante, criativas tensões entre a aplicação de regras (e princípios) constitucionais e o ordenamento privado codificado; como há, sob o sistema constitucional, concepções filosóficas, o Estado liberal patrocinou o agasalho privilegiado da racionalidade codificadora das relações interprivadas; a ordem pública pode limitar a autonomia ou o autorregulamento dos interesses privados, sob a vigilância das garantias fundamentais; os Códigos Civis são reinterpretados pelas Constituições do Estado Social de Direito”.<sup class=\"fn\" title=\"Nota 21 do original — o texto da nota não faz parte deste trecho (Parte I)\">21</sup>", "Reafirme-se que essa incidência franca da Constituição igualmente atinge o Direito Processual, pela previsão expressa do art. 1.º do CPC/2015.", "Como se verá, por diversas vezes, no presente trabalho, serão buscados esses princípios emergentes para solucionar polêmicas advindas da codificação privada, demonstrando uma dimensão do Direito Privado rompida com visão anterior, aliada à personalização do direito privado, de valorização da pessoa e da sua dignidade. A tríade dignidade-solidariedade--igualdade ou dignidade-personalidade-igualdade dará o tom deste volume único."]}, {"num": "2.1.2", "title": "2.1.2 A eficácia horizontal dos direitos fundamentais", "resumo": "A eficácia horizontal dos direitos fundamentais é o reconhecimento de que os direitos que protegem a pessoa incidem também nas relações entre particulares (não só entre Estado e cidadão — esta seria a eficácia vertical). Base: art. 5º, § 1º, da CF (as normas de direitos fundamentais têm aplicação imediata). Divide-se em: eficácia horizontal imediata (o direito fundamental aplica-se diretamente à relação privada, sem ponte legal) e eficácia horizontal mediata (o direito entra na relação privada por meio das cláusulas gerais — a “porta de entrada”/Einbruchstelle). Por isso, sugere-se chamar a CF de “Carta Fundamental” (horizontal), e não “Carta Política” (vertical). Caso emblemático: STF, RE 201.819/RJ (exclusão de associado da UBC/ECAD sem ampla defesa).", "pontos": ["Direitos fundamentais valem também entre particulares (horizontal), não só perante o Estado (vertical).", "Base: art. 5º, § 1º, CF — aplicação imediata.", "Imediata (direta) x mediata (via cláusulas gerais — “porta de entrada”).", "Caso-símbolo: STF, RE 201.819/RJ (UBC/ECAD)."], "quiz": [{"q": "O que é a eficácia horizontal dos direitos fundamentais?", "options": ["A aplicação dos direitos fundamentais apenas contra o Estado", "A aplicação dos direitos fundamentais também nas relações entre particulares", "A hierarquia entre normas constitucionais"], "answer": 1, "explain": "É o reconhecimento de que os direitos que protegem a pessoa incidem nas relações entre particulares — não apenas na relação vertical Estado-cidadão."}, {"q": "Na eficácia horizontal MEDIATA, os direitos fundamentais entram nas relações privadas por meio de:", "options": ["Emenda constitucional", "Cláusulas gerais (a “porta de entrada”)", "Decisão do Senado"], "answer": 1, "explain": "Na eficácia mediata há uma ponte infraconstitucional: as cláusulas gerais funcionam como “porta de entrada” (Einbruchstelle) dos direitos fundamentais no Direito Privado."}, {"q": "Qual dispositivo constitucional fundamenta a aplicação imediata dos direitos fundamentais?", "options": ["Art. 5º, § 1º, da CF/1988", "Art. 37 da CF/1988", "Art. 226 da CF/1988"], "answer": 0, "explain": "O art. 5º, § 1º, da CF/1988: “as normas definidoras dos direitos e garantias fundamentais têm aplicação imediata”."}, {"q": "Qual a diferença entre eficácia vertical e horizontal?", "options": ["Vertical é entre particulares; horizontal é contra o Estado", "Vertical é a relação Estado-cidadão; horizontal é entre particulares", "Não há diferença"], "answer": 1, "explain": "A eficácia vertical regula a relação entre Estado e cidadão; a horizontal incide nas relações entre particulares."}, {"q": "Na eficácia horizontal IMEDIATA, a norma constitucional:", "options": ["Precisa sempre de uma lei intermediária", "Aplica-se diretamente à relação privada, sem ponte infraconstitucional", "Só vale para o Estado"], "answer": 1, "explain": "Na eficácia imediata, a dignidade humana e outros direitos aplicam-se diretamente à relação privada (ex.: empregador-empregado), sem necessidade de ponte infraconstitucional."}, {"q": "Qual julgado é o caso-símbolo da eficácia horizontal citado por Tartuce?", "options": ["STF, RE 201.819/RJ (exclusão de associado da UBC/ECAD sem ampla defesa)", "STF, ADIn 3.510 (células-tronco)", "STJ, Súmula 370"], "answer": 0, "explain": "No RE 201.819/RJ, o STF aplicou diretamente os direitos fundamentais (ampla defesa) para reintegrar associado excluído da UBC, ligada ao ECAD."}, {"q": "Por que Tartuce sugere chamar a CF/1988 de “Carta Fundamental”, e não “Carta Política”?", "options": ["Porque é mais dirigida ao legislador (eficácia vertical)", "Porque prevalece sua horizontalidade, aplicando-se diretamente às relações privadas", "Porque trata só de política"], "answer": 1, "explain": "“Carta Política” sugere eficácia vertical (dirigida ao legislador); “Carta Fundamental” realça a horizontalidade — a subsunção direta às relações interprivadas."}], "terms": [{"termo": "Eficácia vertical", "definicao": "Aplicação dos direitos fundamentais na relação entre o Estado e o cidadão.", "secao": "2.1.2"}, {"termo": "Eficácia horizontal", "definicao": "Aplicação dos direitos fundamentais também nas relações entre particulares.", "secao": "2.1.2"}, {"termo": "Eficácia horizontal imediata", "definicao": "O direito fundamental aplica-se diretamente à relação privada, sem ponte legal (base: art. 5º, § 1º, CF).", "secao": "2.1.2"}, {"termo": "Eficácia horizontal mediata", "definicao": "O direito fundamental entra na relação privada por meio das cláusulas gerais (a “porta de entrada”).", "secao": "2.1.2"}], "blocks": ["Com relação direta com o último tópico, constituindo outra tese de relevo do Direito Privado contemporâneo, é primaz estudar, agora de maneira mais aprofundada, a eficácia horizontal dos direitos fundamentais, mecanismo que torna possível o Direito Civil Constitucional.", "Essa horizontalização dos direitos fundamentais nada mais é do que o reconhecimento da existência e aplicação dos direitos que protegem a pessoa nas relações entre particulares. Nesse sentido, pode-se dizer que as normas constitucionais que protegem tais direitos têm aplicação imediata (eficácia horizontal imediata). Essa aplicação imediata está justificada pelo teor do art. 5.º, § 1.º, da Constituição Federal de 1988, pelo qual: “as normas definidoras dos direitos e garantias fundamentais têm aplicação imediata”. Para Daniel Sarmento, grande entusiasta da eficácia horizontal dos direitos fundamentais, a referida aplicação “é indispensável no contexto de uma sociedade desigual, na qual a opressão pode provir não apenas do Estado, mas de uma multiplicidade de atores privados, presentes em esferas como o mercado, a família, a sociedade civil e a empresa”.<sup class=\"fn\" title=\"Nota 22 do original — o texto da nota não faz parte deste trecho (Parte I)\">22</sup>", "Por certo é que essa eficácia horizontal traz uma visualização diversificada da matéria, eis que as normas de proteção da pessoa previstas na Constituição Federal sempre foram tidas como dirigidas ao legislador e ao Estado (normas programáticas). Essa concepção anterior não mais prevalece, o que faz com que a eficácia horizontal seja interessante à prática, a tornar mais evidente e concreta a proteção da dignidade da pessoa humana e de outros valores constitucionais.", "Do ponto de vista da terminologia, não se justifica mais denominar a Constituição Federal de 1988 como uma Carta Política, fazendo crer que ela é mais dirigida ao legislador, tendo uma eficácia vertical. Melhor denominá-la, portanto, como uma Carta Fundamental, pela prevalência de sua horizontalidade, ou seja, pela sua subsunção direta às relações interprivadas.", "Ilustre-se que a dignidade humana é conceito que pode ser aplicado dire
