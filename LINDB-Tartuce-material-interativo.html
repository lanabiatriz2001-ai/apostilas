 prático envolvendo o Código Civil em vigor.", "O art. 157 do CC consagra como vício ou defeito do negócio jurídico a lesão, presente quando a pessoa, por premente necessidade ou inexperiência, submete-se a uma situação desproporcional por meio de um negócio jurídico. O art. 171, inc. II, da atual codificação material, prevê que tal negócio é anulável, desde que proposta a ação anulatória no prazo decadencial de quatro anos contados da sua celebração (art. 178, inc. II).", "Entretanto, conforme o § 2.º do art. 157, pode-se percorrer o caminho da revisão do negócio, se a parte beneficiada com a desproporção oferecer suplemento suficiente para equilibrar o negócio. Recomenda-se sempre a revisão do contrato em casos tais, prestigiando--se a conservação do negócio jurídico e a função social dos contratos.", "Pois bem, sobre o instituto em estudo vejamos duas hipóteses:", "– Hipótese 1. Aplicação do art. 157, § 2.º, do CC, para a lesão usurária, prevista no Decreto-lei 22.626/1933 (Lei de Usura). Nessa hipótese haverá interpretação extensiva, pois o dispositivo somente será aplicado a outro caso de lesão. Amplia-se o sentido da norma, não rompendo os seus limites (subsunção).", "– Hipótese 2. Aplicação do art. 157, § 2.º, do CC, para o estado de perigo (art. 156 do CC). Nesse caso, haverá aplicação da analogia, pois o comando legal em questão está sendo aplicado a outro instituto jurídico (integração). Nesse sentido, prevê o Enunciado n. 148 do CJF/STJ, da III Jornada de Direito Civil, que “ao ‘estado de perigo’ (art. 156) aplica-se, por analogia, o disposto no § 2.º do art. 157”.", "Muitas vezes, porém, podem existir confusões, não havendo fórmula mágica para apontar se uma determinada situação envolve a aplicação da analogia ou da interpretação extensiva, devendo as situações concretas ser analisadas caso a caso.", "Regra importante que deve ser captada é que as normas de exceção ou normas excepcionais não admitem analogia ou interpretação extensiva.<sup class=\"fn\" data-n=\"21\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 21\">21</sup> Entre essas podem ser citadas as normas que restringem a autonomia privada que, do mesmo modo não admitem socorro a tais artifícios, salvo para proteger vulnerável ou um valor fundamental.", "A exemplificar, imagine-se que um pai quer hipotecar um imóvel em favor de um de seus filhos. Para tanto, haverá necessidade de autorização dos demais filhos? A resposta é negativa, pela ausência de tal requisito previsto em lei. Na verdade, há regra que exige a autorização para a venda entre pais e filhos (ascendentes e descendentes), sob pena de anulabilidade (art. 496 do CC). A norma não pode ser aplicada por analogia para a hipoteca, salvo para proteger um filho incapaz, por exemplo."]}, {"num": "1.4.2", "title": "1.4.2 Os costumes", "resumo": "Costumes são práticas e usos reiterados, de conteúdo lícito e com relevância jurídica. Classificam-se em: secundum legem (segundo a lei — quando a própria lei remete aos costumes; aqui há subsunção, não integração), praeter legem (na falta da lei — costume integrativo; ex.: o cheque pré-datado, cf. Súmula 370 do STJ) e contra legem (contra a lei — em regra não admitido, sobretudo pela vedação do abuso de direito, art. 187 do CC). A jurisprudência consolidada pode formar o costume judiciário.", "pontos": ["Costume = prática reiterada + conteúdo lícito + relevância jurídica.", "Secundum legem (subsunção) / praeter legem (integrativo) / contra legem (em regra, vedado).", "Exemplo de praeter legem: cheque pré-datado (Súmula 370 do STJ)."], "quiz": [{"q": "O costume aplicado quando a lei é omissa, funcionando como ferramenta de integração, chama-se:", "options": ["Costume secundum legem", "Costume praeter legem", "Costume contra legem"], "answer": 1, "explain": "Praeter legem = “na falta da lei”; é o costume integrativo. Ex.: o cheque pré-datado (Súmula 370 do STJ)."}, {"q": "Como se conceituam os costumes?", "options": ["Qualquer prática social", "Práticas e usos reiterados, com conteúdo lícito e relevância jurídica", "Apenas as leis não escritas do passado"], "answer": 1, "explain": "Costumes são as práticas e usos reiterados, com conteúdo lícito e relevância jurídica."}, {"q": "O costume “secundum legem”:", "options": ["Contraria a lei", "Incide quando a própria lei se refere aos costumes (há subsunção, não integração)", "Só existe na Common Law"], "answer": 1, "explain": "No costume secundum legem, a própria norma remete aos costumes (ex.: arts. 13 e 187 do CC) — há subsunção, não integração."}, {"q": "Sobre o costume contra legem, é correto afirmar que:", "options": ["É livremente admitido no Brasil", "Em regra não é admitido, sobretudo pela vedação do abuso de direito (art. 187 do CC)", "Prevalece sempre sobre a lei"], "answer": 1, "explain": "O costume contra legem contraria a lei; em regra não é admitido, especialmente diante da proibição do abuso de direito (art. 187 do CC)."}, {"q": "Qual súmula do STJ é citada como exemplo de costume praeter legem (cheque pré-datado)?", "options": ["Súmula 370 do STJ", "Súmula 7 do STJ", "Súmula Vinculante 25"], "answer": 0, "explain": "A Súmula 370 do STJ: “caracteriza dano moral a apresentação antecipada do cheque pré-datado” — exemplo de reconhecimento do costume praeter legem."}], "terms": [{"termo": "Costume secundum legem", "definicao": "Costume a que a própria lei se refere; sua aplicação é subsunção, não integração.", "secao": "1.4.2"}, {"termo": "Costume praeter legem", "definicao": "Costume aplicado na falta da lei (costume integrativo). Ex.: cheque pré-datado (Súmula 370 do STJ).", "secao": "1.4.2"}, {"termo": "Costume contra legem", "definicao": "Costume que contraria a lei; em regra não é admitido no Direito brasileiro.", "secao": "1.4.2"}], "blocks": ["Desde os primórdios do direito, os costumes desfrutam de larga projeção jurídica. No passado havia certa escassez de leis escritas, realidade ainda hoje presente nos países baseados no sistema da Common Law, caso da Inglaterra. Em alguns ramos jurídicos, o costume assume papel vital, como ocorre no Direito Internacional Privado (Lex Mercatoria).", "Os costumes podem ser conceituados como as práticas e usos reiterados com conteúdo lícito e relevância jurídica. Os costumes, assim, são formados, além da reiteração, por um conteúdo lícito, conceito adaptado ao que consta no Código Civil de 2002. Isso porque em vários dos dispositivos da vigente codificação é encontrada referência aos bons costumes, constituindo seu desrespeito abuso de direito, uma espécie de ilícito, pela previsão do seu art. 187. Também há menção aos bons costumes no art. 13 do CC, regra relacionada com os direitos da personalidade, pela qual “salvo por exigência médica, é defeso ato de disposição do próprio corpo, quando importar diminuição permanente da integridade física, ou contrariar os bons costumes”.", "Os costumes podem ser assim classificados:", "a) Costumes segundo a lei (secundum legem) – incidem quando há referência expressa aos costumes no texto legal, como ocorre nos artigos da codificação antes citados (arts. 13 e 187 do CC/2002). Na aplicação dos costumes secundum legem, não há integração, mas subsunção, eis que a própria norma jurídica é que é aplicada.", "b) Costumes na falta da lei (praeter legem) – aplicados quando a lei for omissa, sendo denominado costume integrativo, eis que ocorre a utilização propriamente dita dessa ferramenta de correção do sistema. Exemplos de aplicação do costume praeter legem são o antigo debate e o reconhecimento da validade do cheque pós-datado ou pré-datado. Como não há lei proibindo a emissão de cheque com data para depósito e tendo em vista as práticas comerciais, reconheceu-se a possibilidade de quebrar com a regra pela qual esse título de crédito é ordem de pagamento à vista. Tanto isso é verdade que a jurisprudência reconhece o dever de indenizar quando o cheque é depositado antes do prazo assinalado. Nesse sentido, a Súmula 370 do STJ prescreve: “caracteriza dano moral a apresentação antecipada do cheque pré-datado”.", "c) Costumes contra a lei (contra legem) – incidem quando a aplicação dos costumes contraria o que dispõe a lei. Entendo que, pelo que consta no Código Civil em vigor, especificamente pela proibição do abuso de direito (art. 187 do CC), não se pode admitir, em regra, a aplicação dos costumes contra legem. Eventualmente, havendo desuso da lei poderá o costume ser aplicado, o que não é pacífico. Também aqui, por regra, não há que se falar em integração.", "Na visão clássica do Direito Civil, os costumes teriam requisitos para aplicação como fonte do direito. Rubens Limongi França apresenta cinco, a saber: a) continuidade; b) uniformidade; c) diuturnidade; d) moralidade; e) obrigatoriedade.<sup class=\"fn\" data-n=\"22\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 22\">22</sup> Resumindo, afirma o jurista que “é necessário que o costume esteja arraigado na consciência popular após a sua prática durante um tempo considerável, e, além disso, goze da reputação de imprescindível norma costumeira”.<sup class=\"fn\" data-n=\"23\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 23\">23</sup>", "Por fim, destaque-se que a jurisprudência consolidada pode constituir elemento integrador do costume (costume judiciário ou jurisprudencial). Como exemplo, podem ser citados os entendimentos constantes em súmulas dos Tribunais Superiores (v.g., STF, STJ e TST). A decisão a seguir, proferida de forma pioneira no âmbito do Superior Tribunal de Justiça, traz interessante exemplo de extensão do costume judiciário em questão envolvendo o Direito Processual Civil:", "“Embargos de declaração. Agravo regimental contra decisão que negou seguimento a agravo de instrumento por ausência de certidão de intimação do acórdão recorrido. Súmula n.º 223 desta corte superior. Artigo 544, § 1.º, do Código de Processo Civil. Artigo 5.º, Inciso II, da Constituição Federal. Omissão e obscuridade inexistentes. Não há choque entre a Súmula n.º 223 do Superior Tribunal de Justiça e o princípio insculpido no artigo 5.º, inciso II, da Constituição Federal. A repetição constante de certos julgados, de forma pacífica, surgida com a necessidade de regular uma situação não prevista de forma expressa na legislação, encerra um elemento de generalidade, pois cria o que se pode chamar de costume judiciário, que, muitas vezes, dá ensejo à edição, pelos Tribunais, dos Enunciados de Súmula, os quais, embora não tenham caráter obrigatório, são acatados em razão dos princípios da segurança jurídica e economia processual. Se de modo uniforme o órgão colegiado tem entendido ser necessária a certidão de intimação do acórdão recorrido (Súmula n.º 223/Superior Tribunal de Justiça), assim o faz levando em conta os pressupostos recursais, no que se refere às peças essenciais, uma vez que, como se sabe, o questionado artigo do Código de Processo Civil não apresenta hipóteses numerus clausus, mas é apenas exemplificativo. A decisão judicial volta-se para a composição de litígios. Não é peça teórica ou acadêmica. Contenta-se o sistema com o desate da lide segundo a res iudicium deducta, o que se deu, no caso ora em exame. ‘É incabível, nos declaratórios, rever a decisão anterior, reexaminando ponto sobre o qual já houve pronunciamento, com inversão, em consequência, do resultado final. Nesse caso, há alteração substancial do julgado, o que foge ao disposto no art. 535 e incisos do CPC’ (RSTJ 30/412). Embargos de declaração rejeitados. Decisão unânime” (STJ, Embargos de Declaração no Agravo Regimental 280.797/SP, 2.ª Turma, Rel. Min. Domingos Franciulli Netto, j. 16.11.2000, DJU 05.03.2001, p. 147).", "A propósito, vale repisar que o Código de Processo Civil em vigor valorizou de maneira considerável os precedentes judiciais. Além do outrora citado art. 926 do CPC/2015, o Estatuto Processual emergente determina que as decisões judiciais devem ser devidamente fundamentadas, sob pena de nulidade (art. 11). Em complemento, preceitua-se que não se considera fundamentada qualquer decisão judicial que se limita a invocar precedente ou enunciado de súmula, sem identificar seus fundamentos determinantes nem demonstrar que o caso sob julgamento se ajusta àqueles fundamentos (art. 489, § 1.º, inc. V, do CPC/2015).", "Também merece ser citado o art. 332 do Codex pelo qual caberá o julgamento liminar do pedido, nas causas que dispensem a fase instrutória, quando o juiz, independentemente da citação do réu, perceber que o pleito contrarie: a) enunciado de súmula do Supremo Tribunal Federal ou do Superior Tribunal de Justiça; b) acórdão proferido pelo Supremo Tribunal Federal ou pelo Superior Tribunal de Justiça em julgamento de recursos repetitivos; c) entendimento firmado em incidente de resolução de demandas repetitivas ou de assunção de competência; e d) enunciado de súmula de tribunal de justiça sobre direito local.", "Reafirmo que o tempo e a prática já evidenciam a efetiva aplicação dessas regras, tendo os precedentes judiciais encontrado ampla aplicação no âmbito do Direito Privado Brasileiro nos últimos anos. Em certa medida, vivencia-se na nossa realidade uma quebra da plena adesão do sistema jurídico brasileiro à Civil Law, aproximando-o ao Common Law.", "Sendo analisados os costumes, parte-se para o estudo dos princípios gerais do Direito, uma das mais importantes fontes do Direito na atualidade."]}, {"num": "1.4.3", "title": "1.4.3 Os princípios gerais de Direito", "resumo": "Princípios gerais são regramentos básicos, mais amplos e abstratos que as normas, muitas vezes com posição na Constituição. Não precisam estar expressos para valer. O art. 5º da LINDB traz um princípio: o do fim social da norma — na aplicação da lei, o juiz deve buscar sua função social e o bem comum (repetido, com mais profundidade, no art. 8º do CPC/2015). O Código Civil de 2002 assenta-se em três princípios (Miguel Reale): eticidade (valorização da ética e da boa-fé objetiva), socialidade (superação do individualismo — o “eu” vira “nós”) e operabilidade (simplicidade e efetividade, via cláusulas gerais).", "pontos": ["Princípios são mais amplos/abstratos que as normas e não precisam estar expressos.", "Art. 5º da LINDB = princípio do fim social da norma.", "Três princípios do CC/2002 (Reale): eticidade, socialidade, operabilidade."], "quiz": [{"q": "Quais são os três princípios fundamentais do Código Civil de 2002, segundo Miguel Reale?", "options": ["Legalidade, moralidade e publicidade", "Eticidade, socialidade e operabilidade", "Autonomia, segurança e celeridade"], "answer": 1, "explain": "Da exposição de motivos de Reale: eticidade (boa-fé objetiva), socialidade (função social) e operabilidade (simplicidade e efetividade)."}, {"q": "Em comparação com as normas, os princípios são:", "options": ["Mais concretos e específicos", "Mais amplos e abstratos, muitas vezes com posição na Constituição", "Sempre inferiores às normas"], "answer": 1, "explain": "Os princípios são mais amplos e abstratos que as normas, muitas vezes com posição definida na Constituição Federal."}, {"q": "Os princípios gerais de direito precisam estar expressos na norma para valer?", "options": ["Sim, sempre", "Não — não precisam estar expressos (Nelson Nery Jr. e Rosa Nery)", "Só no Direito Penal"], "answer": 1, "explain": "Como destacam Nelson Nery Jr. e Rosa Nery, os princípios jurídicos não precisam estar expressos; muitos são imanentes ao sistema."}, {"q": "Qual princípio o art. 5º da LINDB consagra?", "options": ["O princípio da anterioridade", "O princípio do fim social da norma (função social e bem comum)", "O princípio da irretroatividade"], "answer": 1, "explain": "O art. 5º traz o princípio do fim social da norma: na aplicação da lei, o juiz deve atender à sua função social e ao bem comum (repetido no art. 8º do CPC/2015)."}, {"q": "O princípio da eticidade (CC/2002) está ligado principalmente a:", "options": ["À valorização da boa-fé objetiva", "À redução de prazos", "À forma dos contratos"], "answer": 0, "explain": "A eticidade valoriza a ética e a boa-fé objetiva (conduta de lealdade), com funções interpretativa, de controle e de integração no CC."}], "terms": [{"termo": "Princípios gerais de direito", "definicao": "Regramentos básicos, amplos e abstratos, que fundam e unificam o sistema; não precisam estar expressos para valer.", "secao": "1.4.3"}, {"termo": "Fim social da norma", "definicao": "Princípio do art. 5º da LINDB: na aplicação da lei, o juiz deve atender à sua função social e ao bem comum.", "secao": "1.4.3"}, {"termo": "Eticidade", "definicao": "Princípio do CC/2002: valorização da ética e da boa-fé objetiva.", "secao": "1.4.3"}, {"termo": "Socialidade", "definicao": "Princípio do CC/2002: superação do individualismo — toda categoria civil tem função social (“eu” vira “nós”).", "secao": "1.4.3"}, {"termo": "Operabilidade", "definicao": "Princípio do CC/2002: simplicidade e efetividade das categorias, via sistema aberto de cláusulas gerais.", "secao": "1.4.3"}], "blocks": ["O conceito de princípio constitui construção básica muitas vezes não conhecida pelos aplicadores do direito. Vejamos algumas construções doutrinárias que podem ser úteis ao estudioso no seu dia a dia jurídico.", "– Conceito da Enciclopédia Saraiva de Direito, obra clássica do século XX, em verbete elaborado pelo jurista alagoano Sílvio de Macedo: “a palavra princípio vem de principium, que significa início, começo, ponto de partida, origem. Em linguagem científica princípio quer dizer fundamento, causa, estrutura. O termo foi introduzido na filosofia por Anaximandro de Mileto, filósofo pré-socrático, que viveu entre 610 a 547 a.C.”.<sup class=\"fn\" data-n=\"24\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 24\">24</sup>", "– Miguel Reale: “Os princípios são ‘verdades fundantes’ de um sistema de conhecimento, como tais admitidas, por serem evidentes ou por terem sido comprovadas, mas também por motivos de ordem prática de caráter operacional, isto é, como pressupostos exigidos pelas necessidades da pesquisa e da praxis”.<sup class=\"fn\" data-n=\"25\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 25\">25</sup>", "– José de Oliveira Ascensão: “Os princípios são as grandes orientações formais da ordem jurídica brasileira, que fundam e unificam normas e soluções singulares”.<sup class=\"fn\" data-n=\"26\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 26\">26</sup>", "– Francisco Amaral: “Os princípios jurídicos são pensamentos diretores de uma regulamentação jurídica. São critérios para a ação e para a constituição de normas e modelos jurídicos. Como diretrizes gerais e básicas, fundamentam e dão unidade a um sistema ou a uma instituição. O direito, como sistema, seria assim um conjunto ordenado segundo princípios”.<sup class=\"fn\" data-n=\"27\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 27\">27</sup>", "– Maria Helena Diniz: os princípios são “cânones que não foram ditados, explicitamente, pelo elaborador da norma, mas que estão contidos de forma imanente no ordenamento jurídico. Observa Jeanneau que os princípios não têm existência própria, estão ínsitos no sistema, mas é o juiz que, ao descobri-los, lhes dá força e vida. Esses princípios que servem de base para preencher lacunas não podem opor-se às disposições do ordenamento jurídico, pois devem fundar-se na natureza do sistema jurídico, que deve apresentar-se como um ‘organismo’ lógico, capaz de conter uma solução segura para o caso duvidoso”.<sup class=\"fn\" data-n=\"28\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 28\">28</sup>", "– Nelson Nery Jr. e Rosa Nery: “Princípios gerais de direito. São regras de conduta que norteiam o juiz na interpretação da norma, do ato ou negócio jurídico. Os princípios gerais de direito não se encontram positivados no sistema normativo. São regras estáticas que carecem de concreção. Têm como função principal auxiliar o juiz no preenchimento das lacunas”.<sup class=\"fn\" data-n=\"29\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 29\">29</sup>", "Vislumbradas tais definições, constata-se que confrontados com as normas jurídicas, os princípios são mais amplos, abstratos, muitas vezes com posição definida na Constituição Federal. São esses os pontos que os diferenciam das normas, dotadas de concretismo – denota-se um alto grau de concretude –, de uma posição de firmeza, em oposição ao nexo deôntico relativo que acompanha os princípios.", "Ambos os conceitos – de princípios e normas – apontam as decisões particulares a serem tomadas no caso prático pelo aplicador do direito, existindo diferença somente em relação ao caráter da informação que fornecem. As normas deverão ser sempre aplicadas, sob pena de suportar consequências jurídicas determinadas previamente.", "Pois bem, o próprio art. 5.º da Lei de Introdução traz em seu bojo um princípio: o do fim social da norma. O magistrado, na aplicação da lei, deve ser guiado pela sua função ou fim social e pelo objetivo de alcançar o bem comum (a pacificação social). O comando legal é fundamental, ainda, por ser critério hermenêutico, a apontar a correta conclusão a respeito uma determinada lei que surge para a sociedade, o que foi repetido pelo art. 8.º do CPC/2015, ainda com maior profundidade e extensão, pela menção aos princípios da dignidade da pessoa humana, da proporcionalidade, da razoabilidade, da legalidade, da publicidade e da eficiência.", "Ilustrando, entrou em vigor no Brasil, no ano de 2007, a lei que possibilita o divórcio e o inventário extrajudiciais (Lei 11.441/2007, que introduziu o art. 1.124-A no então CPC/1973). Como finalidades da nova norma, a guiar o intérprete, podem ser apontadas a desjudicialização ou extrajudicialização dos conflitos, a redução de formalidades e de burocracia, a simplicidade, a facilitação de extinção dos vínculos familiares, entre outras. Esses fins sociais também guiam o Código de Processo Civil de 2015, que igualmente tratou do divórcio e do inventário extrajudiciais, nos seus arts. 733 e 610, além de outros mecanismos de fuga do Judiciário.", "Historicamente, não se pode esquecer que os princípios já estavam previstos como forma de integração da norma no direito romano, de acordo com as regras criadas pelo imperador, as leges, entre 284 a 568 d.C. Nesse sentido, não se pode perder de vista dos princípios jurídicos consagrados pelo direito romano ou mandamentos do Direito Romano: honeste vivere, alterum non laedere, suum cuique tribuere (viver honestamente, não lesar a ninguém, dar a cada um o que é seu, respectivamente).", "Tais regramentos continuam sendo invocados, tanto pela doutrina quanto pela jurisprudência, sendo artifícios de argumentação dos mais interessantes. Aplicando um desses mandamentos, transcreve-se, do Tribunal de Justiça de Minas Gerais:", "“Ação de cobrança. Pagamento indevido. Enriquecimento ilícito. Restituição. Recurso a que se nega provimento. O enriquecimento sem causa tem como pressuposto um acréscimo patrimonial injustificado e a finalidade de restituição ao patrimônio de quem empobreceu. Ele encontra seu fundamento no velho princípio de justiça suum cuique tribuere, dar a cada um o que é seu. Nessa toada, em que pesem a alardeada boa-fé e a situação econômica precária, com base simplesmente na concepção pura do enriquecimento sem causa, constata-se a necessidade de o Apelante restituir os valores recebidos indevidamente ao Apelado” (TJMG, Acórdão 1.0024.06.025798-7/001, 13.ª Câmara Cível, Belo Horizonte, Rel. Des. Cláudia Maia, j. 10.05.2007, DJMG 25.05.2007).", "Como destacam Nelson Nery Jr. e Rosa Maria de Andrade Nery, os princípios jurídicos não precisam estar expressos na norma.<sup class=\"fn\" data-n=\"30\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 30\">30</sup> A conclusão é perfeita, devendo ser tida como majoritária. Exemplifique-se que o princípio da função social do contrato é expresso no Código Civil de 2002 (arts. 421 e 2.035, parágrafo único), mas implícito ao Código de Defesa do Consumidor e mesmo à CLT, que trazem uma lógica de proteção do vulnerável, do consumidor e do trabalhador, consagrando o regramento em questão, diante do seu sentido coletivo, de diminuição da injustiça social.", "A propósito, o princípio da função social dos contratos deve ser analisado perante os fundamentos retirados da Lei 13.874/2019, conhecida como Lei da Liberdade Econômica e originária da Medida Provisória 881, que traz uma profunda valorização da liberdade individual, remontando à antiga ideia de autonomia da vontade. Conforme seu art. 2.º, são princípios que norteiam o disposto nesta norma: a) a liberdade como uma garantia no exercício de atividades econômicas; b) a boa-fé do particular perante o poder público; c) a intervenção subsidiária e excepcional do Estado sobre o exercício de atividades econômicas; e d) o reconhecimento da vulnerabilidade do particular perante o Estado. No decorrer deste livro, especialmente no Capítulo 5, veremos como se dá essa confrontação e como essa lei especial tem sido aplicada.", "Com a entrada em vigor do Código Civil de 2002, ganhou força a corrente doutrinária clássica nacional que apontou para o fato de não se poder desassociar dos princípios o seu valor coercitivo, tese defendida por Rubens Limongi França em sua festejada e clássica obra sobre o tema.<sup class=\"fn\" data-n=\"31\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 31\">31</sup> Os princípios gerais devem assim trilhar o aplicador do direito na busca da justiça, estando sempre baseados na estrutura da sociedade.", "A partir de todos esses ensinamentos transcritos, é possível conceituar os princípios como fontes do direito, conforme previsão do art. 4.º da Lei de Introdução, o que denota o seu caráter normativo. Analisando os seus fins, os princípios gerais são regramentos básicos aplicáveis a determinado instituto ou ramo jurídico, para auxiliar o aplicador do direito na busca da justiça e da pacificação social. Sob o prisma da sua origem, os princípios são abstraídos das normas jurídicas, dos costumes, da doutrina, da jurisprudência e de aspectos políticos, econômicos e sociais.", "O Código Civil de 2002 consagra três princípios fundamentais, como se extrai da sua exposição de motivos, elaborada por Miguel Reale, a saber:", "a) Princípio da Eticidade – Trata-se da valorização da ética e da boa-fé, principalmente daquela que existe no plano da conduta de lealdade das partes (boa-fé objetiva). Pelo Código Civil de 2002, a boa-fé objetiva tem função de interpretação dos negócios jurídicos em geral (art. 113 do CC). Serve ainda como controle das condutas humanas, eis que a sua violação pode gerar o abuso de direito, nova modalidade de ilícito (art. 187). Por fim, a boa-fé objetiva tem a função de integrar todas as fases pelas quais passa o contrato (art. 422 do CC). Acrescente-se que a eticidade também parece ser regramento adotado pelo Código de Processo Civil de 2015, pela constante valorização da boa-fé processual, notadamente pelos seus arts. 5.º e 6.º.", "b) Princípio da Socialidade – Segundo apontava o próprio Miguel Reale, um dos escopos da nova codificação foi o de superar o caráter individualista e egoísta da codificação anterior. Assim, a palavra “eu” é substituída por “nós”. Todas as categorias civis têm função social: o contrato, a empresa, a propriedade, a posse, a família, a responsabilidade civil.", "c) Princípio da Operabilidade – Esse princípio tem dois sentidos. Primeiro, o de simplicidade ou facilitação das categorias privadas, o que pode ser percebido, por exemplo, pelo tratamento diferenciado da prescrição e da decadência. Segundo, há o sentido de efetividade ou concretude, o que foi buscado pelo sistema aberto de cláusulas gerais adotado pela atual codificação material. Na minha opinião doutrinária, o sistema de cláusulas gerais também foi adotado pelo CPC/2015, pela adoção de um modelo aberto, baseado em princípios como a dignidade da pessoa humana e a boa-fé objetiva.", "A análise mais profunda de tais princípios e das cláusulas gerais consta da primeira parte do próximo capítulo desta obra, em que se busca explicar a filosofia da atual codificação privada."]}, {"num": "1.4.4", "title": "1.4.4 A equidade", "resumo": "Equidade é o uso do bom senso, a justiça do caso concreto, adaptando razoavelmente a lei à situação (na visão aristotélica, a “justiça do caso concreto”). No sistema contemporâneo, Tartuce a considera fonte informal/indireta do Direito. Classifica-se em equidade legal (a própria lei prevê sua aplicação — ex.: redução equitativa da cláusula penal, art. 413 do CC) e equidade judicial (a lei manda o juiz decidir por equidade). Importante distinção: julgar POR equidade (afastar as normas e decidir por outros critérios) ≠ julgar COM equidade (decidir conforme a justiça do caso). CLT (art. 8º) e CDC (art. 7º) preveem a equidade expressamente como fonte.", "pontos": ["Equidade = justiça do caso concreto (Aristóteles); fonte informal/indireta.", "Equidade legal (prevista na lei) x equidade judicial (o juiz é mandado decidir por equidade).", "Julgar POR equidade (afasta a norma) ≠ julgar COM equidade (justiça do caso).", "CLT (art. 8º) e CDC (art. 7º) trazem a equidade expressamente."], "quiz": [{"q": "Na distinção feita por Tartuce, “julgar com equidade” significa:", "options": ["Desconsiderar as normas e decidir por outras regras", "Decidir de acordo com a justiça do caso concreto", "Aplicar sempre a lei ao pé da letra"], "answer": 1, "explain": "Julgar COM equidade = decidir conforme a justiça do caso concreto. Julgar POR equidade seria desconsiderar as normas."}, {"q": "Como se conceitua a equidade?", "options": ["O uso do bom senso, a justiça do caso concreto (Aristóteles)", "A aplicação literal da lei", "O costume contra a lei"], "answer": 0, "explain": "Equidade é o uso do bom senso, a justiça do caso particular — na concepção aristotélica, a justiça do caso concreto."}, {"q": "No sistema contemporâneo, Tartuce considera a equidade:", "options": ["Fonte formal e primária", "Fonte informal ou indireta do direito", "Não é fonte do direito"], "answer": 1, "explain": "No sistema privado contemporâneo, a equidade deve ser considerada fonte informal ou indireta do direito."}, {"q": "A equidade legal é aquela em que:", "options": ["A lei manda o juiz decidir por equidade", "A aplicação está prevista no próprio texto legal (ex.: redução da cláusula penal, art. 413)", "O juiz decide sem qualquer previsão"], "answer": 1, "explain": "Equidade legal: a aplicação está prevista no texto legal — ex.: a redução equitativa da cláusula penal (art. 413 do CC)."}, {"q": "Em quais ramos a equidade é prevista expressamente como fonte, segundo o texto?", "options": ["No Direito do Trabalho (art. 8º da CLT) e no Direito do Consumidor (art. 7º do CDC)", "No Direito Penal e Tributário", "Apenas no Direito Civil"], "answer": 0, "explain": "A equidade é nominalmente fonte no Direito do Trabalho (art. 8º da CLT) e no Direito do Consumidor (art. 7º do CDC)."}], "terms": [{"termo": "Equidade", "definicao": "Uso do bom senso; a justiça do caso concreto, adaptando razoavelmente a lei à situação (Aristóteles).", "secao": "1.4.4"}, {"termo": "Julgar por x com equidade", "definicao": "Julgar POR equidade = afastar as normas e decidir por outros critérios; julgar COM equidade = decidir conforme a justiça do caso.", "secao": "1.4.4"}], "blocks": ["Na visão clássica do Direito Civil, a equidade era tratada não como um meio de suprir a lacuna da lei, mas sim como um mero meio de auxiliar nessa missão.<sup class=\"fn\" data-n=\"32\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 32\">32</sup>", "Todavia, no sistema contemporâneo privado, a equidade deve ser considerada fonte informal ou indireta do direito. Aliás, após a leitura do próximo capítulo desta obra, não restará qualquer dúvida de que a equidade também pode ser tida como fonte do Direito Civil Contemporâneo, principalmente diante dos regramentos orientadores adotados pela nova codificação.", "A equidade pode ser conceituada como o uso do bom senso, a justiça do caso particular, mediante a adaptação razoável da lei ao caso concreto. Na concepção aristotélica é definida como a justiça do caso concreto, o julgamento com a convicção do que é justo. Na doutrina contemporânea, ensinam Pablo Stolze Gagliano e Rodolfo Pamplona Filho que “o julgamento por equidade (e não com equidade) é tido, em casos excepcionais, como fonte do direito, quando a própria lei atribui ao juiz a possibilidade de julgar conforme os seus ditames”.<sup class=\"fn\" data-n=\"33\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 33\">33</sup> Ora, como pelo Código Civil de 2002 é comum essa ingerência, não há como declinar a condição da equidade como fonte jurídica, não formal, indireta e mediata.", "Ato contínuo de estudo, a equidade, de acordo com a doutrina, pode ser classificada da seguinte forma:", "a) Equidade legal – aquela cuja aplicação está prevista no próprio texto legal. Exemplo pode ser retirado do art. 413 do CC/2002, que estabelece a redução equitativa da multa ou cláusula penal como um dever do magistrado (“A penalidade deve ser reduzida equitativamente pelo juiz se a obrigação principal tiver sido cumprida em parte, ou se o montante da penalidade for manifestamente excessivo, tendo-se em vista a natureza e a finalidade do negócio”).", "b) Equidade judicial – presente quando a lei determina que o magistrado deve decidir por equidade o caso concreto. Isso pode ser notado pelo art. 127 do CPC/1973, ora revogado, pelo qual “o juiz só decidirá por equidade nos casos previstos em lei”. Como visto, a norma foi repetida pelo art. 140, parágrafo único, do CPC/2015.", "Os conceitos expostos são muito parecidos e até se confundem. De fato, no segundo caso há uma ordem ao juiz, de forma expressa, o que não ocorre dessa forma na equidade legal, mas apenas implicitamente. Até pela confusão conceitual, a classificação acima perde um pouco a relevância prática.", "No que tange ao art. 127 do CPC/1973 e ao art. 140, parágrafo único, do CPC/2015, os dispositivos são criticáveis, uma vez que, nas suas literalidades, somente autorizam a aplicação da equidade aos casos previstos em lei.", "Na verdade, nos planos teóricos e práticos, é feita uma diferenciação entre os termos julgar por equidade e julgar com equidade.", "Julgar por equidade significaria desconsiderar as regras e normas jurídicas, decidindo--se com outras regras. A título de exemplo, o julgador decide com base em máximas econômicas, como a teoria dos jogos.", "Por seu turno, julgar com equidade tem o sentido de decidir-se de acordo com a justiça do caso concreto. Como as expressões são muito próximas, sempre causaram confusão entre os aplicadores do Direito, o que muitas vezes afasta a aplicação da equidade como se espera.", "Ora, a justiça do caso concreto é a prioridade do Direito, não havendo necessidade de autorização expressa pela norma jurídica. Ademais, pode-se dizer que a equidade é implícita à própria lei. O dispositivo anterior, aliás, era duramente criticado, entre tantos, por Miguel Reale, que o considerava como exageradamente rigoroso e causador de dúvidas e confusões.<sup class=\"fn\" data-n=\"34\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 34\">34</sup> Por isso, penso que o seu sentido não deveria ter sido repetido pelo CPC/2015, tema que foi profundamente debatido na sua tramitação, vencida a tese de permanência da regra.", "Por fim, interessa apontar que em outros ramos jurídicos a equidade é considerada nominalmente como verdadeira fonte do Direito, como acontece no Direito do Trabalho, pela previsão expressa do art. 8.º da CLT, nos seguintes termos: “as autoridades administrativas e a Justiça do Trabalho, na falta de disposições legais ou contratuais, decidirão, conforme o caso, pela jurisprudência, por analogia, por equidade e outros princípios e normas gerais de direito, principalmente do direito de trabalho, e, ainda, de acordo com os usos e costumes, o direito comparado, mas sempre de maneira que nenhum interesse de classe ou particular prevaleça sobre o interesse público” (texto destacado).", "O mesmo ocorre com o Direito do Consumidor, pela menção expressa à equidade como última palavra do art. 7.º, caput, da Lei 8.078/1990, in verbis: “os direitos previstos neste código não excluem outros decorrentes de tratados ou convenções internacionais de que o Brasil seja signatário, da legislação interna ordinária, de regulamentos expedidos pelas autoridades administrativas competentes, bem como dos que derivem dos princípios gerais do direito, analogia, costumes e equidade”. Esse tratamento amplo da equidade, sem qualquer ressalva ou limitação, parece ser o mais correto na minha opinião doutrinária."]}]}, {"num": "1.5", "title": "1.5 APLICAÇÃO DA NORMA JURÍDICA NO TEMPO. O ART. 6.º DA LEI DE INTRODUÇÃO", "resumo": "A lei nasce para valer ao futuro: a irretroatividade é a regra, e a retroatividade é a exceção (que precisa estar prevista em lei e respeitar a CF). O art. 6º da LINDB (e o art. 5º, XXXVI, da CF) protege três categorias contra a lei nova: direito adquirido, ato jurídico perfeito e coisa julgada. O direito adquirido é o conceito mais amplo (engloba os outros); a coisa julgada é o mais restrito. Essa proteção NÃO é absoluta: há forte tendência de relativizá-la por meio da ponderação (Robert Alexy; art. 489, § 2º, do CPC/2015) — exemplo clássico é a relativização da coisa julgada em ações de investigação de paternidade julgadas sem exame de DNA. Existe ainda a retroatividade motivada (art. 2.035, parágrafo único, do CC): normas de ordem pública ligadas à função social podem retroagir.", "pontos": ["Regra: irretroatividade; exceção: retroatividade (prevista em lei + respeito à CF).", "Art. 6º protege: direito adquirido, ato jurídico perfeito e coisa julgada.", "Direito adquirido = mais amplo; coisa julgada = mais restrito.", "Proteção não absoluta: ponderação (Alexy; art. 489, § 2º, CPC).", "Retroatividade motivada: normas de ordem pública podem retroagir (art. 2.035, único, CC)."], "quiz": [{"q": "Quais três categorias o art. 6º da LINDB protege contra a lei nova?", "options": ["Direito adquirido, ato jurídico perfeito e coisa julgada", "Vida, liberdade e propriedade", "Legalidade, moralidade e eficiência"], "answer": 0, "explain": "Art. 6º: “a lei nova terá efeito imediato e geral, respeitados o ato jurídico perfeito, o direito adquirido e a coisa julgada”."}, {"q": "Em regra, quanto à aplicação da norma no tempo:", "options": ["A retroatividade é a regra", "A irretroatividade é a regra, e a retroatividade, a exceção", "A lei nunca retroage"], "answer": 1, "explain": "Ordinariamente, a irretroatividade é a regra e a retroatividade é a exceção (que precisa estar prevista em lei e respeitar a CF)."}, {"q": "Entre as três categorias do art. 6º, qual é a mais ampla e qual a mais restrita?", "options": ["A coisa julgada é a mais ampla; o direito adquirido, o mais restrito", "O direito adquirido é o mais amplo; a coisa julgada, o mais restrito", "São equivalentes"], "answer": 1, "explain": "O direito adquirido é o mais amplo (engloba os demais); a coisa julgada é o conceito mais restrito."}, {"q": "A proteção do direito adquirido, do ato jurídico perfeito e da coisa julgada é absoluta?", "options": ["Sim, é absoluta", "Não — há tendência de relativização pela ponderação (Alexy; art. 489, § 2º, CPC)", "Só é absoluta para a coisa julgada"], "answer": 1, "explain": "A proteção não é absoluta. Vive-se a era da ponderação (Alexy), adotada pelo art. 489, § 2º, do CPC/2015."}, {"q": "O que é o ato jurídico perfeito (art. 6º, § 1º)?", "options": ["O ato que ainda vai se consumar", "O já consumado segundo a lei vigente ao tempo em que se efetuou", "A decisão da qual não cabe recurso"], "answer": 1, "explain": "Ato jurídico perfeito é o já consumado de acordo com a lei vigente ao tempo em que se efetuou (ex.: contrato já celebrado gerando efeitos)."}, {"q": "Um exemplo clássico de relativização da coisa julgada citado no texto é:", "options": ["A revisão de contratos bancários", "A investigação de paternidade julgada improcedente por falta de prova, antes do exame de DNA", "A execução de sentença estrangeira"], "answer": 1, "explain": "A coisa julgada é relativizada em ações de investigação de paternidade julgadas improcedentes por ausência de prova, quando ainda não existia o exame de DNA (Enunciado 109 do CJF; STJ e STF)."}, {"q": "A “retroatividade motivada ou justificada” (art. 2.035, parágrafo único, do CC) permite que:", "options": ["Qualquer lei retroaja", "Normas de ordem pública ligadas à função social (propriedade/contratos) retroajam", "Nenhuma norma retroaja"], "answer": 1, "explain": "As normas de ordem pública relativas à função social da propriedade e dos contratos podem retroagir (retroatividade motivada), sem inconstitucionalidade."}], "terms": [{"termo": "Irretroatividade", "definicao": "Regra de que a lei nova não alcança fatos passados. A retroatividade é exceção (prevista em lei e conforme a CF).", "secao": "1.5"}, {"termo": "Direito adquirido", "definicao": "Direito já incorporado ao patrimônio da pessoa; o mais amplo dos três protegidos pelo art. 6º.", "secao": "1.5"}, {"termo": "Ato jurídico perfeito", "definicao": "Ato já consumado segundo a lei vigente ao tempo em que se efetuou (art. 6º, § 1º).", "secao": "1.5"}, {"termo": "Coisa julgada", "definicao": "Decisão judicial da qual não cabe mais recurso (art. 6º, § 3º); o mais restrito dos três.", "secao": "1.5"}, {"termo": "Ponderação", "definicao": "Técnica (Robert Alexy; art. 489, § 2º, do CPC) de sopesar princípios/valores em colisão para decidir o caso.", "secao": "1.5"}, {"termo": "Retroatividade motivada", "definicao": "Situação em que normas de ordem pública (função social) podem retroagir (art. 2.035, parágrafo único, do CC).", "secao": "1.5"}], "blocks": ["A norma jurídica é criada para valer ao futuro, não ao passado. Entretanto, eventualmente, pode uma determinada norma atingir também os fatos pretéritos, desde que sejam respeitados os parâmetros que constam da Lei de Introdução e da Constituição Federal. Em síntese, ordinariamente, a irretroatividade é a regra, e a retroatividade, a exceção. Para que a retroatividade seja possível, como primeiro requisito, deve estar prevista em lei.", "Valendo para o futuro ou para o passado, tendo em vista a certeza e a segurança jurídica, determina o art. 5.º, inc. XXXVI, da CF/1988 que: “a lei não prejudicará o direito adquirido, o ato jurídico perfeito e a coisa julgada”. A norma constitui outro requisito para a retroatividade.", "O art. 6.º da Lei de Introdução, além de trazer regra semelhante pela qual “a lei nova terá efeito imediato e geral respeitados o ato jurídico perfeito, o direito adquirido e a coisa julgada”, procura conceituar as categorias acima, da seguinte forma:", "a) Direito adquirido: é o direito material ou imaterial incorporado no patrimônio de uma pessoa natural, jurídica ou ente despersonalizado. Pela previsão do § 2.º do art. 6.º da Lei de Introdução, “consideram-se adquiridos assim os direitos que o seu titular, ou alguém por ela, possa exercer, como aqueles cujo começo do exercício tenha tempo prefixo, ou condição preestabelecida inalterável, a arbítrio de outrem”. Como exemplo pode ser citado um benefício previdenciário desfrutado por alguém.", "b) Ato jurídico perfeito: é a manifestação de vontade lícita, emanada por quem esteja em livre disposição, e aperfeiçoada. De acordo com o que consta do texto legal (art. 6.º, § 1.º, Lei de Introdução), o ato jurídico perfeito é aquele consumado de acordo com lei vigente ao tempo em que se efetuou. Exemplo: um contrato anterior já celebrado e que esteja gerando efeitos.", "c) Coisa julgada: é a decisão judicial prolatada, da qual não cabe mais recurso (art. 6.º, § 3.º, Lei de Introdução).", "A partir desses conceitos, pode-se afirmar que o direito adquirido é o mais amplo de todos, englobando os demais, uma vez que tanto no ato jurídico perfeito quanto na coisa julgada existiriam direitos dessa natureza, já consolidados. Em complemento, a coisa julgada também deve ser considerada um ato jurídico perfeito, sendo o conceito mais restrito. Tal convicção pode ser concebida pelo desenho a seguir:", "Questão contemporânea das mais relevantes é saber se a proteção de tais categorias é absoluta. A resposta é negativa, diante da forte tendência de relativizar princípios e regras em sede de Direito. Em reforço, vivificamos a era da ponderação dos princípios e de valores, sobretudo os de índole constitucional, tema muito bem desenvolvido por Robert Alexy.<sup class=\"fn\" data-n=\"35\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 35\">35</sup> Tanto isso é verdade que o Código de Processo Civil de 2015 adotou expressamente a ponderação no seu art. 489, § 2.º, in verbis: “no caso de colisão entre normas, o juiz deve justificar o objeto e os critérios gerais da ponderação efetuada, enunciando as razões que autorizam a interferência na norma afastada e as premissas fáticas que fundamentam a conclusão”.", "Ilustrando, inicialmente, há forte tendência material e processual em apontar a relativização da coisa julgada, particularmente nos casos envolvendo ações de investigação de paternidade julgadas improcedentes por ausência de provas em momento em que não existia o exame de DNA. Nesse sentido, doutrinariamente, dispõe o Enunciado n. 109 do Conselho da Justiça Federal, da I Jornada de Direito Civil, que “a restrição da coisa julgada oriunda de demandas reputadas improcedentes por insuficiência de prova não deve prevalecer para inibir a busca da identidade genética pelo investigando”.", "Na mesma linha o Superior Tribunal de Justiça tem decisões no sentido da possibilidade de relativização da coisa julgada material em situações tais. Nesse sentido, cumpre transcrever o mais famoso dos precedentes judiciais a respeito do tema:", "“Processo civil. Investigação de paternidade. Repetição de ação anteriormente ajuizada, que teve seu pedido julgado improcedente por falta de provas. Coisa julgada. Mitigação. Doutrina. Precedentes. Direito de família. Evolução. Recurso acolhido. I – Não excluída expressamente a paternidade do investigado na primitiva ação de investigação de paternidade, diante da precariedade da prova e da ausência de indícios suficientes a caracterizar tanto a paternidade como a sua negativa, e considerando que, quando do ajuizamento da primeira ação, o exame pelo DNA ainda não era disponível e nem havia notoriedade a seu respeito, admite-se o ajuizamento de ação investigatória, ainda que tenha sido aforada uma anterior com sentença julgando improcedente o pedido. II – Nos termos da orientação da Turma, ‘sempre recomendável a realização de perícia para investigação genética (HLA e DNA), porque permite ao julgador um juízo de fortíssima probabilidade, senão de certeza’ na composição do conflito. Ademais, o progresso da ciência jurídica, em matéria de prova, está na substituição da verdade ficta pela verdade real. III – A coisa julgada, em se tratando de ações de estado, como no caso de investigação de paternidade, deve ser interpretada modus in rebus. Nas palavras de respeitável e avançada doutrina, quando estudiosos hoje se aprofundam no reestudo do instituto, na busca, sobretudo, da realização do processo justo, ‘a coisa julgada existe como criação necessária à segurança prática das relações jurídicas e as dificuldades que se opõem à sua ruptura se explicam pela mesmíssima razão. Não se pode olvidar, todavia, que numa sociedade de homens livres, a Justiça tem de estar acima da segurança, porque sem Justiça não há liberdade’. IV – Este Tribunal tem buscado, em sua jurisprudência, firmar posições que atendam aos fins sociais do processo e às exigências do bem comum” (STJ, REsp 226.436/PR (199900714989), 414113, Data da decisão: 28.06.2001, 4.ª Turma, Rel. Min. Sálvio de Figueiredo Teixeira, DJ 04.02.2002, p. 370, RBDF 11/73, RDR 23/354, RSTJ 154/403).", "Pelo que consta da ementa do julgado, é possível uma nova ação para a prova da paternidade, se a ação anterior foi julgada improcedente em momento em que não existia o exame de DNA. Frise-se que a questão pode perfeitamente ser solucionada a partir da técnica de ponderação, desenvolvida, entre outros, por Robert Alexy e adotada expressamente pelo art. 489, § 2.º, do CPC/2015.<sup class=\"fn\" data-n=\"36\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 36\">36</sup>", "No caso em questão, estão em conflito a proteção da coisa julgada (art. 5.º, inc. XXXVI, da CF/1988) e a dignidade do suposto filho de saber quem é o seu pai, o que traduz o direito à verdade biológica (art. 1.º, inc. III, da CF/1988). Nessa colisão entre direitos fundamentais, o Superior Tribunal de Justiça posicionou-se favoravelmente ao segundo. Outros julgados do mesmo Tribunal Superior têm seguido a mesma linha de raciocínio (nesse sentido, ver decisão publicada no Informativo n. 354 do STJ, de abril de 2008 – REsp 826.698/MS, Rel. Min. Nancy Andrighi, j. 06.05.2008).", "Cumpre destacar que o Supremo Tribunal Federal, em decisão ainda mais atual, publicada no seu Informativo n. 622 (abril de 2011), confirmou a tendência de mitigação da coisa julgada. Conforme o relator do julgado, Ministro Dias Toffoli, há “um caráter personalíssimo, indisponível e imprescritível do reconhecimento do estado de filiação, considerada a preeminência do direito geral da personalidade”; devendo este direito superar a máxima da coisa julgada. Em seguida, ratificou a premissa de que o “princípio da segurança jurídica não seria, portanto, absoluto, e que não poderia prevalecer em detrimento da dignidade da pessoa humana, sob o prisma do acesso à informação genética e da personalidade do indivíduo” (STF, RE 363.889/DF, Rel. Min. Dias Toffoli, 07.04.2011).", "Seguindo-se com os estudos, quanto à relativização de proteção do direito adquirido e do ato jurídico perfeito, o Código Civil em vigor, contrariando a regra de proteção apontada, traz, nas suas disposições finais transitórias, dispositivo polêmico, pelo qual os preceitos relacionados com a função social dos contratos e da propriedade podem ser aplicados às convenções e negócios celebrados na vigência do Código Civil anterior, mas cujos efeitos têm incidência na vigência da nova codificação material. Enuncia o parágrafo único do art. 2.035 do Código em vigor, norma de direito intertemporal:", "“Art. 2.035. (...). Parágrafo único. Nenhuma convenção prevalecerá se contrariar os preceitos de ordem pública, tais como os estabelecidos por este Código para assegurar a função social da propriedade e dos contratos”.", "O dispositivo consagra o princípio da retroatividade motivada ou justificada, pelo qual as normas de ordem pública relativas à função social da propriedade e dos contratos podem retroagir. Não há qualquer inconstitucionalidade na norma, eis que amparada na função social da propriedade, prevista no art. 5.º, incs. XXII e XXIII, da Constituição Federal. Quando se lê no dispositivo civil transcrito a expressão “convenção”, pode-se ali enquadrar qualquer ato jurídico celebrado, inclusive os negócios jurídicos celebrados antes da entrada em vigor da nova lei geral privada e cujos efeitos ainda estão sendo sentidos atualmente, na vigência da codificação de 2002.", "A norma vem recebendo a correta aplicação pela jurisprudência nacional. Fazendo incidir o art. 2.035, parágrafo único, do CC, à importante questão da multa contratual, do Tribunal de Justiça de Sergipe:", "“Civil. Ações declaratórias de inexigibilidade de títulos e cautelares de sustação de protestos. Intempestividade. Não configurada. Litispendência. Extinção do feito. Rescisão contratual. Atraso. Cláusula penal. Alegação de prejuízo. Desnecessidade. Redução da multa convencional. Cabimento. Incidência sobre o montante não executado do pacto. Compensação de dívidas. Liquidez. Simples cálculos aritméticos. Exigibilidade das duplicatas. Inocorrência. Contrato realizado na vigência do CC/1916. Regra de transição. Art. 2.035 do NCC. Matéria de ordem pública. Retroatividade da norma. Protestos indevidos. Distribuição do ônus sucumbencial. Procedência das ações cautelares. (...). VIII. Tendo o contrato sido celebrado na vigência do Código Civil/1916, aplicam-se, em princípio, as regras deste. Todavia, em se tratando de normas de ordem pública, é perfeitamente possível a retroatividade da Lei nova, consoante regra de transição disposta no art. 2.035, parágrafo único, do CC/2002. IX. Em se tratando a redução de cláusula penal de matéria de ordem pública, impondo a nova Lei, através do art. 413 do CC, uma obrigação ao magistrado em reduzir o montante da multa cominatória sempre que verificar excesso na sua fixação, a fim de que seja resguardada a função social dos contratos, impõe-se a manutenção do decisum que apenas fez incidir a norma cogente ao caso em apreço; (...)” (TJSE, Apelação Cível 2006212091, Acórdão 10.214/2008, 2.ª Câmara Cível, Rel. Des. Marilza Maynard Salgado de Carvalho, DJSE 13.01.2009, p. 16).", "Na mesma linha, colaciona-se decisão do Tribunal Paulista, que conclui pela retroatividade da boa-fé objetiva, fazendo interessante diálogo com o Código de Defesa do Consumidor:", "“Seguro-saúde. Não renovação automática do plano pela seguradora. alegação de aumento da sinistralidade. Justificativa não comprovada nos autos. Impossibilidade de denúncia vazia pela parte mais forte da relação. Malferimento do princípio da boa-fé objetiva. Desinteresse justamente no momento em que o beneficiário mais precisa do serviço contratado situação em que o cancelamento ou a não renovação automática podem frustrar o próprio escopo da contratação vantagem exagerada em desfavor do consumidor. Sentença de procedência recurso improvido. Boa-fé objetiva. Principiou de interpretação que se aplica à espécie. Arts. 4.º, III, e 51, IV, todos do CDC, bem como art. 422, aplicável aos contratos anteriores a 2003, por força do art. 2.035, segunda parte, e parágrafo único, do mesmo CODEX. Sentença de procedência. Recurso improvido” (TJSP, Apelação com Revisão 424.075.4/8, Acórdão 3236639, 5.ª Câmara de Direito Privado, São Paulo, Rel. Des. Oscarlino Moeller, j. 10.09.2008, DJESP 03.11.2008).", "A proteção do direito adquirido, um dos baluartes da segurança jurídica, quando levada ao extremo engessa o sistema jurídico, não possibilitando a evolução da ciência e da sociedade. Por isso é que deve ser feita a correta ponderação de valores, especialmente quando entram em cena valores de ordem pública com amparo constitucional. O Direito seguro cede espaço para o Direito justo, conforme se extrai das palavras do constitucionalista Daniel Sarmento:", "“A segurança jurídica – ideia que nutre, informa e justifica a proteção constitucional do direito adquirido – é, como já se destacou, um valor de grande relevância no Estado Democrático do Direito. Mas não é o único valor, e talvez não seja nem mesmo o mais importante dentre aqueles em que se esteia a ordem constitucional brasileira. Justiça e igualdade material, só para ficar com dois exemplos, são valores também caríssimos à nossa Constituição, e que, não raro, conflitam com a proteção da segurança jurídica. Se a segurança jurídica for protegida ao máximo, provavelmente o preço que se terá de pagar será um comprometimento na tutela da justiça e da igualdade substancial, e vice-versa. O correto equacionamento da questão hermenêutica ora enfrentada não pode, na nossa opinião, desprezar esta dimensão do problema, refugiando-se na assepsia de uma interpretação jurídica fechada para o universo dos valores. Ademais, no Estado Democrático de Direito, o próprio valor da segurança jurídica ganha um novo colorido, aproximando-se da ideia de Justiça. Ele passa a incorporar uma dimensão social importantíssima. A segurança jurídica, mais identificada no Estado Liberal com a proteção da propriedade e dos direitos patrimoniais em face do arbítrio estatal, caminha para a segurança contra os infortúnios e incertezas da vida; para a segurança como garantia de direitos sociais básicos para os excluídos; e até para a segurança em face das novas tecnologias e riscos ecológicos na chamada ‘sociedade de riscos’”.<sup class=\"fn\" data-n=\"37\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 37\">37</sup>", "Concluindo, constata-se que a tendência doutrinária e jurisprudencial é justamente relativizar a proteção do direito adquirido, o que torna o sistema jurídico de maior mobilidade, de melhor possibilidade de adaptação às mudanças sociais."], "children": []}, {"num": "1.6", "title": "1.6 APLICAÇÃO DA NORMA JURÍDICA NO ESPAÇO. OS ARTS. 7.º A 19 DA LEI DE INTRODUÇÃO E O DIREITO INTERNACIONAL PÚBLICO E PRIVADO", "resumo": "Os arts. 7º a 19 trazem regras de Direito Internacional (aplicação da norma no espaço). Principais regras de conexão: lex domicilii (art. 7º — começo/fim da personalidade, nome, capacidade e direito de família seguem a lei do domicílio da pessoa); lex rei sitiae (art. 8º — os bens seguem a lei do lugar onde estão); locus regit actum (art. 9º — as obrigações seguem a lei do lugar em que foram constituídas); e a sucessão segue a lei do último domicílio do falecido (art. 10, hoje mitigado pelo STJ). O art. 17 é central: leis, atos e sentenças estrangeiros não terão eficácia no Brasil quando ofenderem a soberania nacional, a ordem pública e os bons costumes. Caso célebre: Convenções de Varsóvia/Montreal x CDC — o STF (Tema 210) firmou que as convenções prevalecem quanto aos danos materiais, mas NÃO quanto aos danos morais.", "pontos": ["Lex domicilii (art. 7º): pessoa, nome, capacidade, família.", "Lex rei sitiae (art. 8º): bens seguem o lugar onde estão.", "Locus regit actum (art. 9º): obrigações seguem o lugar da constituição.", "Art. 17: barra o que ofender soberania, ordem pública e bons costumes.", "Varsóvia/Montreal x CDC: prevalecem para danos materiais, não para danos morais (STF, Tema 210)."], "quiz": [{"q": "Pela regra lex domicilii (art. 7º), a lei que rege o nome, a capacidade e o direito de família é a do:", "options": ["País onde a pessoa nasceu", "País em que a pessoa é domiciliada", "País onde estão seus bens"], "answer": 1, "explain": "Art. 7º: aplica-se a lei do país em que for domiciliada a pessoa quanto ao começo e fim da personalidade, ao nome, à capacidade e aos direitos de família."}, {"q": "Segundo o art. 17 da LINDB, leis e sentenças estrangeiras NÃO terão eficácia no Brasil quando ofenderem:", "options": ["A soberania nacional, a ordem pública e os bons costumes", "Qualquer lei ordinária brasileira", "Os interesses econômicos do Estado"], "answer": 0, "explain": "Art. 17: não terão eficácia no Brasil quando ofenderem a soberania nacional, a ordem pública e os bons costumes."}, {"q": "Aos bens aplica-se a lei do lugar onde se situam. Esse princípio é o:", "options": ["Locus regit actum", "Lex rei sitiae (art. 8º)", "Lex domicilii"], "answer": 1, "explain": "Aos bens aplica-se a norma do local em que se situam — lex rei sitiae (art. 8º)."}, {"q": "Às obrigações aplica-se, em regra, a lei do lugar em que foram constituídas. Esse princípio é o:", "options": ["Lex rei sitiae", "Locus regit actum (art. 9º)", "Lex fori"], "answer": 1, "explain": "Quanto às obrigações, a LINDB consagra o locus regit actum (art. 9º): aplica-se a lei do local em que foram constituídas."}, {"q": "A sucessão por morte obedece, em regra, à lei de qual país (art. 10)?", "options": ["Do país onde estão os bens", "Do país do último domicílio do falecido (de cujus)", "Do país de nascimento do herdeiro"], "answer": 1, "explain": "Art. 10: a sucessão por morte ou ausência obedece à lei do país do último domicílio do de cujus (regra hoje mitigada pelo STJ)."}, {"q": "No conflito entre as Convenções de Varsóvia/Montreal e o CDC, o STF (Tema 210) firmou que as convenções prevalecem:", "options": ["Em tudo, inclusive nos danos morais", "Quanto aos danos materiais, mas NÃO quanto aos danos morais", "Em nada — prevalece sempre o CDC"], "answer": 1, "explain": "O STF firmou que as convenções prevalecem para a limitação de danos MATERIAIS; o entendimento não se aplica aos danos morais/extrapatrimoniais."}, {"q": "As regras de Direito Internacional da LINDB estão em quais artigos?", "options": ["Arts. 1º a 6º", "Arts. 7º a 19", "Arts. 20 a 30"], "answer": 1, "explain": "Os arts. 7º a 19 tratam da aplicação da norma no espaço, com regras de Direito Internacional Público e Privado."}], "terms": [{"termo": "Lex domicilii", "definicao": "Regra de conexão: aplica-se a lei do domicílio da pessoa (art. 7º) — nome, capacidade, família, sucessão.", "secao": "1.6"}, {"termo": "Lex rei sitiae", "definicao": "Regra de conexão: aos bens aplica-se a lei do lugar onde se situam (art. 8º).", "secao": "1.6"}, {"termo": "Locus regit actum", "definicao": "Regra de conexão: o ato/obrigação rege-se pela lei do lugar em que foi constituído (art. 9º).", "secao": "1.6"}, {"termo": "Ordem pública (art. 17)", "definicao": "Limite que barra a eficácia, no Brasil, de leis, atos e sentenças estrangeiros que ofendam a soberania, a ordem pública e os bons costumes.", "secao": "1.6"}], "blocks": ["Conforme antes mencionado, a Lei de Introdução traz também regras de Direito Internacional Público e Privado (arts. 7.º a 19), matéria que mais interessa a esses ramos jurídicos.", "Diante da proposta desta obra, as normas serão apenas expostas com comentários pontuais que interessam ao Direito Privado. Vejamos.", "a) O art. 7.º da Lei de Introdução consagra a regra lex domicilii, pela qual devem ser aplicadas, no que concerne ao começo e fim da personalidade, as normas do país em que for domiciliada a pessoa, inclusive quanto ao nome, à capacidade e aos direitos de família. Em complemento, consigne-se que o CPC/2015 traz regras importantes a respeito dos limites da jurisdição nacional e a cooperação internacional. Como decorrência natural da lex domicilli, enuncia o Estatuto Processual emergente que compete à autoridade judiciária brasileira processar e julgar as ações em que o réu, qualquer que seja a sua nacionalidade, estiver domiciliado no Brasil (art. 21, inc. I, do CPC/2015).", "b) Com relação ao casamento, o mesmo comando enuncia regras específicas que devem ser estudadas à parte. De início, celebrado o casamento no Brasil, devem ser aplicadas as regras quanto aos impedimentos matrimoniais que constam do art. 1.521 do CC (art. 7.º, § 1.º, da Lei de Introdução). O casamento entre estrangeiros poderá ser celebrado no Brasil, perante autoridades diplomáticas ou consulares do país de ambos os nubentes (art. 7.º, § 2.º, da Lei de Introdução). Caso os nubentes tenham domicílios diversos, deverão ser aplicadas as regras, quanto à invalidade do casamento, do primeiro domicílio conjugal (art. 7.º, § 3.º, da Lei de Introdução).", "c) Ainda com relação ao casamento, quanto às regras patrimoniais, ao regime de bens, seja ele de origem legal ou convencional, deverá ser aplicada a lei do local em que os cônjuges tenham domicílio. Havendo divergência quanto aos domicílios, prevalecerá o primeiro domicílio conjugal (art. 7.º, § 4.º, da Lei de Introdução). Para o estrangeiro casado que se naturalizar como brasileiro é deferido, no momento da sua naturalização e mediante autorização expressa do cônjuge, que requeira ao Poder Judiciário a adoção do regime da comunhão parcial de bens, regime legal ou supletório em nosso sistema legal, desde que respeitados os direitos de terceiros anteriores à alteração, e mediante registro no cartório das pessoas naturais (art. 7.º, § 5.º, da Lei de Introdução). A norma está a possibilitar a alteração de regime de bens.", "d) Quanto ao divórcio realizado no estrangeiro em que um ou ambos os cônjuges forem brasileiros, haverá reconhecimento no Brasil depois de um ano da data da sentença, salvo se houver sido antecedida de separação judicial por igual prazo, caso em que a homologação produzirá efeito imediato, obedecidas as condições estabelecidas para a eficácia das sentenças estrangeiras no País. O Superior Tribunal de Justiça, na forma de seu regimento interno, poderá reexaminar, a requerimento do interessado, decisões já proferidas em pedidos de homologação de sentenças estrangeiras de divórcio de brasileiros, a fim de que passem a produzir todos os efeitos legais (art. 7.º, § 6.º, da Lei de Introdução). O dispositivo foi alterado pela Lei 12.036/2009, fazendo menção ao STJ e não mais ao STF. Anote-se que, na minha opinião doutrinária e conforme julgado pelo STF no seu Tema n. 1.053 de repercussão geral (2023), a separação judicial e os prazos mínimos para o divórcio foram banidos do sistema jurídico nacional desde a entrada em vigor da Emenda do Divórcio, em julho de 2010 (EC 66/2010), devendo o dispositivo ser lido com ressalvas. Isso mesmo tendo o Código de Processo Civil de 2015 reafirmado a separação judicial, conforme será ainda desenvolvido neste livro. Tal premissa já havia sido parcialmente reconhecida pelo Superior Tribunal de Justiça, que afastou os lapsos temporais constantes do preceito da Lei de Introdução, em ementa assim publicada: “Homologação de sentença estrangeira. Dissolução de casamento. EC 66, de 2010. Disposições acerca da guarda, visitação e alimentos devidos aos filhos. partilha de bens. Imóvel situado no Brasil. Decisão prolatada por autoridade judiciária brasileira. Ofensa à Soberania Nacional. 1. A sentença estrangeira encontra-se apta à homologação, quando atendidos os requisitos dos arts. 5.º e 6.º da Resolução STJ n.º 9/2005: (i) a sua prolação por autoridade competente; (ii) a devida ciência do réu nos autos da decisão homologanda; (iii) o seu trânsito em julgado; (iv) a chancela consular brasileira acompanhada de tradução por tradutor oficial ou juramentado; (v) a ausência de ofensa à soberania ou à ordem pública. 2. A nova redação dada pela EC 66, de 2010, ao § 6.º do art. 226 da CF/1988 tornou prescindível a comprovação do preenchimento do requisito temporal outrora previsto para fins de obtenção do divórcio. 3. Afronta a homologabilidade da sentença estrangeira de dissolução de casamento a ofensa à soberania nacional, nos termos do art. 6.º da Resolução n.º 9, de 2005, ante a existência de decisão prolatada por autoridade judiciária brasileira a respeito das mesmas questões tratadas na sentença homologanda. 4. A exclusividade de jurisdição relativamente a imóveis situados no Brasil, prevista no art. 89, I, do CPC, afasta a homologação de sentença estrangeira na parte em que incluiu bem dessa natureza como ativo conjugal sujeito à partilha. 5. Pedido de homologação de sentença estrangeira parcialmente deferido, tão somente para os efeitos de dissolução do casamento e da partilha de bens do casal, com exclusão do imóvel situado no Brasil” (STJ, SEC 5.302/EX, Corte Especial, Rel. Min. Nancy Andrighi, j. 12.05.2011, DJe 07.06.2011). Por fim, cumpre também destacar que o art. 961, § 5.º, do CPC/2015 passou a prever que a sentença estrangeira de divórcio consensual produz efeitos no Brasil, independentemente de homologação pelo Superior Tribunal de Justiça. Diante desta última dispensa, o Provimento do CNJ n. 53, de 16 de maio de 2016, tratou da averbação direta, por Oficial de Registro Civil das Pessoas Naturais, da sentença estrangeira de divórcio consensual simples ou puro, no assento de casamento, sem a necessidade de homologação judicial. Em 2023, o Conselho Nacional de Justiça incorporou os seus provimentos ao Código Nacional de Normas (CNN) e essa matéria está tratada entre os seus arts. 463 e 467.", "e) Enuncia o § 7.º, do art. 7.º, da Lei de Introdução que, “salvo o caso de abandono, o domicílio do chefe da família estende-se ao outro cônjuge e aos filhos não emancipados, e o do tutor ou curador aos incapazes sob sua guarda”. Diante da nova visualização da família, à luz da Constituição Federal e do Código Civil de 2002, deve-se entender que esse parágrafo merece nova leitura, eis que pelo art. 1.567 da codificação de 2002 a direção da sociedade conjugal será exercida, em colaboração, pelo marido e pela mulher.", "f) Determina o § 8.º, do art. 7.º, da Lei de Introdução que o domicílio da pessoa que não tiver residência fixa será o local em que a mesma for encontrada (moradia habitual), norma que vale também para as questões de Direito Internacional.", "g) No que se refere aos bens, prevê a Lei de Introdução que deve ser aplicada a norma do local em que esses se situam (lex rei sitiae – art. 8.º). Tratando-se de bens móveis transportados, incide a norma do domicílio do seu proprietário (§ 1.º). Quanto ao penhor, direito real de garantia que recai sobre bens móveis, por regra, deve ser aplicada a norma do domicílio que tiver a pessoa em cuja posse se encontre a coisa empenhada, outra aplicação do princípio lex domicilii (§ 2.º).", "h) Ao tratar das obrigações, na Lei de Introdução há consagração da regra locus regit actum, aplicando-se as leis do local em que foram constituídas (art. 9.º). Dessa forma, exemplificando, para incidir a lei brasileira a um determinado negócio obrigacional, basta a sua celebração no território nacional. Os seus parágrafos trazem duas exceções. Inicialmente, tendo sido o contrato celebrado no exterior e destinando-se a produzir efeitos em nosso País, dependente de forma essencial prevista em lei nacional, deverá esta ser observada, admitidas as peculiaridades da lei estrangeira quanto aos fatores externos, requisitos extrínsecos, do ato (§ 1.º). Como segunda exceção, de acordo com o art. 9.º, § 2.º, da Lei de Introdução, “A obrigação resultante do contrato reputa-se constituída no lugar em que residir o proponente”. O dispositivo está em conflito parcial com o art. 435 do CC/2002, pelo qual se reputa celebrado o contrato no lugar em que foi proposto. Ora, o local da proposta não necessariamente é o da residência daquele que a formulou. Para resolver a suposta antinomia, aplicando-se a especialidade, deve-se entender que a regra do art. 435 do CC serve para os contratos nacionais; enquanto o dispositivo da Lei de Introdução é aplicado aos contratos internacionais.", "i) O art. 10 da Lei de Introdução enuncia que a sucessão por morte ou por ausência obedece a norma do país do último domicílio do de cujus (lex domicilii), conforme faz a codificação privada brasileira no seu art. 1.785 (“A sucessão abre-se no último domicílio do falecido”). Em julgado de 2015, publicado no seu Informativo n. 563, o Superior Tribunal de Justiça mitigou o conteúdo do art. 10 da LINDB. Conforme parte da publicação, “ainda que o domicílio do autor da herança seja o Brasil, aplica-se a lei estrangeira da situação da coisa – e não a lei brasileira – na sucessão de bem imóvel situado no exterior. A LINDB, inegavelmente, elegeu o domicílio como relevante regra de conexão para solver conflitos decorrentes de situações jurídicas relacionadas a mais de um sistema legal (conflitos de leis interespaciais), porquanto consistente na própria sede jurídica do indivíduo. Assim, a lei do país em que for domiciliada a pessoa determina as regras sobre o começo e o fim da personalidade, o direito ao nome, a capacidade jurídica e dos direitos de família (art. 7.º). Por sua vez, a lei do domicílio do autor da herança regulará a correlata sucessão, nos termos do art. 10 da lei sob comento. Em que pese a prevalência da lei do domicílio do indivíduo para regular as suas relações jurídicas pessoais, conforme preceitua a LINDB, esta regra de conexão não é absoluta. Como bem pondera a doutrina, outros elementos de conectividade podem, a depender da situação sob análise, revelar-se preponderantes e, por conseguinte, excepcionar a aludida regra, tais como a situação da coisa, a faculdade concedida à vontade individual na escolha da lei aplicável, quando isto for possível, ou por imposições de ordem pública” (STJ, REsp 1.362.400/SP, Rel. Min. Marco Aurélio Bellizze, j. 28.04.2015, DJe 05.06.2015). Em suma, o entendimento constante do aresto, que afasta o caráter absoluto do preceito, deve ser considerado como majoritário na atualidade, para os devidos fins práticos.", "j) As regras de vocação hereditária para suceder bens de estrangeiro situados no nosso País serão as nacionais, desde que não sejam mais favoráveis ao cônjuge e aos filhos do casal as normas do último domicílio (art. 10, § 1.º, da Lei de Introdução). De acordo com o § 2.º desse comando legal, a lex domicilii do herdeiro ou legatário regulamentará a capacidade para suceder.", "k) Quanto às sociedades e fundações deve ser aplicada a norma do local de sua constituição (art. 11 da Lei de Introdução). Os três parágrafos desse artigo trazem regras específicas que devem ser atentadas quanto à pessoa jurídica, pela ordem. Primeiro, para atuarem no Brasil, as sociedades e fundações necessitam de autorização pelo governo federal, ficando sujeitas às leis brasileiras (arts. 11, § 1.º, da Lei de Introdução e 1.134 do CC). Segundo, os governos estrangeiros e entidades constituídas para atenderem aos anseios de Estados estrangeiros não poderão adquirir no Brasil bens imóveis ou suscetíveis de desapropriação (art. 11, § 2.º, da Lei de Introdução). Terceiro, os governos estrangeiros e afins podem adquirir a propriedade de prédios necessários à sede dos representantes diplomáticos e agentes consulares, única autorização específica que deve ser respeitada (art. 11, § 3.º, da Lei de Introdução).", "l) Em relação à competência da autoridade judiciária brasileira, determina o art. 12 da Lei de Introdução que há necessidade de atuação quando o réu for domiciliado em nosso País ou aqui tiver que ser cumprida a obrigação, como no caso de um contrato. Quanto aos imóveis situados no País, haverá competência exclusiva da autoridade nacional (art. 12, § 1.º); bem quanto ao exequatur, o “cumpra-se” relacionado com uma sentença estrangeira homologada perante o Superior Tribunal de Justiça, conforme nova redação dada ao art. 105 da CF/1988, pela Reforma do Judiciário (EC 45/2004).", "m) De acordo com o art. 13 da Lei de Introdução, quanto aos fatos ocorridos no exterior e ao ônus probatório, devem ser aplicadas as normas do direito alienígena relacionadas com as ocorrências, não sendo admitidas no Brasil provas que a lei nacional não conheça. Em complemento, de acordo com o art. 14 da Lei de Introdução, não conhecendo o juiz nacional a lei estrangeira, poderá exigir de quem a invoca a prova do texto e da sua vigência. Nos termos do art. 15 da Lei de Introdução, será executada no Brasil a sentença proferida no estrangeiro, que reúna os seguintes requisitos: haver sido proferida por juiz competente; terem sido as partes citadas ou haver-se legalmente verificado à revelia; ter passado em julgado e estar revestida das formalidades necessárias para a execução no lugar em que foi proferida; estar traduzida por intérprete autorizado; ter sido homologada pelo Superior Tribunal de Justiça (nos termos da Emenda Constitucional 45/2004). O Código de Processo Civil de 2015 passou a tratar não só da homologação de sentença estrangeira, mas de qualquer outra decisão judicial proferida no estrangeiro, conforme regulamentação constante a partir do seu art. 960. Nos termos do art. 963 do CPC/2015, constituem requisitos indispensáveis à homologação de qualquer decisão proferida no estrangeiro: a) ser proferida por autoridade competente; b) ser precedida de citação regular, ainda que verificada a revelia; c) ser eficaz no país em que foi proferida; d) não ofender a coisa julgada brasileira; e) estar acompanhada de tradução oficial, salvo disposição que a dispense prevista em tratado; e f) não conter manifesta ofensa à ordem pública. Como a norma instrumental não traz exatamente o mesmo teor do art. 15 da Lei de Introdução, entendo que não houve revogação do último dispositivo, devendo ambos os preceitos conviver no sistema jurídico, em diálogo entre as fontes. De toda forma, há interpretação no sentido de ter sido o art. 15 da LINDB revogado tacitamente pelo último comando do Estatuto Processual emergente citado. Assim, não haveria mais a necessidade do trânsito em julgado da sentença no país de origem, exigindo-se apenas a sua eficácia naquela localidade. Seguindo essa interpretação – que tende a ser a majoritária –, concluiu o Superior Tribunal de Justiça em 2018, em ação relativa à homologação de sentença proferida pelo Poder Judiciário da Bulgária a respeito da guarda e visitação de menores: “com a entrada em vigor do CPC/15, os requisitos indispensáveis à homologação da sentença estrangeira passaram a contar com disciplina legal, de modo que o Regimento Interno desta Corte deverá ser aplicado em caráter supletivo e naquilo que for compatível com a disciplina contida na legislação federal. O art. 963, III, do CPC/15, não mais exige que a decisão judicial que se pretende homologar tenha transitado em julgado, mas, ao revés, que somente seja ela eficaz em seu país de origem, tendo sido tacitamente revogado o art. 216-D, III, do RISTJ. Aplica-se o CPC/15, especialmente no que tange aos requisitos materiais de homologação da sentença estrangeira, às ações ainda pendentes ao tempo de sua entrada em vigor, mesmo que tenham sido elas ajuizadas na vigência da legislação revogada” (STJ, SEC 14.812/EX, Corte Especial, Rel. Min. Nancy Andrighi, j. 16.05.2018, DJe 23.05.2018). Em casos tais, se houver de aplicar a lei estrangeira, ter-se-á em vista a disposição desta, sem considerar-se qualquer remissão por ela feita a outra lei (art. 16 da Lei de Introdução). Cabe pontuar que o Código de Processo Civil de 2015 passou a tratar da cooperação internacional para o cumprimento de decisões estrangeiras. Desse modo, conforme o seu art. 26, a cooperação jurídica internacional será regida por tratado de que o Brasil faz parte e observará: o respeito às garantias do devido processo legal no Estado requerente; a igualdade de tratamento entre nacionais e estrangeiros, residentes ou não no Brasil, em relação ao acesso à justiça e à tramitação dos processos, assegurando-se assistência judiciária aos necessitados; a publicidade processual, exceto nas hipóteses de sigilo previstas na legislação brasileira ou na do Estado requerente; a existência de autoridade central para recepção e transmissão dos pedidos de cooperação; e a espontaneidade na transmissão de informações a autoridades estrangeiras. Ademais, a cooperação jurídica internacional terá por objeto a citação, a intimação e a notificação judicial e extrajudicial; colheita de provas e a obtenção de informações; a homologação e o cumprimento de decisão; a concessão de medida judicial de urgência; a assistência jurídica internacional; e qualquer outra medida judicial ou extrajudicial não proibida pela lei brasileira.", "n) Com grande repercussão prática em relação ao Direito Privado, estabelece o art. 17 da Lei de Introdução que “as leis, atos e sentenças de outro país, bem como quaisquer declarações de vontade, não terão eficácia no Brasil, quando ofenderem a soberania nacional, a ordem pública e os bons costumes”. Exemplificando a aplicação desse comando, sempre se apontou questão envolvendo a anterior Convenção de Varsóvia e a atual Convenção de Montreal, tratados internacionais dos quais nosso País é signatário e que consagram limitações de indenização em casos de atraso de voo, perda de voo e extravio de bagagem, no caso de viagens internacionais. As normas internacionais entram em claro conflito com o Código de Defesa do Consumidor que, em seu art. 6.º, VI e VIII, consagra o princípio da reparação integral de danos, pelo qual tem direito o consumidor ao ressarcimento integral pelos prejuízos materiais e morais causados pelo fornecimento de produtos, prestação de serviços ou má informação a eles relacionados, devendo ser facilitada a tutela dos seus direitos. Tal princípio veda qualquer tipo de tarifação, sendo a Lei 8.078/1990 norma de ordem pública e interesse social, como consta do seu art. 1.º. Por isso, o referido tratado não poderia prevalecer, conforme conclusão anterior do Supremo
