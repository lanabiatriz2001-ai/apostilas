<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINDB · Tartuce — Material de estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fs:19px; --lh:1.75; --measure:64ch;
  --sans:"Plus Jakarta Sans",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --grad:linear-gradient(135deg,#6d5efc 0%,#a24bff 48%,#ff5fa2 100%);
  --gap:clamp(16px,3vw,32px); --radius:22px;
}
html[data-theme="claro"]{
  --bg:#f3f5fd; --bg2:#eef1fb; --ink:#1b2036; --ink-soft:#5f6685; --line:#e4e7f5;
  --card:#ffffff; --accent:#6d5efc; --accent-ink:#5a4bf0;
  --shadow:0 10px 30px rgba(80,70,190,.10); --shadow-sm:0 4px 14px rgba(80,70,190,.08);
}
html[data-theme="escuro"]{
  --bg:#0f1120; --bg2:#151830; --ink:#eef0fb; --ink-soft:#9aa2c9; --line:#262a45;
  --card:#181b30; --accent:#8f81ff; --accent-ink:#a99dff;
  --shadow:0 12px 34px rgba(0,0,0,.45); --shadow-sm:0 6px 18px rgba(0,0,0,.4);
}
html[data-theme="sepia"]{
  --bg:#fbeede; --bg2:#f7e6cf; --ink:#3a2f22; --ink-soft:#7b6a4f; --line:#ecdcc0;
  --card:#fff7ea; --accent:#e06636; --accent-ink:#c4522a;
  --shadow:0 10px 28px rgba(150,100,40,.14); --shadow-sm:0 4px 14px rgba(150,100,40,.1);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.font-amigavel{--sans:"Verdana","Trebuchet MS","Comic Sans MS",sans-serif;letter-spacing:.01em}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
h1,h2,h3,h4{font-weight:800;line-height:1.18;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:11px 16px;max-width:1220px;margin:0 auto}
.brand{font-weight:800;font-size:1rem;margin-right:auto;display:flex;align-items:center;gap:11px}
.brand .mk{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:800;box-shadow:0 6px 16px rgba(120,80,240,.35)}
.iconbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;cursor:pointer;font-size:.85rem;font-weight:600;min-height:42px;display:inline-flex;align-items:center;gap:7px}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn.primary{background:var(--grad);color:#fff;border:none;box-shadow:0 8px 20px rgba(120,80,240,.32)}
.iconbtn.primary:hover{color:#fff;filter:brightness(1.05)}
.iconbtn:focus-visible,.fn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progresswrap{height:4px;background:var(--line)} .progressbar{height:100%;width:0;background:var(--grad)}

.wrap{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--gap);padding:var(--gap) 16px 130px}
@media (max-width:960px){.wrap{grid-template-columns:1fr}}

aside.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 98px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.toc h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin:.1rem .2rem .5rem}
.toc .prog{font-size:.82rem;color:var(--ink-soft);margin:0 .2rem .7rem;display:flex;align-items:center;gap:8px}
.toc .prog .pill{background:var(--grad);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.75rem}
.toclink{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:14px;cursor:pointer;color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:600}
.toclink:hover{background:var(--bg)}
.toclink.active{background:color-mix(in srgb,var(--sc) 12%,var(--card))}
.toclink .tnum{min-width:40px;flex:0 0 40px;text-align:center;font-weight:800;font-size:.74rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:9px;padding:4px 2px;font-variant-numeric:tabular-nums}
.toclink.sub{padding-left:14px;font-size:.85rem;font-weight:500;color:var(--ink-soft)}
.toclink.sub .tnum{min-width:46px;flex-basis:46px;font-size:.7rem;opacity:.92}
.toclink.active .ttl{color:var(--sc)}
.toclink .check{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;font-size:11px;color:#fff;display:grid;place-items:center}
.toclink.read .check{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent}
.toclink.read .check::after{content:"✓"}
.toclink.plain .tnum{background:var(--ink-soft)}
@media (max-width:960px){
  aside.toc{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);z-index:60;transform:translateX(-105%);transition:transform .22s;border-radius:0 var(--radius) var(--radius) 0;max-height:100vh}
  aside.toc.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,10,30,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
}
@media(min-width:961px){.scrim{display:none}.menu-only{display:none}}

main{min-width:0}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:clamp(24px,4vw,44px);color:#fff;margin-bottom:var(--gap);
  background:linear-gradient(135deg,#6d5efc 0%,#9b45ff 42%,#ff5b9a 82%,#ff8f5f 100%);box-shadow:0 20px 50px rgba(110,70,230,.32)}
.hero::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.16);top:-140px;right:-80px;filter:blur(6px)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);bottom:-120px;left:20%}
.hero>*{position:relative;z-index:1}
.hero .kicker{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.92;margin:0 0 10px}
.hero h1{margin:.1rem 0;font-size:clamp(1.9rem,5vw,2.9rem);text-shadow:0 2px 10px rgba(60,20,90,.2)}
.hero .sub{font-size:1.08rem;opacity:.95;margin:.4rem 0 0;font-weight:500;max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.legend span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 13px;font-size:.82rem;font-weight:600}
.legend .sw{width:13px;height:13px;border-radius:4px}.legend .sw.orig{background:#fff;opacity:.7}.legend .sw.aid{background:#ffe08a}
.howto{margin-top:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:16px;padding:15px 18px;backdrop-filter:blur(4px)}
.howto b{font-weight:800} .howto ul{margin:.5rem 0 0;padding-left:1.1rem;font-size:.88rem;opacity:.96} .howto li{margin:.32rem 0}

/* sumário original (details) */
.sumario{margin-bottom:var(--gap);border:1.5px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;box-shadow:var(--shadow-sm)}
.sumario>summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:10px}
.sumario>summary::-webkit-details-marker{display:none}
.sumario>summary::after{content:"▸";margin-left:auto;color:var(--accent);font-weight:800}
.sumario[open]>summary::after{content:"▾"}
.sumario .sumpill{background:var(--grad);color:#fff;border-radius:999px;padding:5px 13px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.sumario p{margin:0 18px 16px;color:var(--ink-soft);font-size:.92rem;font-weight:500}

.section{scroll-margin-top:84px;margin-bottom:calc(var(--gap)*1.5)}
.section .shead{display:flex;gap:15px;align-items:center;margin-bottom:6px}
.section .snum{flex:0 0 auto;min-width:58px;height:58px;padding:0 12px;border-radius:18px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.25rem;box-shadow:0 12px 26px color-mix(in srgb,var(--sc) 45%,transparent)}
.section .stitle{font-size:clamp(1.25rem,2.8vw,1.7rem);margin:0;letter-spacing:-.02em}
.section .hrule{height:5px;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2),transparent);margin:12px 0 18px}
.readbtn{margin-left:auto;align-self:center;white-space:nowrap}

.prosa{max-width:var(--measure)}
.prosa p{margin:1.05em 0}
.prosa p.quote{background:color-mix(in srgb,var(--sc) 9%,var(--card));border-left:5px solid var(--sc);padding:12px 18px;border-radius:6px 16px 16px 6px;font-size:.98rem;font-weight:500}
sup.fn{font-size:.62em;font-weight:800;color:var(--sc);cursor:pointer;padding:0 1px;vertical-align:super}
sup.fn:hover{text-decoration:underline}
b.bi{font-weight:800}

.subsec{margin-top:30px}
.subsec .subhead{display:flex;gap:12px;align-items:center;margin:0 0 4px}
.subsec .subnum{flex:0 0 auto;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:11px;padding:5px 12px;font-weight:800;font-size:.9rem;box-shadow:var(--shadow-sm)}
.subsec .subtitle{font-size:1.2rem;margin:0;letter-spacing:-.01em}
.subsec .subrule{height:3px;border-radius:999px;background:linear-gradient(90deg,var(--c1),transparent);margin:8px 0 14px}

.aid{background:color-mix(in srgb,var(--sc) 7%,var(--card));border:1.5px solid color-mix(in srgb,var(--sc) 22%,var(--line));border-radius:20px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow-sm)}
.aid .tag{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 14px;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:11px;box-shadow:0 6px 16px color-mix(in srgb,var(--sc) 40%,transparent)}
.aid.resumo p{margin:.1rem 0 0;max-width:62ch}
.pontos{list-style:none;margin:.1rem 0 0;padding:0;display:grid;gap:10px}
.pontos li{display:flex;gap:12px;align-items:flex-start;font-size:.93rem;font-weight:500}
.pontos li::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));margin-top:.42em;flex:0 0 auto;box-shadow:0 2px 6px color-mix(in srgb,var(--sc) 45%,transparent)}
.terms{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px}
.chip{border:1.5px solid color-mix(in srgb,var(--sc) 30%,var(--line));background:color-mix(in srgb,var(--sc) 10%,var(--card));color:var(--sc);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:700;cursor:pointer}
.chip:hover{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
.termdef{margin-top:12px;font-size:.9rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:none;font-weight:500}
.termdef.show{display:block} .termdef b{color:var(--sc)}

.quiz .tag{background:linear-gradient(135deg,var(--c1),var(--c2))}
.qitem{margin:14px 0} .qitem:first-of-type{margin-top:4px}
.qq{font-weight:700;margin:0 0 10px;font-size:1rem}
.qq .qn{color:var(--sc);font-weight:800;margin-right:3px}
.qopts{display:grid;gap:8px}
.qo{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 13px;font-size:.9rem;font-weight:500;display:flex;gap:11px;align-items:center}
.qo .ql{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:color-mix(in srgb,var(--sc) 13%,var(--card));color:var(--sc);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.gab{margin:16px 0;border:2px dashed color-mix(in srgb,var(--sc) 40%,var(--line));border-radius:18px;background:color-mix(in srgb,var(--sc) 6%,var(--card));overflow:hidden}
.gab>summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;align-items:center;gap:11px;font-weight:600}
.gab>summary::-webkit-details-marker{display:none}
.gab>summary::after{content:"▸";margin-left:auto;color:var(--sc);font-weight:800;transition:transform .15s}
.gab[open]>summary::after{transform:rotate(90deg)}
.gab .gtag{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-radius:999px;padding:6px 14px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.gab .ghint{color:var(--ink-soft);font-size:.83rem;font-weight:500}
.gablist{margin:0;padding:2px 20px 16px 44px;display:grid;gap:10px;font-size:.9rem;font-weight:500}
.gablist li{padding-left:4px} .gablist li::marker{color:var(--sc);font-weight:800}
.gablist b{color:var(--sc)}

/* end sections: notas */
.endsec{margin-top:40px}
.endsec h2{margin:0 0 6px}.endsec .endpill{background:var(--grad);color:#fff;border-radius:999px;padding:6px 16px;font-size:.9rem;font-weight:800;display:inline-block}
.endsec .endnote{color:var(--ink-soft);font-size:.86rem;margin:8px 0 14px;font-weight:500}
.notaslist{padding-left:1.4rem;font-size:.82rem;color:var(--ink-soft);line-height:1.5;font-weight:500}
.notaslist li{margin:.35rem 0;scroll-margin-top:84px}
.notaslist li:target{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:8px}

.pop{position:absolute;z-index:80;max-width:min(360px,86vw);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 14px;font-size:.85rem;line-height:1.5;display:none;color:var(--ink);font-weight:500}
.pop.show{display:block}
.pop .pn{font-weight:800;color:var(--accent);margin-right:6px}
.pop .close{position:absolute;top:6px;right:9px;cursor:pointer;color:var(--ink-soft);background:none;border:none;font-size:1.05rem}

.drawer{position:fixed;top:0;right:0;height:100%;width:min(90vw,370px);background:var(--card);border-left:1px solid var(--line);z-index:70;transform:translateX(105%);transition:transform .22s;overflow:auto;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer .dhead{display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.drawer .dhead b{margin-right:auto;font-size:1.05rem}
.drawer .body{padding:16px;display:grid;gap:20px}
.ctl label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:13px;padding:9px;cursor:pointer;font-size:.86rem;font-weight:600}
.seg button.on{border-color:transparent;background:var(--grad);color:#fff}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw-row .lbl{font-size:.9rem;font-weight:600} .sw-row .lbl small{display:block;color:var(--ink-soft);font-size:.76rem;font-weight:400}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.16s}
.slider::before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;background:#fff;border-radius:50%;transition:.16s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--grad)} .switch input:checked + .slider::before{transform:translateX(22px)}

.ttsbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:65;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);display:none;align-items:center;gap:6px;padding:8px 12px}
.ttsbar.show{display:flex}
.ttsbar button{border:none;background:var(--bg2);color:var(--ink);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:1rem}
.ttsbar button:hover{background:var(--grad);color:#fff}
.ttsbar .lab{font-size:.8rem;color:var(--ink-soft);padding:0 8px;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.reading{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:10px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 32%,transparent)}

body.focus .prosa p{transition:opacity .2s} body.focus .prosa p:not(.pfocus){opacity:.24}
body.focus .prosa p.pfocus,body.focus .prosa p.reading{opacity:1}
.focusnav{position:fixed;right:16px;bottom:16px;z-index:64;display:none;flex-direction:column;gap:8px}
body.focus .focusnav{display:flex}
.focusnav button{width:54px;height:54px;border-radius:50%;border:none;background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(120,80,240,.4);cursor:pointer;font-size:1.4rem}

.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px}
.modal.open{display:flex}
.modal .mbg{position:absolute;inset:0;background:rgba(10,10,30,.5)}
.modal .mcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .mhead{position:sticky;top:0;background:var(--card);padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .mhead b{margin-right:auto;font-size:1.1rem}
.modal input.search{width:100%;padding:12px 15px;border:2px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);font-size:.92rem;font-weight:500}
.modal input.search:focus{outline:none;border-color:var(--accent)}
.gitem{padding:13px 18px;border-bottom:1px solid var(--line)}
.gitem .gt{font-weight:800} .gitem .gs{font-size:.72rem;color:#fff;background:var(--grad);border-radius:999px;padding:2px 9px;margin-left:8px;font-weight:700}
.gitem .gd{margin:5px 0 0;font-size:.9rem;color:var(--ink-soft);font-weight:500}
.backtop{position:fixed;right:16px;bottom:16px;z-index:50;border:none;background:var(--grad);color:#fff;border-radius:14px;padding:11px 15px;cursor:pointer;box-shadow:0 10px 24px rgba(120,80,240,.35);display:none;font-weight:700}
.backtop.show{display:block} @media(max-width:960px){.backtop{bottom:80px}}
</style></head>
<body>
<header class="top"><div class="top-in">
  <button class="iconbtn menu-only" id="btnMenu" aria-label="Índice">☰</button>
  <div class="brand"><span class="mk">LINDB</span> Tartuce</div>
  <button class="iconbtn" id="btnGloss">📖 <span class="hide-sm">Glossário</span></button>
  <button class="iconbtn primary" id="btnSettings">Aa <span class="hide-sm">Ajustes</span></button>
</div><div class="progresswrap"><div class="progressbar" id="pbar"></div></div></header>

<div class="scrim" id="scrim"></div>
<div class="wrap">
  <aside class="toc" id="toc"><h2>Sumário</h2><div class="prog"><span class="pill" id="progPill">0/0</span> <span id="progText">seções lidas</span></div><nav id="tocNav"></nav></aside>
  <main id="main"></main>
</div>

<div class="drawer" id="drawer">
  <div class="dhead"><b>Ajustes de leitura</b><button class="iconbtn" id="btnCloseDrawer">✕</button></div>
  <div class="body">
    <div class="ctl"><label>Tema</label><div class="seg" id="segTheme">
      <button data-theme="claro" class="on">☀️ Claro</button><button data-theme="sepia">🌼 Creme</button><button data-theme="escuro">🌙 Escuro</button></div></div>
    <div class="ctl"><label>Tamanho do texto</label><div class="seg" id="segFs">
      <button data-fs="16">A</button><button data-fs="19" class="on">A</button><button data-fs="22">A</button><button data-fs="26">A</button></div></div>
    <div class="ctl"><label>Espaçamento</label><div class="seg" id="segLh">
      <button data-lh="1.5">Compacto</button><button data-lh="1.75" class="on">Médio</button><button data-lh="2.1">Amplo</button></div></div>
    <div class="ctl"><label>Largura da coluna</label><div class="seg" id="segMeasure">
      <button data-measure="52ch">Estreita</button><button data-measure="64ch" class="on">Média</button><button data-measure="82ch">Larga</button></div></div>
    <div class="sw-row"><div class="lbl">Fonte amigável<small>Espaçada, p/ dislexia</small></div><label class="switch"><input type="checkbox" id="swFont"><span class="slider"></span></label></div>

<script>const DATA={"title": "ESTUDO DA LEI DE INTRODUÇÃO", "subtitle": "Lei de Introdução às Normas do Direito Brasileiro (LINDB)", "sumario": "Sumário: 1.1 Primeiras palavras sobre a Lei de Introdução – 1.2 A Lei de Introdução e a Lei como fonte primária do Direito Brasileiro. A vigência das normas jurídicas (arts. 1.º e 2.º da Lei de Introdução) – 1.3 Características da norma jurídica e sua aplicação. Análise do art. 3.º da Lei de Introdução – 1.4 As formas de integração da norma jurídica. Art. 4.º da Lei de Introdução: 1.4.1 A analogia; 1.4.2 Os costumes; 1.4.3 Os princípios gerais de Direito; 1.4.4 A equidade – 1.5 Aplicação da norma jurídica no tempo. O art. 6.º da Lei de Introdução – 1.6 Aplicação da norma jurídica no espaço. Os arts. 7.º a 19 da Lei de Introdução e o Direito Internacional Público e Privado – 1.7 Estudo das antinomias jurídicas – 1.8 Breve análise das inclusões feitas na Lei de Introdução pela Lei 13.655/2018. Repercussões para o Direito Público.", "hues": {"1.1": 258, "1.2": 205, "1.3": 168, "1.4": 32, "1.4.1": 130, "1.4.2": 280, "1.4.3": 195, "1.4.4": 342, "1.5": 12, "1.6": 152, "1.7": 222, "1.8": 320}, "sections": [{"num": "1.1", "title": "1.1 PRIMEIRAS PALAVRAS SOBRE A LEI DE INTRODUÇÃO", "resumo": "A LINDB (antes chamada LICC) é o Decreto-lei 4.657/1942. É uma “norma de sobredireito”: uma lei que serve para regular as outras leis. Em 2010 mudou de nome (de “Introdução ao Código Civil” para “Introdução às Normas do Direito Brasileiro”) justamente porque hoje ela interessa a todos os ramos do Direito, e não só ao Direito Civil. Ela não faz parte do Código Civil: é uma “lei anexa”. Trata da vigência das leis (arts. 1º e 2º), da aplicação da norma no tempo (arts. 3º a 6º) e no espaço (arts. 7º a 19); e, depois da Lei 13.655/2018, passou a tratar também da atuação dos agentes públicos (arts. 20 a 30).", "pontos": ["Norma de sobredireito = lei sobre leis (lex legum).", "Mudou de LICC para LINDB em 2010 (Lei 12.376).", "Não integra o Código Civil — é uma lei anexa.", "O art. 4º aponta as fontes secundárias: analogia, costumes e princípios gerais."], "quiz": [{"q": "Por que a antiga LICC teve seu nome mudado para LINDB em 2010?", "options": ["Porque passou a integrar o Código Civil de 2002", "Porque se aplica a todos os ramos do Direito, e não só ao Civil", "Porque foi revogada e substituída por uma lei nova"], "answer": 1, "explain": "A norma “mais se aplica aos outros ramos do Direito do que ao próprio Direito Civil”; por isso a Lei 12.376/2010 mudou o nome."}, {"q": "O que significa dizer que a LINDB é uma “norma de sobredireito”?", "options": ["É uma norma superior à Constituição", "É uma norma que regulamenta outras normas (lei sobre leis)", "É uma norma que só vale para o Direito Civil"], "answer": 1, "explain": "Sobredireito (lex legum) é a norma jurídica que visa regulamentar outras normas — leis sobre leis."}, {"q": "Qual é a natureza da LINDB em relação ao Código Civil?", "options": ["Faz parte do Código Civil de 2002", "Não faz parte do Código Civil — é uma espécie de “lei anexa”", "É um capítulo do Código Civil de 1916"], "answer": 1, "explain": "A LINDB não faz parte do Código Civil (nem do de 1916 nem do de 2002); é uma lei anexa, publicada em conjunto para facilitar a aplicação."}, {"q": "Qual é o número e o ano do decreto-lei que instituiu a LINDB?", "options": ["Decreto-lei 4.657, de 1942", "Lei 10.406, de 2002", "Lei 13.655, de 2018"], "answer": 0, "explain": "A LINDB é o Decreto-lei 4.657, de 1942, antes conhecido pela sigla LICC."}, {"q": "Segundo o art. 4º da LINDB, quais são as fontes formais secundárias do Direito?", "options": ["A lei, a doutrina e a jurisprudência", "A analogia, os costumes e os princípios gerais do Direito", "A Constituição, os tratados e as súmulas"], "answer": 1, "explain": "O art. 4º enuncia as fontes formais secundárias, aplicadas na falta da lei: a analogia, os costumes e os princípios gerais do Direito."}], "terms": [{"termo": "LINDB", "definicao": "Lei de Introdução às Normas do Direito Brasileiro (Decreto-lei 4.657/1942). Antes chamada de LICC (Lei de Introdução ao Código Civil).", "secao": "1.1"}, {"termo": "Norma de sobredireito", "definicao": "Norma que serve para regular outras normas — uma “lei sobre leis” (lex legum).", "secao": "1.1"}, {"termo": "Lex legum", "definicao": "Expressão latina para “lei das leis”; designa a norma que disciplina as demais.", "secao": "1.1"}, {"termo": "Lei anexa", "definicao": "Lei publicada junto com o Código para facilitar sua aplicação, mas que não faz parte dele — caso da LINDB.", "secao": "1.1"}], "blocks": ["A antiga Lei de Introdução ao Código Civil é o Decreto-lei 4.657, de 1942, conhecida anteriormente nos meios jurídicos pelas iniciais LICC. Trata-se de uma norma de sobredireito, ou seja, de uma norma jurídica que visa regulamentar outras normas (leis sobre leis ou lex legum).", "O seu estudo sempre foi comum na disciplina de Direito Civil ou de Introdução ao Direito Privado, pela sua posição topográfica preliminar frente ao Código Civil de 1916. A tradição inicialmente foi mantida com o Código Civil de 2002, podendo a citada norma ser encontrada, de forma inaugural, nos comentários à atual codificação privada.<sup class=\"fn\" data-n=\"1\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 1\">1</sup> Por isso, questões relativas à matéria sempre foram e continuavam sendo solicitadas nas provas de Direito Civil.", "Porém, apesar desse seu posicionamento metodológico, a verdade é que a antiga LICC não constituía uma norma exclusiva do Direito Privado. Por isso, e por bem, a Lei 12.376, de 30 de dezembro de 2010, alterou o seu nome de Lei de Introdução ao Código Civil para Lei de Introdução às Normas do Direito Brasileiro. Isso porque, atualmente, o diploma mais se aplica aos outros ramos do Direito do que ao próprio Direito Civil.", "Em outras palavras, o seu conteúdo interessa mais à Teoria Geral do Direito do que ao Direito Civil propriamente dito. Corroborando essa afirmação, a recente Lei 13.655/2018 traz novas regras concernentes à atuação dos agentes públicos, tendo relação substancial com o Direito Administrativo. Pode-se dizer que essa norma emergente consolida um distanciamento do diploma em estudo perante o Direito Privado. Por questões didáticas, a norma será denominada tão simplesmente de Lei de Introdução, expressão que tenho utilizado.", "A Lei de Introdução possuía originalmente artigos que trazem em seu conteúdo regras quanto à vigência das leis (arts. 1.º e 2.º), a respeito da aplicação da norma jurídica no tempo (arts. 3.º a 6.º), bem como no que concerne à sua subsistência no espaço, em especial nas questões de Direito Internacional (arts. 7.º a 19). Sucessivamente, foram incluídos os arts. 20 a 30 pela citada Lei 13.655/2018, que tratam da atuação dos gestores e agentes públicos.", "Como é notório, atribui-se à Lei de Introdução o papel de apontar as fontes do Direito Privado em complemento à própria lei. Não se pode esquecer que o art. 4.º da Lei de Introdução enuncia as fontes formais secundárias do Direito, aplicadas inicialmente na falta da lei: a analogia, os costumes e os princípios gerais do Direito.", "Anote-se que a Lei de Introdução não faz parte do Código Civil de 2002, como também não era componente do Código Civil de 1916. Como se extrai, entre os clássicos, da obra de Serpa Lopes, ela é uma espécie de lei anexa, publicada originalmente em conjunto com o Código Civil para facilitar a sua aplicação.<sup class=\"fn\" data-n=\"2\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 2\">2</sup>", "Feita essa análise preliminar, parte-se ao estudo do conteúdo da Lei de Introdução, aprofundando-se as questões que mais interessam ao estudioso do Direito Privado."], "children": []}, {"num": "1.2", "title": "1.2 A LEI DE INTRODUÇÃO E A LEI COMO FONTE PRIMÁRIA DO DIREITO BRASILEIRO. A VIGÊNCIA DAS NORMAS JURÍDICAS (ARTS. 1.º E 2.º DA LEI DE INTRODUÇÃO)", "resumo": "O Brasil segue a família da Civil Law: a lei é a fonte primária do Direito. Há, porém, uma aproximação da Common Law (súmula vinculante, EC 45/2004; valorização dos precedentes no CPC/2015). Tartuce adota o conceito de lei como “imperativo autorizante” (Goffredo Telles Jr.). Sobre a vigência: pelo art. 1º, salvo disposição em contrário, a lei começa a vigorar 45 dias depois de publicada (vacatio legis); no exterior, 3 meses. O art. 2º traz o princípio da continuidade: a lei vige até que outra a modifique ou revogue. A revogação pode ser total (ab-rogação) ou parcial (derrogação); e expressa ou tácita. Por fim, o art. 2º, § 3º, veda a repristinação automática: a lei revogada NÃO volta a valer só porque a lei que a revogou foi depois revogada — salvo disposição expressa.", "pontos": ["Vacatio legis: 45 dias no Brasil; 3 meses no exterior (art. 1º).", "Princípio da continuidade: a lei vale até ser modificada ou revogada (art. 2º).", "Ab-rogação = revogação TOTAL; derrogação = revogação PARCIAL.", "Revogação expressa (declarada) x tácita (por incompatibilidade).", "Sem repristinação automática (art. 2º, § 3º)."], "quiz": [{"q": "Salvo disposição em contrário, quando uma lei começa a vigorar no país?", "options": ["Na data da publicação", "45 dias depois de oficialmente publicada", "90 dias depois de publicada"], "answer": 1, "explain": "Art. 1º, caput: “salvo disposição contrária, a lei começa a vigorar em todo o País quarenta e cinco dias depois de oficialmente publicada” (vacatio legis)."}, {"q": "A que família jurídica o Direito Brasileiro é filiado?", "options": ["Common Law", "Civil Law (a lei é fonte primária)", "Direito muçulmano"], "answer": 1, "explain": "O Brasil é filiado à Civil Law, de origem romano-germânica, em que a lei é a fonte primária do sistema."}, {"q": "Qual a diferença entre ab-rogação e derrogação?", "options": ["Ab-rogação é parcial e derrogação é total", "Ab-rogação é total e derrogação é parcial", "São sinônimos"], "answer": 1, "explain": "Quanto à extensão: ab-rogação = revogação TOTAL; derrogação = revogação PARCIAL."}, {"q": "Uma norma C revoga a norma B, que antes havia revogado a norma A. A norma A volta a valer automaticamente?", "options": ["Sim, sempre — é a repristinação automática", "Não, salvo disposição expressa em sentido contrário", "Sim, mas apenas por 45 dias"], "answer": 1, "explain": "O art. 2º, § 3º, afasta a repristinação automática. A lei revogada só volta a viger se houver disposição expressa."}, {"q": "O que diz o princípio da continuidade (art. 2º da LINDB)?", "options": ["A lei tem prazo de validade de um ano", "A lei, a partir da entrada em vigor, tem eficácia contínua até que outra a modifique ou revogue", "A lei nunca pode ser revogada"], "answer": 1, "explain": "Não se fixando prazo de vigência, a lei tem eficácia contínua até ser modificada ou revogada por outra (princípio da continuidade)."}, {"q": "Qual a diferença entre revogação expressa e tácita?", "options": ["Expressa é declarada na lei nova; tácita decorre de incompatibilidade, sem previsão expressa", "Expressa é por decreto; tácita é por lei", "Não há diferença"], "answer": 0, "explain": "Revogação expressa: a lei nova declara revogada a anterior. Tácita: a lei posterior é incompatível com a anterior, sem previsão expressa de revogação."}, {"q": "O conceito de lei como “imperativo autorizante”, adotado por Tartuce, é de:", "options": ["Hans Kelsen", "Goffredo Telles Jr.", "Miguel Reale"], "answer": 1, "explain": "O conceito de lei como imperativo autorizante é de Goffredo Telles Jr., seguido por Tartuce: um imperativo (autoridade competente, generalidade) que autoriza ou não condutas."}, {"q": "O prazo para a norma brasileira vigorar nos Estados estrangeiros é de:", "options": ["45 dias", "Três meses após a publicação oficial", "Um ano"], "answer": 1, "explain": "Consoante o art. 1º, § 1º, a obrigatoriedade da norma brasileira vigora nos Estados estrangeiros três meses após a publicação oficial no Brasil."}, {"q": "O “efeito repristinatório” decorrente da declaração de inconstitucionalidade:", "options": ["É o mesmo que a repristinação do art. 2º, § 3º", "Não se confunde com a repristinação do art. 2º, § 3º; restaura a eficácia das normas afetadas", "Nunca é admitido"], "answer": 1, "explain": "O efeito repristinatório da declaração de inconstitucionalidade não se confunde com a repristinação do art. 2º, § 3º — no primeiro caso sequer há revogação no plano jurídico."}], "terms": [{"termo": "Civil Law", "definicao": "Família jurídica (de raíz romano-germânica) em que a lei é a fonte primária do Direito. É a tradição brasileira.", "secao": "1.2"}, {"termo": "Common Law", "definicao": "Família jurídica em que os precedentes judiciais são a principal fonte do Direito (ex.: Inglaterra).", "secao": "1.2"}, {"termo": "Imperativo autorizante", "definicao": "Conceito de lei adotado por Tartuce (de Goffredo Telles Jr.): a norma é um imperativo (vem de autoridade competente, dirigido a todos) que autoriza ou não autoriza condutas.", "secao": "1.2"}, {"termo": "Vacatio legis", "definicao": "Período entre a publicação da lei e o início de sua vigência. Regra geral: 45 dias no Brasil (art. 1º).", "secao": "1.2"}, {"termo": "Princípio da continuidade", "definicao": "Art. 2º: a lei, uma vez em vigor, tem eficácia contínua até que outra a modifique ou revogue.", "secao": "1.2"}, {"termo": "Ab-rogação", "definicao": "Revogação TOTAL de uma norma.", "secao": "1.2"}, {"termo": "Derrogação", "definicao": "Revogação PARCIAL de uma norma (só parte dela perde efeito).", "secao": "1.2"}, {"termo": "Revogação expressa", "definicao": "Quando a lei nova declara textualmente revogada a anterior (ou aponta os dispositivos revogados).", "secao": "1.2"}, {"termo": "Revogação tácita", "definicao": "Quando a lei nova é incompatível com a anterior, sem declará-la revogada expressamente.", "secao": "1.2"}, {"termo": "Repristinação", "definicao": "Retorno da vigência de uma lei revogada quando a sua revogadora é também revogada. Não ocorre automaticamente (art. 2º, § 3º), salvo disposição expressa.", "secao": "1.2"}, {"termo": "Efeito repristinatório", "definicao": "Restauração de eficácia de normas afetadas quando uma lei é declarada inconstitucional. Não se confunde com a repristinação do art. 2º, § 3º.", "secao": "1.2"}], "blocks": ["O Direito Brasileiro sempre foi filiado à escola da Civil Law, de origem romano--germânica, pela qual a lei é fonte primária do sistema jurídico. Assim ainda o é, apesar de todo o movimento de valorização do costume jurisprudencial, notadamente pela emergência da súmula vinculante como fonte do direito, diante da Emenda Constitucional 45/2004. Como é notório, a alteração constitucional incluiu o art. 103-A no Texto Maior com a seguinte redação:", "“Art. 103-A. O Supremo Tribunal Federal poderá, de ofício ou por provocação, mediante decisão de dois terços dos seus membros, após reiteradas decisões sobre matéria constitucional, aprovar súmula que, a partir de sua publicação na imprensa oficial, terá efeito vinculante em relação aos demais órgãos do Poder Judiciário e à administração pública direta e indireta, nas esferas federal, estadual e municipal, bem como proceder à sua revisão ou cancelamento, na forma estabelecida em lei”.", "Desse modo, haveria uma tendência de se caminhar para um sistema próximo à Common Law, em que os precedentes jurisprudenciais constituem a principal fonte do direito. Porém, conforme destaca Walber de Moura Agra, as súmulas vinculantes não são leis, não tendo a mesma força dessas.<sup class=\"fn\" data-n=\"3\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 3\">3</sup> A conclusão, portanto, é pela permanência, pelo menos por enquanto, de um sistema essencialmente legal. Como é notório, o princípio da legalidade está expresso no art. 5.º, inc. II, da Constituição Federal de 1988, pelo qual ninguém será obrigado a fazer ou a deixar de fazer algo senão em virtude da lei.", "Pontue-se que essa tendência de caminhar para o sistema da Common Law foi incrementada pelo Código de Processo Civil de 2015, em virtude da valorização dada, nessa lei instrumental emergente, aos precedentes judiciais. Entre outros comandos, o CPC/2015 determina, em seu art. 926, que os Tribunais devem uniformizar sua jurisprudência e mantê-la estável, íntegra e coerente. Conforme o § 1.º do dispositivo instrumental, na forma estabelecida e segundo os pressupostos fixados no regimento interno, os Tribunais editarão enunciados de súmula correspondentes a sua jurisprudência dominante. Ademais, está previsto que, ao editar os enunciados das súmulas, os Tribunais devem ater-se às circunstâncias fáticas dos precedentes que motivaram sua criação (art. 926, § 2.º, do CPC/2015).", "Em complemento, o art. 927 da mesma norma enuncia a necessidade de os Tribunais e juízes de primeiro grau seguirem as orientações da jurisprudência superior, em especial do Supremo Tribunal Federal e do Superior Tribunal de Justiça. Como está nesse comando, os juízes e os tribunais de todas as instâncias observarão: a) as decisões do Supremo Tribunal Federal em controle concentrado de constitucionalidade; b) os enunciados de súmula vinculante; c) os acórdãos em incidente de assunção de competência ou de resolução de demandas repetitivas e em julgamento de recursos extraordinário e especial repetitivos; d) os enunciados das súmulas do Supremo Tribunal Federal em matéria constitucional e do Superior Tribunal de Justiça em matéria infraconstitucional; e e) a orientação do plenário ou do órgão especial aos quais estiverem vinculados.", "Entendo que o tempo e a prática já demonstram que esse caminho para um sistema jurídico costumeiro, baseado também em decisões judiciais, está sendo bem concretizado, quebrando-se com a nossa secular tradição fundada somente na lei. Tornou-se comum, sobretudo em demandas e processos que envolvem o Direito Civil, a citação de temas de repercussão geral e precedentes vinculativos dos Tribunais Superiores, como se poderá perceber da leitura deste livro.", "Conceito interessante de lei é aquele concebido por Goffredo Telles Jr., seguido por mim, no sentido de ser a norma jurídica um imperativo autorizante.<sup class=\"fn\" data-n=\"4\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 4\">4</sup> Trata-se de um imperativo, pois emanada de autoridade competente, sendo dirigida a todos (generalidade). Constitui um autorizamento, pois autoriza ou não autoriza determinadas condutas. Tal preciosa construção pode ser seguida por todos os estudiosos do Direito, desde o estudante de graduação que se inicia, até o mais experiente jurista ou professor do Direito.", "Apesar de a lei ser a fonte primária do Direito, não se pode conceber um Estado Legal puro, em que a norma jurídica acaba sendo o fim ou o teto para as soluções jurídicas. Na verdade, a norma jurídica é apenas o começo, o ponto de partida, ou seja, o piso mínimo para os debates jurídicos e para a solução dos casos concretos. Vige o Estado de Direito, em que outros parâmetros devem ser levados em conta pelo intérprete do Direito. Em outras palavras, não se pode conceber que a aplicação da lei descabe para o mais exagerado legalismo, conforme se extrai das palavras de Sérgio Resende de Barros a seguir destacadas:", "“Desse modo, com inspiração em Carré de Malberg, pode-se e deve-se distinguir o Estado de direito do Estado de legalidade. O que ele chamou de Estado ‘legal’ hoje se pode chamar de Estado de legalidade: degeneração do Estado de direito, que põe em risco a justa atuação da lei na enunciação e concreção dos valores sociais como direitos individuais, coletivos, difusos. No mero Estado de Legalidade, a lei é editada e aplicada sem levar em conta o resultado, ou seja, sem considerar se daí resulta uma injusta opressão dos direitos. Impera o legalismo, que é a forma mais sutil de autoritarismo, na qual o espírito autoritário se aninha e se disfarça na própria lei. O processo legislativo atende à conveniência política do poderoso do momento, quando não é este in persona quem edita a norma ‘provisoriamente’”.<sup class=\"fn\" data-n=\"5\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 5\">5</sup>", "Pois bem, sendo concebida a lei como fonte do direito – mas não como a única e exclusiva –, a Lei de Introdução consagra no seu início regras relativas à sua vigência.", "De início, o art. 1.º, caput, da Lei de Introdução, enuncia que “salvo disposição contrária, a lei começa a vigorar em todo o País quarenta e cinco dias depois de oficialmente publicada”. Nos termos do art. 8.º, § 1.º, da Lei Complementar 95/1998, a contagem do prazo para entrada em vigor das leis que estabelecem período de vacância far-se-á com a inclusão da data da publicação e do último dia do prazo, entrando em vigor no dia subsequente à sua consumação integral. Como aponta a doutrina, não interessa se a data final seja um feriado ou final de semana, entrando em vigor a norma mesmo assim, ou seja, a data não é prorrogada para o dia seguinte.<sup class=\"fn\" data-n=\"6\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 6\">6</sup>", "Esclarecendo, a lei passa por três fases fundamentais para que tenha validade e eficácia as de elaboração, promulgação e publicação. Depois vem o prazo de vacância, geralmente previsto na própria norma. Isso ocorreu com o Código Civil de 2002, com a previsão do prazo de um ano a partir da publicação (art. 2.044 do CC/2002). De acordo com o entendimento majoritário, inclusive da jurisprudência nacional, a atual codificação privada entrou em vigor no dia 11 de janeiro de 2003, levando-se em conta a contagem dia a dia (nesse sentido, ver: STJ, Ag. Int. no AREsp 1.417.538/BA, 4.ª Turma, Rel. Min. Luis Felipe Salomão, j. 24.09.2019, DJe 30.09.2019; AgRg no REsp 1.052.779/SC, 1.ª Turma, Rel. Min. Hamilton Carvalhido, j. 27.10.2009, DJe 19.11.2009; REsp 1.032.952/SP, 3.ª Turma, Rel. Min. Nancy Andrighi, j. 17.03.2009, DJe 26.03.2009; e EDcl no AgRg no REsp 1.010.158/PR, 2.ª Turma, Rel. Min. Humberto Martins, j. 23.09.2008, DJe 06.11.2008).", "Em continuidade de estudo, consoante o art. 1.º, § 1.º, da Lei de Introdução, a obrigatoriedade da norma brasileira passa a vigorar, nos Estados estrangeiros, três meses após a publicação oficial em nosso País, previsão esta de maior interesse ao Direito Internacional Público.", "Ainda quanto à vigência das leis, destaque-se que o art. 1.º, § 2.º, da Lei de Introdução foi revogado pela Lei 12.036/2009. Previa o comando, na sua redação anterior, que “a vigência das leis, que os Governos Estaduais elaborem por autorização do Governo Federal, depende da aprovação deste e começa no prazo que a legislação estadual fixar”. Segundo aponta Gustavo Mônaco, Professor Titular da Universidade de São Paulo, o dispositivo foi revogado, pondo fim à dúvida doutrinária sobre a sua recepção pela Constituição Federal de 1988, diante de suposto desrespeito à tripartição dos poderes.<sup class=\"fn\" data-n=\"7\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 7\">7</sup>", "Em havendo norma corretiva, mediante nova publicação do texto legal, os prazos mencionados devem correr a partir da nova publicação (art. 1.º, § 3.º, da Lei de Introdução). A norma corretiva é aquela que existe para afastar equívocos importantes cometidos pelo texto legal, sendo certo que as correções do texto de lei já em vigor devem ser consideradas como lei nova.", "O art. 2.º da Lei de Introdução consagra o princípio da continuidade da lei, pelo qual a norma, a partir da sua entrada em vigor, tem eficácia contínua, até que outra a modifique ou revogue. Dessa forma, tem-se a regra do fim da obrigatoriedade da lei, além do caso de ter a mesma vigência temporária.", "Contudo, não se fixando este prazo, prolongam-se a obrigatoriedade e o princípio da continuidade até que a lei seja modificada ou revogada por outra (art. 2.º, caput, da Lei de Introdução). A lei posterior revoga a anterior quando expressamente o declare, quando seja com ela incompatível ou quando regule inteiramente a matéria de que tratava a lei anterior (art. 2.º, § 1.º). Entretanto, a lei nova, que estabeleça disposições gerais ou especiais a par das já existentes, não revoga nem modifica a lei anterior (art. 2.º, § 2.º). Vejamos dois exemplos concretos.", "Inicialmente, imagine-se o caso do Código Civil de 2002, que dispôs expressamente e de forma completa sobre o condomínio edilício, entre os seus arts. 1.331 a 1.358. Por tal tratamento, deve ser tida como revogada tacitamente a Lei 4.591/1964, naquilo que regulava o assunto (arts. 1.º a 27). Trata-se de aplicação da segunda parte do art. 2.º, § 1.º, da Lei de Introdução, o que vem sendo confirmado pela jurisprudência nacional (STJ, REsp 746.589/RS, 4.ª Turma, Rel. Min. Aldir Guimarães Passarinho Junior, j. 15.08.2006, DJU 18.09.2006, p. 327).", "Como segundo exemplo temos a incidência do art. 2.º, § 2.º, da Lei de Introdução na seguinte conclusão: o Código Civil dispôs de forma especial sobre a locação (arts. 565 a 578), não prejudicando a lei especial anterior que dispunha sobre a locação imobiliária, permanecendo esta incólume (Lei 8.245/1991). Tanto isso é verdade que foi introduzida na codificação material uma norma de direito intertemporal, prevendo que a locação de prédio urbano que esteja sujeita à lei especial, por esta continua a ser regida (art. 2.036 do CC/2002).", "Pois bem, pelo que consta do art. 2.º da Lei de Introdução, o meio mais comum para se retirar a vigência de uma norma jurídica é a sua revogação, o que pode ocorrer sob duas formas, classificadas quanto à sua extensão:", "a) Revogação total ou ab-rogação – ocorre quando se torna sem efeito uma norma de forma integral, com a supressão total do seu texto por uma norma emergente. Exemplo ocorreu com o Código Civil de 1916, pelo que consta do art. 2.045, primeira parte, do CC/2002.", "b) Revogação parcial ou derrogação – uma lei nova torna sem efeito parte de uma lei anterior, como se deu em face da parte primeira do Código Comercial de 1850, conforme está previsto no mesmo art. 2.045, segunda parte, do CC/2002.", "No que concerne ao modo, as duas modalidades de revogação analisadas podem ser assim classificadas:", "a) Revogação expressa (ou por via direta) – situação em que a lei nova taxativamente declara revogada a lei anterior ou aponta os dispositivos que pretende retirar. Conforme previsão do art. 9.º da Lei Complementar 95/1998, “a cláusula de revogação deverá enumerar expressamente a lei ou disposições revogadas”. O respeito, em parte, em relação a tal dispositivo especial pode ser percebido pela leitura do citado art. 2.045 do Código Civil, pelo qual “revogam-se a Lei 3.071, de 1.º de janeiro de 1916 – Código Civil e a Primeira Parte do Código Comercial, Lei 556, de 25 de junho de 1850”. Entretanto, o atual Código Civil permaneceu silente a respeito da revogação ou não de algumas leis especiais como a Lei do Divórcio (Lei 6.515/1977), a Lei de Registros Públicos (Lei 6.015/1973), a Lei de Condomínio e Incorporação (Lei 4.591/1967), entre outras. Nesse último ponto residem críticas ao Código Civil de 2002, por ter desobedecido à orientação anterior. A questão da revogação das leis especiais anteriores deve ser analisada caso a caso.", "b) Revogação tácita (ou por via oblíqua) – situação em que a lei posterior é incompatível com a anterior, não havendo previsão expressa no texto a respeito da sua revogação. O Código Civil de 2002 não trata da revogação de leis especiais, devendo ser aplicada a revogação parcial tácita que parece constar do seu art. 2.043 do CC: “Até que por outra forma se disciplinem, continuam em vigor as disposições de natureza processual, administrativa ou penal, constantes de leis cujos preceitos de natureza civil hajam sido incorporados a este Código”. Assim, vários preceitos materiais de leis especiais, como a Lei do Divórcio (Lei 6.515/1977), foram incorporados pelo atual Código Civil, permanecendo em vigor os seus preceitos processuais, trazendo a conclusão da sua revogação parcial, por via oblíqua.", "Muito importante lembrar que o art. 2.º, § 3.º, da Lei de Introdução afasta a possibilidade da lei revogada anteriormente repristinar, salvo disposição expressa em lei em sentido contrário. O efeito repristinatório é aquele pelo qual uma norma revogada volta a valer no caso de revogação da sua revogadora. Esclarecendo, vejamos o seguinte esquema lógico:", "1) Norma A – válida.", "2) Norma B revoga a norma A.", "3) Norma C revoga a norma B.", "4) A Norma A (revogada) volta a valer com a revogação (por C) da sua revogadora (B)?", "5) Resposta: Não. Porque não se admite o efeito repristinatório automático.", "Contudo, excepcionalmente, a lei revogada volta a viger quando a lei revogadora for declarada inconstitucional ou quando for concedida a suspensão cautelar da eficácia da norma impugnada – art. 11, § 2.º, da Lei 9.868/1999. Também voltará a viger quando, não sendo situação de inconstitucionalidade, o legislador assim o determinar expressamente.", "Em suma, são possíveis duas situações. A primeira delas é aquela em que o efeito repristinatório decorre da declaração de inconstitucionalidade da lei. A segunda é o efeito repristinatório previsto pela própria norma jurídica. Como exemplo da primeira hipótese, pode ser transcrito o seguinte julgado do Superior Tribunal de Justiça:", "“Contribuição previdenciária patronal. Empresa agroindustrial. Inconstitucionalidade. Efeito repristinatório. Lei de Introdução ao Código Civil. 1. A declaração de inconstitucionalidade em tese, ao excluir do ordenamento positivo a manifestação estatal inválida, conduz à restauração de eficácia das leis e das normas afetadas pelo ato declarado inconstitucional. 2. Sendo nula e, portanto, desprovida de eficácia jurídica a lei inconstitucional, decorre daí que a decisão declaratória da inconstitucionalidade produz efeitos repristinatórios. 3. O chamado efeito repristinatório da declaração de inconstitucionalidade não se confunde com a repristinação prevista no artigo 2.º, § 3.º, da LICC, sobretudo porque, no primeiro caso, sequer há revogação no plano jurídico. 4. Recurso especial a que se nega provimento” (STJ, REsp 517.789/AL, 2.ª Turma, Rel. Min. João Otávio de Noronha, j. 08.06.2004, DJ 13.06.2005, p. 236).", "A encerrar o estudo da matéria de vigência das normas jurídicas, vejamos as suas principais características e a sua aplicação concreta."], "children": []}, {"num": "1.3", "title": "1.3 CARACTERÍSTICAS DA NORMA JURÍDICA E SUA APLICAÇÃO. ANÁLISE DO ART. 3.º DA LEI DE INTRODUÇÃO", "resumo": "A lei tem cinco características básicas: generalidade (vale para todos, erga omnes), imperatividade (impõe condutas), permanência (dura até ser revogada), competência (deve vir de autoridade competente) e autorizante (autoriza ou não autoriza condutas — conceito que supera a ideia de Kelsen de que não há norma sem sanção). O art. 3º traz o princípio da obrigatoriedade: “ninguém se escusa de cumprir a lei alegando que não a conhece”. Há três teorias para justificá-lo: da ficção legal, da presunção absoluta e da necessidade social — esta última, defendida por Maria Helena Diniz, é a mais aceita e gera o princípio da vigência sincrônica. Esse dever não é absoluto: o Código Civil admite o erro de direito (art. 139, III) como vício que pode anular o negócio jurídico.", "pontos": ["5 características: generalidade, imperatividade, permanência, competência, autorizante.", "Art. 3º = princípio da obrigatoriedade (não se alega desconhecimento da lei).", "Teoria mais aceita: da necessidade social (Maria Helena Diniz).", "O erro de direito (art. 139, III, CC) abranda a obrigatoriedade."], "quiz": [{"q": "O que diz o princípio da obrigatoriedade (art. 3º da LINDB)?", "options": ["Que toda lei precisa de sanção para valer", "Que ninguém pode deixar de cumprir a lei alegando que não a conhece", "Que a lei só obriga quem participou de sua elaboração"], "answer": 1, "explain": "Art. 3º: “Ninguém se escusa de cumprir a lei, alegando que não a conhece”."}, {"q": "Qual das três teorias sobre a obrigatoriedade é considerada a mais correta por Tartuce?", "options": ["Teoria da ficção legal", "Teoria da presunção absoluta", "Teoria da necessidade social"], "answer": 2, "explain": "A teoria da necessidade social (Maria Helena Diniz) é a mais aceita e gera o princípio da vigência sincrônica: as normas devem ser conhecidas para melhor serem observadas."}, {"q": "Quais são as cinco características básicas da lei?", "options": ["Generalidade, imperatividade, permanência, competência e autorizante", "Clareza, brevidade, publicidade, oralidade e sanção", "Rigidez, unidade, coerência, hierarquia e vigência"], "answer": 0, "explain": "As características são: generalidade (erga omnes), imperatividade, permanência, competência e autorizante."}, {"q": "A característica “autorizante” da norma jurídica está ligada à superação de qual tese?", "options": ["A de que a lei é fonte primária", "A de que não há norma sem sanção (Hans Kelsen)", "A de que a lei tem generalidade"], "answer": 1, "explain": "O conceito contemporâneo (autorizamento) supera a tese kelseniana de que não há norma sem sanção: a norma autoriza ou não autoriza condutas."}, {"q": "O princípio da obrigatoriedade é absoluto?", "options": ["Sim, não comporta exceções", "Não — o CC admite o erro de direito (art. 139, III) como vício que pode anular o negócio", "Sim, salvo para estrangeiros"], "answer": 1, "explain": "Não é absoluto: o art. 139, III, do CC admite o erro de direito (error iuris) como causa de anulabilidade do negócio jurídico."}, {"q": "O “erro de direito” (art. 139, III, do CC) pode levar a que consequência?", "options": ["À nulidade absoluta do negócio", "À anulabilidade do negócio jurídico (ação em 4 anos, art. 178, II)", "A nenhuma consequência"], "answer": 1, "explain": "Havendo erro de direito como causa única do negócio, sem intenção de descumprir a lei, reconhece-se a anulabilidade (ação decadencial de 4 anos)."}], "terms": [{"termo": "Erga omnes", "definicao": "Expressão latina: “contra todos”. A lei vale para todos, sem distinção (generalidade).", "secao": "1.3"}, {"termo": "Princípio da obrigatoriedade", "definicao": "Art. 3º: ninguém se escusa de cumprir a lei alegando que não a conhece.", "secao": "1.3"}, {"termo": "Vigência sincrônica", "definicao": "Ideia (teoria da necessidade social) de que a lei deve ser conhecida para ser bem observada, valendo de modo simultâneo para todos.", "secao": "1.3"}, {"termo": "Erro de direito (error iuris)", "definicao": "Falsa noção sobre a norma que, sendo causa única do negócio e sem intenção de descumprir a lei, pode anulá-lo (art. 139, III, do CC).", "secao": "1.3"}], "blocks": ["A lei, como fonte primária do Direito Brasileiro, tem as seguintes características básicas:", "a) Generalidade – a norma jurídica dirige-se a todos os cidadãos, sem qualquer distinção, tendo eficácia erga omnes.", "b) Imperatividade – a norma jurídica é um imperativo, impondo deveres e condutas para os membros da coletividade.", "c) Permanência – a lei perdura até que seja revogada por outra ou perca a eficácia.", "d) Competência – a norma, para valer contra todos, deve emanar de autoridade competente, com o respeito ao processo de elaboração.", "e) Autorizante – o conceito contemporâneo de norma jurídica traz a ideia de um autorizamento (a norma autoriza ou não autoriza determinada conduta), estando superada a tese de que não há norma sem sanção (Hans Kelsen).", "Como outra característica básica, está consagrado no art. 3.º da Lei de Introdução o princípio da obrigatoriedade da norma, pelo qual ninguém pode deixar de cumprir a lei alegando não a conhecer. Três são as correntes doutrinárias que procuram justificar o conteúdo da norma:", "a) Teoria da ficção legal, eis que a obrigatoriedade foi instituída pelo ordenamento para a segurança jurídica.<sup class=\"fn\" data-n=\"8\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 8\">8</sup>", "b) Teoria da presunção absoluta, pela qual haveria uma dedução iure et de iure de que todos conhecem as leis.<sup class=\"fn\" data-n=\"9\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 9\">9</sup>", "c) Teoria da necessidade social, amparada, segundo Maria Helena Diniz, na premissa “de que as normas devem ser conhecidas para que melhor sejam observadas”, a gerar o princípio da vigência sincrônica da lei.<sup class=\"fn\" data-n=\"10\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 10\">10</sup>", "A última das teorias parece-me a mais correta. De fato, não merece alento a tese da ficção legal, pela qual a obrigatoriedade é um comando criado pela lei e dirigida a todos; muito menos a teoria pela qual há uma presunção absoluta (iure et iure) de que todos conhecem o teor da norma, a partir da sua publicação. Sobre a tese da presunção, comenta o saudoso Zeno Veloso, com razão e filiado à teoria da necessidade social:", "“Não se deve concluir que o aludido art. 3.º da LICC está expressando uma presunção de que todos conhecem as leis. Quem acha isto está conferindo a pecha de inepto ou insensato ao legislador. E ele não é estúpido. Num País em que há um excesso legislativo, uma superprodução de leis, que a todos atormenta, assombra e confunde – sem contar o número enormíssimo de medidas provisórias –, presumir que todas as leis são conhecidas por todo mundo agrediria a realidade”.<sup class=\"fn\" data-n=\"11\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 11\">11</sup>", "Em reforço, constata-se que o princípio da obrigatoriedade das leis não pode ser visto como um preceito absoluto, havendo claro abrandamento no Código Civil de 2002. Isso porque o art. 139, inc. III, da codificação material em vigor admite a existência de erro substancial quando a falsa noção estiver relacionada com um erro de direito (error iuris), desde que este seja única causa para a celebração de um negócio jurídico e que não haja desobediência à lei. Alerte-se, em complemento, que a Lei de Contravenções Penais já previa o erro de direito como justificativa para o descumprimento da norma (art. 8.º).", "Não há qualquer conflito entre o art. 3.º da Lei de Introdução e o citado art. 139, inc. III, do CC, que possibilita a anulabilidade do negócio jurídico pela presença do erro de direito, conforme previsão do seu art. 171. A primeira norma – Lei de Introdução – é geral, apesar da discussão da sua eficácia, enquanto a segunda – Código Civil – é especial, devendo prevalecer. Concluindo, havendo erro de direito a acometer um determinado negócio ou ato jurídico, proposta a ação específica no prazo decadencial de quatro anos contados da sua celebração (art. 178, inc. II, do CC), haverá o reconhecimento da sua anulabilidade.", "Ilustrando, trazendo interessante conclusão de aplicação do erro de direito, da jurisprudência trabalhista:", "“Anulação – Erro de direito (art. 139, III, CC) – A concessão de benefício (assistência médica suplementar) previsto em acordo coletivo de trabalho calcada em regulamento já revogado traduz negócio jurídico eivado por erro substancial a autorizar sua supressão quando detectado o equívoco” (TRT 2.ª Região, Recurso Ordinário 2.032, Acórdão 20070028367, 7.ª Turma, Rel. Juíza Cátia Lungov, j. 1.º.02.2007, DOESP 09.02.2007).", "Em complemento, a concretizar o erro de direito, cite-se julgado do Tribunal de Justiça de São Paulo que anulou acordo celebrado na extinta separação judicial diante de engano cometido pelo marido, “que destina à esposa, no acordo de separação, bens incomunicáveis seus” (TJSP, Apelação Cível 192.355-4/1-00, 4.ª Câmara de Direito Privado, Rio Claro, Rel. Des. Ênio Santarelli Zuliani, j. 02.02.2006).", "O erro de direito ainda será retomado no próximo capítulo deste livro, quando do estudo dos vícios do negócio jurídico."], "children": []}, {"num": "1.4", "title": "1.4 AS FORMAS DE INTEGRAÇÃO DA NORMA JURÍDICA. ART. 4.º DA LEI DE INTRODUÇÃO", "resumo": "“O Direito não é lacunoso, mas há lacunas”: as lacunas são da lei (que às vezes é omissa), não do Direito como sistema. O juiz não pode deixar de decidir alegando lacuna (vedação do non liquet). O art. 4º manda que, na omissão da lei, o juiz decida pela analogia, pelos costumes e pelos princípios gerais de direito — são as formas de integração (que não se confundem com a subsunção, aplicação direta da norma). Tartuce defende que a ordem do art. 4º não precisa mais ser rigidamente seguida, porque os princípios constitucionais (como a dignidade humana) têm aplicação imediata — é a eficácia horizontal dos direitos fundamentais, reforçada pelo art. 8º do CPC/2015. Maria Helena Diniz classifica as lacunas em: normativa, ontológica, axiológica e de conflito (antinomia).", "pontos": ["As lacunas são da LEI, não do Direito.", "Vedação do non liquet: o juiz não pode se recusar a decidir.", "Art. 4º: analogia, costumes e princípios gerais.", "Integração (preencher lacuna) ≠ subsunção (aplicar norma existente).", "4 tipos de lacuna: normativa, ontológica, axiológica e de conflito."], "quiz": [{"q": "Segundo o art. 4º da LINDB, quando a lei for omissa o juiz decidirá de acordo com:", "options": ["A analogia, os costumes e os princípios gerais de direito", "Apenas a jurisprudência dos tribunais superiores", "A sua livre convicção pessoal, sem limites"], "answer": 0, "explain": "Art. 4º: “Quando a lei for omissa, o juiz decidirá o caso de acordo com a analogia, os costumes e os princípios gerais de direito”."}, {"q": "Qual a diferença entre integração e subsunção?", "options": ["São a mesma coisa", "Integração preenche uma lacuna; subsunção é a aplicação direta de uma norma existente", "Subsunção preenche lacuna; integração aplica a norma"], "answer": 1, "explain": "A integração corrige a omissão (não há norma direta). A subsunção é a aplicação direta da norma ao caso concreto."}, {"q": "A frase “O Direito não é lacunoso, mas há lacunas” (Maria Helena Diniz) significa que:", "options": ["O Direito é cheio de falhas", "As lacunas são da lei (omissa), não do Direito como sistema", "Não existem lacunas"], "answer": 1, "explain": "As lacunas não são do Direito, mas da lei, que é omissa em alguns casos — o sistema jurídico é aberto."}, {"q": "Uma norma existe para o caso, mas sua aplicação seria injusta. Que tipo de lacuna é esse?", "options": ["Lacuna normativa", "Lacuna ontológica", "Lacuna axiológica"], "answer": 2, "explain": "Lacuna axiológica: há norma, mas sua aplicação seria insatisfatória ou injusta. (Normativa = falta norma; ontológica = norma sem eficácia social.)"}, {"q": "A vedação de o juiz deixar de decidir alegando lacuna ou obscuridade é chamada de:", "options": ["Non liquet", "Erga omnes", "Numerus clausus"], "answer": 0, "explain": "É a vedação do non liquet: o juiz não se exime de decidir sob alegação de lacuna ou obscuridade (art. 140 do CPC/2015)."}, {"q": "Segundo Tartuce, a ordem do art. 4º (analogia → costumes → princípios) deve ser:", "options": ["Sempre rígida e obrigatória", "Flexível, pois os princípios constitucionais têm aplicação imediata", "Invertida obrigatoriamente"], "answer": 1, "explain": "A ordem não precisa mais ser rígida: os princípios constitucionais (dignidade humana) têm aplicação imediata (eficácia horizontal), reforçada pelo art. 8º do CPC/2015."}], "terms": [{"termo": "Integração", "definicao": "Preenchimento das lacunas da lei com as ferramentas do art. 4º (analogia, costumes, princípios).", "secao": "1.4"}, {"termo": "Subsunção", "definicao": "Aplicação direta de uma norma existente ao caso concreto (fattispecie). Não se confunde com integração.", "secao": "1.4"}, {"termo": "Non liquet", "definicao": "Vedação de o juiz deixar de decidir alegando lacuna ou obscuridade da lei.", "secao": "1.4"}, {"termo": "Lacuna normativa", "definicao": "Ausência total de norma prevista para o caso concreto.", "secao": "1.4"}, {"termo": "Lacuna ontológica", "definicao": "Existe norma para o caso, mas ela não tem eficácia social.", "secao": "1.4"}, {"termo": "Lacuna axiológica", "definicao": "Existe norma para o caso, mas sua aplicação seria injusta ou insatisfatória.", "secao": "1.4"}, {"termo": "Eficácia horizontal dos direitos fundamentais", "definicao": "Ideia de que os direitos fundamentais incidem também nas relações entre particulares (não só entre Estado e cidadão) e têm aplicação imediata (art. 5º, § 1º, CF).", "secao": "1.4"}], "blocks": ["“O Direito não é lacunoso, mas há lacunas.”<sup class=\"fn\" data-n=\"12\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 12\">12</sup>", "A frase acima pode parecer um paradoxo sem sentido, mas não o é. A construção reproduzida é perfeita. O sistema jurídico constitui um sistema aberto, no qual há lacunas, conforme elucida Maria Helena Diniz em sua clássica obra As lacunas no direito.<sup class=\"fn\" data-n=\"13\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 13\">13</sup> Entretanto, de acordo com as suas lições, as lacunas não são do direito, mas da lei, omissa em alguns casos.", "Como é cediço, há um dever do aplicador do direito de corrigir as lacunas (vedação do não julgamento ou do non liquet), que era extraído do art. 126 do Código de Processo Civil de 1973, pelo qual o juiz não se exime de sentenciar ou despachar alegando lacuna ou obscuridade da lei. No julgamento da lide caber-lhe-á aplicar as normas legais; não as havendo, recorrerá à analogia, aos costumes e aos princípios gerais de direito”.<sup class=\"fn\" data-n=\"14\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 14\">14</sup> Vale dizer, o dispositivo foi repetido em parte pelo art. 140 do Código de Processo Civil de 2015, com a seguinte expressão: “o juiz não se exime de decidir sob a alegação de lacuna ou obscuridade do ordenamento jurídico. Parágrafo único. O juiz só decidirá por equidade nos casos previstos em lei”.", "Como se nota, o novo preceito não faz mais menção à analogia, aos costumes e aos princípios gerais de direito, remetendo a sua incidência ao art. 4.º da Lei de Introdução, com os aprofundamentos que ainda serão aqui analisados.", "A propósito da classificação das lacunas, é perfeita a construção criada por Maria Helena Diniz, a saber:", "• Lacuna normativa: ausência total de norma prevista para um determinado caso concreto.", "• Lacuna ontológica: presença de norma para o caso concreto, mas que não tenha eficácia social.", "• Lacuna axiológica: presença de norma para o caso concreto, mas cuja aplicação seja insatisfatória ou injusta.", "• Lacuna de conflito ou antinomia: choque de duas ou mais normas válidas, pendente de solução no caso concreto. As antinomias serão estudadas oportunamente, em seção própria.<sup class=\"fn\" data-n=\"15\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 15\">15</sup>", "Presentes as lacunas, como sempre se extraiu da doutrina e da jurisprudência, deverão ser utilizadas as formas de integração da norma jurídica, tidas como ferramentas de correção do sistema, constantes dos arts. 4.º e 5.º da Lei de Introdução. Anote-se que a integração não se confunde com a subsunção, sendo a última a aplicação direta da norma jurídica a um determinado tipo ou fattispecie. O art. 4.º da Lei de Introdução enuncia que quando a lei for omissa, o juiz decidirá o caso de acordo com a analogia, os costumes e os princípios gerais de direito, tratando da integração.", "A primeira dúvida concreta que surge em relação ao comando legal é se a ordem nele prevista deve ou não ser rigorosamente obedecida. Em uma visão clássica, a resposta é positiva. Filiado a essa corrente, pode ser citado, entre tantos outros, Silvio Rodrigues, para quem “no silêncio da lei, portanto, deve o julgador, na ordem mencionada, lançar mão desses recursos, para não deixar insolvida a demanda”.<sup class=\"fn\" data-n=\"16\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 16\">16</sup> No mesmo sentido, posiciona-se Rubens Limongi França.<sup class=\"fn\" data-n=\"17\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 17\">17</sup>", "Todavia, até pode-se afirmar que essa continua sendo a regra, mas nem sempre o respeito a essa ordem deverá ocorrer, diante da força normativa e coercitiva dos princípios, notadamente daqueles de índole constitucional. Como é notório, a Constituição Federal de 1988 prevê no seu art. 5.º, § 1.º, que as normas que definem direitos fundamentais – muitas geradoras de princípios estruturantes do sistema jurídico –, têm aplicação imediata. Trata-se da eficácia horizontal dos direitos fundamentais, mecanismo festejado por muitos constitucionalistas, caso de Daniel Sarmento que assim leciona:", "“Fala-se em eficácia horizontal dos direitos fundamentais, para sublinhar o fato de que tais direitos não regulam apenas as relações verticais de poder que se estabelecem entre Estado e cidadão, mas incidem também sobre relações mantidas entre pessoas e entidades não estatais, que se encontram em posição de igualdade formal”.<sup class=\"fn\" data-n=\"18\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 18\">18</sup>", "A exemplificar, em casos que envolvem a proteção da dignidade humana (art. 1.º, inc. III, da CF/1988), não se pode dizer que esse princípio será aplicado somente após o emprego da analogia e dos costumes e, ainda, se não houver norma prevista para o caso concreto. Em suma, os princípios constitucionais não podem mais ser vistos somente como último recurso de integração da norma jurídica, como acreditavam os juristas clássicos.", "Essa ideia foi adotada pelo art. 8.º do Código de Processo Civil de 2015, norma de caráter revolucionário inegável, ao estabelecer que, ao aplicar o ordenamento jurídico, o juiz atenderá aos fins sociais e às exigências do bem comum, resguardando e promovendo a dignidade da pessoa humana e observando a proporcionalidade, a razoabilidade, a legalidade, a publicidade e a eficiência.", "Consigne-se, como reforço a tais premissas, o trabalho de Paulo Bonavides, que apontou a constitucionalização dos princípios gerais do direito, bem como o fato de que os princípios fundamentam o sistema jurídico, sendo também normas primárias.<sup class=\"fn\" data-n=\"19\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 19\">19</sup> Em suma, deve-se reconhecer eficácia normativa imediata aos princípios, em alguns casos, particularmente naqueles que envolvem os direitos fundamentais da pessoa, ou de personalidade. Isso porque com o Estado Democrático de Direito houve a transposição dos princípios gerais de direito para princípios constitucionais fundamentais.", "Entre os próprios civilistas se contesta o teor do art. 4.º da Lei de Introdução e até mesmo a sua aplicação. Gustavo Tepedino, por exemplo, ensina o seguinte:", "“A civilística brasileira mostra-se resistente às mudanças históricas que carrearam a aproximação entre o direito constitucional e as relações jurídicas privadas. Para o direito civil, os princípios constitucionais equivaleriam a normas políticas, destinadas ao legislador e, apenas excepcionalmente, ao intérprete, que delas poderia timidamente se utilizar, nos termos do art. 4.º da Lei de Introdução ao Código Civil brasileiro, como meio de confirmação ou de legitimação de um princípio geral de direito. Mostra-se de evidência intuitiva o equívoco de tal concepção, ainda hoje difusamente adotada no Brasil, que acaba por relegar a norma constitucional, situada no vértice do sistema, a elemento de integração subsidiário, aplicável apenas na ausência de norma ordinária específica e após terem sido frustradas as tentativas, pelo intérprete, de fazer uso da analogia e de regra consuetudinária. Trata-se, em uma palavra, de verdadeira subversão hermenêutica. O entendimento mostra-se, no entanto, bastante coerente com a lógica do individualismo oitocentista, sendo indiscutível o papel predominante que o Código Civil desempenhava com referência normativa exclusiva no âmbito das relações de direito privado”.<sup class=\"fn\" data-n=\"20\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 20\">20</sup>", "Em síntese, compreendo que aqueles que seguem a escola do Direito Civil Constitucional, procurando analisar o Direito Civil a partir dos parâmetros constitucionais, realidade atual do Direito Privado brasileiro, não podem ser favoráveis à aplicação obrigatória da ordem constante do art. 4.º da Lei de Introdução de forma rígida e incontestável. Esse último entendimento é o que deve prevalecer na visão contemporânea do Direito Civil Brasileiro, em especial tendo em vista a emergência o art. 8.º do CPC/2015, comando que valoriza a dignidade humana como norte do aplicador da lei.", "Superado esse esclarecimento inicial, parte-se ao estudo específico das formas de integração da norma jurídica, ferramentas de correção do sistema."], "children": [{"num": "1.4.1", "title": "1.4.1 A analogia", "resumo": "Analogia é aplicar a um caso sem norma própria uma norma próxima (ou um conjunto de normas próximas), buscando alento no próprio ordenamento. Divide-se em analogia legal (legis — uma norma próxima) e analogia jurídica (iuris — um conjunto de normas). Não se confunde com a interpretação extensiva: na analogia rompe-se o limite da norma (há integração); na interpretação extensiva apenas amplia-se o sentido (há subsunção). Regra importante: normas de exceção não admitem analogia nem interpretação extensiva.", "pontos": ["Analogia legis = uma norma próxima; analogia iuris = conjunto de normas.", "Analogia (integração) ≠ interpretação extensiva (subsunção).", "Normas de exceção não admitem analogia."], "quiz": [{"q": "Qual a diferença central entre analogia e interpretação extensiva?", "options": ["A analogia rompe os limites da norma (integração); a interpretação extensiva apenas amplia o sentido (subsunção)", "Não há diferença", "A interpretação extensiva só vale no Direito Penal"], "answer": 0, "explain": "Na analogia há integração (aplica-se norma a caso fora do seu campo). Na interpretação extensiva há subsunção (amplia-se o sentido da própria norma)."}, {"q": "O que é a analogia legis?", "options": ["A aplicação de um conjunto de normas próximas", "A aplicação de uma única norma próxima", "A criação de uma norma nova pelo juiz"], "answer": 1, "explain": "Analogia legis é a aplicação de somente uma norma próxima; a analogia iuris aplica um conjunto de normas próximas."}, {"q": "A analogia iuris consiste em:", "options": ["Aplicar uma só norma próxima", "Aplicar um conjunto de normas próximas, extraindo elementos que possibilitem a analogia", "Aplicar o costume"], "answer": 1, "explain": "Analogia iuris é a aplicação de um conjunto de normas próximas (ex.: regras da ação reivindicatória aplicadas à ação de imissão de posse)."}, {"q": "As normas de exceção (excepcionais) admitem analogia?", "options": ["Sim, sempre", "Não, em regra não admitem analogia nem interpretação extensiva", "Só admitem interpretação extensiva"], "answer": 1, "explain": "Regra importante: as normas de exceção não admitem analogia nem interpretação extensiva, salvo para proteger vulnerável ou valor fundamental."}], "terms": [{"termo": "Analogia legis", "definicao": "Aplicação de uma única norma próxima a um caso sem previsão.", "secao": "1.4.1"}, {"termo": "Analogia iuris", "definicao": "Aplicação de um conjunto de normas próximas para extrair a solução de um caso sem previsão.", "secao": "1.4.1"}, {"termo": "Interpretação extensiva", "definicao": "Ampliação do sentido da própria norma (subsunção), sem romper seus limites — diferente da analogia.", "secao": "1.4.1"}], "blocks": ["A analogia é a aplicação de uma norma próxima ou de um conjunto de normas próximas, não havendo uma norma prevista para um determinado caso concreto. Dessa forma, sendo omissa uma norma jurídica para um dado caso concreto, deve o aplicador do direito procurar alento no próprio ordenamento jurídico, permitida a aplicação de uma norma além do seu campo inicial de atuação.", "Como exemplo de aplicação da analogia, prevê o art. 499 do CC/2002 que é lícita a venda de bens entre cônjuges quanto aos bens excluídos da comunhão. Como a norma não é, pelo menos diretamente, restritiva da liberdade contratual, não há qualquer óbice de se afirmar que é lícita a compra e venda entre companheiros quanto aos bens excluídos da comunhão. Destaque-se que, em regra, o regime de bens do casamento é o mesmo da união estável, qual seja, o da comunhão parcial de bens (arts. 1.640 e 1.725 do CC/2002).", "Outro exemplo de aplicação da analogia era a incidência do Decreto-lei 2.681/1912, antes do Código Civil de 2002. Previa esse decreto a responsabilidade civil objetiva das empresas de estradas de ferro. Por ausência de lei específica, esse dispositivo legal passou a ser aplicado a todos os tipos de contrato de transporte terrestre. Por uma questão lógica, e pela presença de lacuna normativa, tal comando legal passou a incidir em ocorrências envolvendo bondes, ônibus, caminhões, automóveis, motos e outros meios de transporte terrestre. Frise-se, porém, que não há mais a necessidade de socorro à analogia para tais casos, eis que o Código Civil atual traz o transporte como contrato típico. Observe-se que continua consagrada a responsabilidade objetiva do transportador, pelo que consta dos arts. 734 (transporte de pessoas) e 750 (transporte de coisas) da atual codificação material.", "A analogia pode ser assim classificada, na esteira da melhor doutrina:", "a) Analogia legal ou legis – é a aplicação de somente uma norma próxima, como ocorre nos exemplos citados.", "b) Analogia jurídica ou iuris – é a aplicação de um conjunto de normas próximas, extraindo elementos que possibilitem a analogia. Exemplo: aplicação por analogia das regras da ação reivindicatória para a ação de imissão de posse (TJMG, Agravo Interno 1.0027.09.183171-2/0011, 16.ª Câmara Cível, Betim, Rel. Des. Wagner Wilson, j. 12.08.2009, DJEMG 28.08.2009).", "Não se pode confundir a aplicação da analogia com a interpretação extensiva. No primeiro caso, rompe-se com os limites do que está previsto na norma, havendo integração da norma jurídica. Na interpretação extensiva, apenas amplia-se o seu sentido, havendo subsunção. Ilustre-se com um exemplo
