 Tribunal Federal e do Superior Tribunal de Justiça (ver: STF, RE 351.750-3/RJ, 1.ª Turma, Rel. Min. Carlos Britto, j. 17.03.2009, DJe 25.09.2009, p. 69; STJ, Agravo Regimental no Agravo 1.343.941/ RJ, 3.ª Turma, Rel. Des. Conv. Vasco Della Giustina, j. 18.11.2010, DJe 25.11.2010; e STJ, Agravo Regimental 252.632/SP, 4.ª Turma, Rel. Min. Aldir Passarinho Junior, j. 07.08.2001, DJ 04.02.2002, p. 373). De toda sorte, cabe ressaltar que a questão a respeito das Convenções de Varsóvia e de Montreal alterou-se no âmbito da jurisprudência nacional, uma vez que, em maio de 2017, o Pleno do Supremo Tribunal Federal acabou por concluir pelas suas prevalências sobre o CDC (Recurso Extraordinário 636.331 e Recurso Extraordinário no Agravo 766.618). De acordo com a publicação constante do Informativo n. 866 da Corte, referente a tal mudança de posição, “nos termos do art. 178 da Constituição da República, as normas e os tratados internacionais limitadores da responsabilidade das transportadoras aéreas de passageiros, especialmente as Convenções de Varsóvia e Montreal, têm prevalência em relação ao Código de Defesa do Consumidor. (...). No RE 636.331/RJ, o Colegiado assentou a prevalência da Convenção de Varsóvia e dos demais acordos internacionais subscritos pelo Brasil em detrimento do CDC, não apenas na hipótese de extravio de bagagem. Em consequência, deu provimento ao recurso extraordinário para limitar o valor da condenação por danos materiais ao patamar estabelecido na Convenção de Varsóvia, com as modificações efetuadas pelos acordos internacionais posteriores. Afirmou que a antinomia ocorre, a princípio, entre o art. 14 do CDC, que impõe ao fornecedor do serviço o dever de reparar os danos causados, e o art. 22 da Convenção de Varsóvia, que fixa limite máximo para o valor devido pelo transportador, a título de reparação. Afastou, de início, a alegação de que o princípio constitucional que impõe a defesa do consumidor [Constituição Federal (CF), arts. 5.º, inc. XXXII, e 170, inc. V] impediria a derrogação do CDC por norma mais restritiva, ainda que por lei especial. Salientou que a proteção ao consumidor não é a única diretriz a orientar a ordem econômica. Consignou que o próprio texto constitucional determina, no art. 178, a observância dos acordos internacionais, quanto à ordenação do transporte aéreo internacional. Realçou que, no tocante à aparente antinomia entre o disposto no CDC e na Convenção de Varsóvia – e demais normas internacionais sobre transporte aéreo –, não há diferença de hierarquia entre os diplomas normativos. Todos têm estatura de lei ordinária e, por isso, a solução do conflito envolve a análise dos critérios cronológico e da especialidade”. A solução pelos critérios da especialidade e cronológico é que conduziu à prevalência das duas Convenções sobre o CDC, infelizmente. Foram vencidos apenas os Ministros Marco Aurélio e Celso de Mello, que entenderam de forma contrária, pois a Lei 8.078/1990 teria posição hierárquica superior. Assim, todos os demais julgadores votaram seguindo os Relatores das duas ações, Ministros Gilmar Mendes e Roberto Barroso. Atualizando a obra, sucessivamente, surgiu decisão do Superior Tribunal de Justiça aplicando essa solução da Corte Constitucional Brasileira, com destaque para o seguinte trecho de sua ementa: “no julgamento do RE n. 636.331/RJ, o Supremo Tribunal Federal, reconhecendo a repercussão geral da matéria (Tema 210/STF), firmou a tese de que, ‘nos termos do art. 178 da Constituição da República, as normas e os tratados internacionais limitadores da responsabilidade das transportadoras aéreas de passageiros, especialmente as Convenções de Varsóvia e Montreal, têm prevalência em relação ao Código de Defesa do Consumidor’” (STJ, REsp 673.048/ RS, 3.ª Turma, Rel. Min. Marco Aurélio Bellizze, j. 08.05.2018, DJe 18.05.2018). Com o devido respeito, trata-se de um enorme retrocesso quanto à tutela dos consumidores, pelos argumentos outrora expostos, especialmente com base no art. 17 da Lei de Introdução. Em complemento, como desenvolvemos no Capítulo 1 do nosso Manual de Direito do Consumidor, escrito em coautoria com Daniel Amorim Assumpção Neves, o CDC é norma principiológica, tendo posição hierárquica superior perante as demais leis ordinárias, caso das duas Convenções Internacionais citadas. Porém, infelizmente, tal entendimento, muito comum entre os consumeristas, não foi adotado pela maioria dos julgadores. Esclareça-se, por fim, que o decisum superior apenas disse respeito à indenização tabelada de danos patrimoniais, não atingindo danos morais e outros prejuízos extrapatrimoniais. De todo modo, em decisão monocrática prolatada em abril de 2018, no âmbito do Recurso Extraordinário 351.750, o Ministro Roberto Barroso determinou que um processo que envolvia pedido de indenização por danos morais em razão de atraso em voo internacional fosse novamente apreciado pela instância de origem, levando-se em consideração a citada decisão do Tribunal Pleno. Se tal posição prevalecesse, com o devido respeito, o retrocesso seria ainda maior, pois as Cortes Superiores Brasileiras não admitem o tabelamento do dano moral, por entenderem que isso contraria o princípio da isonomia constitucional (art. 5.º, caput, da CF/1998), especialmente no sentido de tratar de maneira desigual os desiguais. Felizmente, de forma correta, em 2020, surgiu aresto no âmbito do Superior Tribunal de Justiça limitando a conclusão a respeito da tarifação apenas aos danos materiais, não incidindo para os danos morais: “O STF, no julgamento do RE nº 636.331/RJ, com repercussão geral reconhecida, fixou a seguinte tese jurídica: ‘Nos termos do artigo 178 da Constituição da República, as normas e os tratados internacionais limitadores da responsabilidade das transportadoras aéreas de passageiros, especialmente as Convenções de Varsóvia e Montreal, têm prevalência em relação ao Código de Defesa do Consumidor’. Referido entendimento tem aplicação apenas aos pedidos de reparação por danos materiais. As indenizações por danos morais decorrentes de extravio de bagagem e de atraso de voo não estão submetidas à tarifação prevista na Convenção de Montreal, devendo-se observar, nesses casos, a efetiva reparação do consumidor preceituada pelo CDC” (STJ, REsp 1.842.066/RS, 3.ª Turma, Rel. Min. Moura Ribeiro, j. 09.06.2020, DJe 15.06.2020). Por fim, encerrando esse debate, em 2023, o Tribunal Pleno do STF, novamente em repercussão geral, concluiu que o seu entendimento anterior não e aplica aos danos morais, o que inclui o prazo de prescrição, devendo incidir os cinco anos previstos no art. 27 do CDC em situações tais. Foi assim reformulada tese do seu Tema 210 de repercussão geral, passando a ter a seguinte afirmação: “nos termos do art. 178 da Constituição Federal, as normas e os tratados internacionais limitadores da responsabilidade das transportadoras aéreas de passageiros, especialmente as Convenções de Varsóvia e Montreal, têm prevalência em relação ao Código de Defesa do Consumidor, o presente entendimento não se aplica aos danos extrapatrimoniais” (STF, ARE 766.618, Tribunal Pleno, Rel. Min. Roberto Barroso, j. 30.11.2023, com unanimidade). Esse é o entendimento a ser considerado para os devidos fins práticos, encerrando a polêmica quanto a essa temática.", "o) Tratando-se de brasileiros, são competentes as autoridades consulares brasileiras para lhes celebrar o casamento e os mais atos de Registro Civil e de tabelionato, inclusive o registro de nascimento e de óbito dos filhos de brasileiro ou brasileira nascidos no país da sede do Consulado (art. 18 da Lei de Introdução). O dispositivo recebeu dois novos parágrafos por força da Lei 12.874, de outubro de 2013. O primeiro parágrafo preceitua que as autoridades consulares brasileiras também poderão celebrar a separação consensual e o divórcio consensual de brasileiros, não havendo filhos menores ou incapazes do casal e observados os requisitos legais quanto aos prazos, devendo constar da respectiva escritura pública as disposições relativas à descrição e à partilha dos bens comuns e à pensão alimentícia e, ainda, ao acordo quanto à retomada pelo cônjuge de seu nome de solteiro ou à manutenção do nome adotado quando se deu o casamento. Como se nota, passa a existir a possibilidade da separação e do divórcio extrajudiciais, efetivados pelas autoridades consulares. A norma nasceu desatualizada, na minha opinião doutrinária. De início, porque segundo parte considerável da doutrina, não há que se falar mais em separação extrajudicial consensual, tema aprofundado no Capítulo 8 deste livro, o que foi confirmado pelo STF – Tema 1.053 – e pelo CNJ. Ademais, diante da Emenda Constitucional 66/2010 não existem mais prazos mínimos para o divórcio. Em complemento, o § 2.º do art. 18 expressa que “é indispensável a assistência de advogado, devidamente constituído, que se dará mediante a subscrição de petição, juntamente com ambas as partes, ou com apenas uma delas, caso a outra constitua advogado próprio, não se fazendo necessário que a assinatura do advogado conste da escritura pública”. Este último comando segue a linha do que constava do art. 1.124-A do CPC/1973 e do atual art. 733 do CPC/2015 quanto à exigência da presença de advogados nas escrituras de separação e divórcio lavradas perante os Tabelionatos de Notas.", "p) Reputam-se válidos todos os atos indicados no artigo anterior e celebrados pelos cônsules brasileiros na vigência da Lei de Introdução, desde que satisfaçam todos os requisitos legais (art. 19 da Lei de Introdução).", "Superada a simples exposição das normas de Direito Internacional constante da Lei de Introdução, parte-se ao estudo das antinomias jurídicas, tema dos mais relevantes para todo o Direito."], "children": []}, {"num": "1.7", "title": "1.7 ESTUDO DAS ANTINOMIAS JURÍDICAS", "resumo": "Antinomia é o conflito entre duas (ou mais) normas válidas, sem que se saiba de imediato qual aplicar (é uma “lacuna de conflito”). Cuidado: antinomia NÃO é revogação — trata de conflitos, não de retirada de vigência. Os metacritérios de solução (Bobbio) são três: cronológico (norma posterior vence a anterior — o mais fraco), da especialidade (norma especial vence a geral — intermediário) e hierárquico (norma superior vence a inferior — o mais forte). Quanto ao grau: antinomia de 1º grau (envolve um critério) e de 2º grau (envolve dois). Quanto à solução: aparente (resolve-se pelos metacritérios) e real (não se resolve). O caso clássico de antinomia real é o choque entre norma geral superior e norma especial inferior; aí a saída é do Legislativo (nova lei) ou do Judiciário (princípio máximo de justiça; arts. 4º e 5º da LINDB e art. 8º do CPC).", "pontos": ["Antinomia = conflito entre normas válidas (≠ revogação).", "Metacritérios: cronológico (mais fraco) < especialidade < hierárquico (mais forte).", "1º grau (um critério) / 2º grau (dois critérios).", "Aparente (tem solução) / real (não tem solução pelos metacritérios).", "Antinomia real clássica: geral superior x especial inferior."], "quiz": [{"q": "Dos três metacritérios de solução de antinomias, qual é o mais forte?", "options": ["Cronológico", "Da especialidade", "Hierárquico"], "answer": 2, "explain": "O hierárquico é o mais forte (peso do Texto Constitucional); a especialidade é intermediária; o cronológico é o mais fraco."}, {"q": "Uma antinomia é chamada de “real” quando:", "options": ["Pode ser resolvida pelos metacritérios", "Não pode ser resolvida pelos metacritérios (ex.: geral superior x especial inferior)", "Envolve apenas o critério cronológico"], "answer": 1, "explain": "Antinomia real = não há metarregra que a resolva. O caso típico é o conflito entre norma geral superior e norma especial inferior."}, {"q": "O que é uma antinomia?", "options": ["A revogação de uma norma por outra", "O conflito de duas normas válidas, sem se saber qual aplicar (lacuna de conflito)", "A ausência total de norma"], "answer": 1, "explain": "Antinomia é a presença de duas normas conflitantes, válidas e de autoridade competente, sem se saber qual aplicar — não se confunde com revogação."}, {"q": "Os metacritérios clássicos de solução de antinomias foram sistematizados por:", "options": ["Norberto Bobbio", "Hans Kelsen", "Erik Jayme"], "answer": 0, "explain": "Os metacritérios (cronológico, especialidade e hierárquico) foram construídos por Norberto Bobbio, em sua Teoria do ordenamento jurídico."}, {"q": "O critério cronológico significa que:", "options": ["A norma especial prevalece sobre a geral", "A norma posterior prevalece sobre a anterior", "A norma superior prevalece sobre a inferior"], "answer": 1, "explain": "Critério cronológico: norma posterior prevalece sobre norma anterior — é o mais fraco dos três."}, {"q": "A antinomia de 2º grau é aquela que:", "options": ["Envolve apenas um dos critérios", "Envolve dois dos critérios de solução de conflito", "Nunca tem solução"], "answer": 1, "explain": "Antinomia de 1º grau envolve um critério; a de 2º grau envolve o choque de dois critérios."}, {"q": "Diante de uma antinomia real, quais são os dois caminhos de solução?", "options": ["Legislativo (nova lei) e Judiciário (princípio máximo de justiça; arts. 4º e 5º da LINDB e art. 8º do CPC)", "Apenas aguardar a revogação", "Aplicar as duas normas ao mesmo tempo"], "answer": 0, "explain": "Na antinomia real: o Poder Legislativo edita uma terceira norma; ou o Judiciário adota o princípio máximo de justiça (arts. 4º e 5º da LINDB e art. 8º do CPC)."}], "terms": [{"termo": "Antinomia", "definicao": "Conflito entre duas ou mais normas válidas, sem se saber qual aplicar (lacuna de conflito). Não é revogação.", "secao": "1.7"}, {"termo": "Critério cronológico", "definicao": "Metacritério: norma posterior prevalece sobre a anterior. É o mais fraco.", "secao": "1.7"}, {"termo": "Critério da especialidade", "definicao": "Metacritério: norma especial prevalece sobre a geral. É o intermediário.", "secao": "1.7"}, {"termo": "Critério hierárquico", "definicao": "Metacritério: norma superior prevalece sobre a inferior. É o mais forte.", "secao": "1.7"}, {"termo": "Antinomia aparente x real", "definicao": "Aparente: resolve-se pelos metacritérios. Real: não se resolve por eles (ex.: geral superior x especial inferior).", "secao": "1.7"}], "blocks": ["Com o surgimento de qualquer lei nova, ganha relevância o estudo das antinomias, também denominadas lacunas de conflito. A antinomia é a presença de duas normas conflitantes, válidas e emanadas de autoridade competente, sem que se possa dizer qual delas merecerá aplicação em determinado caso concreto (lacunas de colisão).", "Em suma, este estudo não está relacionado com a revogação das normas jurídicas, mas com os eventuais conflitos que podem existir entre elas. Esse esclarecimento é básico e fundamental.", "Pois bem, aqui serão utilizadas as regras de teoria geral de direito muito bem expostas na obra Conflito de normas, da Professora Maria Helena Diniz, sendo certo que por diversas vezes esse trabalho será utilizado para a compreensão dos novos conceitos privados, que emergiram com a nova codificação.<sup class=\"fn\" data-n=\"38\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 38\">38</sup> Assim, serão aqui estudados os conceitos básicos de solução desses conflitos, os metacritérios clássicos construídos por Norberto Bobbio, em sua Teoria do ordenamento jurídico, para a solução dos choques entre as normas jurídicas,<sup class=\"fn\" data-n=\"39\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 39\">39</sup> a saber:", "a) critério cronológico: norma posterior prevalece sobre norma anterior;", "b) critério da especialidade: norma especial prevalece sobre norma geral;", "c) critério hierárquico: norma superior prevalece sobre norma inferior.", "Dos três critérios acima, o cronológico, constante do art. 2.º da Lei de Introdução, é o mais fraco de todos, sucumbindo diante dos demais. O critério da especialidade é o intermediário e o da hierarquia o mais forte de todos, tendo em vista a importância do Texto Constitucional.", "De qualquer modo, lembre-se de que a especialidade também consta do Texto Maior, inserida que está na isonomia constitucional (art. 5.º, caput, da CF/1988), em sua segunda parte, eis que a lei deve tratar de maneira desigual os desiguais.", "Ultrapassada essa análise, parte-se para a classificação das antinomias, quanto aos metacritérios envolvidos, conforme esquema a seguir:", "– Antinomia de 1.º grau: conflito de normas que envolve apenas um dos critérios anteriormente expostos.", "– Antinomia de 2.º grau: choque de normas válidas que envolve dois dos critérios analisados.", "Havendo a possibilidade ou não de solução, conforme os metacritérios de solução de conflito, é pertinente a seguinte visualização:", "– Antinomia aparente: situação que pode ser resolvida de acordo com os metacritérios antes expostos.", "– Antinomia real: situação que não pode ser resolvida de acordo com os metacritérios antes expostos.", "De acordo com essas classificações, devem ser analisados os casos práticos em que estão presentes os conflitos:", "• No caso de conflito entre norma posterior e norma anterior, valerá a primeira, pelo critério cronológico, caso de antinomia de primeiro grau aparente.", "• Norma especial deverá prevalecer sobre norma geral, emergencial, que é o critério da especialidade, outra situação de antinomia de primeiro grau aparente.", "• Havendo conflito entre norma superior e norma inferior, prevalecerá a primeira, pelo critério hierárquico, também situação de antinomia de primeiro grau aparente.", "Esses são os casos de antinomia de primeiro grau, todos de antinomia aparente, eis que presente a solução de acordo com os metacritérios antes analisados. Passa-se então ao estudo das antinomias de segundo grau:", "• Em um primeiro caso de antinomia de segundo grau aparente, quando se tem um conflito de uma norma especial anterior e outra geral posterior, prevalecerá o critério da especialidade, prevalecendo a primeira norma.", "• Havendo conflito entre norma superior anterior e outra inferior posterior, prevalece também a primeira (critério hierárquico), outro caso de antinomia de segundo grau aparente.", "• Finalizando, quando se tem conflito entre uma norma geral superior e outra norma, especial e inferior, qual deve prevalecer?", "Na última hipótese, como bem expõe Maria Helena Diniz não há uma metarregra geral de solução do conflito surgindo a denominada antinomia real. São suas palavras:", "“No conflito entre o critério hierárquico e o de especialidade, havendo uma norma superior-geral e outra norma inferior especial, não será possível estabelecer uma metarregra geral, preferindo o critério hierárquico ao da especialidade ou vice-versa, sem contrariar a adaptabilidade do direito. Poder-se-á, então, preferir qualquer um dos critérios, não existindo, portanto, qualquer prevalência. Todavia, segundo Bobbio, dever-se-á optar, teoricamente, pelo hierárquico; uma lei constitucional geral deverá prevalecer sobre uma lei ordinária especial, pois se se admitisse o princípio de que uma lei ordinária especial pudesse derrogar normas constitucionais, os princípios fundamentais do ordenamento jurídico estariam destinados a esvaziar-se, rapidamente, de seu conteúdo. Mas, na prática, a exigência de se adotarem as normas gerais de uma Constituição a situações novas levaria, às vezes, à aplicação de uma lei especial, ainda que ordinária, sobre a Constituição. A supremacia do critério da especialidade só se justificaria, nessa hipótese, a partir do mais alto princípio da justiça: suum cuique tribuere, baseado na interpretação de que ‘o que é igual deve ser tratado como igual e o que é diferente, de maneira diferente’. Esse princípio serviria numa certa medida para solucionar antinomia, tratando igualmente o que é igual e desigualmente o que é desigual, fazendo as diferenciações exigidas fática e valorativamente”.<sup class=\"fn\" data-n=\"40\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 40\">40</sup>", "Na realidade, como ficou claro, o critério da especialidade também é de suma importância, constando a sua previsão na Constituição Federal de 1988. Repita-se que o art. 5.º do Texto Maior consagra o princípio da isonomia ou igualdade lato sensu, pelo qual a lei deve tratar de maneira igual os iguais. Na parte destacada está o princípio da especialidade. E é por isso que ele até pode fazer frente ao critério hierárquico.", "Desse modo, havendo choque entre os critérios hierárquico e da especialidade, dois caminhos de solução podem ser dados no caso de antinomia real, um pelo Poder Legislativo e outro pelo Poder Judiciário. Vejamos:", "– Solução do Poder Legislativo – cabe a edição de uma terceira norma, dizendo qual das duas normas em conflito deve ser aplicada.", "– Solução do Poder Judiciário – o caminho é a adoção do princípio máximo de justiça, podendo o magistrado, o juiz da causa, de acordo com a sua convicção e aplicando os arts. 4.º e 5.º da Lei de Introdução, adotar uma das duas normas, para solucionar o problema. Também pode ser utilizado o art. 8.º do CPC/2015, segundo o qual, “ao aplicar o ordenamento jurídico, o juiz atenderá aos fins sociais e às exigências do bem comum, resguardando e promovendo a dignidade da pessoa humana e observando a proporcionalidade, a razoabilidade, a legalidade, a publicidade e a eficiência”.", "Mais uma vez entram em cena esses importantes preceitos da Lei de Introdução. Pelo art. 4.º, pode o magistrado aplicar a analogia, os costumes e os princípios gerais do direito, sem que essa ordem seja obrigatoriamente respeitada. Seguindo-se o que preceitua o seu art. 5.º, deve o juiz buscar a função social da norma e as exigências do bem comum, ou seja, a pacificação social. Não se pode esquecer, outrossim, da aplicação imediata dos princípios fundamentais que protegem a pessoa humana, nos termos do art. 5.º, § 1.º, da CF/1988 (eficácia horizontal dos direitos fundamentais). Essa última afirmação pode ser confirmada pela dicção do tão citado art. 8.º do CPC/2015, pelo qual, ao aplicar o ordenamento jurídico, o julgador deve resguardar princípio de proteção da dignidade da pessoa humana.", "Alerte-se que o estudo das antinomias jurídicas, após a entrada em vigor do Código Civil de 2002, tornou-se obrigatório para aqueles que desejam obter um bom desempenho em provas futuras, seja na graduação, na pós-graduação ou nos concursos públicos.", "Na presente obra será demonstrado como tal estudo pode ser útil para a argumentação jurídica. Será exposta, por exemplo e a partir da teoria das antinomias jurídicas, a viabilidade jurídica de aplicação do art. 927, parágrafo único, do Código Civil – que consagra a cláusula geral de responsabilidade objetiva –, para a responsabilidade do empregador, mitigando a regra superior do art. 7.º, inc. XXVIII, da Constituição Federal. O tema está abordado no Capítulo 4 deste livro (item 4.3.2), inclusive com a análise da posição firmada pelo STF em 2019, com repercussão geral.", "Com a emergência do CPC/2015, essa relevância da matéria fica ainda mais aguda, pois, sem dúvida, grandes serão os desafios no futuro para adequar a nova legislação processual ao ordenamento jurídico até então vigente."], "children": []}, {"num": "1.8", "title": "1.8 ANÁLISE DAS INCLUSÕES FEITAS NA LEI DE INTRODUÇÃO PELA LEI 13.655/2018. REPERCUSSÕES PARA O DIREITO PÚBLICO", "resumo": "A Lei 13.655/2018 incluiu os arts. 20 a 30 na LINDB, voltados ao Direito Público — buscando “segurança hermenêutica” (menos instância de surpresa na interpretação) para agentes públicos. Carlos Eduardo Elias de Oliveira agrupa os artigos em três temas: clareza normativa (arts. 29 e 30), responsabilização por infração hermenêutica (arts. 22 e 28) e invalidade do ato administrativo (arts. 20 a 27). Destaques: art. 20 — dever de motivação concreta e consequencialismo (não decidir com base em valores abstratos sem considerar as consequências práticas); art. 21 — menor onerosidade da regularização; art. 22 — primazia da realidade (considerar as dificuldades reais do gestor); art. 23 — regime de transição; art. 24 — invalidade referencial (julgar pela orientação geral da época); arts. 26 e 27 — convalidação por compromisso; art. 28 — o agente responde pessoalmente só por dolo ou erro grosseiro (culpa grave). Tartuce critica o consequencialismo (risco de que “os fins justifiquem os meios”).", "pontos": ["Arts. 20–30 (Lei 13.655/2018) miram o Direito Público e a segurança hermenêutica.", "Art. 20: motivação concreta + consequencialismo.", "Art. 24: invalidade referencial (orientação geral da época).", "Art. 28: agente responde por dolo ou erro grosseiro (culpa grave).", "Tartuce critica o consequencialismo (“fins justificam os meios”)."], "quiz": [{"q": "Os arts. 20 a 30, incluídos pela Lei 13.655/2018, dizem respeito principalmente a que ramo?", "options": ["Direito Civil", "Direito Penal", "Direito Público (atuação dos agentes públicos)"], "answer": 2, "explain": "As novas previsões voltam-se ao Direito Público (segurança hermenêutica na Administração), reforçando o distanciamento da LINDB do Direito Civil."}, {"q": "Pelo art. 28 da LINDB, o agente público responde pessoalmente por suas decisões ou opiniões técnicas em caso de:", "options": ["Qualquer erro, ainda que leve", "Dolo ou erro grosseiro (culpa grave)", "Apenas dolo, nunca culpa"], "answer": 1, "explain": "Art. 28: responde pessoalmente em caso de dolo ou erro grosseiro — entendido como culpa grave (culpa lata dolus aequiparatur)."}, {"q": "O art. 20 da LINDB consagra o dever de:", "options": ["Publicar todos os atos em diário oficial", "Motivação concreta e consideração das consequências práticas da decisão (consequencialismo)", "Realizar concurso público"], "answer": 1, "explain": "Art. 20: nas esferas administrativa, controladora e judicial não se decidirá com base em valores jurídicos abstratos sem considerar as consequências práticas (consequencialismo + motivação)."}, {"q": "A “invalidade referencial” (art. 24) determina que a revisão de um ato leve em conta:", "options": ["As orientações gerais da época em que o ato foi produzido", "Sempre a lei mais nova", "A vontade do gestor atual"], "answer": 0, "explain": "Art. 24: a revisão levará em conta as orientações gerais da época, sendo vedado invalidar situações já constituídas com base em mudança posterior de entendimento."}, {"q": "Qual objetivo geral norteia as inclusões da Lei 13.655/2018?", "options": ["Aumentar tributos", "Buscar segurança hermenêutica (menos instabilidade interpretativa para agentes e atos públicos)", "Criar novos crimes"], "answer": 1, "explain": "O objetivo foi implantar um ambiente de menor instabilidade interpretativa — a chamada segurança hermenêutica na Administração Pública."}, {"q": "Os arts. 26 e 27 da LINDB tratam de:", "options": ["Convalidação do ato administrativo por compromisso (sem e com compensações)", "Revogação de leis", "Prazos de vacatio legis"], "answer": 0, "explain": "O art. 26 institui a convalidação por compromisso sem compensações; o art. 27, a convalidação por compromisso com compensações."}, {"q": "Qual crítica Tartuce faz ao consequencialismo do art. 20?", "options": ["Que é excessivamente rígido", "Que pode ratificar a ideia de que “os fins justificam os meios” e o utilitarismo decisório", "Que não tem base legal"], "answer": 1, "explain": "A afirmação do consequencialismo é passível de crítica: pode representar que os fins justificam os meios e o utilitarismo decisório, sacrificando direitos fundamentais."}], "terms": [{"termo": "Segurança hermenêutica", "definicao": "Objetivo das inclusões de 2018: reduzir a instabilidade na interpretação das normas para agentes e atos públicos.", "secao": "1.8"}, {"termo": "Consequencialismo", "definicao": "Dever (art. 20) de considerar as consequências práticas da decisão, não decidindo apenas com base em valores abstratos.", "secao": "1.8"}, {"termo": "Invalidade referencial", "definicao": "Art. 24: ao revisar um ato, deve-se considerar as orientações gerais da época, sendo vedado invalidar situações já constituídas com base em mudança posterior de entendimento.", "secao": "1.8"}, {"termo": "Erro grosseiro (culpa grave)", "definicao": "Art. 28: o agente público só responde pessoalmente por dolo ou erro grosseiro — entendido como culpa grave (que se equipara ao dolo).", "secao": "1.8"}], "blocks": ["Para encerrar o presente capítulo, interessante tecer alguns breves comentários sobre as modificações introduzidas na Lei de Introdução pela antes mencionada Lei 13.655, de 25 de abril de 2018, com a inclusão dos seus arts. 20 a 30. Os preceitos vigem no nosso sistema jurídico desde a sua publicação, com exceção do novo art. 29 da LINDB, que entrou em vigor cento e oitenta dias após a publicação oficial do diploma emergente. Anote-se que o então proposto art. 25 foi vetado pela Presidência da República.", "Na verdade, as novas previsões não dizem respeito diretamente ao Direito Privado, mas ao Direito Público, fugindo do objeto da presente obra. A Lei de Introdução às Normas do Direito Brasileiro, assim, distancia-se mais ainda do Direito Civil, o que agora justifica plenamente a sua mudança de nome, como antes aqui foi destacado. Quanto às provas, desde a graduação até os concursos públicos, acredito que este conteúdo deva ser cobrado dentro da disciplina de Direito Administrativo, e não no âmbito do Direito Civil. Como bem pondera o coautor de outras obras, Carlos Eduardo Elias de Oliveira, professor de Direito Civil e assessor jurídico do Senado Federal, que tem participado ativamente da elaboração de várias normas recentes, o diploma que surge poderia ser batizado de Lei da Segurança Hermenêutica na Administração Pública, “pois o seu objetivo foi, em síntese, implantar um ambiente de menor instabilidade interpretativa para os agentes públicos e para os atos administrativos, os quais sambam nas asas vacilantes das surpresas provocadas pela superveniência de interpretações jurídicas advindas especialmente de órgãos de controle”.<sup class=\"fn\" data-n=\"41\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 41\">41</sup>", "O autor divide a norma em três grupos temáticos, o que serve muito bem para resumir o seu conteúdo. O primeiro diz respeito à clareza normativa (arts. 29 e 30). O segundo à responsabilização do agente por infração hermenêutica (arts. 22 e 28). O terceiro grupo está relacionado à invalidade de ato administrativo, o que ele fraciona em quatro subgrupos: a) princípio da motivação concreta (arts. 20 e 21, caput); b) regime de transição (art. 23), princípio da menor onerosidade da regularização (art. 21, parágrafo único) e irregularidade sem pronúncia de nulidade (art. 21, parágrafo único, e art. 22, caput e § 1.º); c) convalidação por compromisso com ou sem compensações (arts. 26 e 27); e d) invalidade referencial (art. 24 da LINDB).", "Quanto à busca da segurança hermenêutica, isso já fica claro pelo teor do novo art. 20 da Lei de Introdução, que consagra o dever de motivação concreta e a responsabilidade decisória dos gestores dos interesses públicos ao julgarem sobre questões que lhe são levadas a análise. Conforme o preceito, nas esferas administrativa, controladora e judicial não se decidirá com base em valores jurídicos abstratos sem que sejam consideradas as consequências práticas da decisão. Sendo assim, havendo decisão administrativa baseada em conceitos legais indeterminados ou cláusulas gerais – construções que ainda serão abordadas nesta obra –, é necessária a verificação das suas consequências não só para o caso concreto, como também para a sociedade.", "O mesmo art. 20 da Lei de Introdução estabelece, em seu parágrafo único, que a motivação demonstrará a necessidade e a adequação da medida imposta ou da invalidação de ato, contrato, ajuste, processo ou norma administrativa, inclusive em face das possíveis alternativas. Vale lembrar que o dever de motivação das decisões também consta do art. 93, inc. IX, da Constituição Federal de 1988 e do Código de Processo Civil de 2015, sobretudo no seu art. 489, sendo clara a influência do Estatuto Processual emergente para o diploma em estudo. Além da motivação, ampara-se a necessidade de análise do consequencialismo da decisão administrativa, o que foi influenciado por juristas que atuaram na elaboração da lei, especialmente da Faculdade de Direito da USP e da Escola de Direito da Fundação Getulio Vargas (FGV).", "No mesmo sentido de valorizar o consequencialismo, o art. 21 da LINDB estabelece que a decisão que, nas esferas administrativa, controladora ou judicial, decretar a invalidação de ato, contrato, ajuste, processo ou norma administrativa deverá indicar de modo expresso suas consequências jurídicas e administrativas. Também está previsto no preceito que essa decisão deverá, quando for o caso, apontar as condições para que a regularização ocorra de modo proporcional e equânime e sem prejuízo aos interesses gerais. A decisão igualmente não poderá impor aos sujeitos atingidos ônus ou perdas que, em função das peculiaridades do caso, sejam anormais ou excessivos (princípio da menor onerosidade da regularização).", "A afirmação do consequencialismo, como não poderia ser diferente, é passível de críticas, uma vez que se ratifica a premissa segundo a qual os fins justificam os meios e o utilitarismo decisório. Levadas às últimas consequências, tais afirmações podem representar o sacrifício de direitos fundamentais e de personalidade, bem como da tutela da pessoa humana.", "O art. 22 da LINDB traz regra de hermenêutica ou interpretação relativa às normas sobre gestão pública, devendo ser considerados os obstáculos e as dificuldades reais do gestor e as exigências das políticas públicas a seu cargo, sem prejuízo dos direitos dos administrados. Valoriza-se a primazia da realidade, em especial as dificuldades que podem ser enfrentadas pelos agentes públicos em suas decisões interpretativas. Nos termos do seu § 1.º, em decisão sobre regularidade de conduta ou validade de ato, contrato, ajuste, processo ou norma administrativa, serão consideradas as circunstâncias práticas que houverem imposto, limitado ou condicionado a ação do agente. Há, assim, a possibilidade de reconhecimento da irregularidade do ato público sem a decretação de nulidade, o que também é retirado do parágrafo único do novo art. 21 da LINDB, como bem explica Carlos Eduardo Elias de Oliveira, com interessante exemplo para ilustrar:", "“Ainda à luz desse princípio, será permitido até mesmo que o ato irregular seja preservado, diante da elevada gravidade concreta das consequências práticas da sua invalidação. Isso está implícito no parágrafo único do art. 21 da LINDB, que proíbe que a regularização decorrente da invalidação de um ato cause ônus ou perdas anormais ou excessivas aos sujeitos atingidos (tanto a Administração Pública quanto os particulares envolvidos). Se a invalidade de um ato irregular gerar prejuízos excessivos, o ato irregular deverá ser preservado. Nesse caso, será admitido o que batizamos de declaração de irregularidade sem pronúncia de invalidade.", "Em verdade, ‘nada há de novo debaixo do sol’. Essa situação de conservação de atos irregulares já é conhecida, por exemplo, no Direito Constitucional, no seio do qual é admitida a declaração de inconstitucionalidade de uma lei sem pronúncia de nulidade, e no Direito Civil, em que o princípio da conservação do negócio jurídico e outros conceitos – como o de propriedade aparente e o de usucapião – preservam as situações fático-jurídicas criadas por atos jurídicos irregulares.", "A título ilustrativo, se um contrato administrativo destinado à construção de um prédio de seis andares vem a ser considerado irregular pelo Tribunal de Contas em razão da falta de licitação prévia, é dever da Corte de Contas avaliar as consequências concretas de eventual pronúncia de invalidade do ato e caminhar para adotar a solução menos onerosa para a Administração Pública e também para a empresa contratada, que, no exemplo – suponha-se –, está de boa-fé. O órgão de controle poderá, por exemplo, deixar de pronunciar a nulidade se constatar que os prejuízos financeiros serão demasiadamente elevados e que as obras já estão perto de findar-se (declaração de irregularidade sem pronúncia de nulidade). Poderá também pronunciar a invalidade, mas estabelecendo um ‘regime de transição’ em razão do qual uma nova empresa, escolhida após uma licitação, assumiria a continuidade das obras. Nesse caso, a empresa originariamente contratada continuaria com a construção até ser substituída pela nova empresa, pois isso evitaria desperdício de materiais de construção já comprados, deterioração do esqueleto da construção por conta do abandono da obra e gastos com multas em razão do rompimento de contratos (regime de transição). Seja como for, o Tribunal de Contas deverá, nesse caso, buscar a solução menos onerosa (princípio da menor onerosidade da regularização)”.<sup class=\"fn\" data-n=\"42\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 42\">42</sup>", "Além disso, na aplicação de sanções, serão considerados a natureza e a gravidade da infração cometida, os danos que dela provierem para a administração pública, as circunstâncias agravantes ou atenuantes e os antecedentes do agente (§ 2.º do art. 22 da LINDB). Por fim, a norma determina que as sanções aplicadas ao agente público serão levadas em conta na dosimetria das demais sanções de mesma natureza e relativas ao mesmo fato (§ 3.º).", "Sobre o regime de transição, o novo art. 23 da Lei de Introdução dispõe que a decisão administrativa, controladora ou judicial que estabelecer interpretação ou orientação nova sobre norma de conteúdo indeterminado, impondo novo dever ou novo condicionamento de direito, deverá prever regime de transição quando indispensável para que o novo dever ou condicionamento de direito seja cumprido de modo proporcional, equânime e eficiente e sem prejuízo aos interesses gerais. O objetivo é de não surpreender o agente público, o que representa aplicação da boa-fé objetiva no plano dos atos administrativos. Há aqui outra influência do CPC/2015, em especial do seu art. 927, § 3.º, in verbis: “na hipótese de alteração de jurisprudência dominante do Supremo Tribunal Federal e dos tribunais superiores ou daquela oriunda de julgamento de casos repetitivos, pode haver modulação dos efeitos da alteração no interesse social e no da segurança jurídica”.", "A invalidade referencial está prevista no art. 24 da LINDB, uma vez que a revisão, nas esferas administrativa, controladora ou judicial, quanto à validade de ato, contrato, ajuste, processo ou norma administrativa cuja produção já se houver completado, levará em conta as orientações gerais da época, sendo vedado que, com base em mudança posterior de orientação geral, se declarem inválidas situações plenamente constituídas.", "A expressão referencial, portanto, é utilizada pela necessidade de verificar as normas vigentes à época do reconhecimento da invalidade, na contramão do que está previsto no art. 2.035, caput, do Código Civil de 2002: “a validade dos negócios e demais atos jurídicos, constituídos antes da entrada em vigor deste Código, obedece ao disposto nas leis anteriores, referidas no art. 2.045, mas os seus efeitos, produzidos após a vigência deste Código, aos preceitos dele se subordinam, salvo se houver sido prevista pelas partes determinada forma de execução”. Como se pode notar, o diploma civil transcrito consagra a observação, quanto à validade dos atos e negócios jurídicos, das normas do momento da celebração do ato, e não do momento da decisão de invalidação.", "No tocante às orientações gerais da época que devem ser consideradas, o parágrafo único do mesmo art. 24 da Lei de Introdução enuncia que essas são as interpretações e especificações contidas em atos públicos de caráter geral ou em jurisprudência judicial ou administrativa majoritária, e ainda as adotadas por prática administrativa reiterada e de amplo conhecimento público.", "O art. 26 da LINDB institui a convalidação do ato administrativo por compromisso sem compensações. Conforme a sua dicção, “para eliminar irregularidade, incerteza jurídica ou situação contenciosa na aplicação do direito público, inclusive no caso de expedição de licença, a autoridade administrativa poderá, após oitiva do órgão jurídico e, quando for o caso, após realização de consulta pública, e presentes razões de relevante interesse geral, celebrar compromisso com os interessados, observada a legislação aplicável, o qual só produzirá efeitos a partir de sua publicação oficial”. A menção à consulta pública é louvável dentro do regime democrático, com a participação de especialistas escolhidos dentre os membros da sociedade brasileira.", "Como compromisso entenda-se um acordo em que as partes assumem deveres perante o Poder Público e que devem ser cumpridos posteriormente. Não há, assim, um contrato de compromisso, que conduz à arbitragem, como consta dos arts. 851 a 853 do Código Civil e da Lei 9.307/1996. A norma emergente também estabelece que esse compromisso: a) buscará solução jurídica proporcional, equânime, eficiente e compatível com os interesses gerais; b) não poderá conferir desoneração permanente de dever ou condicionamento de direito reconhecidos por orientação geral; e c) deverá prever com clareza as obrigações das partes, o prazo para seu cumprimento e as sanções aplicáveis em caso de descumprimento.", "Na sequência, consagra-se a convalidação do ato administrativo por compromisso e com compensações, eis que “a decisão do processo, nas esferas administrativa, controladora ou judicial, poderá impor compensação por benefícios indevidos ou prejuízos anormais ou injustos resultantes do processo ou da conduta dos envolvidos” (art. 27 da LINDB). Aqui, tem-se, sim, o instituto privado previsto entre os arts. 368 a 380 do Código Civil, ou seja, a compensação, forma de extinção das obrigações que gera a extinção de dívidas mútuas ou recíprocas até o ponto que se encontrarem.", "Sem prejuízo da observância dos rígidos requisitos da compensação legal, estudados no Capítulo 3 deste livro, a LINDB passou a estabelecer que decisão sobre a compensação será motivada, ouvidas previamente as partes sobre seu cabimento, sua forma e, se for o caso, seu valor (art. 27, § 1.º). Além disso, para prevenir ou regular a compensação, poderá ser celebrado compromisso processual entre os envolvidos (art. 27, § 2.º). Esse compromisso processual parece ter a natureza de um negócio jurídico processual (arts. 190 e 191 do CPC/2015), o que até pode incluir a arbitragem, nos termos das alterações da Lei 9.307/1996 engendradas pela Lei 13.129/2015.", "Quanto à efetividade dessa convalidação com compensações, tem razão o nosso coautor, em outra obra, Carlos Eduardo Elias de Oliveira, quando afirma o seguinte:", "“A compensação é instituto fadado ao ostracismo, pois a falta de parâmetros detalhados de como as negociações podem ser implementadas causará receio fundado nos agentes públicos de futuramente serem responsabilizados por mal--entendidos com órgãos de controle. Dificilmente algum advogado público dará parecer favorável a qualquer espécie de acordo, pois, como o regime atual acaba deixando a certeza hermenêutica nas mãos futuras dos órgãos de controle externo – que ainda prosseguem a responsabilizar advogados públicos –, o receio de futura divergência de entendimento inibirá os advogados públicos. O TCU, por exemplo, já responsabilizou advogado público por ter dado parecer favorável a acordo extrajudicial que foi tido como desvantajoso para a União, conforme este julgado, resumido no seguinte enunciado: ‘Advogado público é responsabilizado quando emite parecer favorável à homologação judicial em acordo extrajudicial, em condições excessivamente onerosas à União e em detrimento de sentença mais vantajosa aos cofres públicos’”.<sup class=\"fn\" data-n=\"43\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 43\">43</sup>", "A propósito da responsabilização do agente público por infração às normas de interpretação (infração hermenêutica), inclusive quanto ao seu eventual dever de indenizar, o art. 28 da LINDB traz um regime excessivamente protetivo, ao preceituar que esse responderá pessoalmente por suas decisões ou opiniões técnicas em caso de dolo ou erro grosseiro. O último conceito deve ser entendido como culpa grave, havendo na norma a confirmação da antiga máxima segundo a qual essa se equipara ao dolo (culpa lata dolus aequiparatur).", "O dispositivo também parece trazer a regra a ser aplicada para a responsabilidade regressiva do agente público, caso acionado pelo Estado, que responde objetivamente ou sem culpa perante o particular, nos termos do art. 37, § 6.º, da Constituição Federal de 1988. Nota-se mais uma vez um claro objetivo de dar segurança à atuação dos agentes públicos, em detrimento dos interesses das vítimas e dos prejudicados pelos seus atos. A norma merece maiores reflexões, que serão expostas nas edições sucessivas deste livro.", "Como penúltimo comando a ser comentado, o art. 29 da LINDB prevê que, em qualquer órgão ou poder, a edição de atos normativos por autoridade administrativa, salvo os de mera organização interna, poderá ser precedida de consulta pública para manifestação de interessados, preferencialmente por meio eletrônico, a qual será considerada na decisão. Louvam-se novamente a possibilidade de consulta pública e a valorização da transparência e da clareza normativa.", "O mesmo se diga quanto ao último preceito da LINDB, ao estabelecer que as autoridades públicas devem atuar para aumentar a segurança jurídica na aplicação das normas, inclusive por meio de regulamentos, súmulas administrativas e respostas a consultas (art. 30). Esses instrumentos terão caráter vinculante em relação ao órgão ou entidade a que se destinam, até ulterior revisão, sendo perceptível novamente a influência do CPC/2015, agora quanto ao caráter vinculativo das decisões.", "Como se pode perceber, de fato, as novas regras têm como escopo o Direito Público e a atuação de seus agentes. Entretanto, sem prejuízo do que consta do Código de Processo Civil de 2015 – que consagra muitas dessas ideias, sobretudo a necessidade de fundamentação das decisões –, tais preceitos podem eventualmente influenciar as tomadas de decisões no âmbito do Direito Privado.", "Em seu texto aqui tão citado, o coautor de outra obra Carlos Eduardo Elias de Oliveira segue essa linha e aponta algumas possibilidades de a norma emergente influenciar as decisões dos notários e registradores, e a sua eventual responsabilização civil, como no caso da cobrança de emolumentos. Fica a sugestão de leitura do artigo citado, disponível no meu site, para as devidas reflexões.<sup class=\"fn\" data-n=\"44\" role=\"button\" tabindex=\"0\" aria-label=\"Nota 44\">44</sup>"], "children": []}], "footnotes": {"1": "Ver, por exemplo: FIUZA, Ricardo; TAVARES DA SILVA, Regina Beatriz. Código Civil comentado. 6. ed. São Paulo: Saraiva, 2008. p. XXXIII-LVIII. Os comentários feitos à Lei de Introdução nesta obra são de Zeno Veloso e Maria Helena Diniz.", "2": "LOPES, Miguel Maria de Serpa. Lei de Introdução ao Código Civil. Rio de Janeiro: Freitas Bastos, 1959. v. 1, p. 8.", "3": "AGRA, Walber de Moura. Curso de direito constitucional. 4. ed. Rio de Janeiro: Forense, 2008. p. 500.", "4": "TELLES JR., Goffredo. Direito quântico. 7. ed. São Paulo: Juarez de Oliveira, p. 263-297.", "5": "BARROS, Sérgio Resende de. Contribuição dialética para o constitucionalismo. Campinas: Millennium, 2008. p. 140.", "6": "VELOSO, Zeno. Comentários à Lei de Introdução ao Código Civil. 2. ed. Belém: Unama, 2006. p. 21.", "7": "MÔNACO, Gustavo Ferraz de Campos. Código Civil interpretado. Coord. Silmara Juny Chinellato. 3. ed. São Paulo: Manole, 2010. p. 3.", "8": "Assim se posiciona: MÔNACO, Gustavo Ferraz de Campos. Código Civil interpretado. Coord. Silmara Juny Chinellato. 3. ed. São Paulo: Manole, 2010. p. 6.", "9": "Pela teoria da presunção: RODRIGUES, Silvio. Direito civil. 24. ed. São Paulo: Saraiva, 1994. v. 1, p. 21.", "10": "DINIZ, Maria Helena. Lei de Introdução ao Código Civil interpretada. 8. ed. São Paulo: Saraiva, 2001. p. 87. Na doutrina clássica, a teoria da necessidade social já era seguida por Miguel Maria de Serpa Lopes (Comentários à Lei de Introdução ao Código Civil. Rio de Janeiro: Freitas Bastos, 1959. v. 1, p. 80).", "11": "VELOSO, Zeno. Comentários à Lei de Introdução ao Código Civil. 2. ed. Belém: Unama, 2006. p. 69.", "12": "Expressão transmitida pela Professora Maria Helena Diniz, na disciplina Teoria Geral do Direito, cursada no programa de mestrado na PUCSP no ano de 2003.", "13": "DINIZ, Maria Helena. As lacunas no direito. 7. ed. São Paulo: Saraiva, 2002. p. 1-5.", "14": "Cf. ASCENSÃO, José de Oliveira. Introdução à ciência do Direito. 3. ed. Rio de Janeiro: Renovar, 2005. p. 415-416.", "15": "DINIZ, Maria Helena. As lacunas no direito. 7. ed. São Paulo: Saraiva, 2002. p. 95.", "16": "RODRIGUES, Silvio. Direito Civil. 24. ed. São Paulo: Saraiva, 1994. v. 1, p. 23.", "17": "FRANÇA, Rubens Limongi. Instituições de direito civil. 4. ed. São Paulo: Saraiva, 1996. p. 35-40.", "18": "SARMENTO, Daniel. Direitos fundamentais e relações privadas. Rio de Janeiro: Lumen Juris, 2004. p. 5.", "19": "BONAVIDES, Paulo. Curso de direito constitucional. 17. ed. São Paulo: Malheiros, 2005. p. 275.", "20": "TEPEDINO, Gustavo. Normas constitucionais e relações de direito civil na experiência brasileira. Temas de direito civil. Rio de Janeiro: Renovar, 2005. t. II, p. 24.", "21": "ASCENSÃO, José de Oliveira. Introdução à ciência do Direito. 3. ed. Rio de Janeiro: Renovar, 2005. p. 432.", "22": "FRANÇA, Rubens Limongi. Instituições de direito civil. 4. ed. São Paulo: Saraiva, 1996. p. 14.", "23": "FRANÇA, Rubens Limongi. Instituições de direito civil. 4. ed. São Paulo: Saraiva, 1996. p. 14.", "24": "FRANÇA, Rubens Limongi. Enciclopédia Saraiva de Direito. São Paulo: Saraiva, 1977. v. 60, p. 505.", "25": "REALE, Miguel. Lições preliminares de direito. 21. ed. São Paulo: Saraiva, 1994. p. 299.", "26": "ASCENSÃO, José de Oliveira. Introdução à ciência do direito. 3. ed. Rio de Janeiro: Renovar, 2005. p. 445.", "27": "AMARAL, Francisco. Direito civil. Introdução. 5. ed. Rio de Janeiro: Renovar, 2003. p. 92.", "28": "DINIZ, Maria Helena. Lei de Introdução ao Código Civil interpretada. 8. ed. São Paulo: Saraiva, 2001. p. 123.", "29": "NERY JR., Nelson; NERY, Rosa Maria de Andrade. Código Civil anotado. 2. ed. São Paulo: RT, 2003. p. 141.", "30": "NERY JR., Nelson; NERY, Rosa Maria de Andrade. Código Civil anotado. 2. ed. São Paulo: RT, 2003. p. 141.", "31": "FRANÇA, Rubens Limongi. Princípios gerais do direito. 2. ed. São Paulo: RT, 1971.", "32": "Ver, por todos: MONTEIRO, Washington de Barros; FRANÇA PINTO, Ana Cristina de Barros Monteiro. Curso de direito civil. Parte geral. 42. ed. São Paulo: Saraiva, 2009. v. 1, p. 47-48.", "33": "GAGLIANO, Pablo Stolze; PAMPLONA FILHO, Rodolfo. Novo curso de direito civil. Parte geral. 4. ed. São Paulo: Saraiva, 2003. v. I, p. 25.", "34": "REALE, Miguel. Lições preliminares de direito. 21. ed. São Paulo: Saraiva, 1994. p. 295.", "35": "ALEXY, Robert. Teoria dos direitos fundamentais. Trad. Virgílio Afonso da Silva. São Paulo: Malheiros, 2008.", "36": "ALEXY, Robert. Teoria dos direitos fundamentais. Trad. Virgílio Afonso da Silva. São Paulo: Malheiros, 2008.", "37": "SARMENTO, Daniel. Direito adquirido, emenda constitucional, democracia e justiça social. Livres e iguais. Rio de Janeiro: Lumen Juris, 2006. p. 18.", "38": "DINIZ, Maria Helena. Conflito de normas. São Paulo: Saraiva, 2003.", "39": "BOBBIO, Norberto. Teoria do ordenamento jurídico. Trad. Maria Celeste Cordeiro Leite dos Santos. 7. ed. Brasília: UNB, 1996.", "40": "DINIZ, Maria Helena. Conflito de normas. São Paulo: Saraiva, 2003. p. 50.", "41": "OLIVEIRA, Carlos Eduardo Elias de. A segurança hermenêutica nos vários ramos do Direito e nos cartórios extrajudiciais: repercussões da LINDB após a Lei n. 13.655/2018. Disponível em: <www.flaviotatuce.adv.br>. Acesso em: 30 ago. 2018.", "42": "OLIVEIRA, Carlos Eduardo Elias de. A segurança hermenêutica nos vários ramos do Direito e nos cartórios extrajudiciais: repercussões da LINDB após a Lei n. 13.655/2018. Disponível em: <www.flaviotatuce.adv.br>. Acesso em: 30 ago. 2018.", "43": "OLIVEIRA, Carlos Eduardo Elias de. A segurança hermenêutica nos vários ramos do Direito e nos cartórios extrajudiciais: repercussões da LINDB após a Lei n. 13.655/2018. Disponível em: <www.flaviotatuce.adv.br>. Acesso em: 30 ago. 2018.", "44": "OLIVEIRA, Carlos Eduardo Elias de. A segurança hermenêutica nos vários ramos do Direito e nos cartórios extrajudiciais: repercussões da LINDB após a Lei n. 13.655/2018. Disponível em: <www.flaviotatuce.adv.br>. Acesso em: 30 ago. 2018."}, "glossario": [{"termo": "LINDB", "definicao": "Lei de Introdução às Normas do Direito Brasileiro (Decreto-lei 4.657/1942). Antes chamada de LICC (Lei de Introdução ao Código Civil).", "secao": "1.1"}, {"termo": "Norma de sobredireito", "definicao": "Norma que serve para regular outras normas — uma “lei sobre leis” (lex legum).", "secao": "1.1"}, {"termo": "Lex legum", "definicao": "Expressão latina para “lei das leis”; designa a norma que disciplina as demais.", "secao": "1.1"}, {"termo": "Lei anexa", "definicao": "Lei publicada junto com o Código para facilitar sua aplicação, mas que não faz parte dele — caso da LINDB.", "secao": "1.1"}, {"termo": "Civil Law", "definicao": "Família jurídica (de raíz romano-germânica) em que a lei é a fonte primária do Direito. É a tradição brasileira.", "secao": "1.2"}, {"termo": "Common Law", "definicao": "Família jurídica em que os precedentes judiciais são a principal fonte do Direito (ex.: Inglaterra).", "secao": "1.2"}, {"termo": "Imperativo autorizante", "definicao": "Conceito de lei adotado por Tartuce (de Goffredo Telles Jr.): a norma é um imperativo (vem de autoridade competente, dirigido a todos) que autoriza ou não autoriza condutas.", "secao": "1.2"}, {"termo": "Vacatio legis", "definicao": "Período entre a publicação da lei e o início de sua vigência. Regra geral: 45 dias no Brasil (art. 1º).", "secao": "1.2"}, {"termo": "Princípio da continuidade", "definicao": "Art. 2º: a lei, uma vez em vigor, tem eficácia contínua até que outra a modifique ou revogue.", "secao": "1.2"}, {"termo": "Ab-rogação", "definicao": "Revogação TOTAL de uma norma.", "secao": "1.2"}, {"termo": "Derrogação", "definicao": "Revogação PARCIAL de uma norma (só parte dela perde efeito).", "secao": "1.2"}, {"termo": "Revogação expressa", "definicao": "Quando a lei nova declara textualmente revogada a anterior (ou aponta os dispositivos revogados).", "secao": "1.2"}, {"termo": "Revogação tácita", "definicao": "Quando a lei nova é incompatível com a anterior, sem declará-la revogada expressamente.", "secao": "1.2"}, {"termo": "Repristinação", "definicao": "Retorno da vigência de uma lei revogada quando a sua revogadora é também revogada. Não ocorre automaticamente (art. 2º, § 3º), salvo disposição expressa.", "secao": "1.2"}, {"termo": "Efeito repristinatório", "definicao": "Restauração de eficácia de normas afetadas quando uma lei é declarada inconstitucional. Não se confunde com a repristinação do art. 2º, § 3º.", "secao": "1.2"}, {"termo": "Erga omnes", "definicao": "Expressão latina: “contra todos”. A lei vale para todos, sem distinção (generalidade).", "secao": "1.3"}, {"termo": "Princípio da obrigatoriedade", "definicao": "Art. 3º: ninguém se escusa de cumprir a lei alegando que não a conhece.", "secao": "1.3"}, {"termo": "Vigência sincrônica", "definicao": "Ideia (teoria da necessidade social) de que a lei deve ser conhecida para ser bem observada, valendo de modo simultâneo para todos.", "secao": "1.3"}, {"termo": "Erro de direito (error iuris)", "definicao": "Falsa noção sobre a norma que, sendo causa única do negócio e sem intenção de descumprir a lei, pode anulá-lo (art. 139, III, do CC).", "secao": "1.3"}, {"termo": "Integração", "definicao": "Preenchimento das lacunas da lei com as ferramentas do art. 4º (analogia, costumes, princípios).", "secao": "1.4"}, {"termo": "Subsunção", "definicao": "Aplicação direta de uma norma existente ao caso concreto (fattispecie). Não se confunde com integração.", "secao": "1.4"}, {"termo": "Non liquet", "definicao": "Vedação de o juiz deixar de decidir alegando lacuna ou obscuridade da lei.", "secao": "1.4"}, {"termo": "Lacuna normativa", "definicao": "Ausência total de norma prevista para o caso concreto.", "secao": "1.4"}, {"termo": "Lacuna ontológica", "definicao": "Existe norma para o caso, mas ela não tem eficácia social.", "secao": "1.4"}, {"termo": "Lacuna axiológica", "definicao": "Existe norma para o caso, mas sua aplicação seria injusta ou insatisfatória.", "secao": "1.4"}, {"termo": "Eficácia horizontal dos direitos fundamentais", "definicao": "Ideia de que os direitos fundamentais incidem também nas relações entre particulares (não só entre Estado e cidadão) e têm aplicação imediata (art. 5º, § 1º, CF).", "secao": "1.4"}, {"termo": "Analogia legis", "definicao": "Aplicação de uma única norma próxima a um caso sem previsão.", "secao": "1.4.1"}, {"termo": "Analogia iuris", "definicao": "Aplicação de um conjunto de normas próximas para extrair a solução de um caso sem previsão.", "secao": "1.4.1"}, {"termo": "Interpretação extensiva", "definicao": "Ampliação do sentido da própria norma (subsunção), sem romper seus limites — diferente da analogia.", "secao": "1.4.1"}, {"termo": "Costume secundum legem", "definicao": "Costume a que a própria lei se refere; sua aplicação é subsunção, não integração.", "secao": "1.4.2"}, {"termo": "Costume praeter legem", "definicao": "Costume aplicado na falta da lei (costume integrativo). Ex.: cheque pré-datado (Súmula 370 do STJ).", "secao": "1.4.2"}, {"termo": "Costume contra legem", "definicao": "Costume que contraria a lei; em regra não é admitido no Direito brasileiro.", "secao": "1.4.2"}, {"termo": "Princípios gerais de direito", "definicao": "Regramentos básicos, amplos e abstratos, que fundam e unificam o sistema; não precisam estar expressos para valer.", "secao": "1.4.3"}, {"termo": "Fim social da norma", "definicao": "Princípio do art. 5º da LINDB: na aplicação da lei, o juiz deve atender à sua função social e ao bem comum.", "secao": "1.4.3"}, {"termo": "Eticidade", "definicao": "Princípio do CC/2002: valorização da ética e da boa-fé objetiva.", "secao": "1.4.3"}, {"termo": "Socialidade", "definicao": "Princípio do CC/2002: superação do individualismo — toda categoria civil tem função social (“eu” vira “nós”).", "secao": "1.4.3"}, {"termo": "Operabilidade", "definicao": "Princípio do CC/2002: simplicidade e efetividade das categorias, via sistema aberto de cláusulas gerais.", "secao": "1.4.3"}, {"termo": "Equidade", "definicao": "Uso do bom senso; a justiça do caso concreto, adaptando razoavelmente a lei à situação (Aristóteles).", "secao": "1.4.4"}, {"termo": "Julgar por x com equidade", "definicao": "Julgar POR equidade = afastar as normas e decidir por outros critérios; julgar COM equidade = decidir conforme a justiça do caso.", "secao": "1.4.4"}, {"termo": "Irretroatividade", "definicao": "Regra de que a lei nova não alcança fatos passados. A retroatividade é exceção (prevista em lei e conforme a CF).", "secao": "1.5"}, {"termo": "Direito adquirido", "definicao": "Direito já incorporado ao patrimônio da pessoa; o mais amplo dos três protegidos pelo art. 6º.", "secao": "1.5"}, {"termo": "Ato jurídico perfeito", "definicao": "Ato já consumado segundo a lei vigente ao tempo em que se efetuou (art. 6º, § 1º).", "secao": "1.5"}, {"termo": "Coisa julgada", "definicao": "Decisão judicial da qual não cabe mais recurso (art. 6º, § 3º); o mais restrito dos três.", "secao": "1.5"}, {"termo": "Ponderação", "definicao": "Técnica (Robert Alexy; art. 489, § 2º, do CPC) de sopesar princípios/valores em colisão para decidir o caso.", "secao": "1.5"}, {"termo": "Retroatividade motivada", "definicao": "Situação em que normas de ordem pública (função social) podem retroagir (art. 2.035, parágrafo único, do CC).", "secao": "1.5"}, {"termo": "Lex domicilii", "definicao": "Regra de conexão: aplica-se a lei do domicílio da pessoa (art. 7º) — nome, capacidade, família, sucessão.", "secao": "1.6"}, {"termo": "Lex rei sitiae", "definicao": "Regra de conexão: aos bens aplica-se a lei do lugar onde se situam (art. 8º).", "secao": "1.6"}, {"termo": "Locus regit actum", "definicao": "Regra de conexão: o ato/obrigação rege-se pela lei do lugar em que foi constituído (art. 9º).", "secao": "1.6"}, {"termo": "Ordem pública (art. 17)", "definicao": "Limite que barra a eficácia, no Brasil, de leis, atos e sentenças estrangeiros que ofendam a soberania, a ordem pública e os bons costumes.", "secao": "1.6"}, {"termo": "Antinomia", "definicao": "Conflito entre duas ou mais normas válidas, sem se saber qual aplicar (lacuna de conflito). Não é revogação.", "secao": "1.7"}, {"termo": "Critério cronológico", "definicao": "Metacritério: norma posterior prevalece sobre a anterior. É o mais fraco.", "secao": "1.7"}, {"termo": "Critério da especialidade", "definicao": "Metacritério: norma especial prevalece sobre a geral. É o intermediário.", "secao": "1.7"}, {"termo": "Critério hierárquico", "definicao": "Metacritério: norma superior prevalece sobre a inferior. É o mais forte.", "secao": "1.7"}, {"termo": "Antinomia aparente x real", "definicao": "Aparente: resolve-se pelos metacritérios. Real: não se resolve por eles (ex.: geral superior x especial inferior).", "secao": "1.7"}, {"termo": "Segurança hermenêutica", "definicao": "Objetivo das inclusões de 2018: reduzir a instabilidade na interpretação das normas para agentes e atos públicos.", "secao": "1.8"}, {"termo": "Consequencialismo", "definicao": "Dever (art. 20) de considerar as consequências práticas da decisão, não decidindo apenas com base em valores abstratos.", "secao": "1.8"}, {"termo": "Invalidade referencial", "definicao": "Art. 24: ao revisar um ato, deve-se considerar as orientações gerais da época, sendo vedado invalidar situações já constituídas com base em mudança posterior de entendimento.", "secao": "1.8"}, {"termo": "Erro grosseiro (culpa grave)", "definicao": "Art. 28: o agente público só responde pessoalmente por dolo ou erro grosseiro — entendido como culpa grave (que se equipara ao dolo).", "secao": "1.8"}]};</script>
