<script>const DATA={"title": "SÚMULAS VINCULANTES 13 A 24", "subtitle": "STF · explicações comentadas (base: Dizer o Direito)", "hues": {"13": 258, "14": 210, "15": 168, "16": 32, "17": 342, "18": 280, "19": 140, "20": 48, "21": 300, "22": 190, "23": 18, "24": 224}, "sections": [{"num": "13", "theme": "Nepotismo", "enunciado": "A nomeação de cônjuge, companheiro ou parente em linha reta, colateral ou por afinidade, até o terceiro grau, inclusive, da autoridade nomeante ou de servidor da mesma pessoa jurídica investido em cargo de direção, chefia ou assessoramento, para o exercício de cargo em comissão ou de confiança ou, ainda, de função gratificada na Administração Pública direta e indireta em qualquer dos poderes da União, dos Estados, do Distrito Federal e dos municípios, compreendido o ajuste mediante designações recíprocas, viola a Constituição Federal.", "meta": ["Aprovada em 21/08/2008, DJe 29/08/2008."], "resumo": "Nomear cônjuge, companheiro ou parente (em linha reta, colateral ou por afinidade) até o 3º grau da autoridade nomeante — ou de servidor investido em cargo de direção, chefia ou assessoramento na mesma pessoa jurídica — para cargo em comissão, função de confiança ou função gratificada viola a Constituição. Inclui o nepotismo cruzado (designações recíprocas) e alcança a administração direta e indireta de todos os Poderes (União, Estados, DF e Municípios).", "pontos": ["Parentesco até o 3º grau; inclui o nepotismo cruzado (designações recíprocas).", "NÃO alcança servidores de provimento efetivo (concursados).", "Cargo político (ex.: Secretário), por si só, em regra não configura nepotismo/improbidade.", "Vale para a administração direta e indireta de todos os Poderes."], "quiz": [{"q": "A vedação da SV 13 alcança os servidores de provimento efetivo (concursados)?", "options": ["Sim, sempre", "Não — a proibição não alcança servidores efetivos", "Apenas no Poder Executivo"], "answer": 1, "explain": "O STF firmou que a norma que impede o nepotismo não alcança servidores de provimento efetivo (ADI 524/ES)."}, {"q": "Até que grau de parentesco a SV 13 veda a nomeação?", "options": ["1º grau", "2º grau", "3º grau (linha reta, colateral ou por afinidade)"], "answer": 2, "explain": "A vedação vai até o terceiro grau, inclusive — em linha reta, colateral ou por afinidade."}, {"q": "O “nepotismo cruzado” (designações recíprocas) é vedado pela SV 13?", "options": ["Não, é permitido", "Sim, está expressamente compreendido no enunciado", "Só quando envolve o mesmo Poder"], "answer": 1, "explain": "O enunciado inclui expressamente “o ajuste mediante designações recíprocas” (nepotismo cruzado)."}, {"q": "A nomeação do cônjuge do prefeito para Secretário Municipal (cargo político), por si só, caracteriza improbidade?", "options": ["Sim, sempre", "Não, por se tratar de cargo de natureza política", "Só se houver dano ao erário"], "answer": 1, "explain": "Por se tratar de cargo público de natureza política, a nomeação, por si só, não caracteriza ato de improbidade (Rcl 22339 AgR/SP)."}, {"q": "A SV 13 abrange quais esferas e Poderes?", "options": ["Apenas o Executivo federal", "Administração direta e indireta de todos os Poderes (União, Estados, DF e Municípios)", "Apenas Estados e Municípios"], "answer": 1, "explain": "O enunciado alcança a administração direta e indireta de qualquer dos Poderes da União, dos Estados, do DF e dos Municípios."}, {"q": "É constitucional nomear servidor efetivo concursado como assistente de desembargador seu parente?", "options": ["Nunca", "Sim, desde que não haja subordinação direta e haja compatibilidade de escolaridade/qualificação", "Sim, sem qualquer condição"], "answer": 1, "explain": "É constitucional, desde que inexista subordinação direta ao magistrado e sejam observadas a compatibilidade de escolaridade e a qualificação (ADI 3.496/SP)."}], "terms": [{"termo": "Nepotismo", "definicao": "Nomeação de parentes (até 3º grau) para cargos em comissão, funções de confiança ou gratificadas, favorecida pela relação de parentesco com a autoridade. É vedado pela SV 13.", "secao": "13"}, {"termo": "Nepotismo cruzado", "definicao": "Troca de favores em que autoridades nomeiam reciprocamente parentes uma da outra (designações recíprocas). Também é vedado.", "secao": "13"}, {"termo": "Cargo em comissão", "definicao": "Cargo de livre nomeação e exoneração (sem concurso), destinado a direção, chefia e assessoramento.", "secao": "13"}, {"termo": "Cargo político", "definicao": "Cargo de natureza política (ex.: Secretário). Sua nomeação, por si só, em regra não configura nepotismo/improbidade.", "secao": "13"}], "blocks": ["1. Vale ressaltar que a norma que impede nepotismo no serviço público não alcança servidores de provimento efetivo. (STF. Plenário. ADI 524/ES, julgado em 20/5/2015)", "2. É constitucional a nomeação de servidor público efetivo de carreira judiciária, admitido via concurso público, para o cargo em comissão de assistente jurídico de desembargador — ainda que o servidor seja cônjuge, afim ou parente de algum integrante do órgão —, desde que: i) inexista subordinação direta do servidor ao magistrado com quem possui laços prévios; e ii) sejam observadas a compatibilidade do grau de escolaridade do cargo de origem, a qualificação profissional do servidor e a complexidade inerente ao cargo em comissão a ser exercido. (STF. Plenário. ADI 3.496/SP, julgado em 13/10/2025)", "3. Não haverá nepotismo se a pessoa nomeada possui um parente no órgão, mas sem influência hierárquica sobre a nomeação. A incompatibilidade da prática enunciada na SV 13 com o art. 37 da CF/88 não decorre diretamente da existência de relação de parentesco entre pessoa designada e agente político ou servidor público, mas de presunção de que a escolha para ocupar cargo de direção, chefia ou assessoramento tenha sido direcionado à pessoa com relação de parentesco com quem tenha potencial de interferir no processo de seleção. (STF. 2ª Turma. Rcl 18564/SP, julgado em 23/2/2016)", "4. É inconstitucional lei estadual que excepciona a vedação da prática do nepotismo, permitindo que sejam nomeados para cargos em comissão ou funções gratificadas de até dois parentes das autoridades estaduais, além do cônjuge do Governador. (STF. Plenário. ADI 3745/GO, julgado em 15/5/2013)", "5. A nomeação do cônjuge de prefeito para o cargo de Secretário Municipal, por se tratar de cargo público de natureza política, por si só, não caracteriza ato de improbidade administrativa. (STF. 2ª Turma. Rcl 22339 AgR/SP, julgado em 4/9/2018)"]}, {"num": "14", "theme": "Acesso do advogado aos autos da investigação", "enunciado": "É direito do defensor, no interesse do representado, ter acesso amplo aos elementos de prova que, já documentados em procedimento investigatório realizado por órgão com competência de polícia judiciária, digam respeito ao exercício do direito de defesa.", "meta": [], "resumo": "É direito do defensor, no interesse do representado, ter amplo acesso aos elementos de prova JÁ DOCUMENTADOS em procedimento investigatório, para o exercício da defesa. Não abrange diligências ainda em andamento e não documentadas. A Lei 13.245/2016 ampliou o direito no Estatuto da OAB para qualquer procedimento investigatório.", "pontos": ["Acesso apenas aos elementos JÁ DOCUMENTADOS (não a diligências em curso).", "Negado o acesso em procedimento de polícia judiciária → cabe reclamação ao STF (SV 14).", "Negado em outros órgãos → não cabe reclamação; usa-se MS ou ação (art. 7º, XIV, Estatuto da OAB).", "A Lei 13.245/2016 ampliou o direito de acesso do advogado."], "quiz": [{"q": "A SV 14 garante acesso a diligências ainda em andamento e não documentadas?", "options": ["Sim, a tudo", "Não — apenas aos elementos JÁ DOCUMENTADOS", "Só com autorização do juiz"], "answer": 1, "explain": "O direito recai sobre os elementos de prova já documentados; diligências em andamento e ainda não documentadas não são alcançadas."}, {"q": "Negado o acesso a inquérito de órgão com competência de polícia judiciária, o que cabe?", "options": ["Reclamação diretamente ao STF (SV 14)", "Apenas recurso administrativo", "Nada"], "answer": 0, "explain": "Nessa hipótese, o advogado pode propor reclamação diretamente no STF invocando violação à SV 14."}, {"q": "Negado o acesso a procedimento de OUTRO órgão (sem competência de polícia judiciária), cabe reclamação com base na SV 14?", "options": ["Sim", "Não — deve-se impetrar mandado de segurança ou ação (art. 7º, XIV, do Estatuto da OAB)", "Só habeas corpus"], "answer": 1, "explain": "Essa situação não está na SV 14; o caminho é MS ou ação alegando afronta ao art. 7º, XIV, do Estatuto da OAB."}, {"q": "Qual lei ampliou o direito de acesso do advogado a qualquer procedimento investigatório?", "options": ["Lei 8.906/1994", "Lei 13.245/2016", "Lei 13.964/2019"], "answer": 1, "explain": "A Lei 13.245/2016 alterou o art. 7º, XIV, do Estatuto da OAB, ampliando o acesso a qualquer instituição."}, {"q": "O acesso previsto na SV 14 está condicionado a quê?", "options": ["Ao pagamento de custas", "Ao interesse do representado e ao exercício do direito de defesa", "À concordância do Ministério Público"], "answer": 1, "explain": "O enunciado fala em acesso “no interesse do representado” e quanto ao que “diga respeito ao exercício do direito de defesa”."}], "terms": [{"termo": "Reclamação constitucional", "definicao": "Ação dirigida ao STF para garantir a autoridade de suas decisões e súmulas vinculantes. Cabe se violada a SV 14 (procedimento de polícia judiciária).", "secao": "14"}, {"termo": "Elementos já documentados", "definicao": "Provas que já foram formalizadas nos autos da investigação. Só a estes o defensor tem acesso garantido pela SV 14 (não a diligências em curso).", "secao": "14"}], "blocks": ["Fundamento: art. 5º, XXXIII, LIV e LV, da CF/88; art. 7º, XIII e XIV, do Estatuto da OAB.", "Depois da edição da súmula, houve alteração no inciso XIV do art. 7º do Estatuto da OAB pela Lei nº 13.245/2016, ampliando o direito dos advogados para ter amplo acesso a qualquer procedimento investigatório realizado por qualquer instituição (não apenas &quot;por órgão com competência de polícia judiciária&quot;). A súmula vinculante continua válida. Contudo, se for negado o acesso a procedimento de órgão com competência de polícia judiciária, o advogado poderá propor reclamação diretamente no STF invocando violação à SV 14. Se for negado acesso a procedimento realizado por outros órgãos, o advogado não poderá propor reclamação (pois esta situação não está prevista na SV 14), devendo impetrar mandado de segurança ou ação ordinária alegando afronta ao art. 7º, XIV, do Estatuto da OAB."]}, {"num": "15", "theme": "Abono do salário mínimo e cálculo de vantagens", "enunciado": "O cálculo de gratificações e outras vantagens não incide sobre o abono utilizado para se atingir o salário mínimo do servidor público.", "meta": ["Válida."], "resumo": "Quando o servidor recebe menos que o salário mínimo, paga-se um abono complementar para atingir o piso. Esse abono NÃO pode ser usado como base de cálculo de gratificações e outras vantagens — que incidem sobre o vencimento-base, e não sobre o abono. Isso evita o “efeito cascata”.", "pontos": ["Gratificações/adicionais incidem sobre o vencimento-base, não sobre o abono.", "O abono só serve para atingir o piso do salário mínimo.", "Impede o “efeito cascata” na remuneração."], "quiz": [{"q": "As gratificações incidem sobre o abono usado para atingir o salário mínimo?", "options": ["Sim", "Não", "Só as de insalubridade"], "answer": 1, "explain": "A SV 15 determina que o cálculo de gratificações e outras vantagens não incide sobre o abono utilizado para atingir o salário mínimo."}, {"q": "Servidor com base R$ 800 e mínimo R$ 1.518; gratificação de 20%. Qual a base correta da gratificação?", "options": ["R$ 1.518 (20% = R$ 303,60)", "R$ 800 (20% = R$ 160,00)", "R$ 718 (o abono)"], "answer": 1, "explain": "A gratificação incide sobre o vencimento-base (R$ 800): 20% = R$ 160,00 — e não sobre o total com abono."}, {"q": "Qual fenômeno a SV 15 busca impedir?", "options": ["A irredutibilidade", "O “efeito cascata” (abono servindo de base para outros cálculos)", "A vinculação ao salário mínimo"], "answer": 1, "explain": "A súmula impede o efeito cascata que ocorreria se o abono fosse incorporado como base para outras parcelas remuneratórias."}, {"q": "Para que serve o abono complementar de que trata a SV 15?", "options": ["Para pagar gratificações", "Para garantir que a remuneração atinja o piso do salário mínimo", "Para custear alimentação"], "answer": 1, "explain": "O abono é pago para garantir que o total não seja inferior ao piso constitucional do salário mínimo."}], "terms": [{"termo": "Abono complementar", "definicao": "Valor pago para completar a remuneração do servidor até o piso do salário mínimo. Não serve de base para outras vantagens (SV 15).", "secao": "15"}, {"termo": "Efeito cascata", "definicao": "Multiplicação de vantagens que ocorreria se o abono fosse usado como base de cálculo de outras parcelas. A SV 15 o impede.", "secao": "15"}], "blocks": ["A SV 15 estabelece uma regra fundamental sobre a composição da remuneração dos servidores públicos quando há necessidade de complementação salarial para atingir o piso do salário mínimo. O entendimento consolidado pelo STF determina que quando um servidor público recebe remuneração inferior ao salário-mínimo, o órgão público deve pagar um abono complementar para garantir que o total não seja inferior ao piso constitucional. O ponto central da súmula é que esse abono complementar não pode ser usado como base de cálculo para outras vantagens funcionais, como gratificações, adicionais ou qualquer outra parcela remuneratória.", "Exemplo prático: servidor com salário base de R$ 800,00 e salário mínimo de R$ 1.518,00. Será necessário um abono de R$ 718,00. Se houver gratificação de 20%, o cálculo correto é 20% de R$ 800,00 = R$ 160,00 (e não 20% de R$ 1.518,00 = R$ 303,60).", "O impacto prático da súmula é significativo para a administração pública, pois impede o chamado &quot;efeito cascata&quot; que ocorreria se o abono fosse incorporado como base para outros cálculos remuneratórios."]}, {"num": "16", "theme": "Salário mínimo e o total da remuneração do servidor", "enunciado": "Os arts. 7º, IV, e 39, § 3º (redação da EC 19/98), da Constituição, referem-se ao total da remuneração percebida pelo servidor público.", "meta": ["Data de publicação: DJE de 1º-7-2009."], "resumo": "A garantia de percepção do salário mínimo (art. 7º, IV, c/c art. 39, §3º, da CF) refere-se ao TOTAL da remuneração do servidor, e não apenas ao vencimento-base. Logo, é lícito o vencimento-base ser inferior ao mínimo, desde que a remuneração total (somadas as demais parcelas) atinja o piso. A garantia não se estende aos militares.", "pontos": ["Piso do salário mínimo = TOTAL da remuneração (não o vencimento-base isolado).", "Vencimento-base pode ser inferior ao mínimo, se o total atingir o piso.", "A garantia não se estende aos militares.", "Tema 900: é vedado pagar menos que o mínimo, ainda que em jornada reduzida."], "quiz": [{"q": "A garantia do salário mínimo (SV 16) incide sobre o vencimento-base ou sobre o total da remuneração?", "options": ["Sobre o vencimento-base", "Sobre o total da remuneração", "Sobre cada parcela isoladamente"], "answer": 1, "explain": "A SV 16 firma que a garantia se refere ao total da remuneração percebida pelo servidor."}, {"q": "É lícito o vencimento-base ser inferior ao salário mínimo?", "options": ["Nunca", "Sim, desde que a remuneração total atinja o piso", "Só para comissionados"], "answer": 1, "explain": "É lícito, desde que a soma das parcelas (remuneração total) atinja o salário mínimo."}, {"q": "A garantia de remuneração não inferior ao salário mínimo estende-se aos militares?", "options": ["Sim", "Não", "Apenas aos inativos"], "answer": 1, "explain": "O STF destacou que essa garantia não se estende aos militares."}, {"q": "Pelo Tema 900 (repercussão geral), é possível pagar menos que o mínimo ao servidor em jornada reduzida?", "options": ["Sim", "Não — é vedado pagar menos que o mínimo, ainda que em jornada reduzida", "Só com previsão em lei"], "answer": 1, "explain": "Tema 900: é defeso pagar remuneração inferior ao salário mínimo ao servidor, ainda que labore em jornada reduzida."}, {"q": "O “total da remuneração”, no sentido da SV 16, pode abranger verbas indenizatórias (ex.: diárias)?", "options": ["Não", "Sim, no sentido de abranger o total remuneratório do servidor", "Apenas gratificações"], "answer": 1, "explain": "Segundo o entendimento adotado, o termo foi usado para abranger o total remuneratório, incluindo, inclusive, verbas indenizatórias como diárias."}], "terms": [{"termo": "Vencimento-base", "definicao": "Parcela fixa da remuneração, antes de gratificações e adicionais. Pode ser inferior ao mínimo, se o TOTAL atingir o piso (SV 16).", "secao": "16"}, {"termo": "Remuneração total", "definicao": "Soma de todas as parcelas recebidas pelo servidor. É sobre ela que incide a garantia do salário mínimo (SV 16).", "secao": "16"}], "blocks": ["A SV 16 consolidou o entendimento de que a garantia da percepção do salário mínimo, prevista na Constituição (art. 7º, IV, c/c art. 39, § 3º), diz respeito ao total da remuneração percebida pelo servidor público, e não apenas ao seu salário-base ou vencimento básico. Portanto, é lícito que o vencimento-base seja inferior ao salário-mínimo, desde que a remuneração total (somada a outras parcelas) atinja o piso legal. O STF também destacou que não se estende aos militares a garantia de remuneração não inferior ao salário mínimo vigente. O termo &quot;total da remuneração&quot; foi introduzido no sentido de abranger o total remuneratório do servidor, a incluir, inclusive, verbas indenizatórias, tais como diárias.", "Tese de Repercussão Geral (Tema 900): É defeso o pagamento de remuneração em valor inferior ao salário mínimo ao servidor público, ainda que labore em jornada reduzida de trabalho."]}, {"num": "17", "theme": "Precatórios — juros de mora no período constitucional", "enunciado": "Durante o período previsto no parágrafo 1º (atual § 5º) do artigo 100 da Constituição, não incidem juros de mora sobre os precatórios que nele sejam pagos.", "meta": ["Aprovada em 29/10/2009, DJe 10/11/2009.", "Válida, mas quando o enunciado fala em \"§ 1º\", deve-se entender § 5º. Isso porque, após a súmula ter sido aprovada (em 10/11/2009), foi editada a EC 62/2009 (em 09/12/2009), que deslocou a redação do antigo § 1º para o atual § 5º do art. 100 da CF/88."], "resumo": "Durante o período constitucional de pagamento dos precatórios (§5º, antigo §1º, do art. 100 da CF), NÃO incidem juros de mora. Esse é o prazo normal que a Constituição deu ao Poder Público para pagar: de 1º/07 de um ano até 31/12 do ano seguinte. Nesse intervalo há correção monetária, mas não juros. Passado o prazo (31/12) sem pagamento, voltam a incidir juros (com precatório complementar).", "pontos": ["No período constitucional de pagamento não há juros de mora (só correção monetária).", "Período: de 1º/07 de um ano até 31/12 do ano seguinte.", "Estourado o prazo (31/12), voltam os juros — precatório complementar.", "Onde se lê “§ 1º”, entenda “§ 5º” do art. 100 (EC 62/2009).", "Entre a data dos cálculos e a requisição (RPV/precatório), incidem juros (Tema 96)."], "quiz": [{"q": "Durante o período constitucional de pagamento do precatório, incidem juros de mora?", "options": ["Sim", "Não", "Só a metade"], "answer": 1, "explain": "A SV 17 afirma que não incidem juros de mora sobre os precatórios pagos nesse período."}, {"q": "O que incide nesse período, mesmo sem juros de mora?", "options": ["Nada", "Correção monetária", "Multa"], "answer": 1, "explain": "Nesse período não há juros moratórios, mas deve ser paga a correção monetária."}, {"q": "Qual é o período em que não incidem os juros?", "options": ["De janeiro a dezembro do mesmo ano", "De 1º/07 de um ano até 31/12 do ano seguinte", "Apenas o mês de dezembro"], "answer": 1, "explain": "É o prazo normal dado pela CF ao Poder Público: de 1º/07 de um ano ao dia 31/12 do ano seguinte."}, {"q": "Se o ente não pagar até 31/12, o que ocorre?", "options": ["Extingue-se a dívida", "Voltam a incidir juros de mora (expede-se precatório complementar)", "Nada muda"], "answer": 1, "explain": "Esgotado o prazo constitucional, voltam a incidir juros de mora, com expedição de precatório complementar."}, {"q": "Ao ler “§ 1º” no enunciado, deve-se entender qual parágrafo?", "options": ["§ 2º", "§ 5º do art. 100 (EC 62/2009 deslocou a redação)", "§ 3º"], "answer": 1, "explain": "Após a súmula, a EC 62/2009 deslocou a redação do antigo § 1º para o atual § 5º do art. 100 da CF."}, {"q": "Entre a data da realização dos cálculos e a requisição (RPV/precatório), incidem juros de mora?", "options": ["Não", "Sim (Tema 96, RE 579431)", "Somente correção"], "answer": 1, "explain": "Incidem juros no período entre a data dos cálculos e a requisição de pequeno valor ou do precatório (Tema 96)."}], "terms": [{"termo": "Precatório", "definicao": "Requisição de pagamento devida pela Fazenda Pública, por dívida reconhecida em decisão judicial transitada em julgado.", "secao": "17"}, {"termo": "RPV", "definicao": "Requisição de Pequeno Valor: forma de pagamento pela Fazenda de dívidas de menor valor, mais célere que o precatório.", "secao": "17"}, {"termo": "Juros de mora", "definicao": "Encargo pelo atraso no pagamento. Não incidem no período constitucional de pagamento do precatório (SV 17).", "secao": "17"}, {"termo": "Correção monetária", "definicao": "Atualização do valor pela inflação. Incide mesmo no período em que não há juros de mora.", "secao": "17"}], "blocks": ["Situação hipotética: João ajuizou ação de cobrança contra a Fazenda Pública. Sentença condenando o Poder Público a pagar R$ 300 mil transitou em julgado. O credor pediu cumprimento de sentença. Segundo o STF, a partir do momento em que forem apresentados os cálculos, começa a incidir juros da mora contra a Fazenda Pública.", "Incidem os juros da mora no período compreendido entre a data da realização dos cálculos e a da requisição de pequeno valor (RPV) ou do precatório. (STF. Plenário. RE 579431/RS, julgado em 19/4/2017 - Repercussão Geral – Tema 96)", "Período de suspensão dos juros moratórios: Entre o dia 01/07 de um ano até o dia 31/12 do ano seguinte, não haverá incidência de juros de mora porque o STF entende que esse foi o prazo normal que a CF/88 deu para o Poder Público pagar seus precatórios. Nesse período, não há incidência de juros moratórios, mas deverá ser paga correção monetária.", "Se passar o prazo (31/12) e o ente não efetuar o pagamento, voltará a incidir juros de mora, pois terá se esgotado o prazo constitucional. Será necessária a expedição de um precatório complementar para receber o valor dos juros.", "A SV 17 não foi superada pela EC 62/2009. O enunciado continua válido."]}, {"num": "18", "theme": "Inelegibilidade e dissolução do vínculo conjugal", "enunciado": "A dissolução da sociedade ou do vínculo conjugal, no curso do mandato, não afasta a inelegibilidade prevista no § 7º do artigo 14 da Constituição Federal.", "meta": ["Importante."], "resumo": "A dissolução da sociedade conjugal ou do vínculo (divórcio) no curso do mandato NÃO afasta a inelegibilidade reflexa do art. 14, §7º, da CF (cônjuge e parentes até o 2º grau do chefe do Executivo). Exceção construída pelo STF: a morte do titular (viuvez), com regular sucessão do vice e formação de novo núcleo familiar, afasta a inelegibilidade — a SV 18 não se aplica à extinção do vínculo pela morte.", "pontos": ["Divórcio no curso do mandato NÃO afasta a inelegibilidade (evita a fraude).", "Exceção: morte do titular (viuvez) + sucessão do vice + novo núcleo familiar → afasta (RE 758461).", "Inelegibilidade reflexa: cônjuge e parentes até o 2º grau do chefe do Executivo."], "quiz": [{"q": "O divórcio no curso do mandato afasta a inelegibilidade do art. 14, §7º, da CF?", "options": ["Sim", "Não (SV 18)", "Só após 6 meses"], "answer": 1, "explain": "A SV 18 firma que a dissolução do vínculo conjugal no curso do mandato não afasta a inelegibilidade."}, {"q": "A SV 18 aplica-se ao caso de extinção do vínculo pela MORTE de um dos cônjuges?", "options": ["Sim, sempre", "Não — a morte, com sucessão do vice e novo núcleo familiar, afasta a inelegibilidade", "Só se houver filhos"], "answer": 1, "explain": "A SV 18 não se aplica à extinção do vínculo pela morte; havendo regular sucessão do vice e novo núcleo familiar, não incide a inelegibilidade (RE 758461/PB)."}, {"q": "A inelegibilidade reflexa do art. 14, §7º alcança parentes até que grau?", "options": ["1º grau", "2º grau (consanguíneos ou afins) ou por adoção", "3º grau"], "answer": 1, "explain": "O art. 14, §7º torna inelegíveis o cônjuge e os parentes consanguíneos ou afins, até o 2º grau ou por adoção."}, {"q": "Por que o divórcio não afasta a inelegibilidade, segundo a lógica da SV 18?", "options": ["Para punir o divórcio", "Para evitar fraude — a dissolução “de fachada” para driblar a inelegibilidade", "Por questão religiosa"], "answer": 1, "explain": "A simples dissolução do casamento no curso do mandato não afasta a inelegibilidade, evitando manobras para perpetuar o grupo familiar no poder."}, {"q": "Quem é o “cônjuge supérstite” mencionado no tema?", "options": ["O ex-cônjuge do divórcio", "O cônjuge sobrevivente (viúvo/viúva)", "O novo cônjuge"], "answer": 1, "explain": "Cônjuge supérstite é o sobrevivente (viúvo), a quem a exceção da morte pode beneficiar."}], "terms": [{"termo": "Inelegibilidade reflexa", "definicao": "Impedimento de candidatura que atinge o cônjuge e parentes (até 2º grau) do chefe do Executivo (art. 14, §7º, da CF).", "secao": "18"}, {"termo": "Cônjuge supérstite", "definicao": "Cônjuge sobrevivente (viúvo/viúva). A morte do titular pode afastar a inelegibilidade, conforme exceção do STF.", "secao": "18"}], "blocks": ["Art. 14, § 7º - São inelegíveis, no território de jurisdição do titular, o cônjuge e os parentes consanguíneos ou afins, até o segundo grau ou por adoção, do Presidente da República, de Governador de Estado ou Território, do Distrito Federal, de Prefeito ou de quem os haja substituído dentro dos seis meses anteriores ao pleito, salvo se já titular de mandato eletivo e candidato à reeleição.", "Atenção: a inelegibilidade do art. 14, § 7º, da Constituição NÃO ALCANÇA o cônjuge supérstite (sobrevivente, viúvo) quando o falecimento tiver ocorrido no primeiro mandato, com regular sucessão do vice-prefeito, e tendo em conta a construção de novo núcleo familiar. A Súmula Vinculante 18 do STF não se aplica aos casos de extinção do vínculo conjugal pela morte de um dos cônjuges. (STF. Plenário. RE 758461/PB, Rel. Min. Teori Zavascki, julgado em 22/5/2014 - repercussão geral)", "Resumo: A simples dissolução do casamento (divórcio) não afasta a inelegibilidade. Porém, a morte do titular do cargo (viuvez), com regular sucessão do vice e construção de novo núcleo familiar pelo cônjuge supérstite, afasta a inelegibilidade."]}, {"num": "19", "theme": "Taxa de coleta de lixo", "enunciado": "A taxa cobrada exclusivamente em razão dos serviços públicos de coleta, remoção e tratamento ou destinação de lixo ou resíduos provenientes de imóveis, não viola o art. 145, II, da CF.", "meta": ["Importante."], "resumo": "A taxa cobrada exclusivamente pela coleta, remoção e tratamento/destinação de lixo proveniente de IMÓVEIS é constitucional, pois o serviço é específico e divisível (uti singuli). Já a taxa por serviços de limpeza de logradouros públicos (ruas, praças) é inconstitucional, porque são serviços indivisíveis, prestados a todos (uti universi).", "pontos": ["Coleta de lixo domiciliar = serviço específico e divisível (uti singuli) → taxa constitucional.", "Limpeza de ruas/praças (logradouros) = uti universi → taxa inconstitucional.", "Pode ser calculada pela testada/área do imóvel, se pertinente ao serviço.", "Não viola o art. 145, II, da CF."], "quiz": [{"q": "A taxa de coleta de lixo domiciliar proveniente de imóveis é constitucional?", "options": ["Não", "Sim, pois o serviço é específico e divisível (uti singuli)", "Só em capitais"], "answer": 1, "explain": "O STF entende que a coleta/remoção/tratamento de lixo de imóveis é serviço específico e divisível (uti singuli); a taxa é constitucional."}, {"q": "A taxa por limpeza de ruas e praças (logradouros públicos) é constitucional?", "options": ["Sim", "Não — trata-se de serviço indivisível (uti universi)", "Só com lei complementar"], "answer": 1, "explain": "É inconstitucional cobrar taxa por serviços de conservação e limpeza de logradouros, pois são indivisíveis (uti universi)."}, {"q": "O que caracteriza um serviço “uti singuli”?", "options": ["Prestado a todos indistintamente", "Específico e divisível, de utilização efetiva ou potencial identificável por contribuinte", "Gratuito"], "answer": 1, "explain": "Uti singuli: serviço específico e divisível, com utilização efetiva ou potencial mensurável por usuário."}, {"q": "A taxa de coleta de lixo pode ser calculada pela área construída ou testada do imóvel?", "options": ["Nunca", "Sim, desde que haja pertinência com o serviço prestado", "Só pela quantidade de lixo"], "answer": 1, "explain": "Pode ser calculada em função da testada do terreno ou da área construída, desde que haja pertinência com o serviço."}, {"q": "A coleta de lixo prestada por sociedade de economia mista permite a cobrança de taxa?", "options": ["Não", "Sim, por se tratar de serviço uti singuli", "Só se for autarquia"], "answer": 1, "explain": "É possível a prestação por sociedade de economia mista, cabendo a cobrança de taxa por ser serviço uti singuli."}, {"q": "A SV 19 afirma que a taxa de coleta de lixo de imóveis NÃO viola qual dispositivo?", "options": ["Art. 150, I, da CF", "Art. 145, II, da CF", "Art. 195 da CF"], "answer": 1, "explain": "A SV 19 diz que essa taxa não viola o art. 145, II, da CF."}], "terms": [{"termo": "Uti singuli", "definicao": "Serviço público específico e divisível, mensurável por usuário (ex.: coleta de lixo domiciliar). Permite cobrança de taxa.", "secao": "19"}, {"termo": "Uti universi", "definicao": "Serviço público indivisível, prestado a todos (ex.: limpeza de ruas). Não pode ser custeado por taxa.", "secao": "19"}, {"termo": "Taxa", "definicao": "Tributo vinculado a um serviço público específico e divisível ou ao poder de polícia (art. 145, II, da CF).", "secao": "19"}], "blocks": ["O STF define que os serviços públicos de coleta, remoção e tratamento de lixo proveniente de imóveis são específicos e divisíveis (uti singuli), caracterizando-se pela utilização efetiva ou potencial do contribuinte. Portanto, a cobrança de taxa por esse serviço específico é constitucional. Em contrapartida, é inconstitucional a cobrança de taxas por serviços de conservação e limpeza de logradouros e bens públicos em geral (limpeza de ruas e praças), pois estes são indivisíveis e prestados uti universi à população como um todo.", "Questões de concurso relevantes:", "- A taxa de coleta de lixo urbano pode ser calculada em função da testada do terreno ou da área construída do imóvel, desde que haja pertinência com o serviço prestado.", "- A coleta, remoção e destinação do lixo doméstico pode sim ser considerado como serviço público específico e divisível (é constitucional cobrar taxa por isso).", "- É possível a prestação do serviço público de coleta e manejo de resíduos sólidos por sociedade de economia mista, e é cabível a cobrança de taxa por se tratar de serviço uti singuli (e não uti universi como erroneamente afirmado).", "- A taxa cobrada exclusivamente em razão dos serviços de coleta de lixo NÃO viola a CF. Porém, taxa por limpeza de logradouros públicos é inconstitucional (é uti universi)."]}, {"num": "20", "theme": "GDATA e servidores inativos", "enunciado": "A Gratificação de Desempenho de Atividade Técnico-Administrativa – GDATA, instituída pela Lei 10.404/2002, deve ser deferida aos inativos nos valores correspondentes a 37,5 (trinta e sete vírgula cinco) pontos no período de fevereiro a maio de 2002 e, nos termos do art. 5º, parágrafo único, da Lei 10.404/2002, no período de junho de 2002 até a conclusão dos efeitos do último ciclo de avaliação a que se refere o art. 1º da Medida Provisória 198/2004, a partir da qual passa a ser de 60 (sessenta) pontos.", "meta": ["Válida, mas pouco relevante para concursos."], "resumo": "A GDATA (Gratificação de Desempenho de Atividade Técnico-Administrativa, Lei 10.404/2002) deve ser paga aos servidores inativos: 37,5 pontos no período de fevereiro a maio de 2002 e, depois, 60 pontos a partir do último ciclo de avaliação (MP 198/2004). É um tema pouco relevante para concursos.", "pontos": ["GDATA aos inativos: 37,5 pontos (fev–mai/2002) e, depois, 60 pontos.", "Tema pouco cobrado em provas."], "quiz": [{"q": "A GDATA (Lei 10.404/2002) deve ser deferida aos servidores inativos?", "options": ["Não", "Sim (SV 20)", "Só aos ativos"], "answer": 1, "explain": "A SV 20 determina que a GDATA seja deferida aos inativos, nos valores em pontos que fixa."}, {"q": "Quantos pontos a SV 20 fixa aos inativos no período de fevereiro a maio de 2002?", "options": ["60 pontos", "37,5 pontos", "20 pontos"], "answer": 1, "explain": "No período de fevereiro a maio de 2002, o valor corresponde a 37,5 pontos; depois, passa a 60 pontos."}], "terms": [{"termo": "GDATA", "definicao": "Gratificação de Desempenho de Atividade Técnico-Administrativa (Lei 10.404/2002). A SV 20 assegura seu pagamento aos inativos.", "secao": "20"}], "blocks": ["O Dizer o Direito não apresenta comentários extensos sobre esta súmula, indicando que ela é pouco relevante para concursos. A SV 20 trata da GDATA dos servidores inativos do Ministério da Saúde. O STF fixou os valores em pontos que devem ser pagos aos inativos em cada período, conforme a Lei 10.404/2002 e a MP 198/2004."]}, {"num": "21", "theme": "Depósito prévio em recurso administrativo", "enunciado": "É inconstitucional a exigência de depósito ou arrolamento prévios de dinheiro ou bens para admissibilidade de recurso administrativo.", "meta": ["Importante."], "resumo": "É INCONSTITUCIONAL exigir depósito prévio ou arrolamento de dinheiro ou bens como condição para a admissibilidade de recurso administrativo. A exigência viola a ampla defesa e o contraditório (art. 5º, LV, da CF). A regra é geral — não se limita a recursos tributários.", "pontos": ["Proibido exigir depósito OU arrolamento prévio para recorrer na esfera administrativa.", "Fundamento: ampla defesa e contraditório (art. 5º, LV, da CF).", "Regra geral (não só para matéria tributária)."], "quiz": [{"q": "É constitucional exigir depósito prévio em dinheiro para admitir recurso administrativo?", "options": ["Sim", "Não (SV 21)", "Só até certo valor"], "answer": 1, "explain": "A SV 21 declara inconstitucional a exigência de depósito ou arrolamento prévios para admissibilidade de recurso administrativo."}, {"q": "Qual garantia constitucional a exigência viola?", "options": ["A legalidade", "A ampla defesa e o contraditório (art. 5º, LV, da CF)", "A isonomia"], "answer": 1, "explain": "A exigência viola o art. 5º, LV, da CF (ampla defesa e contraditório)."}, {"q": "A vedação da SV 21 alcança também o arrolamento prévio de bens?", "options": ["Não", "Sim — depósito OU arrolamento", "Só o depósito em dinheiro"], "answer": 1, "explain": "O enunciado veda tanto o depósito quanto o arrolamento prévios de dinheiro ou bens."}, {"q": "A SV 21 aplica-se apenas a recursos em matéria tributária?", "options": ["Sim", "Não — a recurso administrativo de forma geral", "Só a recursos trabalhistas"], "answer": 1, "explain": "O STF consolidou a inconstitucionalidade da exigência para recurso administrativo de forma geral."}], "terms": [{"termo": "Depósito prévio", "definicao": "Exigência de depositar dinheiro/bens para poder recorrer. É inconstitucional na esfera administrativa (SV 21).", "secao": "21"}], "blocks": ["Essa exigência viola o art. 5º, LV, da CF/88 (ampla defesa e contraditório). A Constituição Federal proíbe a exigência de depósito prévio em dinheiro ou arrolamento de bens para admissibilidade de recurso em matéria de sanção tributária (art. 5º, LIV, CF). O STF estendeu essa lógica, consolidando a SV 21, que declara a inconstitucionalidade de qualquer exigência de depósito ou arrolamento prévios de dinheiro ou bens como requisito de admissibilidade de recurso administrativo de forma geral, garantindo o amplo direito de defesa do administrado."]}, {"num": "22", "theme": "Justiça do Trabalho — acidente de trabalho", "enunciado": "A Justiça do Trabalho é competente para processar e julgar as ações de indenização por danos morais e patrimoniais decorrentes de acidente de trabalho propostas por empregado contra empregador, inclusive aquelas que ainda não possuíam sentença de mérito em primeiro grau quando da promulgação da Emenda Constitucional nº 45/2004.", "meta": ["Aprovada em 02/12/2009, DJe 11/12/2009.", "Importante."], "resumo": "A Justiça do Trabalho é competente para julgar as ações de indenização por danos morais e materiais decorrentes de ACIDENTE DE TRABALHO movidas pelo empregado contra o empregador (art. 114 da CF, após a EC 45/2004) — inclusive as que ainda não tinham sentença de mérito em 1º grau quando da EC 45. Não se confunde com a ação acidentária contra o INSS (benefício previdenciário), que é da Justiça Comum.", "pontos": ["Ação do empregado contra o empregador (acidente de trabalho) → Justiça do Trabalho.", "Base: art. 114 da CF (EC 45/2004); precedente STF, CC 7.204.", "Se já havia sentença de mérito ao tempo da EC 45, permanece no juízo que a proferiu.", "Ação contra o INSS (benefício acidentário) = Justiça Comum (não é a SV 22)."], "quiz": [{"q": "De quem é a competência para a ação de indenização por acidente de trabalho do empregado contra o empregador?", "options": ["Justiça Comum estadual", "Justiça do Trabalho (SV 22)", "Justiça Federal"], "answer": 1, "explain": "A SV 22 fixa a competência da Justiça do Trabalho para essas ações (art. 114 da CF)."}, {"q": "Qual emenda ampliou a competência da Justiça do Trabalho nesse ponto?", "options": ["EC 20/1998", "EC 45/2004", "EC 62/2009"], "answer": 1, "explain": "A EC 45/2004 ampliou a competência da Justiça do Trabalho (art. 114 da CF/88)."}, {"q": "A SV 22 alcança as ações que ainda não tinham sentença de mérito em 1º grau quando da EC 45/2004?", "options": ["Não", "Sim", "Só as ajuizadas depois de 2010"], "answer": 1, "explain": "O enunciado abrange, inclusive, as ações que ainda não possuíam sentença de mérito em primeiro grau quando da promulgação da EC 45/2004."}, {"q": "E se já havia sentença de mérito em 1º grau ao tempo da EC 45/2004?", "options": ["O processo vai para a Justiça do Trabalho mesmo assim", "Permanece a competência do juízo que proferiu a sentença (não se desloca)", "O processo é anulado"], "answer": 1, "explain": "Havendo sentença de mérito ao tempo da Emenda, prevalece a competência do juízo que a proferiu."}, {"q": "A ação movida contra o INSS para obter benefício acidentário é da Justiça do Trabalho?", "options": ["Sim", "Não — é da Justiça Comum/Estadual", "É da Justiça Federal sempre"], "answer": 1, "explain": "A ação previdenciária contra o INSS não se confunde com a da SV 22; sua competência é da Justiça Comum/Estadual."}, {"q": "Qual precedente do STF pacificou essa competência?", "options": ["Súmula 736", "CC 7.204/MG", "HC 81.611"], "answer": 1, "explain": "O STF pacificou a matéria no CC 7.204/MG, base da SV 22."}], "terms": [{"termo": "Competência da Justiça do Trabalho", "definicao": "Ampliada pela EC 45/2004 (art. 114 da CF); abrange acidente de trabalho (SV 22) e ações possessórias ligadas à greve privada (SV 23).", "secao": "22"}, {"termo": "EC 45/2004", "definicao": "Reforma do Judiciário que ampliou a competência da Justiça do Trabalho (art. 114 da CF).", "secao": "22"}], "blocks": ["A Emenda Constitucional 45/2004 ampliou a competência da Justiça do Trabalho (art. 114 da CF/88). Antes dela, havia grande dúvida sobre quem julgava as ações de indenização por acidente de trabalho movidas pelo empregado contra o empregador: a Justiça Comum (estadual) ou a Justiça do Trabalho.", "O STF pacificou o tema no julgamento do CC 7.204/MG e a Súmula Vinculante 22 consolidou o entendimento: a competência é da Justiça do Trabalho, por se tratar de controvérsia decorrente da relação de trabalho (art. 114, VI, da CF/88).", "A súmula abrange, inclusive, as ações que ainda não tinham sentença de mérito em primeiro grau quando a EC 45/2004 foi promulgada. Se já havia sentença de mérito ao tempo da Emenda, prevalece a competência do juízo que a proferiu — o processo não é deslocado.", "Atenção para não confundir: aqui a ação é do empregado (ou de seus sucessores) contra o EMPREGADOR, por danos morais e materiais. Isso é diferente da ação acidentária movida contra o INSS para obter benefício previdenciário, que é de competência da Justiça Comum/Estadual."]}, {"num": "23", "theme": "Justiça do Trabalho — ação possessória na greve", "enunciado": "A Justiça do Trabalho é competente para processar e julgar ação possessória ajuizada em decorrência do exercício do direito de greve pelos trabalhadores da iniciativa privada.", "meta": ["Aprovada em 25/05/2011, DJe 03/06/2011.", "Importante."], "resumo": "A Justiça do Trabalho é competente para julgar a ação possessória decorrente do exercício do direito de greve por trabalhadores da INICIATIVA PRIVADA (por exemplo, o interdito proibitório pedido pela empresa durante a greve). Base: art. 114 da CF (EC 45/2004). Se a greve for de servidores públicos, a competência é da Justiça Comum.", "pontos": ["Ação possessória ligada à greve de trabalhadores privados → Justiça do Trabalho (art. 114 CF).", "Greve de servidores públicos → Justiça Comum (não é a SV 23).", "Ex.: interdito proibitório/reintegração de posse durante a greve."], "quiz": [{"q": "A ação possessória decorrente de greve de trabalhadores da iniciativa privada é julgada por qual justiça?", "options": ["Justiça Comum", "Justiça do Trabalho (SV 23)", "Justiça Eleitoral"], "answer": 1, "explain": "A SV 23 fixa a competência da Justiça do Trabalho para a ação possessória ligada ao direito de greve de trabalhadores privados."}, {"q": "E se a greve for de servidores públicos estatutários?", "options": ["Continua na Justiça do Trabalho", "Competência da Justiça Comum (Federal ou Estadual)", "Competência do STF"], "answer": 1, "explain": "Quando a greve é de servidores públicos, a competência para a ação possessória é da Justiça Comum, não da Justiça do Trabalho."}, {"q": "Qual o fundamento constitucional da SV 23?", "options": ["Art. 109 da CF", "Art. 114 da CF/88 (EC 45/2004) — ações sobre o direito de greve", "Art. 5º, LV"], "answer": 1, "explain": "O art. 114 da CF, com a EC 45/2004, atribuiu à Justiça do Trabalho as ações que envolvam o exercício do direito de greve."}, {"q": "Um exemplo típico de ação possessória nesse contexto é:", "options": ["Usucapião", "O interdito proibitório pedido pela empresa (ou reintegração de posse do estabelecimento)", "Ação de despejo"], "answer": 1, "explain": "Durante a greve, é comum o interdito proibitório ou a reintegração de posse do estabelecimento ocupado pelos grevistas."}, {"q": "Qual é o requisito central da SV 23?", "options": ["Que a greve seja no serviço público", "Que a greve seja de trabalhadores da iniciativa privada", "Que haja acordo coletivo"], "answer": 1, "explain": "A SV 23 exige que a greve seja de trabalhadores da iniciativa privada."}], "terms": [{"termo": "Ação possessória", "definicao": "Ação para proteger a posse (ex.: interdito proibitório, reintegração de posse). Ligada à greve privada, é da Justiça do Trabalho (SV 23).", "secao": "23"}, {"termo": "Interdito proibitório", "definicao": "Ação possessória preventiva contra ameaça de turbação/esbulho (ex.: empresa que teme o bloqueio do estabelecimento na greve).", "secao": "23"}], "blocks": ["Durante uma greve de trabalhadores da iniciativa privada, é comum surgirem conflitos possessórios — por exemplo, a ocupação do estabelecimento pelos grevistas ou o interdito proibitório pedido pela empresa para impedir o bloqueio das instalações.", "A Súmula Vinculante 23 fixa que essas ações possessórias, quando decorrem do exercício do direito de greve, são julgadas pela Justiça do Trabalho, e não pela Justiça Comum. O fundamento é o art. 114 da CF/88 (redação da EC 45/2004), que atribuiu à Justiça do Trabalho as ações que envolvam o exercício do direito de greve.", "Requisito central: a greve deve ser de trabalhadores da INICIATIVA PRIVADA. Se a greve for de servidores públicos estatutários, a competência para a ação possessória é da Justiça Comum (Federal ou Estadual), e não da Justiça do Trabalho."]}, {"num": "24", "theme": "Crime tributário e o lançamento definitivo", "enunciado": "Não se tipifica crime material contra a ordem tributária, previsto no art. 1º, incisos I a IV, da Lei nº 8.137/90, antes do lançamento definitivo do tributo.", "meta": ["Aprovada em 02/12/2009, DJe 11/12/2009.", "Muito importante."], "resumo": "Não se tipifica crime MATERIAL contra a ordem tributária (art. 1º, incisos I a IV, da Lei 8.137/90) antes do LANÇAMENTO DEFINITIVO do tributo. Como são crimes de resultado (supressão/redução de tributo), só se consumam com a constituição definitiva do crédito (fim do processo administrativo fiscal). Antes disso, falta justa causa para a denúncia e não corre a prescrição. Não se aplica aos crimes formais (ex.: art. 2º).", "pontos": ["Crimes do art. 1º, I–IV (materiais): dependem do lançamento definitivo do tributo.", "Antes do lançamento: sem justa causa para a ação penal; a prescrição não corre.", "Precedente-base: STF, HC 81.611.", "Não se aplica aos crimes FORMAIS (ex.: art. 2º da Lei 8.137/90)."], "quiz": [{"q": "Os crimes do art. 1º, I a IV, da Lei 8.137/90 se consumam antes do lançamento definitivo do tributo?", "options": ["Sim", "Não (SV 24)", "Depende do valor"], "answer": 1, "explain": "A SV 24 firma que não se tipifica o crime material antes do lançamento definitivo do tributo."}, {"q": "Por que esses crimes dependem do lançamento definitivo?", "options": ["Porque são formais", "Porque são crimes materiais (de resultado): exigem a efetiva supressão/redução do tributo", "Por questão processual apenas"], "answer": 1, "explain": "São crimes materiais/de resultado; só se consumam com a efetiva supressão ou redução do tributo, o que depende do lançamento definitivo."}, {"q": "Antes do lançamento definitivo, é possível oferecer denúncia?", "options": ["Sim", "Não — falta justa causa para a ação penal", "Só com autorização do Fisco"], "answer": 1, "explain": "Antes do lançamento definitivo falta justa causa para a ação penal; não se pode denunciar."}, {"q": "Quando começa a correr a prescrição nesses crimes materiais?", "options": ["Da data do fato", "Da constituição definitiva do crédito (lançamento definitivo)", "Do trânsito em julgado"], "answer": 1, "explain": "O termo inicial da prescrição é a constituição definitiva do crédito tributário (lançamento definitivo)."}, {"q": "A SV 24 aplica-se aos crimes FORMAIS (ex.: art. 2º da Lei 8.137/90)?", "options": ["Sim", "Não — apenas aos materiais do art. 1º, I a IV", "Aplica-se a todos os crimes tributários"], "answer": 1, "explain": "A súmula alcança os crimes materiais do art. 1º, I a IV; os formais se consumam independentemente do resultado e dispensam o lançamento definitivo."}, {"q": "O que é o “lançamento definitivo” do tributo?", "options": ["A inscrição em dívida ativa", "O ato que encerra a discussão administrativa e constitui definitivamente o crédito tributário", "A sentença penal"], "answer": 1, "explain": "É o ato que encerra o processo administrativo fiscal e constitui definitivamente o crédito tributário."}, {"q": "Qual precedente do STF fundamenta a SV 24?", "options": ["HC 81.611", "RE 579431", "ADI 524"], "answer": 0, "explain": "O precedente-base é o STF, HC 81.611."}], "terms": [{"termo": "Crime material", "definicao": "Crime que só se consuma com o resultado (ex.: supressão/redução de tributo). Depende do lançamento definitivo (SV 24).", "secao": "24"}, {"termo": "Crime formal", "definicao": "Crime que se consuma independentemente do resultado. Não é alcançado pela SV 24 (ex.: art. 2º da Lei 8.137/90).", "secao": "24"}, {"termo": "Lançamento definitivo", "definicao": "Ato que encerra o processo administrativo fiscal e constitui definitivamente o crédito tributário. Marco para o crime tributário material.", "secao": "24"}, {"termo": "Justa causa", "definicao": "Suporte mínimo de prova e tipicidade para a ação penal. Antes do lançamento definitivo, falta justa causa nos crimes do art. 1º, I–IV.", "secao": "24"}], "blocks": ["Os crimes do art. 1º, incisos I a IV, da Lei 8.137/90 são crimes MATERIAIS (de resultado): só se consumam quando há a efetiva supressão ou redução do tributo. Por isso, dependem da conclusão do processo administrativo fiscal.", "O lançamento definitivo do tributo é o ato que encerra a discussão na esfera administrativa e constitui definitivamente o crédito tributário. Antes dele, não há como afirmar que houve supressão ou redução de tributo — logo, o crime ainda não se consumou.", "Consequências práticas: antes do lançamento definitivo falta justa causa para a ação penal (não se pode oferecer denúncia) e o prazo prescricional ainda não começa a correr, pois o termo inicial é a constituição definitiva do crédito tributário. O precedente-base é o STF, HC 81.611.", "Alcance: a súmula vale para os crimes MATERIAIS do art. 1º, incisos I a IV. Não se aplica aos crimes FORMAIS (por exemplo, o art. 2º da Lei 8.137/90), que se consumam independentemente do resultado e, por isso, dispensam o lançamento definitivo."]}], "glossario": [{"termo": "Nepotismo", "definicao": "Nomeação de parentes (até 3º grau) para cargos em comissão, funções de confiança ou gratificadas, favorecida pela relação de parentesco com a autoridade. É vedado pela SV 13.", "secao": "13"}, {"termo": "Nepotismo cruzado", "definicao": "Troca de favores em que autoridades nomeiam reciprocamente parentes uma da outra (designações recíprocas). Também é vedado.", "secao": "13"}, {"termo": "Cargo em comissão", "definicao": "Cargo de livre nomeação e exoneração (sem concurso), destinado a direção, chefia e assessoramento.", "secao": "13"}, {"termo": "Cargo político", "definicao": "Cargo de natureza política (ex.: Secretário). Sua nomeação, por si só, em regra não configura nepotismo/improbidade.", "secao": "13"}, {"termo": "Reclamação constitucional", "definicao": "Ação dirigida ao STF para garantir a autoridade de suas decisões e súmulas vinculantes. Cabe se violada a SV 14 (procedimento de polícia judiciária).", "secao": "14"}, {"termo": "Elementos já documentados", "definicao": "Provas que já foram formalizadas nos autos da investigação. Só a estes o defensor tem acesso garantido pela SV 14 (não a diligências em curso).", "secao": "14"}, {"termo": "Abono complementar", "definicao": "Valor pago para completar a remuneração do servidor até o piso do salário mínimo. Não serve de base para outras vantagens (SV 15).", "secao": "15"}, {"termo": "Efeito cascata", "definicao": "Multiplicação de vantagens que ocorreria se o abono fosse usado como base de cálculo de outras parcelas. A SV 15 o impede.", "secao": "15"}, {"termo": "Vencimento-base", "definicao": "Parcela fixa da remuneração, antes de gratificações e adicionais. Pode ser inferior ao mínimo, se o TOTAL atingir o piso (SV 16).", "secao": "16"}, {"termo": "Remuneração total", "definicao": "Soma de todas as parcelas recebidas pelo servidor. É sobre ela que incide a garantia do salário mínimo (SV 16).", "secao": "16"}, {"termo": "Precatório", "definicao": "Requisição de pagamento devida pela Fazenda Pública, por dívida reconhecida em decisão judicial transitada em julgado.", "secao": "17"}, {"termo": "RPV", "definicao": "Requisição de Pequeno Valor: forma de pagamento pela Fazenda de dívidas de menor valor, mais célere que o precatório.", "secao": "17"}, {"termo": "Juros de mora", "definicao": "Encargo pelo atraso no pagamento. Não incidem no período constitucional de pagamento do precatório (SV 17).", "secao": "17"}, {"termo": "Correção monetária", "definicao": "Atualização do valor pela inflação. Incide mesmo no período em que não há juros de mora.", "secao": "17"}, {"termo": "Inelegibilidade reflexa", "definicao": "Impedimento de candidatura que atinge o cônjuge e parentes (até 2º grau) do chefe do Executivo (art. 14, §7º, da CF).", "secao": "18"}, {"termo": "Cônjuge supérstite", "definicao": "Cônjuge sobrevivente (viúvo/viúva). A morte do titular pode afastar a inelegibilidade, conforme exceção do STF.", "secao": "18"}, {"termo": "Uti singuli", "definicao": "Serviço público específico e divisível, mensurável por usuário (ex.: coleta de lixo domiciliar). Permite cobrança de taxa.", "secao": "19"}, {"termo": "Uti universi", "definicao": "Serviço público indivisível, prestado a todos (ex.: limpeza de ruas). Não pode ser custeado por taxa.", "secao": "19"}, {"termo": "Taxa", "definicao": "Tributo vinculado a um serviço público específico e divisível ou ao poder de polícia (art. 145, II, da CF).", "secao": "19"}, {"termo": "GDATA", "definicao": "Gratificação de Desempenho de Atividade Técnico-Administrativa (Lei 10.404/2002). A SV 20 assegura seu pagamento aos inativos.", "secao": "20"}, {"termo": "Depósito prévio", "definicao": "Exigência de depositar dinheiro/bens para poder recorrer. É inconstitucional na esfera administrativa (SV 21).", "secao": "21"}, {"termo": "Competência da Justiça do Trabalho", "definicao": "Ampliada pela EC 45/2004 (art. 114 da CF); abrange acidente de trabalho (SV 22) e ações possessórias ligadas à greve privada (SV 23).", "secao": "22"}, {"termo": "EC 45/2004", "definicao": "Reforma do Judiciário que ampliou a competência da Justiça do Trabalho (art. 114 da CF).", "secao": "22"}, {"termo": "Ação possessória", "definicao": "Ação para proteger a posse (ex.: interdito proibitório, reintegração de posse). Ligada à greve privada, é da Justiça do Trabalho (SV 23).", "secao": "23"}, {"termo": "Interdito proibitório", "definicao": "Ação possessória preventiva contra ameaça de turbação/esbulho (ex.: empresa que teme o bloqueio do estabelecimento na greve).", "secao": "23"}, {"termo": "Crime material", "definicao": "Crime que só se consuma com o resultado (ex.: supressão/redução de tributo). Depende do lançamento definitivo (SV 24).", "secao": "24"}, {"termo": "Crime formal", "definicao": "Crime que se consuma independentemente do resultado. Não é alcançado pela SV 24 (ex.: art. 2º da Lei 8.137/90).", "secao": "24"}, {"termo": "Lançamento definitivo", "definicao": "Ato que encerra o processo administrativo fiscal e constitui definitivamente o crédito tributário. Marco para o crime tributário material.", "secao": "24"}, {"termo": "Justa causa", "definicao": "Suporte mínimo de prova e tipicidade para a ação penal. Antes do lançamento definitivo, falta justa causa nos crimes do art. 1º, I–IV.", "secao": "24"}]};</script>
<script>
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shortTitle(t){let x=String(t);if(x.length>40)x=x.slice(0,38).replace(/\s+\S*$/,'')+'…';return x;}
const store=(()=>{let ok=true;try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){ok=false;}const mem={};
  return{get(k,d){try{if(ok){const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}}catch(e){}return(k in mem)?mem[k]:d;},
  set(k,v){try{if(ok){localStorage.setItem(k,JSON.stringify(v));return;}}catch(e){}mem[k]=v;}};})();
const SKEY='sv_v1';
let state=Object.assign({theme:'claro',fs:'19',lh:'1.75',measure:'66ch',font:false,bionic:false,focus:false,rate:'1',read:[]},store.get(SKEY,{}));
const readSet=new Set(state.read||[]);
function save(){state.read=[...readSet];store.set(SKEY,state);}

const main=$('#main'),tocNav=$('#tocNav');
const totalSec=DATA.sections.length;
const hero=el('section','hero');
hero.innerHTML=`<p class="kicker">Material de estudo interativo</p>
  <h1>${esc(DATA.title)}</h1><p class="sub">${esc(DATA.subtitle)}</p>
  <div class="legend"><span><i class="sw orig"></i> Enunciado oficial do STF</span><span><i class="sw aid"></i> Comentários e apoios de estudo</span></div>
  <div class="howto"><b>Como usar</b><ul>
    <li><b>Ajustes (Aa)</b>: tamanho, espaçamento, tema, fonte amigável, leitura biônica e modo foco.</li>
    <li><b>Quiz primeiro</b>: cada súmula abre com um teste — tente responder e confira o <b>gabarito no fim do tema</b>.</li>
    <li><b>Modo foco</b>: ilumina um parágrafo por vez — setas ↑ ↓ (tela ou teclado).</li>
    <li><b>🔊 Ouvir</b>: escute o enunciado e os comentários de cada súmula em voz alta.</li></ul></div>
  <div class="note-parte">Os <b>enunciados</b> reproduzem o texto <b>oficial do STF</b>; os comentários se baseiam no material do <b>Dizer o Direito</b>, com atualizações de jurisprudência. Os enunciados das Súmulas <b>22, 23 e 24</b> foram conferidos e ajustados ao texto oficial.</div>`;
main.appendChild(hero);

const progText=$('#progText'),progPill=$('#progPill');
function updProg(){progPill.textContent=`${readSet.size}/${totalSec}`;progText.textContent='súmulas lidas';
  $$('.toclink').forEach(a=>{if(a.dataset.n)a.classList.toggle('read',readSet.has(a.dataset.n));});}

let pIndex=0;
function makeProsa(blocks){const box=el('div','prosa');blocks.forEach(bh=>{
  const isQ=/^[“"]/.test(bh.replace(/<[^>]+>/g,'').trim());
  const p=el('p',isQ?'quote':null,bh);p.dataset.p=pIndex++;p.dataset.orig=bh;box.appendChild(p);});return box;}
function enunBox(s){const d=el('div','enun');
  let chips='';
  if(s.meta&&s.meta.length){chips='<div class="mchips">'+s.meta.map(m=>`<span class="mchip">${esc(m)}</span>`).join('')+'</div>';}
  d.innerHTML=`<span class="etag">📜 Enunciado · STF</span><p>${esc(s.enunciado)}</p>${chips}`;return d;}
function aidResumo(t){if(!t)return null;const d=el('div','aid resumo');d.innerHTML=`<span class="tag">✦ Em poucas palavras</span><p>${esc(t)}</p>`;return d;}
function aidPontos(l){if(!l||!l.length)return null;const d=el('div','aid');d.innerHTML=`<span class="tag">🔑 Pontos-chave</span>`;const ul=el('ul','pontos');l.forEach(x=>ul.appendChild(el('li',null,esc(x))));d.appendChild(ul);return d;}
function aidTerms(ts){if(!ts||!ts.length)return null;const d=el('div','aid');d.innerHTML=`<span class="tag">🏷️ Termos desta súmula</span>`;const w=el('div','terms');const def=el('div','termdef');
  ts.forEach(t=>{const c=el('button','chip',esc(t.termo));c.addEventListener('click',()=>{def.innerHTML=`<b>${esc(t.termo)}.</b> ${esc(t.definicao)}`;def.classList.add('show');});w.appendChild(c);});
  d.appendChild(w);d.appendChild(def);return d;}
const LET=['a','b','c','d','e'];
function quizPerguntas(q){if(!q||!q.length)return null;const d=el('div','aid quiz');
  d.innerHTML=`<span class="tag">✅ Teste-se · ${q.length} ${q.length>1?'questões':'questão'}</span>`;
  q.forEach((it,qi)=>{const item=el('div','qitem');
    item.innerHTML=`<p class="qq"><span class="qn">${qi+1}.</span> ${esc(it.q)}</p>`;
    const opts=el('div','qopts');
    it.options.forEach((opt,oi)=>{opts.appendChild(el('div','qo',`<span class="ql">${LET[oi]}</span><span>${esc(opt)}</span>`));});
    item.appendChild(opts);d.appendChild(item);});
  return d;}
function quizGabarito(q){if(!q||!q.length)return null;const d=el('details','gab');
  d.innerHTML=`<summary><span class="gtag">🔑 Gabarito</span> <span class="ghint">tocar para ver as ${q.length} ${q.length>1?'respostas':'resposta'}</span></summary>`;
  const ol=el('ol','gablist');
  q.forEach(it=>{ol.appendChild(el('li',null,`<b>${LET[it.answer]})</b> ${esc(it.explain)}`));});
  d.appendChild(ol);return d;}

function toggleRead(num){if(readSet.has(num))readSet.delete(num);else readSet.add(num);save();updProg();
  $$('[data-rolefor="'+num+'"]').forEach(b=>{const on=readSet.has(num);
    if(b.classList.contains('primary'))b.innerHTML=on?'✓ Lida — desfazer':'✓ Marcar como lida';else b.innerHTML=on?'✓ lida':'marcar lido';});}

function hueVars(h){const h2=(h+24)%360;return `--h:${h};--c1:hsl(${h} 88% 62%);--c2:hsl(${h2} 90% 56%);--sc:hsl(${h} 70% 50%);`;}
function renderSection(s){
  const hue=DATA.hues[s.num]||258;
  const sec=el('section','section');sec.id='sec-'+s.num;sec.dataset.n=s.num;
  sec.setAttribute('style',hueVars(hue));
  const head=el('div','shead');
  head.innerHTML=`<div class="snum"><small>SV</small><span>${esc(s.num)}</span></div>
    <div class="stitlewrap"><div class="skicker">Súmula Vinculante ${esc(s.num)}</div><h2 class="stitle">${esc(s.theme)}</h2></div>`;
  const rb=el('button','iconbtn readbtn');rb.dataset.rolefor=s.num;rb.innerHTML='marcar lido';rb.addEventListener('click',()=>toggleRead(s.num));head.appendChild(rb);
  sec.appendChild(head);sec.appendChild(el('div','hrule'));
  const sqp=quizPerguntas(s.quiz);if(sqp)sec.appendChild(sqp);
  sec.appendChild(enunBox(s));
  const r=aidResumo(s.resumo);if(r)sec.appendChild(r);
  const p=aidPontos(s.pontos);if(p)sec.appendChild(p);
  if(s.blocks.length)sec.appendChild(makeProsa(s.blocks));
  const st=aidTerms(s.terms);if(st)sec.appendChild(st);
  const sqg=quizGabarito(s.quiz);if(sqg)sec.appendChild(sqg);
  const foot=el('div');foot.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:20px';
  const ob=el('button','iconbtn');ob.innerHTML='🔊 Ouvir esta súmula';ob.addEventListener('click',()=>speakSection(sec));foot.appendChild(ob);
  const mb=el('button','iconbtn primary');mb.dataset.rolefor=s.num;mb.innerHTML='✓ Marcar como lida';mb.addEventListener('click',()=>toggleRead(s.num));foot.appendChild(mb);
  sec.appendChild(foot);
  main.appendChild(sec);
  const a=el('a','toclink');a.href='#'+sec.id;a.dataset.n=s.num;a.setAttribute('style',hueVars(hue));
  a.innerHTML=`<span class="tnum">SV ${esc(s.num)}</span><span class="ttl">${esc(shortTitle(s.theme))}</span><span class="check"></span>`;tocNav.appendChild(a);
}
DATA.sections.forEach(renderSection);

function applyState(){document.documentElement.setAttribute('data-theme',state.theme);
  document.documentElement.style.setProperty('--fs',state.fs+'px');
  document.documentElement.style.setProperty('--lh',state.lh);
  document.documentElement.style.setProperty('--measure',state.measure);
  document.body.classList.toggle('font-amigavel',!!state.font);
  document.body.classList.toggle('focus',!!state.focus);
  segSet('#segTheme','theme',state.theme);segSet('#segFs','fs',state.fs);segSet('#segLh','lh',state.lh);segSet('#segMeasure','measure',state.measure);segSet('#segRate','rate',state.rate);
  $('#swFont').checked=!!state.font;$('#swBionic').checked=!!state.bionic;$('#swFocus').checked=!!state.focus;
  applyBionic(!!state.bionic);if(state.focus)ensureFocusStart();}
function segSet(sel,key,val){$$(sel+' button').forEach(b=>b.classList.toggle('on',b.dataset[key]===String(val)));}
$('#segTheme').addEventListener('click',e=>{const b=e.target.closest('button');if(b){state.theme=b.dataset.theme;save();applyState();}});
$('#segFs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){state.fs=b.dataset.fs;save();applyState();}});
$('#segLh').addEventListener('click',e=>{const b=e.target.closest('button');if(b){state.lh=b.dataset.lh;save();applyState();}});
$('#segMeasure').addEventListener('click',e=>{const b=e.target.closest('button');if(b){state.measure=b.dataset.measure;save();applyState();}});
$('#segRate').addEventListener('click',e=>{const b=e.target.closest('button');if(b){state.rate=b.dataset.rate;save();}});
$('#swFont').addEventListener('change',e=>{state.font=e.target.checked;save();applyState();});
$('#swBionic').addEventListener('change',e=>{state.bionic=e.target.checked;save();applyBionic(state.bionic);});
$('#swFocus').addEventListener('change',e=>{state.focus=e.target.checked;save();document.body.classList.toggle('focus',state.focus);if(state.focus)ensureFocusStart();});
$('#btnReset').addEventListener('click',()=>{state=Object.assign({theme:'claro',fs:'19',lh:'1.75',measure:'66ch',font:false,bionic:false,focus:false,rate:'1'},{read:[...readSet]});save();applyState();});

function applyBionic(on){$$('.prosa p').forEach(p=>{if(on){if(p.dataset.bi)return;bionicNode(p);p.dataset.bi='1';}else{if(p.dataset.orig){p.innerHTML=p.dataset.orig;p.removeAttribute('data-bi');}}});}
function bionicNode(node){const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT,{acceptNode(n){let e=n.parentElement;while(e&&e!==node){if(e.tagName==='SUP'||e.tagName==='B')return NodeFilter.FILTER_REJECT;e=e.parentElement;}return NodeFilter.FILTER_ACCEPT;}});
  const ts=[];let t;while(t=w.nextNode())ts.push(t);
  ts.forEach(tn=>{const frag=document.createDocumentFragment();tn.nodeValue.split(/(\s+)/).forEach(tok=>{
    if(/^\s+$/.test(tok)||tok===''){frag.appendChild(document.createTextNode(tok));return;}
    const m=tok.match(/^([^\wÀ-ÿ]*)([\wÀ-ÿ]+)([\s\S]*)$/);if(!m){frag.appendChild(document.createTextNode(tok));return;}
    const[,pre,word,post]=m;const k=Math.max(1,Math.ceil(word.length*0.42));
    if(pre)frag.appendChild(document.createTextNode(pre));const b=document.createElement('b');b.className='bi';b.textContent=word.slice(0,k);frag.appendChild(b);
    frag.appendChild(document.createTextNode(word.slice(k)+post));});tn.parentNode.replaceChild(frag,tn);});}

const drawer=$('#drawer'),scrim=$('#scrim'),toc=$('#toc');
$('#btnSettings').addEventListener('click',()=>drawer.classList.add('open'));
$('#btnCloseDrawer').addEventListener('click',()=>drawer.classList.remove('open'));
$('#btnMenu').addEventListener('click',()=>{toc.classList.add('open');scrim.classList.add('on');});
scrim.addEventListener('click',()=>{toc.classList.remove('open');scrim.classList.remove('on');});
tocNav.addEventListener('click',e=>{if(e.target.closest('a')){toc.classList.remove('open');scrim.classList.remove('on');}});
const modal=$('#modalGloss');
$('#btnGloss').addEventListener('click',()=>{modal.classList.add('open');$('#gSearch').focus();});
$$('#modalGloss [data-close]').forEach(x=>x.addEventListener('click',()=>modal.classList.remove('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){modal.classList.remove('open');drawer.classList.remove('open');}});
const glist=$('#glist');
function renderGloss(f=''){glist.innerHTML='';f=f.trim().toLowerCase();
  const items=DATA.glossario.filter(g=>!f||g.termo.toLowerCase().includes(f)||g.definicao.toLowerCase().includes(f));
  if(!items.length){glist.appendChild(el('div','gitem','<p class="gd">Nenhum termo encontrado.</p>'));return;}
  items.forEach(g=>{const d=el('div','gitem');d.innerHTML=`<div class="gt">${esc(g.termo)}<span class="gs">SV ${esc(g.secao)}</span></div><p class="gd">${esc(g.definicao)}</p>`;glist.appendChild(d);});}
$('#gSearch').addEventListener('input',e=>renderGloss(e.target.value));renderGloss();

const pbar=$('#pbar'),backtop=$('#backtop');
function onScroll(){const h=document.documentElement;const sc=h.scrollTop;const mx=h.scrollHeight-h.clientHeight;pbar.style.width=(mx>0?sc/mx*100:0)+'%';backtop.classList.toggle('show',sc>600);}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();
backtop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const n=en.target.dataset.n;$$('.toclink').forEach(a=>a.classList.toggle('active',a.dataset.n===n));}});},{rootMargin:'-30% 0px -60% 0px'});
$$('.section').forEach(s=>io.observe(s));

let paras=[];function refreshParas(){paras=$$('.prosa p');}refreshParas();let focusIdx=-1;
function setFocus(i){refreshParas();if(i<0)i=0;if(i>=paras.length)i=paras.length-1;focusIdx=i;paras.forEach((p,k)=>p.classList.toggle('pfocus',k===i));const p=paras[i];if(p)p.scrollIntoView({block:'center',behavior:'smooth'});}
function ensureFocusStart(){if(focusIdx<0){refreshParas();const vy=window.scrollY+window.innerHeight*0.3;let idx=paras.findIndex(p=>p.getBoundingClientRect().top+window.scrollY>=vy);if(idx<0)idx=0;setFocus(idx);}else setFocus(focusIdx);}
$('#fnDown').addEventListener('click',()=>setFocus(focusIdx+1));$('#fnUp').addEventListener('click',()=>setFocus(focusIdx-1));
document.addEventListener('click',e=>{const p=e.target.closest('.prosa p');if(p&&state.focus)setFocus(+p.dataset.p);});
document.addEventListener('keydown',e=>{if(!state.focus||e.target.matches('input,textarea'))return;
  if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();setFocus(focusIdx+1);}if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();setFocus(focusIdx-1);}});

const synth=window.speechSynthesis;let ttsParas=[],ttsPos=0,ttsPaused=false,ttsOn=false,ptVoice=null;
const ttsbar=$('#ttsbar'),ttsLab=$('#ttsLab');
function pickVoice(){const vs=synth?synth.getVoices():[];ptVoice=vs.find(v=>/pt[-_]?BR/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null;}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
function speakSection(sec){if(!synth){alert('Seu navegador não tem leitura em voz alta.');return;}stopTTS();ttsParas=$$('.enun p, .prosa p',sec);if(!ttsParas.length)return;ttsOn=true;ttsPos=0;ttsPaused=false;ttsbar.classList.add('show');$('#ttsToggle').textContent='⏸';const tt=sec.querySelector('.stitle');ttsLab.textContent='Lendo: '+(tt?tt.textContent:'súmula');speakAt(0);}
function speakAt(i){if(i>=ttsParas.length){stopTTS();return;}ttsPos=i;const p=ttsParas[i];ttsParas.forEach(x=>x.classList.remove('reading'));p.classList.add('reading');p.scrollIntoView({block:'center',behavior:'smooth'});
  const u=new SpeechSynthesisUtterance(p.textContent);u.lang='pt-BR';if(ptVoice)u.voice=ptVoice;u.rate=parseFloat(state.rate)||1;u.onend=()=>{if(ttsOn&&!ttsPaused)speakAt(i+1);};synth.speak(u);}
function stopTTS(){ttsOn=false;ttsPaused=false;if(synth)synth.cancel();$$('.reading').forEach(x=>x.classList.remove('reading'));ttsbar.classList.remove('show');}
$('#ttsStop').addEventListener('click',stopTTS);
$('#ttsToggle').addEventListener('click',()=>{if(!ttsOn)return;if(ttsPaused){ttsPaused=false;$('#ttsToggle').textContent='⏸';speakAt(ttsPos);}else{ttsPaused=true;$('#ttsToggle').textContent='▶';synth.cancel();}});
$('#ttsPrev').addEventListener('click',()=>{if(ttsOn){synth.cancel();speakAt(Math.max(0,ttsPos-1));}});

applyState();updProg();
$$('[data-rolefor]').forEach(b=>{const on=readSet.has(b.dataset.rolefor);if(b.classList.contains('primary'))b.innerHTML=on?'✓ Lida — desfazer':'✓ Marcar como lida';else b.innerHTML=on?'✓ lida':'marcar lido';});
</script></body></html>
