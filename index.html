<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Minhas Apostilas</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --accent:#7c3aed; --accent-soft:#ede9fe; --border:#e5e1d8;
    --done:#059669; --done-soft:#d1fae5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14151a; --card:#1e2028; --ink:#e8e6f0; --muted:#9ca3af;
      --accent:#a78bfa; --accent-soft:#2e2547; --border:#2c2e38;
      --done:#34d399; --done-soft:#123c2e; }
  }
  *{box-sizing:border-box; margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh}
  header{padding:40px 20px 12px; text-align:center}
  header h1{font-size:1.9rem; letter-spacing:-.02em}
  header p{color:var(--muted); margin-top:6px}
  .stats{display:flex; gap:24px; justify-content:center; margin-top:18px; flex-wrap:wrap}
  .stat{text-align:center}
  .stat b{font-size:1.4rem; display:block}
  .stat span{font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  .controls{max-width:900px; margin:24px auto 8px; padding:0 20px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  #busca{flex:1; min-width:220px; padding:12px 16px; font-size:1rem; border-radius:12px;
    border:1.5px solid var(--border); background:var(--card); color:var(--ink); outline:none}
  #busca:focus{border-color:var(--accent)}
  .filtros{display:flex; gap:8px; flex-wrap:wrap}
  .chip{padding:8px 14px; border-radius:999px; border:1.5px solid var(--border);
    background:var(--card); color:var(--ink); font-size:.85rem; cursor:pointer}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
  main{max-width:900px; margin:16px auto 60px; padding:0 20px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
  .card{background:var(--card); border:1.5px solid var(--border); border-radius:16px;
    padding:18px; display:flex; flex-direction:column; gap:8px; position:relative;
    transition:transform .15s, box-shadow .15s; text-decoration:none; color:inherit}
  .card:hover{transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .card .emoji{font-size:1.6rem}
  .card h2{font-size:1.02rem; line-height:1.35}
  .card .cat{font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em;
    color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px;
    align-self:flex-start}
  .card .desc{font-size:.85rem; color:var(--muted); flex:1}
  .check{position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:50%;
    border:2px solid var(--border); background:transparent; cursor:pointer; font-size:.85rem;
    line-height:1; color:transparent; transition:all .15s}
  .check:hover{border-color:var(--done)}
  .card.done .check{background:var(--done); border-color:var(--done); color:#fff}
  .card.done{border-color:var(--done)}
  .card.done h2{opacity:.75}
  .barra{max-width:860px; margin:10px auto 0; padding:0 20px}
  .trilho{height:8px; background:var(--border); border-radius:99px; overflow:hidden}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--done)); transition:width .4s}
  .vazio{grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0}
  footer{text-align:center; color:var(--muted); font-size:.8rem; padding:0 20px 40px}
</style>
</head>
<body>
<header>
  <h1>📚 Minhas Apostilas</h1>
  <p>Portal de estudos interativos — clique no ✓ quando concluir uma apostila</p>
  <div class="stats">
    <div class="stat"><b id="st-total">0</b><span>apostilas</span></div>
    <div class="stat"><b id="st-done">0</b><span>concluídas</span></div>
    <div class="stat"><b id="st-pct">0%</b><span>progresso</span></div>
  </div>
</header>
<div class="barra"><div class="trilho"><div class="fill" id="fill"></div></div></div>
<div class="controls">
  <input id="busca" type="search" placeholder="🔍 Buscar apostila… (ex.: LINDB, locação, súmulas)">
  <div class="filtros" id="filtros"></div>
</div>
<main id="grid"></main>
<footer>Seu progresso fica salvo neste navegador (localStorage).</footer>
<script>
const APOSTILAS = [
  {f:"LINDB-Tartuce-apostila-interativa.html", t:"LINDB — Apostila Interativa (Tartuce)", c:"Civil", e:"⚖️", d:"Lei de Introdução às Normas do Direito Brasileiro, com base na doutrina de Flávio Tartuce."},
  {f:"LINDB-Questoes-Magistratura-Tartuce.html", t:"LINDB — Questões de Magistratura", c:"Civil", e:"📝", d:"Questões de concursos de magistratura sobre a LINDB."},
  {f:"CodigoCivil-arts-1-a-120-apostila.html", t:"Código Civil — Arts. 1º a 120", c:"Civil", e:"📖", d:"Parte Geral do Código Civil: pessoas, bens e fatos jurídicos."},
  {f:"Lei-8245-1991-Locacoes-apostila.html", t:"Lei 8.245/1991 — Locações", c:"Civil", e:"🏠", d:"Lei do Inquilinato: locação de imóveis urbanos."},
  {f:"Lei-9514-1997-SFI-alienacao-fiduciaria-imovel-apostila.html", t:"Lei 9.514/1997 — SFI e Alienação Fiduciária de Imóvel", c:"Civil", e:"🏦", d:"Sistema de Financiamento Imobiliário e alienação fiduciária de bem imóvel."},
  {f:"DL-911-1969-alienacao-fiduciaria-apostila.html", t:"DL 911/1969 — Alienação Fiduciária", c:"Civil", e:"🚗", d:"Alienação fiduciária de bens móveis e busca e apreensão."},
  {f:"CF88-arts-1-a-19-apostila.html", t:"CF/88 — Arts. 1º a 19", c:"Constitucional", e:"🏛️", d:"Princípios fundamentais, direitos e garantias fundamentais."},
  {f:"Lei-9985-2000-SNUC-apostila.html", t:"Lei 9.985/2000 — SNUC", c:"Ambiental", e:"🌳", d:"Sistema Nacional de Unidades de Conservação da Natureza."},
  {f:"Lei-6938-1981-PNMA-apostila.html", t:"Lei 6.938/1981 — PNMA", c:"Ambiental", e:"🌎", d:"Política Nacional do Meio Ambiente."},
  {f:"LINDB-Lei-Esquematizada.html", t:"LINDB — Lei Esquematizada", c:"Civil", e:"🗂️", d:"Texto da LINDB esquematizado para leitura ativa."},
  {f:"LINDB-Tartuce-material-interativo.html", t:"LINDB — Tartuce (material interativo)", c:"Civil", e:"⚖️", d:"Material interativo de estudo da LINDB pela doutrina de Tartuce."},
  {f:"Quiz-LINDB-Tartuce.html", t:"Quiz LINDB — Estudo da Lei de Introdução", c:"Civil", e:"❓", d:"Quiz de fixação sobre a LINDB."},
  {f:"CC-CapII-ParteI-material-interativo.html", t:"CC — Cap. II, Parte I (material interativo)", c:"Civil", e:"📘", d:"Visão filosófica do CC/2002 e da pessoa natural — material interativo."},
  {f:"Quiz-CapII-Tartuce.html", t:"Quiz Cap. II — CC/2002 e pessoa natural", c:"Civil", e:"❓", d:"Quiz de fixação do Capítulo II (Tartuce)."},
  {f:"Sumulas-Vinculantes-13-a-24.html", t:"Súmulas Vinculantes 13 a 24 (STF)", c:"Constitucional", e:"📌", d:"Material de estudo das Súmulas Vinculantes 13 a 24."},
  {f:"Sumulas-Vinculantes-25-a-36.html", t:"Súmulas Vinculantes 25 a 36 (STF)", c:"Constitucional", e:"📌", d:"Material de estudo das Súmulas Vinculantes 25 a 36."},
  {f:"Sumulas-Vinculantes-37-a-48.html", t:"Súmulas Vinculantes 37 a 48 (STF)", c:"Constitucional", e:"📌", d:"Material de estudo das Súmulas Vinculantes 37 a 48."},
  {f:"Checklist-por-Disciplina.html", t:"Checklist por Disciplina — Leitura de Leis", c:"Método", e:"✅", d:"Checklist de acompanhamento da leitura de leis por disciplina."},
  {f:"Codigo-Cores-Leitura-Ativa.html", t:"Código de Cores — Leitura Ativa", c:"Método", e:"🎨", d:"Sistema de cores para marcação e leitura ativa da lei seca."},
  {f:"Sumulas-Vinculantes-49-a-63.html", t:"Súmulas Vinculantes 49 a 63 (STF)", c:"Constitucional", e:"📌", d:"Material interativo sobre as Súmulas Vinculantes 49 a 63 do STF."},
  {f:"Sumulas-TSE-estudo-por-questoes.html", t:"Súmulas do TSE — Estudo por Questões", c:"Eleitoral", e:"🗳️", d:"Súmulas do Tribunal Superior Eleitoral em formato de questões."},
];
const KEY="apostilas-done";
let done = new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
let filtro = "Todas", termo = "";
const cats = ["Todas", ...new Set(APOSTILAS.map(a=>a.c))];

function norm(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}

function render(){
  const grid = document.getElementById("grid");
  const list = APOSTILAS.filter(a =>
    (filtro==="Todas"||a.c===filtro) &&
    (!termo || norm(a.t+" "+a.d+" "+a.c).includes(norm(termo))));
  grid.innerHTML = list.length ? list.map(a=>`
    <a class="card ${done.has(a.f)?"done":""}" href="${a.f}">
      <button class="check" title="Marcar como concluída" onclick="toggle(event,'${a.f}')">✓</button>
      <div class="emoji">${a.e}</div>
      <span class="cat">${a.c}</span>
      <h2>${a.t}</h2>
      <p class="desc">${a.d}</p>
    </a>`).join("") : `<p class="vazio">Nenhuma apostila encontrada 🤔</p>`;
  document.getElementById("st-total").textContent = APOSTILAS.length;
  document.getElementById("st-done").textContent = done.size;
  const pct = Math.round(done.size/APOSTILAS.length*100);
  document.getElementById("st-pct").textContent = pct+"%";
  document.getElementById("fill").style.width = pct+"%";
}
function toggle(ev,f){
  ev.preventDefault(); ev.stopPropagation();
  done.has(f) ? done.delete(f) : done.add(f);
  localStorage.setItem(KEY, JSON.stringify([...done]));
  render();
}
document.getElementById("filtros").innerHTML = cats.map(c=>
  `<button class="chip ${c==="Todas"?"on":""}" data-c="${c}">${c}</button>`).join("");
document.getElementById("filtros").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  filtro=b.dataset.c;
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
document.getElementById("busca").addEventListener("input",e=>{termo=e.target.value; render()});
render();
</script>
</body>
</html>
